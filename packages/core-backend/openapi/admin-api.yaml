openapi: 3.0.3
info:
  title: MetaSheet Admin API
  description: |
    Administrative API for MetaSheet platform with SafetyGuard protection.

    **SafetyGuard Integration**:
    - Dangerous operations require confirmation tokens
    - Rate limiting: 10 requests per minute per user
    - Idempotency keys supported via `X-Idempotency-Key` header

    **Risk Levels**:
    - LOW: Basic validation, optional confirmation
    - MEDIUM: Standard confirmation required
    - HIGH: Double confirmation required
    - CRITICAL: Maximum safeguards applied
  version: 1.0.0
  contact:
    name: MetaSheet Team
    email: plugins@metasheet.io

servers:
  - url: http://localhost:8900/api/admin
    description: Local development server

# SECURITY (ADM-05 follow-up, docs/admin-api-security-schemes): every path under /api/admin sits
# behind the global JWT gate (jwt-middleware.ts:150-168, wired at index.ts:1670-1683) — there is no
# entry in GLOBAL_GATE_EXCEPTIONS for /api/admin or any sub-path (auth/api-path-policy.ts:114-164),
# so an unauthenticated caller always gets 401 here, spec-wide. That JWT gate only verifies the
# token; it does not check role. Role enforcement is a second, per-operation layer added by
# requireAdminRole()/protectAdminOperation() in the route handlers themselves — see each operation's
# own '403' response below for whether that second layer is present.
#
# This file documents a curated subset of packages/core-backend/src/routes/admin-routes.ts and its
# protection-rules.ts sub-router (SafetyGuard, Plugins, Snapshots, Protection Rules, Data, System).
# It does NOT yet cover the newer read-only endpoints added directly to admin-routes.ts (/dlq,
# /shards, /shards/{name}, /queues, /ratelimits, /ratelimits/{key}, /health/detailed,
# /health/summary, /health/subsystem/{name}, /slo/status) — their handler-level gate status is
# tracked separately in docs/development/admin-read-endpoints-exposure-inventory-20260912.md.
# As of 2026-09-20 all of those are gated with requireAdminRole() except GET /slo/status, which is
# intentionally left ungated for now: PR #5680 (admin-routes structural guard spec, still OPEN at
# time of writing) uses it as the one negative-control example asserting "this route has no gate",
# so adding the gate here first would turn that PR red. Once #5680 merges, a follow-up PR gates
# /slo/status and flips that assertion to positive.
security:
  - bearerAuth: []

tags:
  - name: SafetyGuard
    description: SafetyGuard management endpoints
  - name: Plugins
    description: Plugin lifecycle management
  - name: Snapshots
    description: Snapshot management operations
  - name: Snapshot Protection
    description: Snapshot labeling and protection operations (Sprint 2)
  - name: Protection Rules
    description: Protection rule management and evaluation (Sprint 2)
  - name: System
    description: System maintenance operations
  - name: Data
    description: Bulk data operations

paths:
  /safety/status:
    get:
      tags:
        - SafetyGuard
      summary: Get SafetyGuard status
      description: Returns SafetyGuard configuration and pending confirmations
      operationId: getSafetyStatus
      responses:
        '200':
          description: SafetyGuard status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SafetyStatus'
              example:
                enabled: true
                pendingConfirmations: 2
                config:
                  tokenExpirationSeconds: 300
                  allowBypass: false
        '403':
          description: Caller is authenticated but is not a platform admin (requireAdminRole()).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminError'

  /safety/confirm:
    post:
      tags:
        - SafetyGuard
      summary: Confirm dangerous operation
      description: |
        Confirm a pending dangerous operation using its safety token.

        **Rate Limited**: 10 requests per minute per user
        **Idempotency**: Supports X-Idempotency-Key header
      operationId: confirmSafetyOperation
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmationRequest'
            example:
              token: "safety_token_abc123"
              acknowledged: true
              typedConfirmation: "DELETE ALL"
      responses:
        '200':
          description: Operation confirmed successfully
          headers:
            X-Idempotency-Replayed:
              schema:
                type: string
              description: "'true' if this is a cached response"
            X-RateLimit-Remaining:
              schema:
                type: integer
              description: Remaining requests in current window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmationResponse'
        '400':
          description: Invalid confirmation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Caller is authenticated but is not a platform admin (requireAdminRole()).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminError'
        '404':
          description: Token not found or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /safety/enable:
    # NOTE (2026-09-21, supersedes the 2026-09-20 security-schemes audit note): the gap that note
    # described — POST /safety/enable carrying neither requireAdminRole() nor requireSafetyCheck(),
    # so any caller who cleared the global JWT gate could flip SafetyGuard back on — is closed.
    # requireAdminRole() is now the first handler on this operation and on eleven sibling write
    # endpoints (safety/disable, cache/clear, metrics/reset, DELETE+PUT data/bulk, the four /dlq
    # mutations, and the two /ratelimits resets); the 403 below is therefore now real. The /dlq and
    # /ratelimits paths are not yet described in this file at all (see the header note), so their
    # gates are only recorded here, not documented as operations.
    post:
      tags:
        - SafetyGuard
      summary: Enable SafetyGuard
      description: Enables SafetyGuard protection for dangerous operations
      operationId: enableSafetyGuard
      responses:
        '200':
          description: SafetyGuard enabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "SafetyGuard enabled"
        '403':
          description: Caller is authenticated but is not a platform admin (requireAdminRole()).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminError'

  /safety/disable:
    post:
      tags:
        - SafetyGuard
      summary: Disable SafetyGuard
      description: |
        Disables SafetyGuard protection (requires confirmation).

        **Risk Level**: LOW
      operationId: disableSafetyGuard
      responses:
        '200':
          description: SafetyGuard disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "SafetyGuard disabled"
                warning: "Safety checks are now bypassed"
        '403':
          description: |
            Two distinct rejections share this status on this operation. requireAdminRole() runs
            first and answers AdminError (error: Forbidden, code: ADMIN_REQUIRED) when the caller
            is authenticated but is not a platform admin; only an admin caller reaches
            requireSafetyCheck(), which answers SafetyCheckRequired when a safety token is needed.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AdminError'
                  - $ref: '#/components/schemas/SafetyCheckRequired'
        '503':
          description: |
            requireAdminRole() fails closed: the admin-role lookup itself threw, so the request is
            refused rather than allowed through (error: ServiceUnavailable, code: RBAC_CHECK_FAILED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /plugins/{id}/reload:
    post:
      tags:
        - Plugins
      summary: Reload a single plugin
      description: |
        Reloads a specific plugin by ID.

        **Risk Level**: MEDIUM
      operationId: reloadPlugin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Plugin ID to reload
          example: "plugin-view-gantt"
      responses:
        '200':
          description: Plugin reloaded successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginOperationResponse'
              example:
                success: true
                message: "Plugin plugin-view-gantt reloaded successfully"
                pluginId: "plugin-view-gantt"
        '403':
          description: |
            Either AdminError (caller authenticated but not a platform admin —
            protectAdminOperation()'s requireAdminRole() runs first) or SafetyCheckRequired (admin
            check passed but the dangerous-operation confirmation token is missing/invalid).
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/AdminError'
                  - $ref: '#/components/schemas/SafetyCheckRequired'
        '500':
          description: Plugin reload failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: PluginLoader service not available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /plugins/reload-all:
    post:
      tags:
        - Plugins
      summary: Reload all plugins
      description: |
        Reloads all plugins. Service may experience brief unavailability.

        **Risk Level**: HIGH (double confirmation required)
      operationId: reloadAllPlugins
      responses:
        '200':
          description: All plugins reloaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: "All plugins reloaded successfully"
                warning: "Service may have experienced brief unavailability"
        '403':
          description: |
            Either AdminError (caller authenticated but not a platform admin —
            protectAdminOperation()'s requireAdminRole() runs first) or SafetyCheckRequired
            (admin check passed but the double-confirmation token is missing/invalid).
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/AdminError'
                  - $ref: '#/components/schemas/SafetyCheckRequired'
        '500':
          description: Reload failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /plugins/{id}:
    delete:
      tags:
        - Plugins
      summary: Unload a plugin
      description: |
        Unloads and removes a plugin from memory.

        **Risk Level**: MEDIUM
      operationId: unloadPlugin
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Plugin ID to unload
      responses:
        '200':
          description: Plugin unloaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PluginOperationResponse'
        '403':
          description: |
            Either AdminError (caller authenticated but not a platform admin —
            protectAdminOperation()'s requireAdminRole() runs first) or SafetyCheckRequired
            (admin check passed but the confirmation token is missing/invalid).
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/AdminError'
                  - $ref: '#/components/schemas/SafetyCheckRequired'
        '500':
          description: Unload failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /snapshots/{id}/restore:
    post:
      tags:
        - Snapshots
      summary: Restore from snapshot
      description: |
        Restores system state from a snapshot. Overwrites current state.

        **Risk Level**: CRITICAL
      operationId: restoreSnapshot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Snapshot ID to restore
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreRequest'
            example:
              restoreType: "full"
              itemTypes: ["users", "data"]
      responses:
        '200':
          description: Snapshot restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreResponse'
        '403':
          description: |
            Either AdminError (caller authenticated but not a platform admin —
            protectAdminOperation()'s requireAdminRole() runs first) or SafetyCheckRequired
            (admin check passed but the confirmation token is missing/invalid).
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/AdminError'
                  - $ref: '#/components/schemas/SafetyCheckRequired'
        '500':
          description: Restore failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /snapshots/{id}:
    delete:
      tags:
        - Snapshots
      summary: Delete a snapshot
      description: |
        Permanently deletes a snapshot.

        **Risk Level**: MEDIUM
      operationId: deleteSnapshot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Snapshot ID to delete
      responses:
        '200':
          description: Snapshot deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '403':
          description: |
            Either AdminError (caller authenticated but not a platform admin —
            protectAdminOperation()'s requireAdminRole() runs first; GHSA-h8mf hardening) or
            SafetyCheckRequired (admin check passed but the confirmation token is missing/invalid).
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/AdminError'
                  - $ref: '#/components/schemas/SafetyCheckRequired'

  /snapshots/cleanup:
    post:
      tags:
        - Snapshots
      summary: Cleanup expired snapshots
      description: |
        Removes expired snapshots to free storage space.

        **Risk Level**: HIGH
        **Sprint 2**: Protected and critical snapshots are automatically skipped
      operationId: cleanupSnapshots
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                dryRun:
                  type: boolean
                  default: false
                  description: If true, simulates cleanup without deleting
      responses:
        '200':
          description: Cleanup completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CleanupResponse'
              example:
                success: true
                message: "Cleanup completed: 5 snapshots deleted, 2 protected skipped"
                deleted: 5
                skipped: 2
                freedBytes: 1048576
        '403':
          description: |
            Either AdminError (caller authenticated but not a platform admin —
            protectAdminOperation()'s requireAdminRole() runs first) or SafetyCheckRequired
            (admin check passed but the confirmation token is missing/invalid).
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/AdminError'
                  - $ref: '#/components/schemas/SafetyCheckRequired'

  /snapshots/{id}/tags:
    put:
      tags:
        - Snapshot Protection
      summary: Add or remove tags from snapshot
      description: |
        Add or remove tags from a snapshot. Tags are used for organization,
        filtering, and protection rule matching.

        **Sprint 2**: Snapshot Protection System
      operationId: updateSnapshotTags
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Snapshot ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                add:
                  type: array
                  items:
                    type: string
                  description: Tags to add
                remove:
                  type: array
                  items:
                    type: string
                  description: Tags to remove
            example:
              add: ["production", "v1.0.0", "stable"]
              remove: ["beta"]
      responses:
        '200':
          description: Tags updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotResponse'
        '403':
          description: Caller is authenticated but is not a platform admin (requireAdminRole()).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminError'
        '404':
          description: Snapshot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /snapshots/{id}/protection:
    patch:
      tags:
        - Snapshot Protection
      summary: Set snapshot protection level
      description: |
        Set the protection level for a snapshot. Protected and critical
        snapshots are automatically skipped during cleanup operations.

        **Sprint 2**: Snapshot Protection System
        **Protection Levels**:
        - normal: Standard snapshot, eligible for cleanup when expired
        - protected: Protected from automatic cleanup
        - critical: Highest protection, never auto-deleted
      operationId: setSnapshotProtectionLevel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Snapshot ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - level
              properties:
                level:
                  type: string
                  enum: [normal, protected, critical]
            example:
              level: "protected"
      responses:
        '200':
          description: Protection level updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotResponse'
        '400':
          description: Invalid protection level
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Caller is authenticated but is not a platform admin (requireAdminRole()).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminError'
        '404':
          description: Snapshot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /snapshots/{id}/release-channel:
    patch:
      tags:
        - Snapshot Protection
      summary: Set snapshot release channel
      description: |
        Set the release channel for a snapshot. Used for managing
        different deployment stages and protection policies.

        **Sprint 2**: Snapshot Protection System
      operationId: setSnapshotReleaseChannel
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Snapshot ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - channel
              properties:
                channel:
                  type: string
                  enum: [stable, canary, beta, experimental]
                  nullable: true
            example:
              channel: "stable"
      responses:
        '200':
          description: Release channel updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotResponse'
        '400':
          description: Invalid release channel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Caller is authenticated but is not a platform admin (requireAdminRole()).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminError'
        '404':
          description: Snapshot not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /snapshots:
    # NOTE (2026-09-20 security-schemes audit): GET / in snapshot-labels.ts has no
    # requireAdminRole() (unlike its PUT/PATCH siblings on this same router) — any caller who
    # clears the global JWT gate can query the snapshot list. No 403 is documented here because
    # none is actually returned; flagged as a residual finding, not fixed by this PR.
    get:
      tags:
        - Snapshot Protection
      summary: Query snapshots with filters
      description: |
        Query snapshots by tags, protection level, or release channel.

        **Sprint 2**: Snapshot Protection System
      operationId: querySnapshots
      parameters:
        - name: tags
          in: query
          schema:
            type: string
          description: Comma-separated list of tags (matches snapshots with ANY of the tags)
          example: "production,v1.0.0"
        - name: protection_level
          in: query
          schema:
            type: string
            enum: [normal, protected, critical]
          description: Filter by protection level
        - name: release_channel
          in: query
          schema:
            type: string
            enum: [stable, canary, beta, experimental]
          description: Filter by release channel
      responses:
        '200':
          description: Snapshots matching query
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  snapshots:
                    type: array
                    items:
                      $ref: '#/components/schemas/Snapshot'
                  count:
                    type: integer
        '400':
          description: Invalid query parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /safety/rules:
    get:
      tags:
        - Protection Rules
      summary: List all protection rules
      description: |
        List all protection rules with optional filtering.

        **Sprint 2**: Snapshot Protection System
      operationId: listProtectionRules
      parameters:
        - name: target_type
          in: query
          schema:
            type: string
            enum: [snapshot, plugin, schema, workflow]
          description: Filter by target entity type
        - name: is_active
          in: query
          schema:
            type: boolean
          description: Filter by active status
      responses:
        '200':
          description: List of protection rules
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  rules:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProtectionRule'
                  count:
                    type: integer
        '403':
          description: Caller is authenticated but is not a platform admin (requireAdminRole()).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminError'
    post:
      tags:
        - Protection Rules
      summary: Create a new protection rule
      description: |
        Create a new protection rule to enforce policies on operations.

        **Sprint 2**: Snapshot Protection System
      operationId: createProtectionRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProtectionRuleRequest'
      responses:
        '201':
          description: Protection rule created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  rule:
                    $ref: '#/components/schemas/ProtectionRule'
                  message:
                    type: string
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Caller is authenticated but is not a platform admin (requireAdminRole()).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminError'

  /safety/rules/{id}:
    get:
      tags:
        - Protection Rules
      summary: Get a single protection rule
      description: Get details of a specific protection rule
      operationId: getProtectionRule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Protection rule ID
      responses:
        '200':
          description: Protection rule details
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  rule:
                    $ref: '#/components/schemas/ProtectionRule'
        '403':
          description: Caller is authenticated but is not a platform admin (requireAdminRole()).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminError'
        '404':
          description: Rule not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags:
        - Protection Rules
      summary: Update a protection rule
      description: Update an existing protection rule
      operationId: updateProtectionRule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Protection rule ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProtectionRuleRequest'
      responses:
        '200':
          description: Protection rule updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  rule:
                    $ref: '#/components/schemas/ProtectionRule'
                  message:
                    type: string
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Caller is authenticated but is not a platform admin (requireAdminRole()).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminError'
        '404':
          description: Rule not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Protection Rules
      summary: Delete a protection rule
      description: Delete a protection rule
      operationId: deleteProtectionRule
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: Protection rule ID
      responses:
        '200':
          description: Protection rule deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '403':
          description: Caller is authenticated but is not a platform admin (requireAdminRole()).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminError'
        '404':
          description: Rule not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /safety/rules/evaluate:
    post:
      tags:
        - Protection Rules
      summary: Dry-run evaluation of protection rules
      description: |
        Test how protection rules would apply to a given operation
        without actually executing it. Useful for testing and debugging rules.

        **Sprint 2**: Snapshot Protection System
      operationId: evaluateProtectionRules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RuleEvaluationRequest'
      responses:
        '200':
          description: Rule evaluation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleEvaluationResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Caller is authenticated but is not a platform admin (requireAdminRole()).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminError'

  /cache/clear:
    post:
      tags:
        - System
      summary: Clear application cache
      description: |
        Clears all cached data from memory.

        **Risk Level**: LOW
      operationId: clearCache
      responses:
        '200':
          description: Cache cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '403':
          description: |
            Two distinct rejections share this status on this operation. requireAdminRole() runs
            first and answers AdminError (error: Forbidden, code: ADMIN_REQUIRED) when the caller
            is authenticated but is not a platform admin; only an admin caller reaches
            requireSafetyCheck(), which answers SafetyCheckRequired when a safety token is needed.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AdminError'
                  - $ref: '#/components/schemas/SafetyCheckRequired'
        '503':
          description: |
            requireAdminRole() fails closed: the admin-role lookup itself threw, so the request is
            refused rather than allowed through (error: ServiceUnavailable, code: RBAC_CHECK_FAILED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /metrics/reset:
