        '503':
          description: |
            requireAdminRole() fails closed: the admin-role lookup itself threw, so the request is
            refused rather than allowed through (error: ServiceUnavailable, code: RBAC_CHECK_FAILED).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /data/bulk:
    delete:
      tags:
        - Data
      summary: Bulk delete data
      description: |
        Deletes data in bulk based on filters.

        **Risk Level**: CRITICAL
      operationId: bulkDeleteData
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkDeleteRequest'
      responses:
        '200':
          description: Bulk deletion initiated
          content:
            application/json:
              schema:
