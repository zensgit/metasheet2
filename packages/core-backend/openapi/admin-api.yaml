components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Global gate for every /api/admin path (jwt-middleware.ts:150-168, mounted at
        index.ts:1670-1683). Missing or invalid token -> 401. This scheme only proves the caller
        is authenticated; it does not by itself grant admin privileges. Operations additionally
        gated by requireAdminRole()/protectAdminOperation() can still reject an authenticated
        non-admin caller with 403 (see AdminError) — check each operation's own responses.

  parameters:
    IdempotencyKey:
      name: X-Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        maxLength: 255
      description: Unique key to prevent duplicate operations

  schemas:
    SafetyStatus:
      type: object
      properties:
        enabled:
          type: boolean
        pendingConfirmations:
          type: integer
        config:
          type: object
          properties:
            tokenExpirationSeconds:
              type: integer
            allowBypass:
              type: boolean

    ConfirmationRequest:
      type: object
      required:
        - token
        - acknowledged
      properties:
        token:
          type: string
          description: Safety token from initial request
        acknowledged:
          type: boolean
          description: User acknowledgment of risk
        typedConfirmation:
          type: string
          description: Required for double confirmation operations

    ConfirmationResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        operationResult:
          type: object
          description: Result of the confirmed operation

    SafetyCheckRequired:
      type: object
      properties:
        requiresConfirmation:
          type: boolean
          default: true
        token:
          type: string
          description: Safety token for confirmation
        operation:
          type: string
        riskLevel:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        message:
          type: string
        expiresAt:
          type: string
          format: date-time
        requiresDoubleConfirmation:
          type: boolean

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        warning:
          type: string

    PluginOperationResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        pluginId:
          type: string

    RestoreRequest:
      type: object
      properties:
        restoreType:
          type: string
          enum: [full, partial]
          default: full
        itemTypes:
          type: array
          items:
            type: string

    RestoreResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        snapshotId:
          type: string
        result:
          type: object
        warning:
          type: string

    CleanupResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        deleted:
          type: integer
        skipped:
          type: integer
          description: Number of protected snapshots skipped (Sprint 2)
        freedBytes:
          type: integer
        dryRun:
          type: boolean

    Snapshot:
      type: object
      properties:
        id:
          type: string
        view_id:
          type: string
        name:
          type: string
        description:
          type: string
        snapshot_data:
          type: object
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
        expires_at:
          type: string
          format: date-time
        is_locked:
          type: boolean
        tags:
          type: array
          items:
            type: string
          description: Snapshot tags (Sprint 2)
        protection_level:
          type: string
          enum: [normal, protected, critical]
          description: Protection level (Sprint 2)
        release_channel:
          type: string
          enum: [stable, canary, beta, experimental]
          nullable: true
          description: Release channel (Sprint 2)

    SnapshotResponse:
      type: object
      properties:
        success:
          type: boolean
        snapshot:
          $ref: '#/components/schemas/Snapshot'
        message:
          type: string

    ProtectionRule:
      type: object
      properties:
        id:
          type: string
        rule_name:
          type: string
        description:
          type: string
        target_type:
          type: string
          enum: [snapshot, plugin, schema, workflow]
        conditions:
          type: object
          description: JSON-based rule conditions
        effects:
          type: object
          description: Effects to apply when rule matches
        priority:
          type: integer
          description: Higher priority rules are evaluated first
        is_active:
          type: boolean
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        created_by:
          type: string
        updated_at:
          type: string
          format: date-time
        updated_by:
          type: string

    CreateProtectionRuleRequest:
      type: object
      required:
        - rule_name
        - target_type
        - conditions
        - effects
      properties:
        rule_name:
          type: string
        description:
          type: string
        target_type:
          type: string
          enum: [snapshot, plugin, schema, workflow]
        conditions:
          type: object
          description: |
            JSON conditions with operators: eq, ne, contains, in, gt, lt, gte, lte, exists.
            Supports composite conditions: all, any, not
        effects:
          type: object
          description: |
            Effect to apply when rule matches.
            Actions: allow, block, elevate_risk, require_approval
        priority:
          type: integer
          default: 100
        is_active:
          type: boolean
          default: true

    UpdateProtectionRuleRequest:
      type: object
      properties:
        rule_name:
          type: string
        description:
          type: string
        conditions:
          type: object
        effects:
          type: object
        priority:
          type: integer
        is_active:
          type: boolean

    RuleEvaluationRequest:
      type: object
      required:
        - entity_type
        - entity_id
        - operation
      properties:
        entity_type:
          type: string
          enum: [snapshot, plugin, schema, workflow]
        entity_id:
          type: string
        operation:
          type: string
        properties:
          type: object
          description: Entity properties to match against
        user_id:
          type: string

    RuleEvaluationResponse:
      type: object
      properties:
        success:
          type: boolean
        result:
          type: object
          properties:
            matched:
              type: boolean
            rule_id:
              type: string
            rule_name:
              type: string
            effects:
              type: object
            execution_time_ms:
              type: number
        message:
          type: string

    BulkDeleteRequest:
      type: object
      required:
        - table
        - filters
      properties:
        table:
          type: string
        filters:
          type: object
        estimatedCount:
          type: integer

    BulkUpdateRequest:
      type: object
      required:
        - table
        - updates
      properties:
        table:
          type: string
        updates:
          type: object
        estimatedCount:
          type: integer

    BulkOperationResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        table:
          type: string
        estimatedCount:
          type: integer

    Error:
      type: object
      properties:
        success:
          type: boolean
          default: false
        error:
          type: string
        details:
          type: object

    AdminError:
      type: object
      description: |
        Exact response body of requireAdminRole() (guards/audit-integration.ts:113-198). Distinct
        from the generic Error schema above: no `success` field, and `error` is a fixed category
        string rather than a free-form message. Returned with HTTP 403 when the caller is
        authenticated but is not a platform admin; the same middleware fails closed with HTTP 503
        and error: ServiceUnavailable / code: RBAC_CHECK_FAILED if the admin-role lookup itself
        throws (e.g. RBAC service unavailable) — not modeled as a separate response here since this
        schema only documents the 403 case.
      required:
        - error
        - code
        - message
      properties:
        error:
          type: string
          enum:
            - AccessDenied
          example: AccessDenied
        code:
          type: string
          enum:
            - ADMIN_REQUIRED
          example: ADMIN_REQUIRED
        message:
          type: string
          example: This operation requires admin privileges
