    MultitableField:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          $ref: '#/components/schemas/MultitableFieldType'
        property:
          type: object
          additionalProperties: true
          properties:
            foreignBaseId:
              type: string
              description: >-
                Cross-base opt-in claim for a `link` field (②b). When present,
                the link is permitted to target a foreign sheet in a DIFFERENT
                base IFF this value equals the foreign sheet's actual base_id
                (claim == truth); a mismatched or absent value keeps the
                cross-base link rejected. Immutable after create. Cross-base
                READ additionally requires foreign-base read permission; a
                reader lacking it sees foreign data masked (and a 403 on the
                explicit link-options pull). Omitted for same-base links.
            rich:
              type: boolean
              description: >-
                Rich-text opt-in for a `longText` field. When `true`, the field
                stores sanitized HTML (constrained allow-list:
                b/strong/i/em/u/s, a[http|https|mailto] with forced rel=noopener
                target=_blank, ul/ol/li, h1-h3, p/br/blockquote/code/pre) —
                every value is sanitized SERVER-SIDE on write (the authoritative
                XSS defense), so the stored value is inert by construction.
                Default/absent = `false` = plain text (legacy behavior).
                Toggling `rich` ON is rejected on a field that already holds
                data (historical plain values were never sanitized). Omitted for
                plain longText and all non-longText fields.
            twoWay:
              type: boolean
              description: >-
                Bidirectional / mirror links MVP. When `true`, this `link` field
                participates in a paired (two-way) relationship: the foreign
                sheet has a paired field that surfaces the reverse of the SAME
                `meta_links` edge (a derived read-projection — no materialized
                mirror row, no write-back). Same-base only in the MVP. Omitted
                for ordinary one-directional links.
            mirrorFieldId:
              type: string
              description: >-
                Bidirectional / mirror links MVP. Id of the paired `link` field
                on the foreign sheet. The pairing is symmetric (each side's
                `mirrorFieldId` names the other) and validated at field
                create/patch; the two sides must be same-base.
            mirrorOf:
              type: string
              description: >-
                Bidirectional / mirror links MVP — present ONLY on the DERIVED
                (mirror) side. Its value is the paired FORWARD field's id. A
                field with `mirrorOf` set resolves the reverse projection of the
                forward edge (`WHERE field_id=mirrorOf AND
                foreign_record_id=<record>`) and is forced READ-ONLY
                (mirror-side editing is deferred), so the single canonical edge
                never gains a second row.
            visibilityRule:
              type: object
              description: >-
                Conditional field-VISIBILITY (form-conditional-fields MVP,
                2026-06-14). When present, presentation surfaces (the form view)
                show/hide THIS field based on a condition evaluated against
                ANOTHER field's value in the SAME record being entered. Absent ⇒
                always visible (backward-compatible). The `operator` vocabulary
                is shared with conditional formatting
                (`gt`/`gte`/`lt`/`lte`/`eq`/`neq`/`between`/`contains`/`not_contains`/`is_empty`/
                `is_not_empty`/`is_today`/`is_in_last_n_days`/`is_in_next_n_days`/`is_overdue`/`is_true`/
                `is_false`); value-less operators omit `value`. PRESENTATION
                ONLY — a field hidden by this rule is NOT a security boundary;
                the value is still masked (or not) by the normal
                field-permission layer. Never a substitute for field
                permissions.
              required:
                - fieldId
                - operator
              properties:
                fieldId:
                  type: string
                  description: >-
                    Id of the OTHER field in the same record whose value the
                    condition reads.
                operator:
                  type: string
                  description: >-
                    Condition operator (shared with conditional-formatting
                    vocabulary).
                value:
                  description: >-
                    Comparison operand. Omitted for value-less operators (the
                    `is_*` family); a 2-element array for `between`; a positive
                    integer for the `*_n_days` operators; otherwise a scalar.
        options:
          type: array
          items:
            type: object
            properties:
              value:
                type: string
              color:
                type: string
                nullable: true
            required:
              - value
        order:
          type: integer
