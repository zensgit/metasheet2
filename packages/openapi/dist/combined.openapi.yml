    ProvenanceEventType:
      type: string
      description: >-
        Data Factory DF-N2-1 provenance event type. `row_skipped` is
        reserved/deferred and is not accepted by this contract.
      enum:
        - source_read
        - row_imported
        - row_edited
        - mapping_applied
        - validation_failed
        - dry_run_previewed
        - target_write_attempted
        - target_write_succeeded
        - target_write_failed
        - row_retried
        - row_exported
    ProvenanceEvent:
      type: object
      description: >-
        Data Factory DF-N2-1 row provenance event contract. This component
        freezes the redacted event shape only; no route or runtime persistence
        is introduced here.
      additionalProperties: false
      properties:
        runId:
          type: string
          minLength: 1
        rowId:
          type: string
          minLength: 1
        eventType:
          $ref: '#/components/schemas/ProvenanceEventType'
        at:
          type: string
          format: date-time
        attrs:
          type: object
          description: >-
            Redacted safe attributes only. Tokens, passwords, authorization
            headers, connection strings, raw payloads, and customer secrets must
            not be exposed.
          additionalProperties: true
      required:
        - runId
        - rowId
        - eventType
        - at
        - attrs
    ProvenanceTimelineEntry:
      type: object
      description: >-
        Data Factory DF-N2-2c read-only timeline entry — one redacted provenance
        event in a row's cross-run timeline (GET
        /api/integration/provenance?rowId=...). Reads the
        integration_provenance_by_row view (migration 060); attrs were redacted
        at write (DF-N2-2b scrub gate), the read path does NOT re-redact.
      additionalProperties: false
      properties:
        runId:
          type: string
          minLength: 1
        pipelineId:
          type: string
        rowId:
          type: string
          minLength: 1
        eventType:
          $ref: '#/components/schemas/ProvenanceEventType'
        at:
          type: string
          format: date-time
        attrs:
          type: object
          description: >-
            Redacted safe attributes only (redacted at write; never
            tokens/passwords/connection-strings/raw payloads).
          additionalProperties: true
        eventIndex:
          type: integer
          description: >-
            Stable ordinal of the event within its run (the view's WITH
            ORDINALITY).
        runStatus:
          type: string
        runMode:
          type: string
        runCreatedAt:
          type: string
          format: date-time
          description: >-
            Run creation time; the read-route from/to window bounds whole runs
            by this field.
      required:
        - runId
        - pipelineId
        - rowId
        - eventType
        - at
        - attrs
        - eventIndex
        - runStatus
        - runMode
        - runCreatedAt
    ConnectorActionOperation:
      type: string
      description: >-
        DF-T1A connector action operation kind. read/preview/export are
        non-mutating; upsert is a write (always gated). Submit/Audit/BOM are
        intentionally NOT modeled here.
      enum:
        - read
        - preview
        - upsert
        - export
    ConnectorActionInput:
      type: object
      additionalProperties: false
      description: >-
        One business input for a connector action. References data by `source`
        (e.g. record.FNumber); never an inline literal value (no secrets in
        metadata).
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
        source:
          type: string
        required:
          type: boolean
    ConnectorAction:
      type: object
      description: >-
        DF-T1A connector action metadata — one safe, named operation exposed by
        a connector profile, as metadata around an existing adapter method.
        Latent contract: authorizes no generic HTTP client, user JavaScript, or
        SQL. Write actions (upsert) are always gated.
      additionalProperties: false
      properties:
        actionId:
          type: string
          minLength: 1
        connectorKind:
          type: string
          minLength: 1
        operation:
          $ref: '#/components/schemas/ConnectorActionOperation'
        label:
          type: string
        request:
          type: object
          additionalProperties: false
          required:
            - method
            - path
            - inputs
          properties:
            method:
              type: string
            path:
              type: string
              description: >-
                Relative to the connector base URL — no scheme/host/backslash,
                and no query (?) or fragment (#); query/header/body go through
                inputs.
            inputs:
              type: object
              additionalProperties: false
              properties:
                path:
                  type: array
                  items:
                    $ref: '#/components/schemas/ConnectorActionInput'
                query:
                  type: array
                  items:
                    $ref: '#/components/schemas/ConnectorActionInput'
                header:
                  type: array
                  items:
                    $ref: '#/components/schemas/ConnectorActionInput'
                body:
                  type: array
                  items:
                    $ref: '#/components/schemas/ConnectorActionInput'
        output:
          type: object
          additionalProperties: false
          required:
            - recordPath
            - successPath
            - errorPath
          properties:
            recordPath:
              type: string
            successPath:
              type: string
            successValue: {}
            errorPath:
              type: string
        safety:
          type: object
          additionalProperties: false
          required:
            - readOnly
            - allowBatch
            - maxRowsPreview
            - requiresApproval
          properties:
            readOnly:
              type: boolean
            allowBatch:
              type: boolean
            maxRowsPreview:
              type: integer
            requiresApproval:
              type: boolean
        gated:
          type: boolean
          description: >-
            Derived — true for a write op OR requiresApproval; the UI renders
            gated actions disabled.
        help:
          type: object
          additionalProperties: true
      required:
        - actionId
        - connectorKind
        - operation
        - request
        - output
        - safety
        - gated
    AttendanceShift:
      type: object
      properties:
        id:
          type: string
        orgId:
          type: string
        org_id:
          type: string
          deprecated: true
        name:
          type: string
        timezone:
          type: string
        workStartTime:
          type: string
        work_start_time:
          type: string
          deprecated: true
        workEndTime:
          type: string
        work_end_time:
          type: string
          deprecated: true
        isOvernight:
          type: boolean
        is_overnight:
          type: boolean
          deprecated: true
        lateGraceMinutes:
          type: integer
        late_grace_minutes:
          type: integer
          deprecated: true
        earlyGraceMinutes:
          type: integer
        early_grace_minutes:
          type: integer
          deprecated: true
        roundingMinutes:
          type: integer
        rounding_minutes:
          type: integer
          deprecated: true
        workingDays:
          type: array
          items:
            type: integer
        working_days:
          type: array
          deprecated: true
          items:
            type: integer
        segments:
          type: array
          description: >-
            Canonical shift segments (W3 / #4556). Persisted rows when present;
            a legacy shift without segment rows is synthesized as segment 0 from
            its envelope. The legacy workStartTime/workEndTime/isOvernight
            fields expose the OUTER envelope of these segments for compatibility
            only — for a multi-segment shift (calculationMode=segments) the
            envelope is not payable time.
          items:
            $ref: '#/components/schemas/AttendanceShiftSegment'
        calculationMode:
          type: string
          enum:
            - envelope
            - segments
        plannedMinutes:
          type: integer
          description: >-
            Sum of per-segment planned minutes for strict shifts (breaks between
            segments are never counted). For flex_required_duration this is the
            required duration in minutes.
        flexPolicy:
          $ref: '#/components/schemas/AttendanceShiftFlexPolicy'
        flexEligible:
          type: boolean
          description: >-
            True only when the shift has exactly one segment. Multi-segment flex
            is rejected in v1 (OD-4556-3).
        capabilities:
          $ref: '#/components/schemas/AttendanceShiftCapabilities'
    AttendanceShiftFlexPolicy:
      description: >-
        W5 flexible attendance policy (design lock §3.3). Discriminated by mode.
        flex_required_duration is valid only for a one-segment shift;
        multi-segment flex is rejected with a typed 422 and zero writes. Absent
        flexPolicy on create defaults to strict.
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - mode
          properties:
            mode:
              type: string
              enum:
                - strict
        - type: object
          additionalProperties: false
          required:
            - mode
            - requiredMinutes
            - arrivalWindowBeforeMinutes
            - arrivalWindowAfterMinutes
          properties:
            mode:
              type: string
              enum:
                - flex_required_duration
            requiredMinutes:
              type: integer
              minimum: 1
              maximum: 1440
            arrivalWindowBeforeMinutes:
              type: integer
              minimum: 0
            arrivalWindowAfterMinutes:
              type: integer
              minimum: 0
            coreStartTime:
              type: string
              nullable: true
              description: >-
                Optional same-day core-hours start (HH:MM) in the shift
                timezone.
              pattern: ^(?:[01]\d|2[0-3]):[0-5]\d$
            coreEndTime:
              type: string
              nullable: true
              description: Optional same-day core-hours end (HH:MM) in the shift timezone.
              pattern: ^(?:[01]\d|2[0-3]):[0-5]\d$
    AttendanceShiftSegment:
      type: object
      properties:
        id:
          type: string
          nullable: true
          description: >-
            Persisted segment row id; null when synthesized from the legacy
            envelope.
        segmentIndex:
          type: integer
          minimum: 0
          maximum: 2
        segment_index:
          type: integer
          deprecated: true
