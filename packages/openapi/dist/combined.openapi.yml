                                  type: integer
                                approved:
                                  type: integer
                                rejected:
                                  type: integer
                                revoked:
                                  type: integer
                                avgDurationSeconds:
                                  type: number
                                  nullable: true
                                slaBreachRate:
                                  type: number
                      slowestInstances:
                        type: array
                        items:
                          type: object
                          properties:
                            instanceId:
                              type: string
                            templateId:
                              type: string
                              nullable: true
                            startedAt:
                              type: string
                              format: date-time
                            terminalAt:
                              type: string
                              format: date-time
                              nullable: true
                            terminalState:
                              type: string
                              nullable: true
                              enum:
                                - approved
                                - rejected
                                - revoked
                                - returned
                            durationSeconds:
                              type: integer
                            slaHours:
                              type: integer
                              nullable: true
                            slaBreached:
                              type: boolean
                            slaBreachedAt:
                              type: string
                              format: date-time
                              nullable: true
                      breachedTemplates:
                        type: array
                        items:
                          type: object
                          properties:
                            templateId:
                              type: string
                              nullable: true
                            total:
                              type: integer
                            slaCandidateCount:
                              type: integer
                            slaBreachCount:
                              type: integer
                            slaBreachRate:
                              type: number
                            avgDurationSeconds:
                              type: number
                              nullable: true
                            p95DurationSeconds:
