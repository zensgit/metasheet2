            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  count:
                    type: integer
                  list:
                    type: array
                    items:
                      $ref: '#/components/schemas/PluginAdminEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/plugins/health:
    get:
      summary: Plugin health status (admin)
      security:
