openapi: 3.0.3
info:
  title: Metasheet v2 API
  version: 0.1.0
servers:
  - url: http://localhost:8900
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    StandardResponse:
      type: object
      properties:
        ok:
          type: boolean
        data:
          nullable: true
    ErrorResponse:
      type: object
      properties:
        ok:
          type: boolean
          default: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
    DirectErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
    User:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        roles:
          type: array
          items:
            type: string
        perms:
          type: array
          items:
            type: string
    Permission:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    Role:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        permissions:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Comment:
      type: object
      properties:
        id:
          type: string
        targetType:
          type: string
          nullable: true
        targetId:
          type: string
          nullable: true
        targetFieldId:
          type: string
          nullable: true
          description: Frontend alias for fieldId.
        containerType:
          type: string
          nullable: true
        containerId:
          type: string
          nullable: true
          description: Frontend alias for spreadsheetId.
        spreadsheetId:
          type: string
          nullable: true
        rowId:
          type: string
          nullable: true
        fieldId:
          type: string
          nullable: true
          description: >-
            Backend field-thread identifier. Replies inherit the parent field
            scope.
        content:
          type: string
        authorId:
          type: string
        parentId:
          type: string
          nullable: true
          description: Parent comment id for one-level threaded replies.
        resolved:
          type: boolean
        createdAt:
          type: string
        updatedAt:
          type: string
        mentions:
          type: array
          items:
            type: string
          description: Mentioned user identifiers parsed from comment content.
    CommentsListResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Comment'
            total:
              type: integer
              example: 1
            limit:
              type: integer
              example: 50
            offset:
              type: integer
              example: 0
    CommentInboxItem:
      allOf:
        - $ref: '#/components/schemas/Comment'
        - type: object
          properties:
            unread:
              type: boolean
            mentioned:
              type: boolean
            baseId:
              type: string
              nullable: true
            sheetId:
              type: string
              nullable: true
            viewId:
              type: string
              nullable: true
            recordId:
              type: string
              nullable: true
            baseName:
              type: string
              nullable: true
            sheetName:
              type: string
              nullable: true
            viewName:
              type: string
              nullable: true
            fieldName:
              type: string
              nullable: true
          required:
            - unread
            - mentioned
    CommentInboxResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/CommentInboxItem'
            total:
              type: integer
              example: 1
            limit:
              type: integer
              example: 50
            offset:
              type: integer
              example: 0
    CommentMentionCandidate:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        subtitle:
          type: string
      required:
        - id
        - label
    CommentMentionCandidatesResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/CommentMentionCandidate'
            total:
              type: integer
              example: 1
            limit:
              type: integer
              example: 50
    CommentUnreadCountResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        data:
          type: object
          properties:
            count:
              type: integer
              example: 0
    CommentPresenceSummary:
      type: object
      properties:
        spreadsheetId:
          type: string
        rowId:
          type: string
        unresolvedCount:
          type: integer
        fieldCounts:
          type: object
          additionalProperties:
            type: integer
        mentionedCount:
          type: integer
          description: >-
            Unresolved comments in this record that mention the current
            requester.
        mentionedFieldCounts:
          type: object
          description: Per-field unresolved mention counts for the current requester.
          additionalProperties:
            type: integer
    CommentMentionSummaryItem:
      type: object
      properties:
        rowId:
          type: string
        mentionedCount:
          type: integer
          description: >-
            Number of unresolved comments in this record that mention the
            current user.
        unreadCount:
          type: integer
          description: >-
            Number of unresolved mentioned comments in this record that have not
            been marked as read by the current user.
        mentionedFieldIds:
          type: array
          items:
            type: string
          description: Deduplicated, sorted field ids where the user is mentioned.
      required:
        - rowId
        - mentionedCount
        - unreadCount
        - mentionedFieldIds
    CommentMentionSummary:
      type: object
      properties:
        spreadsheetId:
          type: string
        unresolvedMentionCount:
          type: integer
          description: >-
            Total number of unresolved comments mentioning the current user
            across all records.
        unreadMentionCount:
          type: integer
          description: >-
            Total unresolved mentioned comments that have not been marked as
            read by the current user.
        mentionedRecordCount:
          type: integer
          description: Number of distinct records with unresolved mentions.
        unreadRecordCount:
          type: integer
          description: Number of distinct records with unread mentions.
        items:
          type: array
          items:
            $ref: '#/components/schemas/CommentMentionSummaryItem'
          description: Per-record breakdown, sorted by mentionedCount desc, rowId asc.
      required:
        - spreadsheetId
        - unresolvedMentionCount
        - unreadMentionCount
        - mentionedRecordCount
        - unreadRecordCount
        - items
    CommentMentionSummaryResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/CommentMentionSummary'
    CommentsSummaryResponse:
      type: object
      properties:
        ok:
          type: boolean
          example: true
        data:
          type: object
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/CommentPresenceSummary'
            total:
              type: integer
              example: 1
    PluginAdminEntry:
      type: object
      properties:
        name:
          type: string
        displayName:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        version:
          type: string
          nullable: true
        author:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - active
            - inactive
            - failed
        error:
          type: string
          nullable: true
        lastAttempt:
          type: string
          nullable: true
        registryStatus:
          type: string
          nullable: true
        lastActivated:
          type: string
          nullable: true
    PluginConfigEntry:
      type: object
      properties:
        config:
          type: object
        schema:
          type: object
          nullable: true
        version:
          type: string
          nullable: true
        last_modified:
          type: string
          nullable: true
        modified_by:
          type: string
          nullable: true
    AttendanceEvent:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        org_id:
          type: string
        work_date:
          type: string
          format: date
        occurred_at:
          type: string
          format: date-time
        event_type:
          type: string
          enum:
            - check_in
            - check_out
            - adjustment
        source:
          type: string
        timezone:
          type: string
        location:
          type: object
        meta:
          type: object
        created_at:
          type: string
          format: date-time
    AttendancePunchEvent:
      allOf:
        - $ref: '#/components/schemas/AttendanceEvent'
    AttendanceRecord:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        org_id:
          type: string
        work_date:
          type: string
          format: date
        timezone:
          type: string
        first_in_at:
          type: string
          format: date-time
          nullable: true
        last_out_at:
          type: string
          format: date-time
          nullable: true
        work_minutes:
          type: integer
        late_minutes:
          type: integer
        early_leave_minutes:
          type: integer
        status:
          type: string
        is_workday:
          type: boolean
        meta:
          type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AttendanceW4ShadowDiff:
      type: object
      additionalProperties: false
      required:
        - schemaVersion
        - code
        - changedFields
        - absoluteMinuteDelta
        - segmentCount
      properties:
        schemaVersion:
          type: integer
          enum:
            - 1
        code:
          type: string
          enum:
            - equal
            - expected_break_exclusion
            - status_changed
            - work_minutes_mismatch
            - late_minutes_mismatch
            - early_leave_minutes_mismatch
            - missing_boundary_mismatch
            - work_date_mismatch
            - context_mismatch
            - input_mismatch
            - review_required
            - legacy_uncomparable
        changedFields:
          type: array
          uniqueItems: true
          maxItems: 9
          items:
            type: string
            enum:
              - workDate
              - status
              - firstInAt
              - lastOutAt
              - workMinutes
              - lateMinutes
              - earlyLeaveMinutes
              - context
              - input
        absoluteMinuteDelta:
          type: integer
          minimum: 0
        segmentCount:
          type: integer
          minimum: 0
          maximum: 3
    AttendanceW4CalculationSegment:
      type: object
      additionalProperties: false
      required:
        - index
        - expectedStartAt
        - expectedEndAt
        - actualInAt
        - actualOutAt
        - workMinutes
        - lateMinutes
        - earlyLeaveMinutes
        - status
        - statusReasons
      properties:
        index:
          type: integer
          minimum: 0
          maximum: 2
        expectedStartAt:
          type: string
          format: date-time
        expectedEndAt:
          type: string
          format: date-time
        actualInAt:
          type: string
          format: date-time
          nullable: true
        actualOutAt:
          type: string
          format: date-time
          nullable: true
        workMinutes:
          type: integer
          minimum: 0
        lateMinutes:
          type: integer
          minimum: 0
        earlyLeaveMinutes:
          type: integer
          minimum: 0
        status:
          type: string
          enum:
            - normal
            - late
            - early_leave
            - late_early
            - missing_check_in
            - missing_check_out
            - missing_both
        statusReasons:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
              - within_window
              - late_check_in
              - early_check_out
              - missing_check_in
              - missing_check_out
              - missing_both
              - approved_correction_applied
              - approved_leave_overlay
              - approved_overtime_overlay
              - dst_fold_start_earlier
              - dst_fold_end_later
    AttendanceW4Calculation:
      type: object
      additionalProperties: false
      required:
        - id
        - version
        - kind
        - mode
        - entrypoint
        - engineVersion
        - snapshotSchemaVersion
        - outcome
        - outcomeReasonCode
        - projectionEffect
        - expectedSegmentCount
        - projectedStatus
        - projectedWorkMinutes
        - projectedLateMinutes
        - projectedEarlyLeaveMinutes
        - shadowDiff
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        kind:
          type: string
          enum:
            - legacy_baseline
            - calculation
            - reversal
        mode:
          type: string
          enum:
            - shadow
            - authoritative
        entrypoint:
          type: string
          enum:
            - live
            - legacy_import
            - integration_sync
            - correction
            - approved_leave
            - approved_overtime
            - outdoor_approval
            - manual_override
            - recompute
            - scheduled
            - approval_reversal
            - import_rollback
            - ops_retirement
        engineVersion:
          type: string
        snapshotSchemaVersion:
          type: integer
          enum:
            - 1
        outcome:
          type: string
          enum:
            - baseline
            - completed
            - review_required
            - reversed
        outcomeReasonCode:
          type: string
          enum:
            - calculated
            - shadow_only
            - legacy_projection_baseline
            - ambiguous_segment_match
            - duplicate_check_in
            - duplicate_check_out
            - dst_gap_local_time
            - dst_fold_shared_boundary_ambiguous
            - invalid_timezone
            - invalid_segment_order
            - invalid_evidence_order
            - overlapping_actual_intervals
            - evidence_outside_attribution_window
            - missing_frozen_context
            - legacy_attribution_not_upgradeable
            - frozen_evidence_unavailable
            - context_resolution_ambiguous
            - context_mismatch
            - input_schema_invalid
            - legacy_time_ingress_not_authoritative
            - approved_fact_conflict
            - manual_override_invalid
            - import_metric_conflict
            - import_rollback_reversal
            - operator_retirement
        projectionEffect:
          type: string
          enum:
            - none
            - set_active
            - set_retired
        expectedSegmentCount:
          type: integer
          minimum: 0
          maximum: 3
        projectedStatus:
          type: string
          nullable: true
          enum:
            - normal
            - late
            - early_leave
            - late_early
            - partial
            - absent
            - adjusted
            - 'off'
        projectedWorkMinutes:
          type: integer
          minimum: 0
          nullable: true
        projectedLateMinutes:
          type: integer
          minimum: 0
          nullable: true
        projectedEarlyLeaveMinutes:
          type: integer
          minimum: 0
          nullable: true
        shadowDiff:
          allOf:
            - $ref: '#/components/schemas/AttendanceW4ShadowDiff'
          nullable: true
        createdAt:
          type: string
          format: date-time
    AttendanceW4CalculationDetail:
      type: object
      additionalProperties: false
      required:
        - recordId
        - calculation
        - segments
        - current
      properties:
        recordId:
          type: string
          format: uuid
        calculation:
          allOf:
            - $ref: '#/components/schemas/AttendanceW4Calculation'
          nullable: true
        segments:
          type: array
          maxItems: 3
          items:
            $ref: '#/components/schemas/AttendanceW4CalculationSegment'
        current:
          type: object
          additionalProperties: false
          required:
            - projectionOwner
            - visibilityState
            - visibilityReason
            - posture
          properties:
            projectionOwner:
              type: string
              enum:
                - legacy_untracked
                - w4
                - w4_group
            visibilityState:
              type: string
              enum:
                - active
                - retired
            visibilityReason:
              type: string
              enum:
                - active
                - review_placeholder
                - import_rollback
                - operator_retirement
            posture:
              type: string
              enum:
                - shadow
                - authoritative
                - undeterminable
    AttendanceW4ShadowBacklogItem:
      type: object
      additionalProperties: false
      required:
        - entrypoint
        - code
        - label
        - critical
        - count
      properties:
        entrypoint:
          type: string
          enum:
            - live
            - legacy_import
            - integration_sync
            - correction
            - approved_leave
            - approved_overtime
            - outdoor_approval
            - manual_override
            - recompute
            - scheduled
            - approval_reversal
            - import_rollback
            - ops_retirement
        code:
          type: string
          enum:
            - expected_break_exclusion
            - status_changed
            - work_minutes_mismatch
            - late_minutes_mismatch
            - early_leave_minutes_mismatch
            - missing_boundary_mismatch
            - work_date_mismatch
            - context_mismatch
            - input_mismatch
            - review_required
            - legacy_uncomparable
        label:
          type: string
        critical:
          type: boolean
        count:
          type: integer
          minimum: 1
    AttendanceRequest:
      type: object
      properties:
        id:
          type: string
        user_id:
          type: string
        org_id:
          type: string
        work_date:
          type: string
          format: date
        request_type:
          type: string
          enum:
            - missed_check_in
            - missed_check_out
            - time_correction
            - leave
            - overtime
            - outdoor_punch
            - shift_swap
            - schedule_dispatch
        requested_in_at:
          type: string
          format: date-time
          nullable: true
        requested_out_at:
          type: string
          format: date-time
          nullable: true
        reason:
          type: string
          nullable: true
        status:
          type: string
          enum:
            - pending
            - approved
            - rejected
            - cancelled
        approval_instance_id:
          type: string
          nullable: true
        resolved_by:
          type: string
          nullable: true
        resolved_at:
          type: string
          format: date-time
          nullable: true
        metadata:
          type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AttendanceShiftSwapRequest:
      type: object
      properties:
        requestId:
          type: string
        request_id:
          type: string
        orgId:
          type: string
        org_id:
          type: string
        requestStatus:
          type: string
          enum:
            - pending
            - approved
            - rejected
            - cancelled
        request_status:
          type: string
          enum:
            - pending
            - approved
            - rejected
            - cancelled
        requesterUserId:
          type: string
        requester_user_id:
          type: string
        counterpartyUserId:
          type: string
        counterparty_user_id:
          type: string
        counterpartyStatus:
          type: string
          enum:
            - pending
            - accepted
            - rejected
        counterparty_status:
          type: string
          enum:
            - pending
            - accepted
            - rejected
        requesterAssignmentId:
          type: string
        requester_assignment_id:
          type: string
        counterpartyAssignmentId:
          type: string
        counterparty_assignment_id:
          type: string
        requesterReplacementAssignmentId:
          type: string
          nullable: true
        requester_replacement_assignment_id:
          type: string
          nullable: true
        counterpartyReplacementAssignmentId:
          type: string
          nullable: true
        counterparty_replacement_assignment_id:
          type: string
          nullable: true
        requesterWorkDate:
          type: string
          format: date
        requester_work_date:
          type: string
          format: date
        counterpartyWorkDate:
          type: string
          format: date
        counterparty_work_date:
          type: string
          format: date
        requesterShiftId:
          type: string
          nullable: true
          description: Null when historical evidence outlives its deleted requester shift.
        requester_shift_id:
          type: string
          nullable: true
          deprecated: true
        requesterShiftLabel:
          type: string
          description: >-
            Resolved requester shift name or a neutral deleted/unavailable
            label.
        requesterShiftStatus:
          type: string
          enum:
            - available
            - deleted
        counterpartyShiftId:
          type: string
          nullable: true
          description: >-
            Null when historical evidence outlives its deleted counterparty
            shift.
        counterparty_shift_id:
          type: string
          nullable: true
          deprecated: true
        counterpartyShiftLabel:
          type: string
          description: >-
            Resolved counterparty shift name or a neutral deleted/unavailable
            label.
        counterpartyShiftStatus:
          type: string
          enum:
            - available
            - deleted
        requesterSlotIndex:
          type: integer
        requester_slot_index:
          type: integer
        counterpartySlotIndex:
          type: integer
        counterparty_slot_index:
          type: integer
        sourceKey:
          type: string
        source_key:
          type: string
        counterpartyRespondedAt:
          type: string
          format: date-time
          nullable: true
        counterparty_responded_at:
          type: string
          format: date-time
          nullable: true
        finalizedAt:
          type: string
          format: date-time
          nullable: true
        finalized_at:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AttendanceScheduleDispatchRequest:
      type: object
      properties:
        id:
          type: string
        requestId:
          type: string
        orgId:
          type: string
        dispatchType:
          type: string
          enum:
            - daily
        userId:
          type: string
        targetScheduleGroupId:
          type: string
        targetAttendanceGroupId:
          type: string
          nullable: true
        targetDepartmentRef:
          type: string
          nullable: true
        targetShiftId:
          type: string
          nullable: true
          description: >-
            Null only when a historical cancelled dispatch outlives its deleted
            target shift.
        targetShiftLabel:
          type: string
          description: Resolved shift name or a neutral deleted/unavailable label.
        targetShiftStatus:
          type: string
          enum:
            - available
            - deleted
        slotIndex:
          type: integer
          minimum: 0
          maximum: 2
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        publishStatus:
          type: string
          enum:
            - pending
            - published
            - cancelled
        sourceKey:
          type: string
        assignmentIds:
          type: array
          items:
            type: string
        membershipId:
          type: string
          nullable: true
        finalizedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        request:
          type: object
          nullable: true
          properties:
            id:
              type: string
            status:
              type: string
              enum:
                - pending
                - approved
                - rejected
                - cancelled
            workDate:
              type: string
              format: date
            reason:
              type: string
              nullable: true
            approvalInstanceId:
              type: string
              nullable: true
    AttendanceAnomaly:
      type: object
      properties:
        recordId:
          type: string
        workDate:
          type: string
          format: date
        status:
          type: string
        isWorkday:
          type: boolean
        firstInAt:
          type: string
          format: date-time
          nullable: true
        lastOutAt:
          type: string
          format: date-time
          nullable: true
        workMinutes:
          type: integer
        lateMinutes:
          type: integer
        earlyLeaveMinutes:
          type: integer
        leaveMinutes:
          type: integer
        overtimeMinutes:
          type: integer
        warnings:
          type: array
          items:
            type: string
        state:
          type: string
          enum:
            - open
            - pending
        request:
          type: object
          nullable: true
          properties:
            id:
              type: string
            status:
              type: string
            requestType:
              type: string
        suggestedRequestType:
          type: string
          nullable: true
