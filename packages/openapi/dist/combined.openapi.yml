              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      summary:
                        type: object
                        properties:
                          total:
                            type: integer
                          approved:
                            type: integer
                          rejected:
                            type: integer
                          revoked:
                            type: integer
                          returned:
                            type: integer
