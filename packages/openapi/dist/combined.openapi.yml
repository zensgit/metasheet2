          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Shift not found
        '409':
          description: >-
            Typed conflict with zero writes: CONFLICT (legacy rotation-rule
            rename ambiguity) or ATTENDANCE_SHIFT_SEGMENT_CONVERSION_BLOCKED (an
            active assignment, rotation, pending swap, or pending/published
            dispatch blocks converting one segment to multiple while segment
            calculation is disabled).
        '422':
          description: >-
            Typed segment rejection with zero writes:
            ATTENDANCE_SHIFT_SEGMENTS_INVALID,
            ATTENDANCE_SHIFT_SEGMENT_MODE_AMBIGUOUS, or
            ATTENDANCE_SHIFT_ENVELOPE_COLLAPSE_REJECTED (a start/end-only update
            on a multi-segment shift); or ATTENDANCE_SHIFT_FLEX_POLICY_INVALID
            for a canonical semantic flex rejection after request-shape
            validation, including multi-segment flex or core-hours coverage
            failure.
    delete:
      summary: Delete attendance shift
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      id:
                        type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Shift not found
        '409':
          description: >-
            Typed delete blocker with zero writes:
            ATTENDANCE_SHIFT_DELETE_BLOCKED — the shift is still referenced by
            any assignment row (including ended/inactive history), a rotation
            rule, a pending swap snapshot, or a pending/published dispatch
            target. Historical evidence is preserved.
