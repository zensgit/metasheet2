          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElearningTitleSnapshot'
        '401':
          $ref: '#/components/responses/ElearningAuthError'
        '403':
          description: ORG_CONTEXT_REQUIRED or insufficient elearning:admin
          $ref: '#/components/responses/ElearningError'
        '404':
          description: Incentive surface flags off
          $ref: '#/components/responses/ElearningError'
        '503':
          description: unavailable
          $ref: '#/components/responses/ElearningError'
    post:
      operationId: publishElearningTitleSnapshot
      summary: Publish one complete credit-title threshold snapshot
      description: >
        Global `elearning:admin` only. Actor and organization are
        server-derived.

        The complete normalized snapshot becomes one immutable active revision.

        The same organization-scoped `requestId` and logical payload replay the

        original closed result; changed values return a values-free 409.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElearningTitlePublishRequest'
      responses:
        '200':
          description: Published snapshot or exact idempotent replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElearningTitleSnapshot'
        '400':
          description: invalid_input
          $ref: '#/components/responses/ElearningError'
        '401':
          $ref: '#/components/responses/ElearningAuthError'
        '403':
          description: ORG_CONTEXT_REQUIRED or insufficient elearning:admin
          $ref: '#/components/responses/ElearningError'
        '404':
          description: Incentive surface flags off
          $ref: '#/components/responses/ElearningError'
        '409':
          description: requestId reused with a different normalized snapshot
          $ref: '#/components/responses/ElearningError'
        '503':
          description: unavailable
          $ref: '#/components/responses/ElearningError'
