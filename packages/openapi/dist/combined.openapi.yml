  /api/multitable/sheets/{sheetId}/records/{recordId}/restore:
    post:
      summary: Restore a multitable record to a prior revision (Layer 1)
      description: >-
        Restores a live record's user-data fields to a prior revision's recorded
        values, including link fields (re-synced through meta_links + the twoWay
        mirror). Forward-change semantics — a value-changing restore emits a new
        revision (source=restore) and bumps version; an empty diff is a no-op.
        Computed / system-auto / attachment fields are excluded by type.
        Atomically rejected if any restorable differing field is not writable.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: sheetId
          required: true
          schema:
            type: string
        - in: path
          name: recordId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                targetVersion:
                  type: integer
                  minimum: 1
                  description: The record version to restore to.
                expectedVersion:
                  type: integer
                  minimum: 0
                  description: >-
                    Optimistic-concurrency token; must equal the current server
                    version.
                fieldIds:
                  type: array
                  minItems: 1
                  items:
                    type: string
                  description: >-
                    Optional per-field (column-level) restore. When provided,
                    only these fields are restored (still atomic over the
                    subset); omitted = full-record restore. A requested field
                    that is unchanged / non-restorable / unknown is simply not
                    restored.
              required:
                - targetVersion
                - expectedVersion
      responses:
        '200':
          description: >-
            Restore applied, or a no-op when the current state already matches
            the target.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      recordId:
                        type: string
                      newVersion:
                        type: integer
                      noop:
                        type: boolean
                        description: >-
                          true when the restorable diff was empty (no write, no
                          new revision).
                      restoredFieldIds:
                        type: array
                        items:
                          type: string
                      skippedFieldIds:
                        type: array
                        items:
                          type: string
                        description: >-
                          Always empty under atomic reject; reserved for a
                          future partial-restore mode.
                    required:
                      - recordId
                      - newVersion
                      - noop
                      - restoredFieldIds
                      - skippedFieldIds
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          description: >-
            VERSION_EXPIRED — the target version is older than the retained
            floor and has been pruned by the meta-revision retention policy
            (distinct from VERSION_NOT_FOUND for a version that never existed).
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                          - VERSION_EXPIRED
                      message:
                        type: string
                    required:
                      - code
                      - message
                required:
                  - ok
                  - error
        '422':
          description: >-
            Restore not possible — RESTORE_UNSUPPORTED (target is a delete
            revision), SNAPSHOT_UNAVAILABLE (revision has a null snapshot), or
            SCHEMA_DRIFT (a snapshot field no longer exists in the current
            schema).
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  error:
                    type: object
                    properties:
                      code:
                        type: string
                        enum:
                          - RESTORE_UNSUPPORTED
                          - SNAPSHOT_UNAVAILABLE
                          - SCHEMA_DRIFT
                      message:
                        type: string
                    required:
                      - code
                      - message
                required:
                  - ok
                  - error
