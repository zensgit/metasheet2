    post:
      summary: Transition a user to a calculation group on an inclusive effective date
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                orgId:
                  type: string
                userId:
                  type: string
                targetGroupId:
                  type: string
                  format: uuid
                effectiveOn:
                  type: string
                  format: date
                reason:
                  type: string
                  minLength: 1
                  maxLength: 1000
                correlationId:
                  type: string
                  minLength: 1
                  maxLength: 128
              required:
                - orgId
                - userId
                - targetGroupId
                - effectiveOn
                - reason
      responses:
        '200':
          description: Transition applied or replayed idempotently
          headers:
            X-Correlation-Id:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      correlationId:
                        type: string
                      outcome:
                        type: string
                        enum:
                          - transitioned
                          - unchanged
                      membership:
                        $ref: >-
                          #/components/schemas/AttendanceCalculationGroupMembership
                    required:
                      - correlationId
                      - outcome
                      - membership
                required:
                  - ok
                  - data
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: Target user is not active in the requested organization
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Calculation-group transition failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
