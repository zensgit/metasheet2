  /api/elearning/media/playback:
    get:
      operationId: getElearningMediaPlayback
      summary: Stream MP4 bytes for a playback ticket
      description: >
        Token-auth GET. No session JWT, cookies, or bearer. Credential is the

        single `token` query parameter issued by playback-ticket. Mounted before

        the authenticated e-learning routers and the global JWT gate.


        Range is a single `bytes=` range (commas are invalid_range). Server cap

        is 8388608 bytes (8 MiB).


        - No Range and object size ≤ cap and the returned span is the full
        object → 200.

        - No Range and object size > cap → 206 of the first cap bytes with
        Content-Range.

        - Range present and satisfiable → 206 with Content-Range (even if the
        range covers the whole object).

        - Unsatisfiable range → 416 JSON `{ error: unsatisfiable_range }` (no
        Content-Range header).

        - Malformed Range → 400 `{ error: invalid_range }`.


        Successful bodies are video/mp4 with Accept-Ranges: bytes,
        Cache-Control:

        private, no-store, X-Content-Type-Options: nosniff, Referrer-Policy:
        no-referrer.

        Storage keys never appear.
      parameters:
        - in: query
          name: token
          required: true
          schema:
            type: string
            minLength: 1
          description: Opaque playback ticket. Multiple token values are invalid_input.
        - in: header
          name: Range
          required: false
          schema:
            type: string
          description: >-
            Single HTTP byte range, e.g. bytes=0-1023 or bytes=-500. Multipart
            ranges are refused.
      responses:
        '200':
          description: >-
            Full object when Range is absent and the object fits in the 8 MiB
            cap.
          headers:
            Accept-Ranges:
              schema:
                type: string
                enum:
                  - bytes
            Content-Type:
              schema:
                type: string
                enum:
                  - video/mp4
            Content-Length:
              schema:
                type: integer
                minimum: 1
                maximum: 8388608
            Cache-Control:
              schema:
                type: string
                enum:
                  - private, no-store
            X-Content-Type-Options:
              schema:
                type: string
                enum:
                  - nosniff
            Referrer-Policy:
              schema:
                type: string
                enum:
                  - no-referrer
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        '206':
          description: >-
            Partial content. Used for every satisfiable Range header, and for
            absent Range when the object exceeds the 8 MiB cap.
          headers:
            Accept-Ranges:
              schema:
                type: string
                enum:
                  - bytes
            Content-Type:
              schema:
                type: string
                enum:
                  - video/mp4
            Content-Length:
              schema:
                type: integer
                minimum: 1
                maximum: 8388608
            Content-Range:
              schema:
                type: string
                description: bytes START-END/SIZE
            Cache-Control:
              schema:
                type: string
                enum:
                  - private, no-store
            X-Content-Type-Options:
              schema:
                type: string
                enum:
                  - nosniff
            Referrer-Policy:
              schema:
                type: string
                enum:
                  - no-referrer
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        '400':
          description: invalid_input, invalid_range, or unsupported_item
          $ref: '#/components/responses/ElearningError'
        '401':
          description: invalid_token or token_expired
          $ref: '#/components/responses/ElearningError'
        '403':
          description: assignment_unavailable
          $ref: '#/components/responses/ElearningError'
        '404':
          description: not_found or watch flags off
          $ref: '#/components/responses/ElearningError'
        '409':
          description: course_withdrawn
          $ref: '#/components/responses/ElearningError'
        '416':
          description: Unsatisfiable range. JSON only; Content-Range is not set.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ElearningError'
                  - type: object
                    properties:
                      error:
                        type: string
                        enum:
                          - unsatisfiable_range
        '500':
          description: internal_error
          $ref: '#/components/responses/ElearningError'
        '503':
          description: unavailable (no range store)
          $ref: '#/components/responses/ElearningError'
