            type: string
      responses:
        '200':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/admin/plugins/{id}/reload:
    post:
      summary: Reload plugin (admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
