                    type: boolean
                  data:
                    $ref: '#/components/schemas/AttendanceShift'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: >-
            Typed rejection with zero writes: ATTENDANCE_SHIFT_SEGMENTS_INVALID
            (invalid segment array), ATTENDANCE_SHIFT_SEGMENT_MODE_AMBIGUOUS
            (segments combined with legacy start/end fields), or
            ATTENDANCE_SHIFT_FLEX_POLICY_INVALID (canonical semantic flex
            rejection after request-shape validation, including multi-segment
            flex or core-hours coverage failure).
