  /api/attendance/requests:
    x-plugin: plugin-attendance
    post:
      summary: Create attendance adjustment request
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                workDate:
                  type: string
                  format: date
                  description: Work date in YYYY-MM-DD format.
                work_date:
                  type: string
                  format: date
                  description: Compatibility snake_case alias for workDate.
                date:
                  type: string
                  format: date
                  description: Compatibility alias for workDate.
                requestType:
                  type: string
                  enum:
                    - missed_check_in
                    - missed_check_out
                    - time_correction
                    - leave
                    - overtime
                  description: Request type.
                request_type:
                  type: string
                  enum:
                    - missed_check_in
                    - missed_check_out
                    - time_correction
                    - leave
                    - overtime
                  description: Compatibility snake_case alias for requestType.
                type:
                  type: string
                  enum:
                    - missed_check_in
                    - missed_check_out
                    - time_correction
                    - leave
                    - overtime
                  description: Compatibility alias for requestType.
                requestedInAt:
                  type: string
                  format: date-time
                  description: >-
                    Required for missed_check_in. Optional for time_correction,
                    leave, and overtime.
                requested_in_at:
                  type: string
                  format: date-time
                  description: Compatibility alias for requestedInAt.
                clockIn:
                  type: string
                  format: date-time
                  description: Compatibility alias for requestedInAt.
                requestedOutAt:
                  type: string
                  format: date-time
                  description: >-
                    Required for missed_check_out. Optional for time_correction,
                    leave, and overtime.
                requested_out_at:
                  type: string
                  format: date-time
                  description: Compatibility alias for requestedOutAt.
                clockOut:
                  type: string
                  format: date-time
                  description: Compatibility alias for requestedOutAt.
                reason:
                  type: string
                leaveTypeId:
                  type: string
                  description: >-
                    Required for leave requests unless leaveTypeCode is
                    provided.
                leave_type_id:
                  type: string
                  description: Compatibility snake_case alias for leaveTypeId.
                leaveTypeCode:
                  type: string
                  description: Required for leave requests unless leaveTypeId is provided.
                leave_type_code:
                  type: string
                  description: Compatibility snake_case alias for leaveTypeCode.
                overtimeRuleId:
                  type: string
                  description: >-
                    Required for overtime requests unless overtimeRuleName is
                    provided.
                overtime_rule_id:
                  type: string
                  description: Compatibility snake_case alias for overtimeRuleId.
                overtimeRuleName:
                  type: string
                  description: >-
                    Required for overtime requests unless overtimeRuleId is
                    provided.
                overtime_rule_name:
                  type: string
                  description: Compatibility snake_case alias for overtimeRuleName.
                minutes:
                  type: integer
                  description: >-
                    Required for overtime unless derived from
                    requestedInAt/requestedOutAt.
                attachmentUrl:
                  type: string
                attachment_url:
                  type: string
                  description: Compatibility snake_case alias for attachmentUrl.
                approvalFlowId:
                  type: string
                approval_flow_id:
                  type: string
                  description: Compatibility snake_case alias for approvalFlowId.
                orgId:
                  type: string
                org_id:
                  type: string
                  description: Compatibility snake_case alias for orgId.
              required:
                - workDate
                - requestType
            examples:
              missedCheckIn:
                summary: Missed check-in using canonical fields
                value:
                  workDate: '2026-03-20'
                  requestType: missed_check_in
                  requestedInAt: '2026-03-20T09:05:00+08:00'
                  reason: Forgot to check in after a network reconnect.
              missedCheckOutLegacy:
                summary: Missed check-out using legacy alias fields
                value:
                  date: '2026-03-20'
                  type: missed_check_out
                  clockOut: '2026-03-20T18:10:00+08:00'
                  reason: Left the office before the kiosk synced.
              leaveByCode:
                summary: Leave request using leaveTypeCode
                value:
                  workDate: '2026-03-21'
                  requestType: leave
                  leaveTypeCode: annual_leave
                  minutes: 480
                  reason: Family event
              leaveById:
                summary: Leave request using a leaveTypeId from the leave-types list
                value:
                  workDate: '2026-03-21'
                  requestType: leave
                  leaveTypeId: 11111111-1111-4111-8111-111111111111
                  minutes: 480
                  reason: Family event
              overtimeByRuleName:
                summary: Overtime request using overtimeRuleName
                value:
                  workDate: '2026-03-22'
                  requestType: overtime
                  requestedInAt: '2026-03-22T18:30:00+08:00'
                  requestedOutAt: '2026-03-22T21:00:00+08:00'
                  overtimeRuleName: Weekday OT
                  reason: End-of-month release support
              overtimeByRuleId:
                summary: >-
                  Overtime request using an overtimeRuleId from the
                  overtime-rules list
                value:
                  workDate: '2026-03-22'
                  requestType: overtime
                  overtimeRuleId: 22222222-2222-4222-8222-222222222222
                  minutes: 90
                  reason: End-of-month release support
              snakeCaseMissedCheckIn:
                summary: Request using snake_case aliases
                value:
                  work_date: '2026-03-20'
                  request_type: missed_check_in
                  requested_in_at: '2026-03-20T09:05:00+08:00'
                  reason: Badge reader was offline.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      request:
                        $ref: '#/components/schemas/AttendanceRequest'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: >-
            APPROVAL_ORG_UNRESOLVED — the request's SUBJECT could not be
            resolved to a single active organization (Lock-11 W-4 arm (a)): zero
            or two-or-more active user_orgs memberships.
            APPROVAL_ORG_SELECTOR_NOT_PERMITTED — the request named an
            organization (orgId / x-org-id) that is not one of the subject's
            active memberships (Lock-11 W-4 arm (f)). Both refusals are
            values-free: the response carries no org id, membership count, or
            user id.
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                        enum:
                          - APPROVAL_ORG_UNRESOLVED
                          - APPROVAL_ORG_SELECTOR_NOT_PERMITTED
                      message:
                        type: string
