        - sizeBytes
        - sha256
      description: >-
        Values-free ready media metadata. Never includes storageKey or client
        duration.
      properties:
        id:
          $ref: '#/components/schemas/ElearningUuid'
        status:
          type: string
          enum:
            - ready
        durationMs:
          type: integer
          minimum: 1
          description: Positive server-probed duration in milliseconds.
        sizeBytes:
          type: integer
          minimum: 1
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
    ElearningMediaUploadRejectedResult:
      type: object
      additionalProperties: false
      required:
        - id
        - status
        - durationMs
        - sizeBytes
        - sha256
      description: >-
        Values-free rejected media metadata. Never includes storageKey or client
        duration.
      properties:
        id:
          $ref: '#/components/schemas/ElearningUuid'
        status:
          type: string
          enum:
            - rejected
        durationMs:
          type: integer
          nullable: true
          enum:
            - null
          description: Always null because rejected media has no trusted duration.
        sizeBytes:
          type: integer
          minimum: 1
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
    ElearningMediaUploadResult:
      oneOf:
