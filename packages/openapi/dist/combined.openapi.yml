          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                timezone:
                  type: string
                workStartTime:
                  type: string
                workEndTime:
                  type: string
                isOvernight:
                  type: boolean
                segments:
                  type: array
                  minItems: 1
                  maxItems: 3
