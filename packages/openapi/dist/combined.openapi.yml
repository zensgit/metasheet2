      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/approvals:
    get:
      operationId: listApprovals
      tags:
        - Approvals
      summary: List approval instances
      description: |
        Returns a paginated list of approval instances. The live route accepts
        both page/pageSize and the older limit/offset pagination fallback.
        Use `tab` for the current inbox lens, plus optional sourceSystem,
        workflowKey, businessKey, assignee, status, and search filters.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: sourceSystem
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: workflowKey
          schema:
            type: string
        - in: query
          name: businessKey
          schema:
            type: string
        - in: query
          name: assignee
          schema:
            type: string
        - in: query
          name: tab
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      operationId: createApproval
      tags:
        - Approvals
      summary: Create approval request from a published template
      description: >
        Initiates a new approval instance from a published template. The
        formData

        is validated against the template's formSchema (required fields, type

        checks, enum legality). Returns 400 if the template is not published or

        form validation fails. On success, generates request number (AP-XXXXXX).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApprovalRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnifiedApprovalDTO'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden - approvals:write permission is required.
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: string
                    example: Insufficient permissions
        '422':
          description: >-
            APPROVAL_ORG_UNRESOLVED — the requester's org could not be resolved
            (Lock-11 arm (a)): the requester holds zero active organization
            memberships, or holds two or more. The request was authorized
            (approvals:write passed) but the org derivation refused; this is
            distinct from 403. The response body is values-free — it carries no
            org id, membership count, or user id.
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                        example: APPROVAL_ORG_UNRESOLVED
                      message:
                        type: string
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/approvals/record-link-options:
    get:
      operationId: listApprovalRecordLinkOptions
      tags:
        - Approvals
      summary: List candidate records for an approval record-link field
      description: >
        FWB-0 Layer 2 dedicated candidate picker for ordinary fillers. Scoped to
        a

        server-pinned (baseId, sheetId) pair from a form `record-link` field.
        Requires

        the same `approvals:write` permission as createApproval (not
        read/act-only).


        Returns only rows the actor can read, with human display labels derived
        from

        visible non-computed source fields (never a raw record id). Missing
        sheet,

        base mismatch, and unreadable target share one public refuse shape (no
        existence

        oracle). Does NOT reuse multitable `/fields/:fieldId/link-options`.
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: baseId
          required: true
          schema:
            type: string
          description: Pinned multitable base id from the form field props.
        - in: query
          name: sheetId
          required: true
          schema:
            type: string
          description: Pinned multitable sheet id from the form field props.
        - in: query
          name: search
          schema:
            type: string
          description: >-
            Optional case-insensitive search against the effective display
            label.
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required:
                  - records
                  - page
                properties:
                  records:
                    type: array
                    items:
                      type: object
                      required:
                        - id
                        - display
                      properties:
                        id:
                          type: string
                          description: >-
                            Record id (selection value only; never used as the
                            display label).
                        display:
                          type: string
                          description: >-
                            Human label from visible source fields, or a generic
                            placeholder.
                  page:
                    type: object
                    required:
                      - limit
                      - offset
                      - total
                      - hasMore
                    properties:
                      limit:
                        type: integer
                      offset:
                        type: integer
                      total:
                        type: integer
                      hasMore:
                        type: boolean
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Forbidden - approvals:write permission is required.
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: string
                    example: Insufficient permissions
        '404':
          description: >
            Target sheet not found / base mismatch / unreadable (shared
            no-oracle shape).

            Body is the same approval error envelope as other 4xx routes

            (`ok: false` with nested `error.code` + `error.message`; it never

            distinguishes missing from denied).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/approvals/pending:
    get:
      operationId: listPendingApprovalsLegacy
      tags:
        - Approvals (Legacy)
      deprecated: true
      summary: Get pending approvals for current actor
      description: |
        Deprecated. Use GET /api/approvals with `tab=pending` instead.
      parameters:
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - in: query
          name: offset
          schema:
            type: integer
            minimum: 0
      security:
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegacyPendingApprovalListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/approvals/sync/plm:
    post:
      operationId: syncPlmApprovals
      tags:
        - Approvals
      summary: Trigger a PLM approval sync
      description: |
        Pulls approval instances from the PLM bridge into the unified approval
        inbox. Requires approvals:read and a configured PLM adapter.
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                productId:
                  type: string
                requesterId:
                  type: string
                limit:
                  type: integer
                  minimum: 1
                  maximum: 200
                offset:
                  type: integer
                  minimum: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApprovalPlmSyncResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/approvals/{id}:
    get:
      operationId: getApproval
      tags:
        - Approvals
      summary: Get approval instance
      description: |
        Returns the full approval instance including formSnapshot, assignments,
        and current status. PLM-backed approvals (id starting with 'plm:') are
        resolved via the PLM adapter.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnifiedApprovalDTO'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/approvals/{id}/actions:
    post:
      operationId: dispatchApprovalAction
      tags:
        - Approvals
      summary: Execute an approval action
      description: |
        Unified action dispatch endpoint. Accepted actions: approve, reject,
        transfer (requires targetUserId), revoke (subject to RuntimePolicy),
        comment (does not change status), and return (requires targetNodeKey).
        Concurrent writes are serialized with a database row lock. This endpoint
        does not accept a client version field. 409 responses indicate a
        conflicting current state after serialization, such as an invalid status
        transition or a closed revoke window. The Wave 2 Pack 1A executor
        follow-up will activate return semantics for template-runtime approvals.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalActionRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UnifiedApprovalDTO'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Conflict or invalid state transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/approvals/{id}/approve:
    post:
      operationId: approveApprovalLegacy
      tags:
        - Approvals (Legacy)
      deprecated: true
      summary: Approve instance with optimistic locking
      description: >
        Deprecated. Use POST /api/approvals/{id}/actions with
        {"action":"approve"} instead.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version:
                  type: integer
                comment:
                  type: string
                metadata:
                  type: object
                  additionalProperties: true
              required:
                - version
      responses:
        '200':
          description: OK
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Version conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/approvals/{id}/reject:
    post:
      operationId: rejectApprovalLegacy
      tags:
        - Approvals (Legacy)
      deprecated: true
      summary: Reject instance with optimistic locking
      description: >
        Deprecated. Use POST /api/approvals/{id}/actions with
        {"action":"reject"} instead.
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                version:
                  type: integer
                reason:
                  type: string
