    ElearningScopeRule:
      description: >
        L1 visibility rule. Subjects are resolved from fresh, active, same-org

        database state. `department.subjectRef` is the directory department
        UUID;

        only department rules may set includeChildren true. Position matches the

        trimmed, case-sensitive title on an active same-org directory account.

        Platform roles are not accepted until an org-scoped role-membership
        store

        exists. `all` requires subjectRef absent/null.
      oneOf:
        - type: object
          additionalProperties: false
          required:
            - subjectType
          properties:
            subjectType:
              type: string
              enum:
                - all
            subjectRef:
              type: string
              nullable: true
              enum:
                - null
            includeChildren:
              type: boolean
              enum:
                - false
        - type: object
          additionalProperties: false
          required:
            - subjectType
            - subjectRef
          properties:
            subjectType:
              type: string
              enum:
                - department
            subjectRef:
              $ref: '#/components/schemas/ElearningUuid'
            includeChildren:
              type: boolean
        - type: object
          additionalProperties: false
          required:
            - subjectType
            - subjectRef
          properties:
            subjectType:
              type: string
              enum:
                - role
            subjectRef:
              type: string
              minLength: 1
            includeChildren:
              type: boolean
              enum:
                - false
          description: >-
            Accepted wire shape that returns unsupported_subject until
            org-scoped role membership exists.
        - type: object
          additionalProperties: false
          required:
            - subjectType
            - subjectRef
          properties:
            subjectType:
              type: string
              enum:
                - position
                - user
            subjectRef:
              type: string
              minLength: 1
            includeChildren:
              type: boolean
              enum:
                - false
