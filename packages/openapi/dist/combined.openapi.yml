  /api/attendance/punch:
    x-plugin: plugin-attendance
    post:
      summary: Punch attendance (check in/out)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                eventType:
                  type: string
                  enum:
                    - check_in
                    - check_out
                occurredAt:
                  type: string
                  format: date-time
                  description: Preferred punch timestamp in ISO 8601 format.
                occurred_at:
                  type: string
                  format: date-time
                  description: Compatibility alias for occurredAt.
                timezone:
                  type: string
                source:
                  type: string
                location:
                  type: object
                meta:
                  type: object
                orgId:
                  type: string
              required:
                - eventType
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  data:
                    type: object
                    properties:
                      event:
                        $ref: '#/components/schemas/AttendanceEvent'
                      record:
                        $ref: '#/components/schemas/AttendanceRecord'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: >-
            APPROVAL_ORG_UNRESOLVED — the request's SUBJECT could not be
            resolved to a single active organization (Lock-11 W-4 arm (a)): zero
            or two-or-more active user_orgs memberships.
            APPROVAL_ORG_SELECTOR_NOT_PERMITTED — the request named an
            organization (orgId / x-org-id) that is not one of the subject's
            active memberships (Lock-11 W-4 arm (f)). Outdoor-approval leg only
            — reachable from POST /api/attendance/punch when an outdoor punch
            requires approval and enters the request_create boundary. Both
            refusals are values-free: the response carries no org id, membership
            count, or user id.
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - code
                      - message
                    properties:
                      code:
                        type: string
                        enum:
                          - APPROVAL_ORG_UNRESOLVED
                          - APPROVAL_ORG_SELECTOR_NOT_PERMITTED
                      message:
                        type: string
  /api/attendance/punch/events:
    x-plugin: plugin-attendance
    get:
      summary: List raw punch timeline events
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: userId
          schema:
            type: string
          description: >-
            Optional target user. Cross-user access requires attendance
