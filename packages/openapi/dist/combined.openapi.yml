                  type: boolean
                is_overnight:
                  type: boolean
                  deprecated: true
                segments:
                  type: array
                  minItems: 1
                  maxItems: 3
                  description: >-
                    Canonical segments (W3). Mutually exclusive with the legacy
                    workStartTime/workEndTime/isOvernight fields. While
                    authoritative segment calculation is disabled for the org,
                    multi-segment shifts are authoring preview-only.
                  items:
                    $ref: '#/components/schemas/AttendanceShiftSegmentInput'
                lateGraceMinutes:
                  type: integer
                late_grace_minutes:
                  type: integer
                  deprecated: true
                earlyGraceMinutes:
                  type: integer
                early_grace_minutes:
                  type: integer
                  deprecated: true
                roundingMinutes:
                  type: integer
                rounding_minutes:
                  type: integer
                  deprecated: true
                workingDays:
                  type: array
                  items:
                    type: integer
