    post:
      summary: Create attendance shift
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name:
                  type: string
                  minLength: 1
                  maxLength: 200
                timezone:
                  type: string
                workStartTime:
                  type: string
                work_start_time:
                  type: string
                  deprecated: true
                start_time:
                  type: string
                  deprecated: true
