    ApprovalNodeConfig:
      type: object
      properties:
        assigneeType:
          type: string
          enum: [user, role]
        assigneeIds:
          type: array
          items:
            type: string
        approvalMode:
          type: string
          enum: [single, all, any]
          description: |
            Approval aggregation mode for a single approval node. `single`
            preserves the Wave 1 behavior, `all` represents countersign, and
            `any` represents any-sign.
        emptyAssigneePolicy:
          type: string
          enum: [error, auto-approve]
          description: |
            Behavior when the approval node resolves to zero assignees. `error`
            blocks runtime execution, `auto-approve` allows the node to advance
            automatically.
      required: [assigneeType, assigneeIds]
    ApprovalConditionRule:
      type: object
      properties:
        fieldId:
          type: string
        operator:
          type: string
          enum: [eq, neq, gt, gte, lt, lte, in, isEmpty]
        value:
          nullable: true
      required: [fieldId, operator]
    ApprovalConditionBranch:
      type: object
      properties:
        edgeKey:
          type: string
        rules:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalConditionRule'
        conjunction:
          type: string
          enum: [and, or]
      required: [edgeKey, rules]
    ApprovalConditionNodeConfig:
      type: object
      properties:
        branches:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalConditionBranch'
        defaultEdgeKey:
          type: string
      required: [branches]
    ApprovalCcNodeConfig:
      type: object
      properties:
        targetType:
          type: string
          enum: [user, role]
        targetIds:
          type: array
          items:
            type: string
      required: [targetType, targetIds]
    ApprovalParallelNodeConfig:
      type: object
      description: |
        Parallel gateway (并行分支) — fans into the listed branch edges and
        re-joins at `joinNodeKey`. v1 only ships `joinMode: all` (会签 on
        the join); `any` is reserved for a future wave.
      properties:
        branches:
          type: array
          minItems: 2
          items:
            type: string
          description: |
            Outgoing edgeKeys, one per branch. Each edge's downstream path
            must reach `joinNodeKey` before any `end` or loop, and must not
            share approver assignees with any other branch.
        joinMode:
          type: string
          enum: [all, any]
          description: |
            Join policy at `joinNodeKey`. `all` waits for every branch to
            report complete before advancing. `any` (future) would advance
            on the first branch to complete.
        joinNodeKey:
          type: string
          description: |
            The approval / cc node every branch converges onto. Required —
            lets the runtime short-circuit walker without structural
            inference.
      required: [branches, joinMode, joinNodeKey]
    ApprovalNode:
      type: object
      properties:
        key:
          type: string
        type:
          type: string
          enum: [start, approval, cc, condition, parallel, end]
        name:
          type: string
        config:
          type: object
          additionalProperties: true
      required: [key, type, config]
    ApprovalEdge:
      type: object
      properties:
        key:
          type: string
        source:
          type: string
        target:
          type: string
      required: [key, source, target]
    ApprovalGraph:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalEdge'
      required: [nodes, edges]
    RuntimePolicy:
      type: object
      properties:
        allowRevoke:
          type: boolean
        revokeBeforeNodeKeys:
          type: array
          items:
            type: string
      required: [allowRevoke]
    RuntimeGraph:
      allOf:
        - $ref: '#/components/schemas/ApprovalGraph'
        - type: object
          properties:
            policy:
              $ref: '#/components/schemas/RuntimePolicy'
          required: [policy]
    FormOption:
      type: object
