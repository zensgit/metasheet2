          nullable: true
        policy:
          allOf:
            - $ref: '#/components/schemas/ApprovalPolicySnapshot'
          nullable: true
        currentStep:
          type: integer
          nullable: true
        totalSteps:
          type: integer
          nullable: true
        templateId:
          type: string
          nullable: true
        templateVersionId:
          type: string
          nullable: true
