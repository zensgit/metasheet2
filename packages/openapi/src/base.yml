          type: string
          nullable: true
        requestNo:
          type: string
          nullable: true
        formSnapshot:
          type: object
          nullable: true
          additionalProperties: true
        fieldAccess:
          type: object
          nullable: true
          additionalProperties:
            type: string
            enum: [editable, readonly, hidden, required]
          description: |
            Lock-7 OD-L7-10 (widened by Lock-7B OD-L7B-1) — the actor-scoped per-field
            access map for the viewer at their claimed handler seat(s): fieldId ->
            editable | readonly | hidden | required. Present ONLY on the DETAIL read
            (getApproval); absent on the list. A field absent from the map is editable
            (legacy default, OD-L7-9). `required` is editable plus a submit-time
            obligation enforced at handler submit. Presentation only — enforcement is
            server-side (a masked field write is refused regardless of what the client
            renders).
        currentNodeKey:
          type: string
          nullable: true
        currentNodeKeys:
          type: array
          nullable: true
          items:
            type: string
          description: |
            Parallel gateway (并行分支) runtime frontier. Present only when
            the instance is inside a parallel region with ≥ 2 still-pending
            branches. Each entry is the current approval node key for one
            branch. When absent or length < 2, use `currentNodeKey`
            unchanged for the linear / non-parallel flow.
