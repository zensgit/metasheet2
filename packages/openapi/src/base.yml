      type: object
      additionalProperties: false
    ElearningObjectiveQuestionType:
      type: string
      enum: [single_choice, multiple_choice, true_false]
    ElearningQuestionType:
      type: string
      enum: [single_choice, multiple_choice, true_false, short_answer]
    ElearningCapabilityFlags:
      type: object
      additionalProperties: false
      required: [content, assignment, assessment, incentive, analytics, media]
      properties:
        content: { type: boolean }
        assignment: { type: boolean }
        assessment: { type: boolean }
        incentive:
          type: boolean
          description: Reported from ELEARNING_INCENTIVE_ENABLED. Parked for V0.1; not part of readiness.
        analytics:
          type: boolean
          description: Reported from ELEARNING_ANALYTICS_ENABLED. Parked for V0.1; not part of readiness.
        media: { type: boolean }
    ElearningCapabilities:
      type: object
      additionalProperties: false
      required: [enabled, capabilities]
      description: |
        Plugin GET /api/elearning/capabilities payload. V0.1 readiness is enabled
        plus content, assignment, assessment, and media all true. Incentive and
        analytics stay parked and must not be treated as readiness inputs.
      properties:
        enabled: { type: boolean }
        capabilities:
          $ref: '#/components/schemas/ElearningCapabilityFlags'
    ElearningMediaRejectCode:
      type: string
      enum:
        - file_too_large
        - too_many_files
        - mime_not_allowed
        - extension_not_allowed
        - extension_mime_mismatch
        - content_mime_mismatch
        - invalid_size
        - org_quota_exceeded
        - upload_rejected
