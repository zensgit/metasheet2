paths:
  # Contract source: plugins/plugin-integration-core/lib/http-routes.cjs, handler `runsList`
  # (read the handler itself, not this comment, before touching this block — it is the sole
  # source of truth). Same tenant/workspace scoping as the single-run read below: `tenantId` is
  # resolved from the verified session claim and an explicit query value must match it (403 on
  # mismatch), so the parameter cannot widen scope beyond a tenantless platform admin. Response
  # `data` is a plain array (no `total`/`nextCursor` — the handler has neither), sharing the
  # IntegrationPipelineRun projection verbatim with the single-run read.
  /api/integration/runs:
    get:
      summary: List integration pipeline runs
      description: >-
        Read-only run listing, scoped by (tenantId, workspaceId) and optionally narrowed by
        pipelineId/status. `data` is a plain array of IntegrationPipelineRun, newest first
        (ORDER BY created_at DESC); there is no cursor or total count.
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: query
          name: tenantId
          required: false
          description: >-
            Optional echo of the caller's own tenant. Must equal the authenticated tenant
            (403 TENANT_MISMATCH otherwise); only a tenantless platform admin may name another.
          schema: { type: string }
        - in: query
          name: workspaceId
          required: false
          description: Workspace scope. Omitted means the null workspace.
          schema: { type: string }
        - in: query
          name: pipelineId
          required: false
          description: Restrict to runs of one pipeline.
          schema: { type: string }
        - in: query
          name: status
          required: false
          description: >-
            Restrict to runs in one status. An unrecognized value is a 400
            (PipelineValidationError), not an empty result.
          schema:
            type: string
            enum: [pending, running, succeeded, partial, failed, cancelled]
        - in: query
          name: limit
          required: false
          description: >-
            Max rows to return. Must be a positive integer; a non-numeric or non-positive value
            is silently ignored (registry default applies), not rejected. Capped at 500 server-side.
          schema: { type: integer, minimum: 1, maximum: 500 }
        - in: query
          name: offset
          required: false
          description: >-
            Rows to skip. Must be a positive integer; a non-numeric or non-positive value is
            silently ignored (registry default applies), not rejected.
          schema: { type: integer, minimum: 1 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/IntegrationPipelineRun' }
        '400':
          description: An unrecognized `status` value.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                status_invalid:
                  value:
                    ok: false
                    error:
                      code: PipelineValidationError
                      message: >-
                        status must be one of pending, running, succeeded, partial, failed,
                        cancelled
                      details: { field: status }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  # SC-04 single-run read. Contract for the plugin route added in #5887
  # (plugins/plugin-integration-core/lib/http-routes.cjs, handler `runsGet`).
  /api/integration/runs/{runId}:
    get:
      summary: Get one integration pipeline run
      description: >-
        Read-only single-run read, scoped by (tenantId, workspaceId, runId). The tenant is
        resolved from the verified session claim; `tenantId` may be echoed as a query
        parameter but must MATCH the caller's own tenant (a mismatch is 403), so this
        parameter cannot widen scope. Another tenant's run id and a run id that does not
        exist return the SAME details-free 404 — the route is not a cross-tenant existence
        oracle. No write, replay or retry is performed.
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: path
          name: runId
          required: true
          description: Pipeline run id.
          schema: { type: string }
        - in: query
          name: tenantId
          required: false
          description: >-
            Optional echo of the caller's own tenant. Must equal the authenticated tenant
            (403 TENANT_MISMATCH otherwise); only a tenantless platform admin may name another.
          schema: { type: string }
        - in: query
          name: workspaceId
          required: false
          description: >-
            Workspace scope. Omitted means the null workspace — the same normalization the
            list route applies, so a run written under the null workspace is read back there.
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  data: { $ref: '#/components/schemas/IntegrationPipelineRun' }
        '400':
          description: runId missing from the path
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                run_id_required:
                  value:
                    ok: false
                    error:
                      code: RUN_ID_REQUIRED
                      message: runId is required
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: >-
            Run not visible in the caller's (tenant, workspace) scope. Identical body for a
            non-existent id and another tenant's id; carries no `details`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                run_not_found:
                  value:
                    ok: false
                    error:
                      code: RUN_NOT_FOUND
                      message: pipeline run not found
        '501':
          description: >-
            The host's pipeline registry does not implement the single-run read
            (optional-method wiring older than this route).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                run_read_not_implemented:
                  value:
                    ok: false
                    error:
                      code: RUN_READ_NOT_IMPLEMENTED
                      message: Run read is not implemented
  # Q4a per-run provenance sub-route. Contract for the plugin route added alongside this block
  # (plugins/plugin-integration-core/lib/http-routes.cjs, handler `runsProvenance`). Distinct from
  # GET /api/integration/provenance, which is the CROSS-RUN by-rowId timeline and still requires
  # `rowId` — this sub-route selects by the runId already in the path and takes no rowId at all.
  /api/integration/runs/{runId}/provenance:
    get:
      summary: List one run's provenance timeline
      description: >-
        Read-only per-run provenance timeline, scoped by (tenantId, workspaceId, runId) and
        ordered by `eventIndex` (the migration-060 view's WITH ORDINALITY over the run's
        persisted `provenance_events`, i.e. write order). The run is resolved first through the
        same three-key lookup the single-run read uses, so another tenant's run id and a run id
        that does not exist return the SAME details-free 404 — an unknown run is never answered
        with an empty timeline. `attrs` were redacted at write (DF-N2-2b scrub gate); this read
        path does not re-redact and never returns raw payloads. No write, replay or retry.
        One call answers ONE PAGE (default 200 events) together with `total`, `truncated` and
        `nextCursor`, so a client can always tell the first page from the whole timeline; pass
        the previous page's `nextCursor` as `cursor` to read the next page.
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: path
          name: runId
          required: true
          description: Pipeline run id.
          schema: { type: string }
        - in: query
          name: tenantId
          required: false
          description: >-
            Optional echo of the caller's own tenant. Must equal the authenticated tenant
            (403 TENANT_MISMATCH otherwise); only a tenantless platform admin may name another.
          schema: { type: string }
        - in: query
          name: workspaceId
          required: false
          description: >-
            Workspace scope. Omitted means the null workspace — the same normalization the run
            reads apply.
          schema: { type: string }
        - in: query
          name: limit
          required: false
          description: >-
            Max events per page. Capped at 500 at the route and at 1000 in the registry (the
            tighter wins); a non-numeric or non-positive value is silently ignored and the
            server-held default page size (200) applies.
          schema: { type: integer, minimum: 1, maximum: 500 }
        - in: query
          name: cursor
          required: false
          description: >-
            The previous page's `nextCursor` (the `eventIndex` of the last event it returned).
            Answers the events strictly after it, in `eventIndex` order, under the same
            (tenantId, workspaceId, runId) scope. Omitted or empty means the first page. Anything
            else that is not 1-15 ASCII decimal digits is refused with 400 INVALID_CURSOR (never
            silently treated as the first page); the tenant scope is checked before the cursor.
          schema: { type: string, pattern: '^[0-9]{0,15}$' }
      responses:
        '200':
          description: >-
            One page of the run's timeline plus its completeness disclosure. `truncated` is true
            iff at least one more event exists after the last returned item; `nextCursor` is then
            that item's `eventIndex` as a string (null otherwise). `total` counts every event the
            run has in the caller's scope, independent of `cursor` and `limit`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/ProvenanceTimelineEntry' }
                      total:
                        type: integer
                        minimum: 0
                        description: Every event this run has in the caller's scope (not just this page).
                      truncated:
                        type: boolean
                        description: True iff more events exist after the last returned item.
                      nextCursor:
                        type: string
                        nullable: true
                        description: Cursor for the next page when `truncated`; null on the last page.
                    required: [items, total, truncated, nextCursor]
        '400':
          description: runId missing from the path, or a malformed `cursor`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                run_id_required:
                  value:
                    ok: false
                    error:
                      code: RUN_ID_REQUIRED
                      message: runId is required
                invalid_cursor:
                  value:
                    ok: false
                    error:
                      code: INVALID_CURSOR
                      message: cursor must be a non-negative integer string
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: >-
            Run not visible in the caller's (tenant, workspace) scope. Identical body for a
            non-existent id and another tenant's id; carries no `details`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                run_not_found:
                  value:
                    ok: false
                    error:
                      code: RUN_NOT_FOUND
                      message: pipeline run not found
        '501':
          description: >-
            The host's pipeline registry implements neither the per-run provenance read
            (PROVENANCE_READ_NOT_IMPLEMENTED) nor the single-run read the scope probe needs
            (RUN_READ_NOT_IMPLEMENTED) — optional-method wiring older than this route.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
              examples:
                provenance_read_not_implemented:
                  value:
                    ok: false
                    error:
                      code: PROVENANCE_READ_NOT_IMPLEMENTED
                      message: Provenance read is not implemented
                run_read_not_implemented:
                  value:
                    ok: false
                    error:
                      code: RUN_READ_NOT_IMPLEMENTED
                      message: Run read is not implemented
