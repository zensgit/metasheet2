paths:
  /api/admin/directory/notification-verification:
    post:
      summary: Verify one connection and record its notification readiness
      description: >-
        Platform administrators only. A token check does not send a notification. A send check requires
        delivery to be enabled and sends one test to the explicit DingTalk recipient. This is the sole
        notification endpoint that accepts a recipient value; the response never echoes it. A report
        answers 200 even when a check fails: read result.passed and result.reachedLevel. Evidence reports
        its level, expiry and current validity. A new check can replace or invalidate earlier evidence.
        Provider acceptance does not prove receipt or reading.
      operationId: verifyDirectoryNotificationConnection
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationVerificationRequest' }
      responses:
        '200':
          description: The verification report and the current evidence summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationVerificationResult' }
        '400':
          description: The integration id is not a UUID (DIRECTORY_INTEGRATION_ID_INVALID), or the verification input is invalid (INVALID_REQUEST)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: The notification surface is switched off, or no such connection belongs to the managed organization (NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationError' }
        '409':
          description: >-
            A send check was requested while delivery is disabled (NOTIFICATION_DELIVERY_DISABLED),
            or the connection cannot support notification verification (VERIFICATION_TUPLE_UNSUPPORTED).
            An unsupported connection is refused before any token request or send.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationError' }
        '422':
          description: Unknown fields or invalid request shape (INVALID_REQUEST)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationError' }
        '500':
          description: >-
            Verification completed but its evidence could not be recorded (VERIFICATION_EVIDENCE_WRITE_FAILED),
            or a fixed-sentence failure (INTERNAL). A test message may already have been sent when evidence
            recording fails; retrying a send check can send another message.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationError' }
        '503':
          description: NOTIFICATION_BUSY (retry), or NOTIFICATION_SCHEMA_UNAVAILABLE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationError' }
  /api/admin/directory/notification-topic-policies:
    get:
      summary: Read notification topic takeover policies and verification expiry
      operationId: listNotificationTopicPolicies
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: Policy rows and connection verification summaries, without recipient addresses or witnesses
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [topics]
                properties:
                  topics:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [topic, integrated, policy, verification]
                      properties:
                        topic: { type: string, enum: [task_reminder] }
                        integrated: { type: boolean }
                        policy: { allOf: [ { $ref: '#/components/schemas/NotificationTopicPolicy' } ], nullable: true }
                        verification: { $ref: '#/components/schemas/NotificationVerificationSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Notification preferences surface is disabled }
        '500': { description: INTERNAL, a fixed-sentence unexpected failure }
        '503': { description: NOTIFICATION_SCHEMA_UNAVAILABLE or NOTIFICATION_BUSY }
  /api/admin/directory/notification-topic-policies/{topic}:
    put:
      parameters:
        - { name: topic, in: path, required: true, schema: { type: string, enum: [task_reminder] } }
      summary: Take over, pause, resume or change the default notification connection
      description: >-
        Platform administrator only. First takeover requires an integrated topic, both notification
        switches, readable policy and decision tables, and endpoint and preference tables. There is no
        delete or return to legacy routing. A missing defaultConnectionId preserves the current default
        on updates. First takeover must explicitly provide defaultConnectionId and state active; an omitted
        default or initial paused state is INVALID_REQUEST (422). Null first takeover requires
        confirmNoDefaultConnection true; without it the response is DEFAULT_CONNECTION_CONFIRM_REQUIRED (409).
        Every first takeover and every explicit nonnull default selection requires a trusted authenticated
        tenant equal to default and active membership. Headers and request-body organization values cannot
        supply that tenant. A malformed nonnull connection selection passes this tenant gate before body
        validation. State-only updates and clearing an existing default retain the platform-admin boundary.
        All replicas must run the routing implementation before first takeover.
      operationId: putNotificationTopicPolicy
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expectedRevision, state]
              oneOf:
                - required: [defaultConnectionId]
                  properties:
                    expectedRevision: { enum: [0] }
                    state: { enum: [active] }
                - properties:
                    expectedRevision: { minimum: 1 }
              properties:
                expectedRevision: { type: integer, minimum: 0 }
                state: { type: string, enum: [active, paused] }
                defaultConnectionId: { type: string, format: uuid, nullable: true }
                confirmNoDefaultConnection: { type: boolean, enum: [true] }
      responses:
        '200':
          description: Persisted policy after revision comparison
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationTopicPolicy' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403':
          description: Platform administrator required, or ORG_MISMATCH for a non-default trusted tenant or inactive membership; no organization values are returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationError' }
        '404': { description: Notification preferences surface is disabled }
        '409':
          description: POLICY_STALE, TOPIC_NOT_INTEGRATED, NOTIFICATION_DELIVERY_DISABLED, DEFAULT_CONNECTION_NOT_READY or DEFAULT_CONNECTION_CONFIRM_REQUIRED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationError' }
        '422':
          description: INVALID_REQUEST or ORG_MISSING when first takeover or an explicit nonnull selection lacks a trusted authenticated tenant, including sessions whose default membership was revoked and whose tenant was removed during authentication
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationError' }
        '500': { description: INTERNAL, a fixed-sentence unexpected failure }
        '503': { description: NOTIFICATION_SCHEMA_UNAVAILABLE or NOTIFICATION_BUSY }
  /api/admin/directory/notification-topic-policies/{topic}/takeover-preview:
    get:
      parameters:
        - { name: topic, in: path, required: true, schema: { type: string, enum: [task_reminder] } }
        - { name: defaultConnectionId, in: query, required: false, schema: { type: string, format: uuid } }
      summary: Preview takeover using bounded batches of active members
      description: >-
        Read-only, at most 5000 members in batches of 500. Returns counts and fixed warnings only.
        A supplied default connection uses the authenticated capability entry and the same trusted
        default-tenant membership gate; no preview witness becomes a persisted routing decision.
        Missing and foreign-organization connections have the same connection_not_found count and
        default_connection_not_ready warning (200). Malformed input is 422; inactive membership is
        403 ORG_MISMATCH. An unreadable capability is 503 NOTIFICATION_BUSY.
      operationId: previewNotificationTopicTakeover
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: Counts and fixed warnings, never addresses or witnesses
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationTakeoverPreview' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { description: Platform administrator required or ORG_MISMATCH }
        '404': { description: Notification preferences surface is disabled }
        '422': { description: 'INVALID_REQUEST or ORG_MISSING, including sessions whose default membership was revoked and whose tenant was removed during authentication' }
        '500': { description: INTERNAL, a fixed-sentence unexpected failure }
        '503': { description: NOTIFICATION_SCHEMA_UNAVAILABLE or NOTIFICATION_BUSY }
