paths:
  /api/welding/jwks:
    get:
      operationId: getWeldingJwks
      summary: Dedicated welding SSO assertion public verification key
      description: Default disabled; requires exact WELDING_READ_ENABLED=true. No parameters or request body. This exact public endpoint does not exempt descendants. All responses use Cache-Control no-store.
      security: []
      responses:
        '200':
          description: Dedicated RSA public key only
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [keys]
                properties:
                  keys:
                    type: array
                    minItems: 1
                    maxItems: 1
                    items:
                      type: object
                      additionalProperties: false
                      required: [kty, n, e, use, alg, kid]
                      properties:
                        kty: { type: string, enum: [RSA] }
                        n: { type: string }
                        e: { type: string }
                        use: { type: string, enum: [sig] }
                        alg: { type: string, enum: [RS256] }
                        kid: { type: string }
        '400': { description: WELDING_INVALID_REQUEST; no-store }
        '503': { description: WELDING_UNAVAILABLE; no-store }
  /api/welding/authority:
    get:
      operationId: getWeldingAuthority
      summary: Resolve current native session through fixed Yuantus identity authority
      description: Default disabled; exact read flag required. No query parameters or body. Requires an active registered native session and verified fixed tenant; no header tenant fallback. Exchanges a dedicated RS256 assertion using server-only configuration and returns only the verified authority. Assertion lifetime is at most 60 seconds subject to upstream clock skew; the upstream credential is an ordinary bearer, remains local to this call, and is never returned. All responses use Cache-Control no-store.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Verified current authority
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [schema, owner]
                properties:
                  schema: { type: string, enum: [yuantus.welding_generation_authority/1] }
                  owner:
                    type: object
                    additionalProperties: false
                    required: [tenant_id, org_id, auth_user_id, rbac_user_id]
                    properties:
                      tenant_id: { type: string }
                      org_id: { type: string }
                      auth_user_id: { type: integer, minimum: 1, maximum: 9007199254740991 }
                      rbac_user_id: { type: integer, minimum: 1, maximum: 9007199254740991 }
        '400': { description: WELDING_INVALID_REQUEST; no-store }
        '401': { description: Native session missing or invalid; no-store }
        '403': { description: Native password change required; no-store }
        '502': { description: WELDING_UPSTREAM_REJECTED; no upstream body is returned; no-store }
        '503': { description: WELDING_UNAVAILABLE; no-store }
  /api/welding/cad-assets/tickets:
    post:
      operationId: issueWeldingCadAssetTicket
      summary: Issue a short same-origin ticket for one pinned CAD editor, history or preparation source
      description: Exact WELDING_READ_ENABLED=true and native bearer session required. Request JSON is limited to 1024 original bytes and has no query. The server verifies the installed manifest pin, performs personal SSO and a fresh fixed CAD context or source document read, and binds one 60-second-or-less in-process ticket to the original native sid, owner, target scope and installed pin. The returned cookie contains only an opaque random value and is HttpOnly, Secure, SameSite Strict and scoped to /welding-cad/{pin}/. Each static GET repeats native session, personal SSO, source ACL and pin checks. No Y bearer or domain body is returned. The static host is an authenticated non-API route and is intentionally absent from this OpenAPI document. A restart invalidates tickets; at most 256 live tickets are held. The absolute installed root is supplied by WELDING_CAD_ASSET_ROOT. Responses are no-store.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [purpose, plan_id, version_id, context_id]
                  properties:
                    purpose: { type: string, enum: [editor] }
                    plan_id: { type: string, minLength: 1, maxLength: 64 }
                    version_id: { type: string, minLength: 1, maxLength: 64 }
                    context_id: { type: string, minLength: 1, maxLength: 64 }
                - type: object
                  additionalProperties: false
                  required: [purpose, plan_id, version_id, change_id, side]
                  properties:
                    purpose: { type: string, enum: [history] }
                    plan_id: { type: string, minLength: 1, maxLength: 64 }
                    version_id: { type: string, minLength: 1, maxLength: 64 }
                    change_id: { type: string, minLength: 1, maxLength: 64 }
                    side: { type: string, enum: [before, after] }
                - type: object
                  additionalProperties: false
                  required: [purpose, plan_id, version_id, context_id, side]
                  properties:
                    purpose: { type: string, enum: [preparation] }
                    plan_id: { type: string, minLength: 1, maxLength: 64 }
                    version_id: { type: string, minLength: 1, maxLength: 64 }
                    context_id: { type: string, minLength: 1, maxLength: 64 }
                    side: { type: string, enum: [before, after] }
      responses:
        '201':
          description: Bound short ticket; Set-Cookie contains only an opaque value
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [asset_url, bundle_sha256, expires_at]
                properties:
                  asset_url: { type: string }
                  bundle_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
                  expires_at: { type: string, format: date-time }
        '400': { description: Invalid fixed descriptor; no-store }
        '413': { description: Oversized original JSON; no-store }
        '401': { description: Native session required; no-store }
        '403': { description: Upstream CAD source denied; no-store }
        '404': { description: Source not visible; no-store }
        '429': { description: Process-local live ticket capacity reached; no-store }
        '502': { description: Upstream or source contract rejected; no-store }
        '503': { description: Read gate or installed bundle unavailable; no-store }
  /api/welding/plans:
    get:
      operationId: listWeldingPlans
      summary: List currently authorized process plans
      description: Fixed Yuantus domain read through a fresh native session and per-request personal SSO. Requires exact WELDING_READ_ENABLED=true; no browser-selected target or actor. Responses are no-store.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100 } }
        - { name: offset, in: query, schema: { type: integer, minimum: 0 } }
        - { name: product_id, in: query, schema: { type: string, minLength: 1, maxLength: 64 } }
        - { name: product_version_id, in: query, schema: { type: string, minLength: 1, maxLength: 64 } }
      responses:
        '200': { description: Authorized finite plan page; no-store }
        '400': { description: Invalid or duplicate query; no-store }
        '401': { description: Native session unavailable; no-store }
        '403': { description: Yuantus scope denied; no-store }
        '502': { description: Upstream read unavailable; no-store }
        '503': { description: Read gate or Yuantus setup unavailable; no-store }
    post:
      operationId: createWeldingPlan
      summary: Create one process plan from the original JSON bytes
      description: Requires exact read and write flags plus fresh native and Yuantus authorization. Body maximum 5 MiB. No automatic retry; a transport failure after dispatch is WELDING_RESULT_UNKNOWN. Yuantus validates the original JSON including duplicate keys and CAS fields.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: Yuantus CreatePlanRequest; original JSON bytes are forwarded }
      responses:
        '201': { description: Yuantus create receipt; no-store }
        '400': { description: Invalid request; no-store }
        '401': { description: Native session unavailable; no-store }
        '403': { description: Yuantus actor denied; no-store }
        '404': { description: Fixed source invisible; no-store }
        '409': { description: Source or save conflict; no-store }
        '413': { description: Plan body exceeds 5 MiB; no-store }
        '422': { description: Domain body rejected; no-store }
        '502': { description: Transport result unknown after dispatch; no-store }
        '503': { description: Write gate or Yuantus setup unavailable; no-store }
  /api/welding/resources/import/templates/{format}:
    get:
      operationId: downloadWeldingResourceImportTemplate
      summary: Download the fixed authorized CSV or XLSX resource import template
      description: Read gate, personal SSO and native session required. No request body or query. Original Yuantus binary bytes, exact MIME and fixed filename are checked; whole response limit 1 MiB, whole relay deadline 300 seconds. No-store and nosniff on success and failure.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: format, in: path, required: true, schema: { type: string, enum: [csv, xlsx] } }
      responses:
        '200':
          description: Complete fixed template bytes with attachment filename; no-store
          content:
            text/csv: { schema: { type: string, format: binary } }
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet: { schema: { type: string, format: binary } }
        '400': { description: Invalid method, path, query or body; no-store }
        '401': { description: Native session unavailable; no-store }
        '403': { description: Yuantus actor denied; no-store }
        '502': { description: Bounded upstream response rejected; no-store }
        '503': { description: Read gate or Yuantus unavailable; no-store }
  /api/welding/resources/import/preview:
    post:
      operationId: previewWeldingResourceImport
      summary: Preflight one complete fixed CSV or XLSX resource file
      description: Read gate and personal SSO required. Send original octet-stream bytes at most 5 MiB. Yuantus authorizes all rows and fixed sources; 200 can contain ready=false and complete issues. Strict whole JSON response limit 32 MiB, whole relay deadline 300 seconds. No-store and nosniff.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: format, in: query, required: true, schema: { type: string, enum: [csv, xlsx] } }
      requestBody:
        required: true
        content: { application/octet-stream: { schema: { type: string, format: binary, maxLength: 5242880 } } }
      responses:
        '200': { description: Complete yuantus.welding_resource_import/1 preview with all rows and issues; no-store }
        '400': { description: Invalid method, path, query or body; no-store }
        '401': { description: Native session unavailable; no-store }
        '403': { description: Yuantus actor denied; no-store }
        '413': { description: Upload exceeds 5 MiB or Yuantus import budget; no-store }
        '415': { description: Yuantus rejected media type; no-store }
        '422': { description: Yuantus rejected fixed file or rows; validated issues when available; no-store }
        '502': { description: Bounded upstream response rejected; no-store }
        '503': { description: Read gate or Yuantus unavailable; no-store }
  /api/welding/resources/import/commit:
    post:
      operationId: commitWeldingResourceImport
      summary: Create the whole confirmed resource batch as Draft
      description: Read and write gates plus personal SSO required at preflight and dispatch. Original bytes, format, import_id and Yuantus preview_digest bind one atomic create-only command. Caller persists the original command before dispatch; after any uncertain ACK preserve it and explicitly replay identical bytes and parameters. Strict 201 complete receipt limit 1 MiB, whole relay deadline 300 seconds. No-store and nosniff.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: format, in: query, required: true, schema: { type: string, enum: [csv, xlsx] } }
        - { name: import_id, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 64 } }
        - { name: preview_digest, in: query, required: true, schema: { type: string, pattern: '^[0-9a-f]{64}$' } }
      requestBody:
        required: true
        content: { application/octet-stream: { schema: { type: string, format: binary, maxLength: 5242880 } } }
      responses:
        '201': { description: Complete yuantus.welding_resource_import/1 receipt for all rows; no-store }
        '400': { description: Invalid method, path, query or body; no-store }
        '401': { description: Native session unavailable before dispatch; no-store }
        '403': { description: Yuantus actor denied; original pending command remains; no-store }
        '404': { description: Fixed source unavailable; original pending command remains; no-store }
        '409': { description: Source, digest, number or import ID conflict; original pending command remains; no-store }
        '413': { description: Upload or Yuantus import budget exceeded; no-store }
        '415': { description: Yuantus rejected media type; no-store }
        '422': { description: Yuantus rejected file or rows; validated issues when available; no-store }
        '502': { description: WELDING_RESULT_UNKNOWN after dispatch or bounded response rejection; preserve original pending command; no-store }
        '503': { description: Write gate or Yuantus unavailable; no-store }
  /api/welding/resources:
    post:
      operationId: createWeldingResource
      summary: Register one authorized enterprise welding resource
      description: Fixed Yuantus resource command using original JSON bytes, personal SSO, exact read and write flags, and a 5 MiB request limit. A successful response is bounded to 32 MiB; larger valid acknowledgments after dispatch are WELDING_RESULT_UNKNOWN. Preserve the original request ID for authoritative recovery; no automatic retry.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: Yuantus CreateResourceRequest; original JSON bytes forwarded }
      responses:
        '201': { description: Authorized version-pinned resource record including full payload and source snapshot; no-store }
        '400': { description: Invalid or unaddressable request; no-store }
        '401': { description: Native session unavailable; no-store }
        '403': { description: Yuantus action denied; no-store }
        '404': { description: Fixed source invisible; no-store }
        '409': { description: Resource or receipt conflict; no-store }
        '413': { description: Request exceeds 5 MiB; no-store }
        '422': { description: Yuantus strict DTO rejected; no-store }
        '502': { description: WELDING_RESULT_UNKNOWN after dispatch; no-store }
        '503': { description: Gate or Yuantus setup unavailable; no-store }
  /api/welding/resources/catalog:
    get:
      operationId: listWeldingResourceCatalog
      summary: Browse authorized fixed resource summaries with a bound cursor
      description: Exact recorded-field filters and paired mm/in thickness values. Each page has at most limit authorized matches; next_cursor only indicates another authorized match. Refresh to discover concurrent changes; no cross-page snapshot promise. Personal SSO and native session are rechecked. The entire response is bounded to 2 MiB and failures never return partial items.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: kind, in: query, schema: { type: string, enum: [wps, pqr, parameter_reference, requirements, material, filler, joint_diagram] } }
        - { name: method, in: query, schema: { type: string, maxLength: 256 } }
        - { name: material_a, in: query, schema: { type: string, maxLength: 256 } }
        - { name: material_b, in: query, schema: { type: string, maxLength: 256 } }
        - { name: filler, in: query, schema: { type: string, maxLength: 256 } }
        - { name: joint_type, in: query, schema: { type: string, maxLength: 256 } }
        - { name: thickness_a_value, in: query, schema: { type: number, minimum: 0 } }
        - { name: thickness_a_unit, in: query, schema: { type: string, enum: [mm, in] } }
        - { name: thickness_b_value, in: query, schema: { type: number, minimum: 0 } }
        - { name: thickness_b_unit, in: query, schema: { type: string, enum: [mm, in] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 20 } }
        - { name: cursor, in: query, schema: { $ref: '#/components/schemas/WeldingCatalogCursor' } }
      responses:
        '200':
          description: Complete authorized summary page; no-store
          content: { application/json: { schema: { $ref: '#/components/schemas/WeldingResourceCatalog' } } }
        '400': { description: Unknown, duplicate or invalid parameters; no-store }
        '401': { description: Native session unavailable; no-store }
        '403': { description: Yuantus scope denied; no-store }
        '422': { description: Cursor binding or domain query rejected; no-store }
        '502': { description: Upstream or whole bounded response unavailable; no-store }
        '503': { description: Read gate or setup unavailable; no-store }
  /api/welding/resources/{resource_id}/version-catalog:
    get:
      operationId: listWeldingResourceVersionCatalog
      summary: Browse authorized fixed version summaries without loading all history bodies
      description: Version IDs sort lexically, not chronologically. current_version_id is disclosed only when independently readable, even if outside this page; null does not prove there is no current version. Selection must read the fixed detail again. Personal SSO and native session are rechecked; the entire response is bounded to 2 MiB, with no partial items.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: resource_id, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 64 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 20 } }
        - { name: cursor, in: query, schema: { $ref: '#/components/schemas/WeldingCatalogCursor' } }
      responses:
        '200':
          description: Complete authorized fixed version summary page; no-store
          content: { application/json: { schema: { $ref: '#/components/schemas/WeldingResourceVersionCatalog' } } }
        '400': { description: Unknown, duplicate or invalid parameters; no-store }
        '401': { description: Native session unavailable; no-store }
        '403': { description: Yuantus scope denied; no-store }
        '404': { description: Resource unavailable; no-store }
        '422': { description: Cursor binding rejected; no-store }
        '502': { description: Upstream or whole bounded response unavailable; no-store }
        '503': { description: Read gate or setup unavailable; no-store }
  /api/welding/process-references/candidate-catalog:
    get:
      operationId: listWeldingProcessReferenceCatalog
      summary: Browse authorized fixed document candidates
      description: Uses the existing document ID/current title/current number search semantics, including SQL wildcard characters. Each page has at most 20 authorized fixed references. Explicit selection fixes item/version/file/role and fingerprint; checksum is a separate file checksum. Candidate visibility does not grant resource writes or professional applicability. Personal SSO and native session are rechecked; the entire response is bounded to 2 MiB, with no partial items.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: query, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
        - { name: cursor, in: query, schema: { $ref: '#/components/schemas/WeldingCatalogCursor' } }
      responses:
        '200':
          description: Complete authorized fixed document candidate page; no-store
          content: { application/json: { schema: { $ref: '#/components/schemas/WeldingProcessReferenceCatalog' } } }
        '400': { description: Unknown, duplicate or invalid parameters; no-store }
        '401': { description: Native session unavailable; no-store }
        '403': { description: Yuantus scope denied; no-store }
        '422': { description: Cursor binding or query rejected; no-store }
        '502': { description: Upstream or whole bounded response unavailable; no-store }
        '503': { description: Read gate or setup unavailable; no-store }
  /api/welding/resources/{resource_id}/versions/{version_id}:
    get:
      operationId: getWeldingResourceVersion
      summary: Read one authorized immutable enterprise resource version
      description: Fixed Yuantus read with personal SSO and source ACL recheck. Full record response is bounded to 32 MiB; a larger valid record fails closed as WELDING_UPSTREAM_REJECTED.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: resource_id, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 64 } }
        - { name: version_id, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 64 } }
      responses:
        '200': { description: Authorized full resource version record; no-store }
        '400': { description: Invalid path or query; no-store }
        '401': { description: Native session unavailable; no-store }
        '403': { description: Yuantus scope denied; no-store }
        '404': { description: Resource or source invisible; no-store }
        '502': { description: Upstream read or bounded response unavailable; no-store }
        '503': { description: Read gate or Yuantus setup unavailable; no-store }
  /api/welding/resources/{resource_id}/versions/{version_id}/diagram:
    get:
      operationId: getWeldingResourceJointDiagram
      summary: Read the authorized original image of a fixed joint-diagram resource version
      description: >-
        Personal SSO and the read gate are required; the write gate is not required.
        No query, body, redirect, compressed response or trailing path is accepted.
        Only a strict joint_diagram resource descriptor with a qualified PNG, JPEG or WebP
        of 1..5242880 bytes is accepted. The complete original image is buffered and its
        exact Content-Length, MIME and lowercase SHA256 checked before sending any image bytes.
        A fresh fixed descriptor and owner must match, followed by a final native session
        recheck. The five-minute total deadline includes identity, metadata, stream and
        final authorization waits; disconnect cancels reading. A historical version need
        not be current, and a cached client descriptor is not an authorization grant.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: resource_id, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 64 } }
        - { name: version_id, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 64 } }
      responses:
        '200':
          description: Complete verified original image; no partial image is returned
          headers:
            Content-Length: { schema: { type: integer, minimum: 1, maximum: 5242880 }, description: Exact original image byte count }
            X-Content-SHA256: { schema: { type: string, pattern: '^[0-9a-f]{64}$' }, description: SHA256 of the returned original bytes }
            Content-Disposition: { schema: { type: string, enum: [inline] } }
            Cache-Control: { schema: { type: string, enum: [no-store] } }
            X-Content-Type-Options: { schema: { type: string, enum: [nosniff] } }
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '400': { description: Invalid method, fixed path, query or body; no-store }
        '401': { description: Native session unavailable or changed; no-store }
        '403': { description: Yuantus scope denied; no-store }
        '404': { description: Resource or diagram unavailable; no-store }
        '409': { description: Yuantus fixed diagram changed while being read; no-store }
        '413': { description: Yuantus image exceeds 5 MiB; no-store }
        '422': { description: Yuantus image qualification rejected; no-store }
        '502': { description: Changed owner or descriptor, invalid image response, timeout or unavailable upstream; no-store }
        '503': { description: Read gate, setup or image storage unavailable; no-store }
  /api/welding/resources/{resource_id}/revisions:
    post:
      operationId: reviseWeldingResource
      summary: Register one CAS-bound enterprise resource revision
      description: Fixed Yuantus revision command with original 5 MiB JSON bytes and exact read and write flags. A successful response is bounded to 32 MiB; larger valid acknowledgments after dispatch remain WELDING_RESULT_UNKNOWN with the original request ID pending.
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: resource_id, in: path, required: true, schema: { type: string, minLength: 1, maxLength: 64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, description: Yuantus ReviseResourceRequest; original JSON bytes forwarded }
      responses:
        '201': { description: Authorized successor record with predecessor IDs and content hash; no-store }
        '400': { description: Invalid request; no-store }
        '401': { description: Native session unavailable; no-store }
        '403': { description: Yuantus revision denied; no-store }
        '404': { description: Resource or source invisible; no-store }
        '409': { description: Current version, source, or receipt conflict; no-store }
        '413': { description: Request exceeds 5 MiB; no-store }
        '422': { description: Yuantus strict DTO rejected; no-store }
        '502': { description: WELDING_RESULT_UNKNOWN after dispatch; no-store }
        '503': { description: Gate or Yuantus setup unavailable; no-store }
  /api/welding/plans/product-context:
    get:
      operationId: getWeldingPlanProductContext
      summary: Resolve one fixed product version
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: product_id, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 64 } }
        - { name: product_version_id, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 64 } }
      responses:
        '200': { description: Authorized product context; no-store }
        '400': { description: Invalid query; no-store }
        '403': { description: Denied; no-store }
        '404': { description: Not visible; no-store }
  /api/welding/plans/product-candidates:
    get:
      operationId: listWeldingPlanProductCandidates
      summary: Search authorized product candidates
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: query, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 20 } }
      responses:
        '200': { description: Authorized candidates; no-store }
        '400': { description: Invalid query; no-store }
  /api/welding/plans/drawing-candidates:
    get:
      operationId: listWeldingPlanDrawingCandidates
      summary: Search authorized fixed drawing candidates
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: query, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 100 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 20 } }
      responses:
        '200': { description: Authorized candidates; no-store }
        '400': { description: Invalid query; no-store }
  /api/welding/plans/bom-candidates:
    get:
      operationId: listWeldingPlanBomCandidates
      summary: List authorized BOM choices for one fixed product version
      security: [{ bearerAuth: [] }]
      parameters:
        - { name: product_id, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 64 } }
        - { name: product_version_id, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 64 } }
      responses:
