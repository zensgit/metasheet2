# G44 — integration (data-factory) READ contract, first cut.
#
# Mechanically derived from the plugin route table and its handlers:
#   - route table:  plugins/plugin-integration-core/lib/http-routes.cjs:13-273 (`ROUTES`)
#   - gates:        the `requireAccess(req, ...)` call at the top of each handler
#   - query params: `requestQuery(req)` reads in each handler, plus `resolveTenantId` /
#                   `resolveWorkspaceId` (http-routes.cjs:1028-1057, 1248-1258), which every
#                   `scopedInput` route consults for optional `tenantId` / `workspaceId`
#   - envelope:     `sendOk` -> `{ ok: true, data }` (http-routes.cjs:732); `sendError` ->
#                   `{ ok: false, error: { code, message, details? } }` (http-routes.cjs:736)
#
# SCOPE OF THIS FILE — read-only, and only part of the read surface.
#   IN:  every GET whose gate is exactly `requireAccess(req, 'read')`, MINUS the three that construct
#        an adapter and reach the customer's own system (`/external-systems/{id}/objects`,
#        `/external-systems/{id}/schema`, `/stock-preparation/source-preflight`).
#   OUT: every write method (no POST/PUT/PATCH/DELETE is described here at all — not `pipelines/{id}/run`,
#        not any dry-run, not any apply), every `requireAccess(req, 'admin')` GET, and every GET in the
#        stock-prep vocabulary (`stock-prep:read` / `:operate`).
#
# `data` IS DELIBERATELY UNTYPED. Each handler returns whatever its registry/store returns; describing
# those shapes here would mean inventing them. The envelope is pinned (it is `StandardResponse`), the
# status codes are pinned, and the per-route description says what the payload is ABOUT. Typing `data`
# is deferred to a later cut that generates it from the stores rather than from a reader's guess.
#
# AUTH. Every operation takes `Authorization: Bearer <session JWT>` as it always has. Operations carrying
# `x-api-token-scope: integration:read` ADDITIONALLY accept an `mst_` open-API token, and that is the
# complete list of integration operations that do — see
# packages/core-backend/src/integration/oapi-integration-read-allowlist.ts. A token is admitted only when
# BOTH its own scope list contains `integration:read` AND its creator independently holds the
# `integration:read` RBAC permission code; its tenant comes from the creator's membership, never from the
# request or the `x-tenant-id` header.
paths:
  /api/integration/status:
    get:
      summary: Integration plugin status (adapter kinds + registered route table)
      description: >-
        Gate `requireAccess(req, 'read')`. Resolves no tenant. `data` is
        `{ adapters: string[], routes: { method, path }[] }` — the adapter-kind list and the plugin's
        own route inventory (http-routes.cjs:4613-4618).
      security: [ { bearerAuth: [] } ]
      x-api-token-scope: integration:read
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/StandardResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/integration/adapters:
    get:
      summary: List adapter kinds with their metadata
      description: >-
        Gate `requireAccess(req, 'read')`. Resolves no tenant. `data` is one descriptor per registered
        adapter kind (http-routes.cjs:4630-4636).
      security: [ { bearerAuth: [] } ]
      x-api-token-scope: integration:read
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/StandardResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/integration/hub/overview:
    get:
      summary: 对接总览 — one joined read of systems, consumers and connection descriptors
      description: >-
        Gate `requireAccess(req, 'read')`. Tenant-scoped. Joins the external-system registry to the
        data_sources display descriptor (name/type/status only), the server-held stock-prep table-action
        binding, pipelines, and approved read-source configs/compositions. Page sizes are server-held
        constants, not request-tunable. Writes nothing and opens no connection (http-routes.cjs:4653-4726).
      security: [ { bearerAuth: [] } ]
      x-api-token-scope: integration:read
      parameters:
        - { in: query, name: tenantId, required: false, description: 'Tenantless platform admins only; any other principal must omit it or repeat its own tenant (403 TENANT_MISMATCH otherwise). An API token can never use it.', schema: { type: string } }
        - { in: query, name: workspaceId, required: false, schema: { type: string } }
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/StandardResponse' } } } }
        '400': { description: 'TENANT_REQUIRED — no tenant could be resolved', content: { application/json: { schema: { $ref: '#/components/schemas/ErrorResponse' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/integration/external-systems:
    get:
      summary: List registered external systems
      description: >-
        Gate `requireAccess(req, 'read')`. Tenant-scoped. Credentials are never returned
        (http-routes.cjs:4729-4738).
      security: [ { bearerAuth: [] } ]
      x-api-token-scope: integration:read
      parameters:
        - { in: query, name: kind, required: false, schema: { type: string } }
        - { in: query, name: status, required: false, schema: { type: string } }
        - { in: query, name: limit, required: false, description: 'Capped server-side at 500 (MAX_LIST_LIMIT).', schema: { type: integer, minimum: 1, maximum: 500 } }
        - { in: query, name: offset, required: false, description: 'Capped server-side at 10000 (MAX_LIST_OFFSET).', schema: { type: integer, minimum: 0, maximum: 10000 } }
        - { in: query, name: tenantId, required: false, schema: { type: string } }
        - { in: query, name: workspaceId, required: false, schema: { type: string } }
      responses:
