paths:
  /api/auth/dev-token:
    get:
      summary: Issue dev token (non-production)
      parameters:
        - in: query
          name: userId
          schema: { type: string }
        - in: query
          name: roles
          schema: { type: string }
        - in: query
          name: perms
          schema: { type: string }
        - in: query
          name: expiresIn
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
                  payload: { type: object }
        '404': { description: Not found }
  /api/auth/login:
    post:
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
              required: [email, password]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      user: { $ref: '#/components/schemas/User' }
                      token: { type: string }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { description: Too many requests }
  /api/auth/register:
    post:
      summary: User registration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string }
                password: { type: string }
              required: [name, email, password]
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      user: { $ref: '#/components/schemas/User' }
                      token: { type: string }
        '400': { $ref: '#/components/responses/ValidationError' }
        '409': { description: Conflict }
        '429': { description: Too many requests }
  /api/auth/refresh-token:
    post:
      summary: Refresh JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
              required: [token]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      token: { type: string }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/auth/verify:
    get:
      summary: Verify JWT token
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      user: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/auth/me:
    get:
      summary: Get current user
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      user: { $ref: '#/components/schemas/User' }
                      features:
                        type: object
                        description: Product capability flags for UI shells.
                        properties:
                          attendance: { type: boolean }
                          workflow: { type: boolean }
                          attendanceAdmin: { type: boolean }
                          attendanceImport: { type: boolean }
                          mode:
                            type: string
                            enum: [platform, attendance]
        '401': { $ref: '#/components/responses/Unauthorized' }
  /api/auth/users:
    get:
      summary: List users for admin consoles
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/User' }
                      total: { type: integer }
                      page: { type: integer }
                      pageSize: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/auth/security-actions/verify:
    post:
      summary: Re-verify the signed-in user for one security action
      description: >-
        Mounted only when SECURITY_ACTION_PROOF_ENABLED is exactly 'true'. Returns a 300-second
        single-use proof bound to the session, the authenticated organization, the purpose and the
        target. A purpose whose prerequisites are not delivered is refused before any data is read.
        Responses are not cacheable.
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [purpose, connectionId, method, password]
              properties:
                purpose:
                  type: string
                  enum: [external_identity_bind, external_identity_unbind, login_grant_enable, login_grant_disable]
                connectionId: { type: string, format: uuid }
                targetIdentityId:
                  type: string
                  format: uuid
                  description: Required for every purpose except external_identity_bind, and refused for it.
                expectedBindingRevision:
                  type: integer
                  minimum: 0
                  description: Present exactly when targetIdentityId is present.
                method: { type: string, enum: [local_password] }
                password: { type: string, format: password, minLength: 1, maxLength: 1024 }
                clientBindingDigest: { type: string, pattern: '^[0-9a-f]{64}$' }
      responses:
        '200':
          description: A single-use proof was issued
          headers:
            Cache-Control: { schema: { type: string, enum: [no-store] } }
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, enum: [true] }
                  data:
                    type: object
                    properties:
                      proof: { type: string, description: 'Opaque; present only in this response body.' }
                      purpose: { type: string, enum: [external_identity_bind, external_identity_unbind, login_grant_enable, login_grant_disable] }
                      connectionId: { type: string, format: uuid }
                      method: { type: string, enum: [local_password] }
                      assurance: { type: string, enum: [local_password] }
                      expiresAt: { type: string, format: date-time }
                      ttlSeconds: { type: integer, enum: [300] }
        '401':
          description: No usable session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecurityActionError' }
        '403':
          description: Refused (purpose unavailable, method unavailable, policy refusal or rejected credential)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecurityActionError' }
        '409':
          description: Organization context, target or state conflict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecurityActionError' }
        '422':
          description: Request does not satisfy the closed schema; details.fields names schema fields only
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecurityActionError' }
        '429':
          description: Per-user failure limit reached; Retry-After carries details.retryAfter
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecurityActionError' }
        '503':
          description: Verification unavailable
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecurityActionError' }
