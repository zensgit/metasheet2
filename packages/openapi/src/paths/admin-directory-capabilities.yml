paths:
  /api/admin/directory/integration-capabilities/{integrationId}:
    get:
      summary: Show the capability state of one directory integration
      description: >-
        Platform administrators only. Answers 404 DIRECTORY_CAPABILITIES_DISABLED while
        DIRECTORY_INTEGRATION_CAPABILITIES_ENABLED is not the exact string true. Read-only and display only:
        the response carries no scope value, corp id, application key, environment value or configuration
        value. `effective` is null where the stored state does not govern the capability (legacy path,
        unsupported capability, unregistered provider); null does not mean the capability is off.
      operationId: getDirectoryIntegrationCapabilities
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: path
          name: integrationId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Capability state
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean }
                  data: { $ref: '#/components/schemas/DirectoryIntegrationCapabilities' }
        '400':
          description: integrationId is not a UUID (DIRECTORY_INTEGRATION_ID_INVALID)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: The surface is switched off (DIRECTORY_CAPABILITIES_DISABLED) or the integration does not exist (DIRECTORY_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          description: Fixed-sentence failure (DIRECTORY_CAPABILITIES_INTERNAL)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: The capability tables are not present (DIRECTORY_CAPABILITIES_SCHEMA_UNAVAILABLE)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    patch:
      summary: Turn capabilities of one directory integration on or off
      description: >-
        Platform administrators only. Answers 404 DIRECTORY_CAPABILITIES_DISABLED while
        DIRECTORY_INTEGRATION_CAPABILITIES_ENABLED is not the exact string true. Answers are given in this
        order: administrator check, switch, path, integration, body, revision, and then each named
        capability in the order directory, login, notification. `expectedRevision` is the revision the
        caller last read (0 while the integration has no capability row); any other stored revision is
        answered 409 DIRECTORY_CAPABILITIES_STALE whatever the request asks for. A capability that is not
        named keeps its state. False is always allowed. True is allowed only where the provider registry
        governs the capability as gated and every check passes; several capabilities in one request are
        applied together or not at all, and a refusal names the first capability that failed. A request
        that changes nothing answers 200 without advancing the revision. Every change advances the
        revision by one and is recorded with the administrator who made it. The response has the shape of
        the GET response and carries no scope value, corp id, application key or configuration value.
      operationId: patchDirectoryIntegrationCapabilities
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: path
          name: integrationId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DirectoryIntegrationCapabilitiesPatch' }
      responses:
        '200':
          description: Capability state after the request, also when the request changed nothing
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean }
                  data: { $ref: '#/components/schemas/DirectoryIntegrationCapabilities' }
        '400':
          description: integrationId is not a UUID (DIRECTORY_INTEGRATION_ID_INVALID)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: The surface is switched off (DIRECTORY_CAPABILITIES_DISABLED) or the integration does not exist (DIRECTORY_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: >-
            The stored revision is not the expected one (DIRECTORY_CAPABILITIES_STALE), or a capability may
            not be turned on (one of the CAPABILITY_ codes; `details.capability` names the capability and,
            for CAPABILITY_PRECONDITION_FAILED, `details.reason` is the fixed code of the precondition).
            Nothing was written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectoryIntegrationCapabilitiesPatchRefusal' }
        '422':
          description: >-
            The body is not valid (DIRECTORY_CAPABILITIES_INVALID_INPUT). `details.fields` lists fixed
            tokens only: `body`, `expectedRevision`, `capabilities`, `capabilities.<name>` for one of the
            three capabilities, and `unknown_field` for any other field, whose name is not repeated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DirectoryIntegrationCapabilitiesPatchInvalid' }
        '500':
          description: Fixed-sentence failure (DIRECTORY_CAPABILITIES_INTERNAL). Nothing was written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: >-
            The capability tables are not present (DIRECTORY_CAPABILITIES_SCHEMA_UNAVAILABLE), or the write
            lost a lock race or ran out of time (DIRECTORY_CAPABILITIES_BUSY; nothing was written and the
            request may be retried).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
