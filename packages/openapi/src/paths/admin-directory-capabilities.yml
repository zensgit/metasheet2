paths:
  /api/admin/directory/integration-capabilities/{integrationId}:
    get:
      summary: Show the capability state of one directory integration
      description: >-
        Platform administrators only. Answers 404 DIRECTORY_CAPABILITIES_DISABLED while
        DIRECTORY_INTEGRATION_CAPABILITIES_ENABLED is not the exact string true. Read-only and display only:
        the response carries no scope value, corp id, application key, environment value or configuration
        value. `effective` is null where the stored state does not govern the capability (legacy path,
        unsupported capability, unregistered provider); null does not mean the capability is off.
      operationId: getDirectoryIntegrationCapabilities
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: path
          name: integrationId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Capability state
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean }
                  data: { $ref: '#/components/schemas/DirectoryIntegrationCapabilities' }
        '400':
          description: integrationId is not a UUID (DIRECTORY_INTEGRATION_ID_INVALID)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: The surface is switched off (DIRECTORY_CAPABILITIES_DISABLED) or the integration does not exist (DIRECTORY_NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '500':
          description: Fixed-sentence failure (DIRECTORY_CAPABILITIES_INTERNAL)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '503':
          description: The capability tables are not present (DIRECTORY_CAPABILITIES_SCHEMA_UNAVAILABLE)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
