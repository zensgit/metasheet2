paths:
  /api/roles:
    get:
      summary: List roles
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, default: 50 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Role' }
                      page: { type: integer }
                      pageSize: { type: integer }
                      total: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      summary: Create role
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: string }
                name: { type: string }
                permissions:
                  type: array
                  items: { type: string }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/roles/{id}:
    put:
      summary: Update role
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                permissions:
                  type: array
                  items: { type: string }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      summary: Delete role
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200': { description: OK }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/admin/roles/{roleId}/members:
    get:
      operationId: listAdminRoleMembers
      summary: List role member display names
      description: Platform-admin read of persisted role members. Page defaults are 1 and 20, and pageSize is capped at 100. Items contain only id and displayName.
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: path
          name: roleId
          required: true
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean, enum: [true] }
                  data:
                    type: object
                    required: [items, page, pageSize, total]
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                          required: [id, displayName]
                          additionalProperties: false
                          properties:
                            id: { type: string }
                            displayName: { type: string }
                      page: { type: integer, minimum: 1 }
                      pageSize: { type: integer, minimum: 1, maximum: 100 }
                      total: { type: integer, minimum: 0 }
        '400':
          description: Role id is required
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: Role members are temporarily unavailable
          content:
            application/json:
              schema:
                type: object
                required: [ok, error]
                properties:
                  ok: { type: boolean, enum: [false] }
                  error:
                    type: object
                    required: [code, message]
                    properties:
                      code: { type: string, enum: [ROLE_MEMBERS_UNAVAILABLE] }
                      message: { type: string }
