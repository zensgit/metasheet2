# E-learning named-pilot and L3 assessment HTTP surface.
# Live routes: content/video, assignment/watch, objective assessment authoring,
# learner exams, auto grading, and policy-controlled review.
# L4 incentive rules and wallet reads are present behind master+INCENTIVE.
# Analytics and remaining incentive surfaces stay parked.

paths:
  /api/elearning/capabilities:
    x-plugin: plugin-elearning
    get:
      operationId: getElearningCapabilities
      summary: Report e-learning master and capability flags
      description: |
        Plugin route. JWT session is required by the global `/api` gate.
        Returns `{ enabled, capabilities }` with keys content, assignment,
        assessment, incentive, analytics, media. V0.1 readiness is enabled
        plus content/assignment/assessment/media only; incentive and analytics
        stay parked. Secondary master-off after registration is a values-free
        404 FEATURE_DISABLED (no flag names, no capabilities object).
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: Flag snapshot. Does not imply every HTTP surface is mounted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElearningCapabilities'
        '401':
          description: Missing or invalid JWT
          $ref: '#/components/responses/ElearningAuthError'
        '404':
          description: Master flag is not exact 'true' after registration
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                ok: false
                error:
                  code: FEATURE_DISABLED
                  message: Feature is disabled

  /api/elearning/admin/credit-rules:
    get:
      operationId: listElearningCreditRules
      summary: List active organization credit rules
      description: |
        Global `elearning:admin` only. Requires master and incentive flags to
        be exact `true`. Organization comes only from the JWT-bound session.
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: Active automatic-behavior rules ordered by behavior.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElearningCreditRuleList'
        '401':
          $ref: '#/components/responses/ElearningAuthError'
        '403':
          description: ORG_CONTEXT_REQUIRED or insufficient elearning:admin
          $ref: '#/components/responses/ElearningError'
        '404':
          description: Incentive surface flags off
          $ref: '#/components/responses/ElearningError'
        '503':
          description: unavailable
          $ref: '#/components/responses/ElearningError'
    post:
      operationId: publishElearningCreditRule
      summary: Publish a new active credit-rule version
      description: |
        Global `elearning:admin` only. Actor and organization are server
        derived. Publishing atomically retires the prior active version.
        `requestId` is organization-scoped: same normalized payload replays
        the same closed response; a changed payload returns values-free 409.
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElearningCreditRulePublishRequest'
      responses:
        '200':
          description: Published rule or exact idempotent replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElearningCreditRule'
        '400':
          description: invalid_input
          $ref: '#/components/responses/ElearningError'
        '401':
          $ref: '#/components/responses/ElearningAuthError'
        '403':
          description: ORG_CONTEXT_REQUIRED or insufficient elearning:admin
          $ref: '#/components/responses/ElearningError'
        '404':
          description: Incentive surface flags off
          $ref: '#/components/responses/ElearningError'
        '409':
          description: requestId reused with a different normalized payload
          $ref: '#/components/responses/ElearningError'
        '503':
          description: unavailable
          $ref: '#/components/responses/ElearningError'

  /api/elearning/admin/credit-titles:
    get:
      operationId: getElearningTitleSnapshot
      summary: Read the active organization credit-title threshold snapshot
      description: |
        Global `elearning:admin` only. Requires `ELEARNING_ENABLED` and
        `ELEARNING_INCENTIVE_ENABLED` to each equal the exact literal `true`.
        Organization is server-derived. The closed response contains only the
        active immutable revision and its threshold-ordered title rows.
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: Active snapshot, or the explicit empty snapshot when no titles are configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElearningTitleSnapshot'
        '401':
          $ref: '#/components/responses/ElearningAuthError'
        '403':
          description: ORG_CONTEXT_REQUIRED or insufficient elearning:admin
          $ref: '#/components/responses/ElearningError'
        '404':
          description: Incentive surface flags off
          $ref: '#/components/responses/ElearningError'
        '503':
          description: unavailable
          $ref: '#/components/responses/ElearningError'
    post:
      operationId: publishElearningTitleSnapshot
      summary: Publish one complete credit-title threshold snapshot
      description: |
        Global `elearning:admin` only. Actor and organization are server-derived.
        The complete normalized snapshot becomes one immutable active revision.
        The same organization-scoped `requestId` and logical payload replay the
        original closed result; changed values return a values-free 409.
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElearningTitlePublishRequest'
      responses:
        '200':
          description: Published snapshot or exact idempotent replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElearningTitleSnapshot'
        '400':
          description: invalid_input
          $ref: '#/components/responses/ElearningError'
        '401':
          $ref: '#/components/responses/ElearningAuthError'
        '403':
          description: ORG_CONTEXT_REQUIRED or insufficient elearning:admin
          $ref: '#/components/responses/ElearningError'
        '404':
          description: Incentive surface flags off
          $ref: '#/components/responses/ElearningError'
        '409':
          description: requestId reused with a different normalized snapshot
          $ref: '#/components/responses/ElearningError'
        '503':
          description: unavailable
          $ref: '#/components/responses/ElearningError'

  /api/elearning/admin/certificate-templates:
    get:
      operationId: listElearningCertificateTemplates
      summary: List active organization certificate templates
      description: |
        Global `elearning:admin` only. Requires `ELEARNING_ENABLED` and
        `ELEARNING_INCENTIVE_ENABLED` to each equal the exact literal `true`.
        Organization is server-derived. The closed response contains only each
        active immutable template revision. This surface stores template and
        issuance metadata; it does not render or expose PDF, image, or download
        artifacts.
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: Active templates ordered by stable certificate identifier.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElearningCertificateTemplateList'
        '401':
          $ref: '#/components/responses/ElearningAuthError'
        '403':
          description: ORG_CONTEXT_REQUIRED or insufficient elearning:admin
          $ref: '#/components/responses/ElearningError'
        '404':
          description: Incentive surface flags off
          $ref: '#/components/responses/ElearningError'
        '503':
          description: unavailable
          $ref: '#/components/responses/ElearningError'
    post:
      operationId: publishElearningCertificateTemplate
      summary: Publish an immutable certificate-template revision
      description: |
        Global `elearning:admin` only. Requires `ELEARNING_ENABLED` and
        `ELEARNING_INCENTIVE_ENABLED` to each equal the exact literal `true`.
        Organization and actor are server-derived. The same organization-scoped
        `requestId` and normalized payload replay the original closed result;
        changed values return a values-free 409. Publishing stores metadata only
        and does not render or expose PDF, image, or download artifacts.
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElearningCertificateTemplatePublishRequest'
      responses:
        '200':
          description: Published template revision or exact idempotent replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElearningCertificateTemplate'
        '400':
          description: invalid_input
          $ref: '#/components/responses/ElearningError'
        '401':
          $ref: '#/components/responses/ElearningAuthError'
        '403':
          description: ORG_CONTEXT_REQUIRED or insufficient elearning:admin
          $ref: '#/components/responses/ElearningError'
        '404':
          description: Incentive surface flags off
          $ref: '#/components/responses/ElearningError'
        '409':
          description: requestId reused with a different normalized payload
          $ref: '#/components/responses/ElearningError'
        '503':
          description: unavailable
          $ref: '#/components/responses/ElearningError'

  /api/elearning/admin/certificate-issues:
    post:
      operationId: issueElearningCertificate
      summary: Issue a certificate ledger record to a same-organization learner
      description: |
        Global `elearning:admin` only. Requires `ELEARNING_ENABLED` and
        `ELEARNING_INCENTIVE_ENABLED` to each equal the exact literal `true`.
        Organization, actor, serial number, and issuance time are server-derived.
        The same organization-scoped `requestId` and normalized payload replay
        the original closed result; changed values return a values-free 409.
        The result is immutable ledger metadata, not a rendered PDF, image, or
        downloadable certificate artifact.
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElearningCertificateIssueRequest'
      responses:
        '200':
          description: Issued ledger record or exact idempotent replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElearningCertificateIssue'
        '400':
          description: invalid_input
          $ref: '#/components/responses/ElearningError'
        '401':
          $ref: '#/components/responses/ElearningAuthError'
        '403':
          description: ORG_CONTEXT_REQUIRED or insufficient elearning:admin
          $ref: '#/components/responses/ElearningError'
        '404':
          description: Template or target membership not found, or incentive flags off
          $ref: '#/components/responses/ElearningError'
        '409':
          description: requestId reused with a different normalized payload
          $ref: '#/components/responses/ElearningError'
        '503':
          description: unavailable
          $ref: '#/components/responses/ElearningError'

  /api/elearning/certificates:
    get:
      operationId: listMyElearningCertificates
      summary: List the authenticated learner's certificate ledger records
      description: |
        Requires `ELEARNING_ENABLED` and `ELEARNING_INCENTIVE_ENABLED` to each
        equal the exact literal `true` plus an e-learning read-capable role.
        Organization and learner identity are server-derived; only that learner's
        same-organization immutable records are returned. The closed DTO contains
        metadata and parameter snapshots only, with no PDF, render, or download
        capability.
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: Learner-owned certificate records ordered newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElearningCertificateIssueList'
        '401':
          $ref: '#/components/responses/ElearningAuthError'
        '403':
          description: ORG_CONTEXT_REQUIRED or insufficient e-learning read permission
          $ref: '#/components/responses/ElearningError'
        '404':
          description: Incentive surface flags off
          $ref: '#/components/responses/ElearningError'
        '503':
          description: unavailable
          $ref: '#/components/responses/ElearningError'

  /api/elearning/admin/credits/adjustments:
    post:
      operationId: adjustElearningCredit
      summary: Apply a manual credit adjustment to a same-organization learner
      description: |
        Global `elearning:admin` only. Requires `ELEARNING_ENABLED` and
        `ELEARNING_INCENTIVE_ENABLED` to each equal the exact literal `true`.
        Organization and actor are derived only from the authenticated server
        context and are never accepted from the request body. `requestId` is
        organization-scoped: the same normalized payload replays the same
        closed result, while a changed payload returns values-free 409.
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElearningCreditAdjustmentRequest'
      responses:
        '200':
          description: Applied adjustment or exact idempotent replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElearningCreditAdjustmentResult'
        '400':
          description: invalid_input
          $ref: '#/components/responses/ElearningError'
        '401':
          $ref: '#/components/responses/ElearningAuthError'
        '403':
          description: ORG_CONTEXT_REQUIRED or insufficient elearning:admin
          $ref: '#/components/responses/ElearningError'
        '404':
          description: Target or actor is not active in the organization, or incentive flags are off
          $ref: '#/components/responses/ElearningError'
        '409':
          description: requestId conflict, insufficient balance, or int4 balance overflow
          $ref: '#/components/responses/ElearningError'
        '503':
          description: unavailable
          $ref: '#/components/responses/ElearningError'

  /api/elearning/admin/content-revisions:
    post:
      operationId: createElearningContentRevision
      summary: Create an immutable article or external-link revision
      description: |
        Global `elearning:admin` only. `ELEARNING_ENABLED` and
        `ELEARNING_CONTENT_ENABLED` must each equal the exact literal `true`.
        Organization and actor are server-derived and are never accepted from
        the closed request body. Reusing `requestId` with the same normalized
        payload replays the immutable revision; a changed payload returns a
        values-free conflict.
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElearningContentRevisionRequest'
      responses:
        '201':
          description: Created immutable revision or exact idempotent replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElearningContentRevision'
        '400':
          description: invalid_input
          $ref: '#/components/responses/ElearningError'
        '401':
          $ref: '#/components/responses/ElearningAuthError'
        '403':
          description: ORG_CONTEXT_REQUIRED or insufficient elearning:admin
          $ref: '#/components/responses/ElearningError'
        '404':
          description: Content surface flags off
          $ref: '#/components/responses/ElearningError'
        '409':
          description: requestId reused with a different normalized payload
          $ref: '#/components/responses/ElearningError'
        '413':
          description: payload_too_large
          $ref: '#/components/responses/ElearningError'
        '500':
          description: internal_error
          $ref: '#/components/responses/ElearningError'
        '503':
          description: unavailable
          $ref: '#/components/responses/ElearningError'

  /api/elearning/admin/courses/content/publish:
    post:
      operationId: publishElearningContentCourse
      summary: Publish one ordered content-only course version
      description: |
        Global `elearning:admin` only. `ELEARNING_ENABLED` and
        `ELEARNING_CONTENT_ENABLED` must each equal the exact literal `true`.
        Organization and actor are server-derived. The closed request freezes
        a non-empty ordered list of same-organization immutable content
        revisions; array order becomes the one-based course-item position.
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElearningContentCoursePublishRequest'
      responses:
        '201':
          description: Published content-only course or exact idempotent replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElearningContentCoursePublishResult'
        '400':
          description: invalid_input
          $ref: '#/components/responses/ElearningError'
        '401':
          $ref: '#/components/responses/ElearningAuthError'
        '403':
          description: ORG_CONTEXT_REQUIRED or insufficient elearning:admin
          $ref: '#/components/responses/ElearningError'
        '404':
          description: Content surface flags off
          $ref: '#/components/responses/ElearningError'
        '409':
          description: reference_unavailable or requestId conflict
          $ref: '#/components/responses/ElearningError'
        '413':
          description: payload_too_large
          $ref: '#/components/responses/ElearningError'
        '500':
          description: internal_error
          $ref: '#/components/responses/ElearningError'
        '503':
          description: unavailable
          $ref: '#/components/responses/ElearningError'

  /api/elearning/me/course-items/{itemId}/open:
    post:
      operationId: openElearningContentCourseItem
      summary: Open an accessible article or external-link item and record completion
      description: |
        RBAC any of `elearning:read`, `elearning:write`, `elearning:admin`.
        `ELEARNING_ENABLED` and `ELEARNING_CONTENT_ENABLED` must each equal the
        exact literal `true`. Organization, learner, completion time, event,
        and assurance are server-derived. The closed body accepts only the
        idempotency `requestId`; the response exposes sanitized article HTML or
        the validated HTTPS link, never both.
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: path
          name: itemId
          required: true
          schema:
            $ref: '#/components/schemas/ElearningUuid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ElearningOpenCompletionRequest'
      responses:
        '200':
          description: Server-recorded completion or exact idempotent replay.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElearningOpenCompletionResult'
        '400':
          description: invalid_input or unsupported_item
          $ref: '#/components/responses/ElearningError'
        '401':
          $ref: '#/components/responses/ElearningAuthError'
        '403':
          description: ORG_CONTEXT_REQUIRED or forbidden
          $ref: '#/components/responses/ElearningError'
        '404':
          description: Item not found or content surface flags off
          $ref: '#/components/responses/ElearningError'
        '409':
          description: course_withdrawn or requestId conflict
          $ref: '#/components/responses/ElearningError'
        '413':
          description: payload_too_large
          $ref: '#/components/responses/ElearningError'
        '500':
          description: internal_error
          $ref: '#/components/responses/ElearningError'
        '503':
          description: unavailable
          $ref: '#/components/responses/ElearningError'

  /api/elearning/credits/wallet:
    get:
      operationId: getMyElearningCreditWallet
      summary: Read the authenticated learner credit wallet
      description: |
        RBAC any of `elearning:read`, `elearning:write`, `elearning:admin`.
        User and organization come only from the authenticated session. The
        closed DTO excludes request hashes, effect keys, and raw references.
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: query
          name: cursor
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Own balance and stable keyset-paginated history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElearningCreditWallet'
        '400':
          description: invalid_input
          $ref: '#/components/responses/ElearningError'
        '401':
          $ref: '#/components/responses/ElearningAuthError'
        '403':
          description: ORG_CONTEXT_REQUIRED or insufficient read permission
          $ref: '#/components/responses/ElearningError'
        '404':
          description: User not active in the organization or flags off
          $ref: '#/components/responses/ElearningError'
        '503':
          description: unavailable
          $ref: '#/components/responses/ElearningError'

  /api/elearning/admin/credits/wallet:
    get:
      operationId: getAdminElearningCreditWallet
      summary: Read one same-organization learner wallet as global admin
      description: |
        Global `elearning:admin` only. `userId` must resolve to an active user
        in the authenticated organization. Department-scoped statistics are
        not part of this L4 endpoint.
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: query
          name: userId
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - in: query
          name: cursor
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 512
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Same-organization target balance and history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElearningCreditWallet'
        '400':
          description: invalid_input
          $ref: '#/components/responses/ElearningError'
        '401':
          $ref: '#/components/responses/ElearningAuthError'
        '403':
          description: ORG_CONTEXT_REQUIRED or insufficient elearning:admin
          $ref: '#/components/responses/ElearningError'
        '404':
          description: User not active in the organization or flags off
          $ref: '#/components/responses/ElearningError'
        '503':
          description: unavailable
          $ref: '#/components/responses/ElearningError'

  /api/elearning/profile:
    get:
      operationId: getMyElearningLearningProfile
      summary: Read the authenticated learner historical archive
      description: |
        RBAC any of `elearning:read`, `elearning:write`, `elearning:admin`.
        The organization and learner are derived only from the authenticated
        session. The archive is projected from immutable completion evidence
        and graded attempts; it does not expose answers, grading comments,
        event digests, request hashes, actor identifiers, or access-basis keys.
        Historical completed courses remain visible after course withdrawal.
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: query
          name: cursor
          required: false
          schema:
            type: string
            pattern: '^[A-Za-z0-9_-]+$'
            minLength: 1
            maxLength: 512
        - in: query
          name: limit
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        '200':
          description: Closed learner-owned archive with stable keyset pagination.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElearningLearningProfile'
        '400':
          description: invalid_input
          $ref: '#/components/responses/ElearningError'
        '401':
          $ref: '#/components/responses/ElearningAuthError'
        '403':
          description: ORG_CONTEXT_REQUIRED, inactive membership, or insufficient read permission
          $ref: '#/components/responses/ElearningError'
        '404':
          description: Incentive surface flags off
          $ref: '#/components/responses/ElearningError'
        '503':
          description: unavailable
          $ref: '#/components/responses/ElearningError'

  /api/elearning/media:
    post:
      operationId: uploadElearningMedia
      summary: One-shot authenticated MP4 upload
      description: |
        Multipart field `file` only (one file part; no client metadata).
        Duration is server-probed. RBAC `elearning:write`. Identity, org, RBAC,
        storage, and quotas are checked before multipart ingest. 201 may be
        `ready` or probe-rejected `rejected`; storage keys never appear.
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Exactly one `file` part. MIME must be video/mp4; extension mp4; ISO-BMFF ftyp.
            encoding:
              file:
                contentType: video/mp4
      responses:
        '201':
          description: Ingest finished. `ready` after successful probe; `rejected` after probe/codec failure (no blob kept as ready).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElearningMediaUploadResult'
        '400':
          description: file_required, upload_failed, upload_rejected, or rejected/invalid_size
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ElearningError'
                  - $ref: '#/components/schemas/ElearningMediaRejectError'
        '401':
          description: unauthenticated or missing JWT
          $ref: '#/components/responses/ElearningAuthError'
        '403':
          description: ORG_CONTEXT_REQUIRED or Insufficient permissions (`elearning:write`)
          $ref: '#/components/responses/ElearningError'
        '404':
          description: Media surface flags off
          $ref: '#/components/responses/ElearningError'
        '413':
          description: file_too_large, too_many_files (extra parts/fields), or org_quota_exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElearningMediaRejectError'
        '415':
          description: MIME, extension, or ISO-BMFF ftyp rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ElearningMediaRejectError'
        '500':
          description: internal_error
          $ref: '#/components/responses/ElearningError'
        '503':
          description: media_unavailable (missing quotas or storage)
          $ref: '#/components/responses/ElearningError'

  /api/elearning/courses/publish:
    post:
      operationId: publishElearningCourse
      summary: Publish a one-video plus one-exam course
      description: |
        Admin composite publish. RBAC `elearning:admin`. Requires watch gate plus
        ASSESSMENT. JSON limit 1 MiB (just over is values-free 413 payload_too_large).
        Actor/org are injected from JWT, never from the body. Unknown top-level
        keys are invalid_input. Learner responses never echo answer keys.
      security: [ { bearerAuth: [] } ]
