paths:
  /api/me/notification-endpoints:
    get:
      summary: List the caller's notification endpoints and the connections that could become one
      description: >-
        Answers 404 while USER_NOTIFICATION_PREFERENCES_ENABLED is not the exact string true (and when the
        session token carries no organization). The caller and the organization come from the session only.
        The response carries no recipient identifier, digest or proof id. `capability` is a display state
        and is not authoritative.
      operationId: listMyNotificationEndpoints
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: The caller's endpoints and candidates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationEndpointListing' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: The surface is switched off, or the session has no organization (NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationError' }
        '500':
          description: Fixed-sentence failure (INTERNAL)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationError' }
    post:
      summary: Make or refresh an endpoint from a proof the caller already holds
      description: >-
        The request names a connection and a proof kind and nothing else; any other field, including every
        recipient-identifier name, is a 422. The address is derived from the proof and never stored or
        returned. Repeating the request changes nothing; a revoked endpoint is re-enabled as the same row.
      operationId: createMyNotificationEndpoint
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationEndpointCreate' }
      responses:
        '200':
          description: The endpoint already existed (or was refreshed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationEndpointResult' }
        '201':
          description: The endpoint was created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationEndpointResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: The surface is switched off (NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationError' }
        '409':
          description: >-
            PROOF_KIND_UNAVAILABLE, ADDRESS_KIND_NOT_DERIVABLE, PROOF_NOT_FOUND, PROOF_AMBIGUOUS, SCOPE_UNPROVEN,
            ADDRESS_UNUSABLE, NOT_ACTIVE_MEMBER, ADDRESS_ALREADY_BOUND (an endpoint of another organization and user
            holds this address in this tenant) or ADDRESS_BOUND_ON_OTHER_CONNECTION (the caller's own endpoint on
            another connection of the tenant holds it)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationError' }
        '422':
          description: INVALID_REQUEST with the names of the offending fields, or ORG_MISSING
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationError' }
        '500':
          description: Fixed-sentence failure (INTERNAL)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationError' }
        '503':
          description: NOTIFICATION_BUSY (a lock wait, deadlock or cancelled statement); retry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationError' }
  /api/me/notification-endpoints/{id}:
    delete:
      summary: Revoke one of the caller's endpoints
      description: >-
        Idempotent. The preferences that refer to the endpoint are cleared in the same transaction: a revoked
        primary is replaced by the backup when there is one. The preference's `enabled` is never changed. An
        endpoint of another user, of another organization and an unknown id are the same 404.
      operationId: revokeMyNotificationEndpoint
      security: [ { bearerAuth: [] } ]
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: The endpoint is revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationEndpointRevoked' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: The surface is switched off, or no such endpoint of the caller (NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationError' }
        '422':
          description: ORG_MISSING
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationError' }
        '500':
          description: Fixed-sentence failure (INTERNAL)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationError' }
        '503':
          description: NOTIFICATION_BUSY; retry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationError' }
  /api/me/notification-preferences:
    get:
      summary: Show the caller's preference for each topic and whether it takes effect now
      description: >-
        One entry per topic. `applies` says whether the preference is in force at this moment and why not;
        a topic that is not connected to sending shows topic_not_integrated. Answers 404 while
        USER_NOTIFICATION_PREFERENCES_ENABLED is not the exact string true.
      operationId: listMyNotificationPreferences
      security: [ { bearerAuth: [] } ]
      responses:
        '200':
          description: The preference of each topic
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferenceList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: The surface is switched off, or the session has no organization (NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationError' }
        '500':
          description: Fixed-sentence failure (INTERNAL)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationError' }
    patch:
      summary: Change the caller's preference for one topic
      description: >-
        Applied only if the stored revision equals expectedRevision. The endpoints must be the caller's own,
        active, of a provider the topic routes; an endpoint of another user, of another organization and an
        unknown id are the same 409 ENDPOINT_NOT_USABLE. A backup of the primary's provider is refused
        (FALLBACK_PROVIDER_NOT_ALLOWED). Quiet hours suppress a reminder that falls due inside the window;
        they do not delay it. Nothing is sent.
      operationId: patchMyNotificationPreference
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationPreferencePatch' }
      responses:
        '200':
          description: The topic view after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationTopicView' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: The surface is switched off (NOT_FOUND)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationError' }
        '409':
          description: >-
            PREFERENCE_STALE (with currentRevision), ENDPOINT_NOT_USABLE (with reason), ENDPOINT_NOT_ALLOWED_FOR_TOPIC
            or FALLBACK_PROVIDER_NOT_ALLOWED
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationError' }
        '422':
          description: INVALID_REQUEST with the names of the offending fields (a topic outside the closed set is one), or ORG_MISSING
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationError' }
        '500':
          description: Fixed-sentence failure (INTERNAL)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationError' }
        '503':
          description: NOTIFICATION_BUSY; retry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationError' }
