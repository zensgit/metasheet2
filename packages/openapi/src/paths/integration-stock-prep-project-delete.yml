paths:
  /api/integration/stock-preparation/project-delete/access:
    get:
      operationId: getStockPreparationProjectDeleteAccess
      summary: Check the current tenant's project cleanup permission
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Whether the current administrator may request a cleanup preview
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    required: [mayDelete]
                    properties:
                      mayDelete: { type: boolean }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { description: Cleanup authority unavailable }
  /api/integration/stock-preparation/projects/{projectNo}/delete/preview:
    post:
      operationId: previewStockPreparationProjectDelete
      summary: Preview local cleanup of one project and issue a five-minute verification code
      description: Requires a verified tenant on the authenticated principal, active membership in that tenant, and live platform administrator authority. The preview includes both trial and production rows.
      security: [{ bearerAuth: [] }]
      parameters: &projectNo
        - in: path
          name: projectNo
          required: true
          schema: { type: string, maxLength: 80 }
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '200':
          description: Project impact and one-time challenge
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    required: [tenantId, projectNo, tables, counts, challengeId, verificationCode, expiresAt]
                    properties:
                      tenantId: { type: string }
                      projectNo: { type: string }
                      tables:
                        type: array
                        items:
                          type: object
                          required: [sheetId, name, kind, rowCount]
                          properties:
                            sheetId: { type: string }
                            name: { type: string }
                            kind: { type: string, enum: [dedicated, shared] }
                            rowCount: { type: integer, minimum: 0 }
                      counts: &counts
                        type: object
                        additionalProperties: { type: integer, minimum: 0 }
                      challengeId: { type: string, format: uuid }
                      verificationCode: { type: string }
                      expiresAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Feature disabled or project absent }
        '409': { description: Concurrent work or ambiguous ownership }
        '422': { description: Invalid request }
        '503': { description: Cleanup authority unavailable }
  /api/integration/stock-preparation/projects/{projectNo}/delete/confirm:
    post:
      operationId: confirmStockPreparationProjectDelete
      summary: Confirm permanent cleanup of all stock-preparation data for one project
      description: Rechecks the verified tenant, membership and live administrator authority before applying the one-time challenge.
      security: [{ bearerAuth: [] }]
      parameters: *projectNo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [challengeId, code]
              properties:
                challengeId: { type: string, format: uuid }
                code: { type: string }
      responses:
        '200':
          description: Committed cleanup and audit reference
          content:
            application/json:
              schema:
                type: object
                required: [ok, data]
                properties:
                  ok: { type: boolean }
                  data:
                    type: object
                    required: [tenantId, projectNo, counts, auditId]
                    properties:
                      tenantId: { type: string }
                      projectNo: { type: string }
                      counts: *counts
                      auditId: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Feature disabled }
        '409': { description: Invalid or expired verification, stale preview, concurrent work or ambiguous ownership }
        '422': { description: Invalid request }
        '503': { description: Cleanup authority unavailable }
