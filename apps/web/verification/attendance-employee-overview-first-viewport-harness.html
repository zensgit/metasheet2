<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Attendance employee overview first viewport — browser verification</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        color: #333;
        background-color: #f4f6fa;
      }
      #app, .harness-app {
        min-height: 100%;
        display: flex;
        flex-direction: column;
      }
      .app-nav {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 20px;
        height: 50px;
        background: #fff;
        border-bottom: 1px solid #e0e0e0;
        box-sizing: border-box;
      }
      .brand-text {
        font-size: 18px;
        font-weight: 600;
        color: var(--ms-color-primary, #2563eb);
      }
      .nav-link { color: #666; }
      .app-main { flex: 1; min-width: 0; }
      .attendance-shell {
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .attendance-shell__tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 0 20px;
        padding-top: 14px;
      }
      .attendance-shell__tab {
        border: none;
        background: transparent;
        color: #646a73;
        border-radius: 999px;
        padding: 6px 14px;
      }
      .attendance-shell__tab--active {
        color: #1f2329;
        background: #fff;
        box-shadow: 0 1px 4px rgba(31, 45, 82, 0.08);
      }
      .attendance {
        display: flex;
        flex-direction: column;
        gap: 24px;
        padding: 24px;
        color: #2b2b2b;
        box-sizing: border-box;
        min-width: 0;
      }
      .attendance--overview {
        gap: 16px;
        padding: 16px 20px 24px;
        background-color: #f4f6fa;
        background-image: radial-gradient(ellipse 80% 46% at 50% -8%, rgba(51, 112, 255, 0.12), transparent 58%);
      }
      .attendance__header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }
      .attendance__header-copy { min-width: 0; flex: 1 1 auto; }
      .attendance__header-aside {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        flex: 0 1 auto;
        min-width: 0;
      }
      .attendance__title {
        font-size: 18px;
        line-height: 1.25;
        margin: 0 0 2px;
      }
      .attendance__subtitle {
        margin: 0;
        color: #666;
        font-size: 12px;
        line-height: 1.35;
      }
      .harness-state-row {
        position: fixed;
        right: 12px;
        bottom: 12px;
        z-index: 4;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        max-width: calc(100vw - 24px);
      }
      .harness-state-row__btn {
        border: 1px solid #d1d5db;
        background: #fff;
        border-radius: 6px;
        padding: 4px 8px;
        font-size: 12px;
      }
      .harness-state-row__btn--active {
        border-color: #2563eb;
        color: #2563eb;
      }
      @media (max-width: 768px) {
        .app-nav {
          height: auto;
          flex-wrap: wrap;
          padding: 12px 16px;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./attendance-employee-overview-first-viewport-harness.ts"></script>
  </body>
</html>
