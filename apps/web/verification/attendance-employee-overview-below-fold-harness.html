<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Attendance employee overview below-fold — browser verification</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        color: #333;
        background-color: #f4f6fa;
      }
      #app, .harness-app {
        min-height: 100%;
        display: flex;
        flex-direction: column;
      }
      .app-nav {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 20px;
        height: 50px;
        background: #fff;
        border-bottom: 1px solid #e0e0e0;
        box-sizing: border-box;
      }
      .brand-text { font-size: 18px; font-weight: 600; color: var(--ms-color-primary, #2563eb); }
      .app-main { flex: 1; min-width: 0; }
      .attendance-shell { display: flex; flex-direction: column; gap: 14px; }
      .attendance-shell__tabs {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        padding: 14px 20px 0;
      }
      .attendance-shell__tab {
        border: none;
        background: transparent;
        color: #646a73;
        border-radius: 999px;
        padding: 6px 14px;
      }
      .attendance-shell__tab--active {
        color: #1f2329;
        background: #fff;
        box-shadow: 0 1px 4px rgba(31, 45, 82, 0.08);
      }
      .attendance {
        display: flex;
        flex-direction: column;
        gap: 16px;
        padding: 16px 20px 24px;
        color: #2b2b2b;
        box-sizing: border-box;
        min-width: 0;
      }
      .attendance--overview {
        background-color: #f4f6fa;
      }
      .attendance__field {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 12px;
        color: #555;
      }
      /* Competing parent rule — this is what overflowed slotted date inputs at 390px. */
      .attendance__field input,
      .attendance__field select,
      .attendance__field textarea {
        padding: 6px 10px;
        border: 1px solid #d0d0d0;
        border-radius: 6px;
        min-width: 180px;
        box-sizing: border-box;
      }
      .attendance-ew__history-filter-control,
      .attendance-ew__history-filter-control input,
      .attendance-ew__history-filter-control select {
        min-width: 0;
        max-width: 100%;
        width: 100%;
        box-sizing: border-box;
      }
      .attendance__btn {
        padding: 8px 14px;
        border-radius: 999px;
        border: 1px solid #e5e6eb;
        background: #fff;
      }
      .attendance__card {
        background: #fff;
        border-radius: 12px;
        padding: 16px;
        box-sizing: border-box;
        min-width: 0;
        max-width: 100%;
      }
      .attendance__details-summary { cursor: pointer; font-weight: 600; }
      @media (max-width: 768px) {
        .app-nav { height: auto; flex-wrap: wrap; padding: 12px 16px; }
        .attendance { padding: 16px; }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./attendance-employee-overview-below-fold-harness.ts"></script>
  </body>
</html>
