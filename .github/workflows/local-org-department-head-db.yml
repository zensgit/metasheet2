name: Native local organization department-head real-DB acceptance

# Whole native file; paired no-DB exclusion prevents conditional skip-shaped green.
# Isolated synthetic PostgreSQL only. No provider IO or deployment.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/core-backend/src/directory/local-directory-department-head.ts'
      - 'packages/core-backend/src/services/ApprovalDirectoryOrg.ts'
      - 'packages/core-backend/src/routes/admin-directory-local.ts'
      - 'packages/core-backend/src/db/migrations/zzzz20261027090000_add_local_department_head.ts'
      - 'packages/core-backend/tests/integration/local-org-department-head.db.test.ts'
      - 'packages/core-backend/tests/unit/local-org-department-head-ci-contract.test.ts'
      - 'packages/core-backend/vitest.config.ts'
      - '.github/workflows/local-org-department-head-db.yml'
      - 'packages/core-backend/src/directory/local-directory-org.ts'
      - 'packages/core-backend/src/directory/directory-sync.ts'
      - 'packages/core-backend/src/services/ApprovalProductService.ts'
  push:
    branches: [main]
    paths:
      - 'packages/core-backend/src/directory/local-directory-department-head.ts'
      - 'packages/core-backend/src/services/ApprovalDirectoryOrg.ts'
      - 'packages/core-backend/src/routes/admin-directory-local.ts'
      - 'packages/core-backend/src/db/migrations/zzzz20261027090000_add_local_department_head.ts'
      - 'packages/core-backend/tests/integration/local-org-department-head.db.test.ts'
      - 'packages/core-backend/tests/unit/local-org-department-head-ci-contract.test.ts'
      - 'packages/core-backend/vitest.config.ts'
      - '.github/workflows/local-org-department-head-db.yml'
      - 'packages/core-backend/src/directory/local-directory-org.ts'
      - 'packages/core-backend/src/directory/directory-sync.ts'
      - 'packages/core-backend/src/services/ApprovalProductService.ts'

permissions:
  contents: read

jobs:
  local-org-department-head-db:
    name: local-org-department-head-db
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metasheet_local_org_head
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d metasheet_local_org_head"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/metasheet_local_org_head
      # Arms the suite's top-level sentinel: in THIS lane a missing DATABASE_URL is a red run,
      # never a silent skipped-green.
      EXPECT_DB: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Use empty npmrc for pnpm
        run: |
          echo "" > /tmp/empty-npmrc
          echo "NPM_CONFIG_USERCONFIG=/tmp/empty-npmrc" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run DB migrations
        env:
          # Same per-PR-gate exclusion list as plugin-tests.yml's "Run DB migrations" step
          # (see packages/core-backend/MIGRATION_EXCLUDE_TRACKING.md) — this lane provisions the
          # identical schema the approval real-DB steps run against.
          MIGRATION_EXCLUDE: 008_plugin_infrastructure.sql,048_create_event_bus_tables.sql,049_create_bpmn_workflow_tables.sql,042a_core_model_views.sql,20250924140000_create_gantt_tables.ts,20250925_create_view_tables.sql
        run: pnpm --filter @metasheet/core-backend db:migrate

      - name: Run native local department-head acceptance (whole file)
        # WHOLE FILE, --reporter=verbose: a name filter matching zero tests would exit green and
        # hide regressions; verbose prints every collected test so an empty collection shows in
        # the log.
        run: >-
          pnpm --filter @metasheet/core-backend exec vitest
          --config vitest.integration.config.ts run
          tests/integration/local-org-department-head.db.test.ts
          --reporter=verbose

      - name: Values-free evidence (this job)
        run: |
          {
            echo "evidenceKind=CONTROLLED_SYNTHETIC_FUNCTIONAL"
            echo "suites=local-org-department-head.db.test.ts"
            echo "scope=local department-head role, scoped admin writes, native approval snapshots"
            echo "sentinelArmed=EXPECT_DB=1"
            echo "customerSourceAccess=NOT_INVOLVED"
            echo "flagChanged=false"
            echo "externalWrite=false"
          } | tee -a "$GITHUB_STEP_SUMMARY"
