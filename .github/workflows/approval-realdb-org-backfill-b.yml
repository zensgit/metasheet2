name: Approval real-DB acceptance (S1 Migration B — org_id backfill)

# EVIDENCE LANE for the Lock-10 (S1) Migration B suite, EXTENDED at the Lock-11 §10 D-8(β)
# revision to also cover the companion provisioning migration:
#   - tests/integration/approval-instance-org-backfill-b.db.test.ts — the ordered class-2/class-3
#     backfill over the residual NULL population left by Phase 1
#     (zzzz20260821100000_add_approval_instance_org_id.ts), prefix-guarded (plm:/afs: excluded from
#     every UPDATE and from the class-6 terminal census), cross-class FAIL-LOUD (class-2 conflict
#     abort + revised class-6 terminal abort/STAMP, both values-free), idempotent replay, the lane
#     guards (user_orgs / approval_attachments absent) that keep the backfill CI-safe on an empty
#     DB, AND — since the D-8(β) revision — zzzz20260823050000_provision_zero_membership_active_users.ts
#     (the (i)-guarded single-org provisioning step that runs BEFORE this backfill), its own
#     ON CONFLICT non-resurrection, idempotence, missing-table guards, and the composed
#     provisioning-then-backfill ordering/class-attribution end to end.
# The org pin (APPROVAL_S1_ORG_PIN_ENABLED) ships DEFAULT OFF and is untouched by this migration or
# this lane — Migration B backfills EXISTING rows only.
# Ephemeral first-party PostgreSQL container; no customer source, no deployment, no flag change.
#
# WHY A STANDALONE FILE, not a plugin-tests.yml allowlist entry: plugin-tests.yml is an s6a
# sha256-pinned provenance input (sealed-export-package-provenance.cjs PINNED_EVIDENCE_FILES), so
# every edit forces an s6a re-pin and a merge-serialisation race. This mirrors the sibling
# approval-realdb-instance-readability-s1.yml / approval-realdb-history-guard.yml /
# approval-realdb-node-operation-policy.yml lanes and the sealed-export-s6a-authority-row-lock.yml
# precedent they cite. plugin-tests.yml is left byte-identical.
#
# TWO-POINT WIRING (the other half): the suite is excluded from the no-DB default vitest config
# (packages/core-backend/vitest.config.ts) in the SAME commit that adds this file, so the required
# `test (18.x/20.x)` job no longer collect-and-skip-greens it. This workflow is where the suite
# actually EXECUTES, with EXPECT_DB=1 arming the suite's top-level anti-skip-green sentinel: a run
# in this lane with a missing/broken DATABASE_URL goes RED instead of silently reporting the whole
# file as skipped.

on:
  workflow_dispatch:
  # NO `merge_group:` — deliberately, matching the sibling approval-realdb-* evidence lanes (see
  # approval-realdb-history-guard.yml's comment for the full rationale: a `merge_group` event does
  # not honour the `paths` filter the way `pull_request` does, so declaring it would spin up this
  # PostgreSQL job for every merge group regardless of relevance).
  pull_request:
    # No `branches:` filter (mirrors the sibling approval-realdb-* precedents): a brand-new
    # workflow cannot be workflow_dispatch-ed until it has run once via a trigger it responds to.
    # The `paths` filter keeps it off unrelated PRs.
    paths:
      - 'packages/core-backend/tests/integration/approval-instance-org-backfill-b.db.test.ts'
      - 'packages/core-backend/src/db/migrations/zzzz20260823040000_recovery09_prepare_legacy_default_org.ts'
      - 'packages/core-backend/src/db/migrations/zzzz20260823050000_provision_zero_membership_active_users.ts'
      - 'packages/core-backend/src/db/migrations/zzzz20260823100000_backfill_approval_instance_org_id.ts'
      - 'packages/core-backend/src/db/migrations/zzzz20260821100000_add_approval_instance_org_id.ts'
      - 'packages/core-backend/vitest.config.ts'
      - '.github/workflows/approval-realdb-org-backfill-b.yml'
  push:
    branches: [main]
    paths:
      - 'packages/core-backend/tests/integration/approval-instance-org-backfill-b.db.test.ts'
      - 'packages/core-backend/src/db/migrations/zzzz20260823040000_recovery09_prepare_legacy_default_org.ts'
      - 'packages/core-backend/src/db/migrations/zzzz20260823050000_provision_zero_membership_active_users.ts'
      - 'packages/core-backend/src/db/migrations/zzzz20260823100000_backfill_approval_instance_org_id.ts'
      - 'packages/core-backend/src/db/migrations/zzzz20260821100000_add_approval_instance_org_id.ts'
      - 'packages/core-backend/vitest.config.ts'
      - '.github/workflows/approval-realdb-org-backfill-b.yml'

permissions:
  contents: read

jobs:
  approval-realdb-org-backfill-b:
    name: approval-realdb-org-backfill-b
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metasheet_approval_realdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d metasheet_approval_realdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/metasheet_approval_realdb
      # Arms the suite's top-level sentinel: in THIS lane a missing DATABASE_URL is a red run,
      # never a silent skipped-green.
      EXPECT_DB: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Use empty npmrc for pnpm
        run: |
          echo "" > /tmp/empty-npmrc
          echo "NPM_CONFIG_USERCONFIG=/tmp/empty-npmrc" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run DB migrations
        env:
          # Same per-PR-gate exclusion list as plugin-tests.yml's "Run DB migrations" step
          # (see packages/core-backend/MIGRATION_EXCLUDE_TRACKING.md) — this lane provisions the
          # identical schema the approval real-DB steps run against, INCLUDING this PR's
          # zzzz20260823100000_backfill_approval_instance_org_id.ts migration.
          MIGRATION_EXCLUDE: 008_plugin_infrastructure.sql,048_create_event_bus_tables.sql,049_create_bpmn_workflow_tables.sql,042a_core_model_views.sql,20250924140000_create_gantt_tables.ts,20250925_create_view_tables.sql
        run: pnpm --filter @metasheet/core-backend db:migrate

      - name: Run Migration B real-DB acceptance (whole file)
        # WHOLE FILE, --reporter=verbose: a name filter matching zero tests would exit green and
        # hide regressions; verbose prints every collected test so an empty collection shows in
        # the log.
        run: >-
          pnpm --filter @metasheet/core-backend exec vitest
          --config vitest.integration.config.ts run
          tests/integration/approval-instance-org-backfill-b.db.test.ts
          --reporter=verbose

      - name: Values-free evidence (this job)
        run: |
          {
            echo "evidenceKind=CONTROLLED_SYNTHETIC_FUNCTIONAL"
            echo "suites=approval-instance-org-backfill-b.db.test.ts"
            echo "scope=Lock-10 (S1) Migration B — ordered org_id backfill (classes 2/3), prefix-guarded, FAIL-LOUD (class-2 conflict + class-6 terminal), idempotent, lane-guarded"
            echo "sentinelArmed=EXPECT_DB=1"
            echo "customerSourceAccess=NOT_INVOLVED"
            echo "flagChanged=false"
            echo "externalWrite=false"
          } | tee -a "$GITHUB_STEP_SUMMARY"
