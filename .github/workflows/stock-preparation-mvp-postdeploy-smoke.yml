name: Stock Preparation MVP Postdeploy Smoke

# Stock-preparation MVP (#3751) — post-deploy E2E smoke lane over the W2..W5b HTTP surface.
# Values-free by construction: the smoke script prints only statuses/booleans/counts/modes/coarse codes
# and leak-scans every response against its own fixture sentinels (#3600 discipline).
# DISPATCH-ONLY: deliberately NOT chained to the deploy workflow (same posture as the read/composition
# postdeploy smoke lanes). The fixture is self-contained — no external system id / sample key needed.
# Mirrors the composition postdeploy smoke lane (same token resolver, secrets, and vars).

# P2-1 (#4038 review): the smoke's candidate-id attribution and tenant-level cleanup assume SERIAL
# runs — enforce it with a fixed concurrency group. cancel-in-progress stays false so a second
# dispatch QUEUES behind the running one instead of killing it mid-chain (a cancelled run would leave
# active smoke rows behind).
concurrency:
  group: stock-preparation-mvp-postdeploy-smoke
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployed backend base URL (defaults to repo var / entity host)
        required: false
      tenant_id:
        description: Tenant scope (defaults to repo var)
        required: false
      workspace_id:
        description: Workspace scope (optional)
        required: false
      project_prefix:
        description: Business-project prefix for the salted smoke fixture
        required: false
        default: stockprep-smoke
      timeout_ms:
        description: Per-request timeout in ms
        required: false
        default: '15000'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Resolve smoke token
        id: token
        env:
          METASHEET_K3WISE_SMOKE_TOKEN_SECRET: ${{ secrets.METASHEET_K3WISE_SMOKE_TOKEN }}
          K3_WISE_TOKEN_RESOLVE_REQUIRED: 'true'
          K3_WISE_TOKEN_AUTO_DISCOVER_TENANT: ${{ vars.K3_WISE_TOKEN_AUTO_DISCOVER_TENANT || 'false' }}
          METASHEET_TENANT_ID: ${{ github.event.inputs.tenant_id || vars.METASHEET_TENANT_ID || '' }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_COMPOSE_FILE: ${{ secrets.DEPLOY_COMPOSE_FILE }}
        run: |
          set -euo pipefail
          scripts/ops/resolve-k3wise-smoke-token.sh

      - name: Run stock-preparation MVP postdeploy smoke
        id: smoke
        env:
          METASHEET_BASE_URL: ${{ github.event.inputs.base_url || vars.METASHEET_BASE_URL || vars.PUBLIC_APP_URL || 'http://23.254.236.11:8081' }}
          METASHEET_TENANT_ID: ${{ github.event.inputs.tenant_id || vars.METASHEET_TENANT_ID || '' }}
          METASHEET_WORKSPACE_ID: ${{ github.event.inputs.workspace_id || '' }}
          SMOKE_PROJECT_PREFIX: ${{ github.event.inputs.project_prefix || 'stockprep-smoke' }}
          TIMEOUT_MS: ${{ github.event.inputs.timeout_ms || '15000' }}
        run: |
          set -euo pipefail
          out_dir="output/stock-preparation-mvp-postdeploy-smoke/manual"
          rm -rf "$out_dir"
          mkdir -p "$out_dir"

          args=(
            --base-url "$METASHEET_BASE_URL"
            --project-prefix "$SMOKE_PROJECT_PREFIX"
            --timeout-ms "$TIMEOUT_MS"
            --out-dir "$out_dir"
          )
          if [[ -n "${METASHEET_TENANT_ID:-}" ]]; then args+=(--tenant-id "$METASHEET_TENANT_ID"); fi
          if [[ -n "${METASHEET_WORKSPACE_ID:-}" ]]; then args+=(--workspace-id "$METASHEET_WORKSPACE_ID"); fi
          if [[ -n "${K3_WISE_SMOKE_TOKEN:-}" ]]; then
            export METASHEET_AUTH_TOKEN="$K3_WISE_SMOKE_TOKEN"
          fi

          node scripts/ops/stock-preparation-mvp-postdeploy-smoke.mjs "${args[@]}"

      - name: Write summary
        if: always()
        run: |
          set -euo pipefail
          echo "## Stock Preparation MVP Postdeploy Smoke" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat output/stock-preparation-mvp-postdeploy-smoke/manual/summary.txt 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || echo "no summary produced" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-preparation-mvp-postdeploy-smoke
          path: output/stock-preparation-mvp-postdeploy-smoke/manual
          if-no-files-found: ignore
