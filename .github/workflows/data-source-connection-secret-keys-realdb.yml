name: Data-source connection secret-keys gate (real DB)

# EVIDENCE LANE for the #5621 `connection` secret-key gate on data sources:
#   - packages/core-backend/tests/integration/data-source-connection-secret-keys-realdb.test.ts
#     A real express app + the real `dataSourcesRouter` + the real `DataSourceManager` bound to an
#     ephemeral first-party PostgreSQL `data_sources` table (persistence is NOT faked). Four cases:
#     a create carrying `connection.password` is refused with DATA_SOURCE_CONNECTION_SECRET_REJECTED
#     and the refusal is asserted by `data_sources` ROW COUNT = 0 for that id (not "the response
#     looked like an error"); the SUPPORTED shape still lands 201, with `config->'connection'`
#     holding no `password` key and `config->'credentials'->>'password'` carrying the `enc:` prefix;
#     a LEGACY row seeded straight into the table has its stored secret stripped from
#     `GET /api/data-sources/:id` while the ROW STILL HOLDS IT (scope pin: this cut changes the ECHO
#     only, removing stored plaintext is the migration ticket); and the inventory SQL from
#     docs/development/data-source-connection-secret-keys-design-20260912.md runs verbatim on the
#     shipped schema, counting rows without ever selecting a secret value.
# Ephemeral first-party PostgreSQL container; no customer source, no deployment, no flag change.
#
# WHY A STANDALONE FILE, not a plugin-tests.yml allowlist entry: plugin-tests.yml is an s6a
# sha256-pinned provenance input, so every edit forces an s6a re-pin and a merge-serialisation race.
# This mirrors the approval-realdb-* evidence lanes and the precedent they cite. plugin-tests.yml is
# left byte-identical by this PR.
#
# TWO-POINT WIRING (the other half): the suite is excluded from the no-DB default vitest config
# (packages/core-backend/vitest.config.ts) in the SAME commit that adds this file, so the required
# `test (18.x/20.x)` job cannot collect-and-skip-green it. EXPECT_DB=1 below arms the suite's
# top-level anti-skip-green sentinel: a run in this lane with a missing/broken DATABASE_URL goes RED
# instead of silently reporting the whole file as skipped.
#
# The no-DB half of the same matrix (fake Kysely, same real router, plus the pure-function legs for
# the shared word list) runs on every PR inside the required core-backend unit job as
# tests/unit/data-source-connection-secret-keys.test.ts — it is NOT gated on this lane.

on:
  workflow_dispatch:
  # NO `merge_group:` — matching the sibling real-DB evidence lanes: a `merge_group` event does not
  # honour the `paths` filter the way `pull_request` does, so declaring it would spin up this
  # PostgreSQL job for every merge group regardless of relevance.
  pull_request:
    # No `branches:` filter (mirrors the sibling precedents): a brand-new workflow cannot be
    # workflow_dispatch-ed until it has run once via a trigger it responds to. The `paths` filter
    # keeps it off unrelated PRs.
    paths:
      - 'packages/core-backend/src/data-adapters/data-source-secret-keys.ts'
      - 'packages/core-backend/src/data-adapters/BaseAdapter.ts'
      - 'packages/core-backend/src/data-adapters/DataSourceManager.ts'
      - 'packages/core-backend/src/routes/data-sources.ts'
      - 'packages/core-backend/tests/integration/data-source-connection-secret-keys-realdb.test.ts'
      - 'packages/core-backend/vitest.config.ts'
      - '.github/workflows/data-source-connection-secret-keys-realdb.yml'
  push:
    branches: [main]
    paths:
      - 'packages/core-backend/src/data-adapters/data-source-secret-keys.ts'
      - 'packages/core-backend/src/data-adapters/BaseAdapter.ts'
      - 'packages/core-backend/src/data-adapters/DataSourceManager.ts'
      - 'packages/core-backend/src/routes/data-sources.ts'
      - 'packages/core-backend/tests/integration/data-source-connection-secret-keys-realdb.test.ts'
      - 'packages/core-backend/vitest.config.ts'
      - '.github/workflows/data-source-connection-secret-keys-realdb.yml'

permissions:
  contents: read

jobs:
  data-source-connection-secret-keys-realdb:
    name: data-source-connection-secret-keys-realdb
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metasheet_ds_secret_keys
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d metasheet_ds_secret_keys"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/metasheet_ds_secret_keys
      # Arms the suite's top-level sentinel: in THIS lane a missing DATABASE_URL is a red run, never
      # a silent skipped-green.
      EXPECT_DB: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Use empty npmrc for pnpm
        run: |
          echo "" > /tmp/empty-npmrc
          echo "NPM_CONFIG_USERCONFIG=/tmp/empty-npmrc" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run DB migrations
        env:
          # Same per-PR-gate exclusion list as plugin-tests.yml's "Run DB migrations" step
          # (see packages/core-backend/MIGRATION_EXCLUDE_TRACKING.md).
          MIGRATION_EXCLUDE: 008_plugin_infrastructure.sql,048_create_event_bus_tables.sql,049_create_bpmn_workflow_tables.sql,042a_core_model_views.sql,20250924140000_create_gantt_tables.ts,20250925_create_view_tables.sql
        run: pnpm --filter @metasheet/core-backend db:migrate

      - name: Run data-source connection secret-keys real-DB goldens (whole file)
        # WHOLE FILE, --reporter=verbose: a name filter matching zero tests would exit green and hide
        # regressions; verbose prints every collected test so an empty collection shows in the log.
        run: >-
          pnpm --filter @metasheet/core-backend exec vitest
          --config vitest.integration.config.ts run
          tests/integration/data-source-connection-secret-keys-realdb.test.ts
          --reporter=verbose

      - name: Values-free evidence (this job)
        run: |
          {
            echo "evidenceKind=CONTROLLED_SYNTHETIC_FUNCTIONAL"
            echo "suites=data-source-connection-secret-keys-realdb.test.ts"
            echo "scope=connection secret-key write refusal proven by data_sources ROW COUNT zero for the refused id; supported shape lands with no password key under config->connection and an enc:-prefixed credentials password; legacy row stripped from GET /:id while the stored row keeps the value; the design-doc inventory SQL runs on the shipped schema and returns counts only"
            echo "sentinelArmed=EXPECT_DB=1"
            echo "customerSourceAccess=NOT_INVOLVED"
            echo "flagChanged=false"
            echo "externalWrite=false"
          } | tee -a "$GITHUB_STEP_SUMMARY"
