            echo "evidenceKind=CONTROLLED_SYNTHETIC_FUNCTIONAL"
            echo "suites=approval-cancel-round-attendance-fk-migration.db.test.ts"
            echo "scope=WI-3 Q1c package (§14.3 #10/#11) — the migration's own preflight guard (dangling reference aborts before any constraint exists), the two atr_* CHECK constraints discriminated by .constraint name (atr_instance_key_pair, atr_not_cancel_round — both share SQLSTATE 23514), #11's outcome-level dependency-on-#10 claim (the row never lands), and a source-text sweep pairing approval_instance_id with approval_workflow_key at each of the five known production writer sites in index.cjs. Runs against throwaway CREATE DATABASE scratch databases it provisions itself, not the shared migrated public schema"
            echo "notCovered=WI-0 lock-order census, WI-4 creation, WI-7/8 outlet/seat guards, WI-12/13/14 redemption — separate sibling files/jobs; attendance-parity (blocked on WI-10/11, themselves blocked on WI-0's Q-B/Q-C closing — not attempted on this branch)"
            echo "sentinelArmed=EXPECT_DB=1"
            echo "customerSourceAccess=NOT_INVOLVED"
            echo "flagChanged=false"
            echo "externalWrite=false"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  approval-cancel-round-outlet-guards:
    name: approval-cancel-round-outlet-guards (§14.3 #2, #4/#6)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metasheet_approval_realdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d metasheet_approval_realdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/metasheet_approval_realdb
      # Arms the suite's top-level sentinel: in THIS lane a missing DATABASE_URL is a red run,
      # never a silent skipped-green.
      EXPECT_DB: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Use empty npmrc for pnpm
        run: |
          echo "" > /tmp/empty-npmrc
          echo "NPM_CONFIG_USERCONFIG=/tmp/empty-npmrc" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run DB migrations
        env:
          # Same per-PR-gate exclusion list as plugin-tests.yml's "Run DB migrations" step
          # (see packages/core-backend/MIGRATION_EXCLUDE_TRACKING.md) — this lane provisions the
          # identical schema the approval real-DB steps run against.
          MIGRATION_EXCLUDE: 008_plugin_infrastructure.sql,048_create_event_bus_tables.sql,049_create_bpmn_workflow_tables.sql,042a_core_model_views.sql,20250924140000_create_gantt_tables.ts,20250925_create_view_tables.sql
        run: pnpm --filter @metasheet/core-backend db:migrate

      - name: Run §14.3 outlets #2/#4/#6 outlet-guard acceptance (whole file)
        # WHOLE FILE, --reporter=verbose: a name filter matching zero tests would exit green and
        # hide regressions; verbose prints every collected test so an empty collection shows in
        # the log.
        run: >-
          pnpm --filter @metasheet/core-backend exec vitest
          --config vitest.integration.config.ts run
          tests/integration/approval-cancel-round-outlet-guards.db.test.ts
          --reporter=verbose

      - name: Values-free evidence (this job)
        run: |
          {
            echo "evidenceKind=CONTROLLED_SYNTHETIC_FUNCTIONAL"
            echo "suites=approval-cancel-round-outlet-guards.db.test.ts"
            echo "scope=§14.3 outlet #2 (adminJump -> rejectIfCancelRound) and #4/#6 (dispatchAction's single action-judgment call site, assertCancelRoundActionAllowed -> handle/return rejected, comment allowed) — both throw CancelRoundOutletForbiddenError (409 CANCEL_ROUND_OUTLET_FORBIDDEN) in-process before any DML; each paired with a positive control on the SAME method against an ordinary (non-cancel-round) instance (a genuine downstream admin-jump for #2, a genuine comment action for #4/#6)"
            echo "notCovered=#3 (applyNodeTimeoutEffect, a two-part oracle needing an env-flag-gated scanner call), #7/#7'/#8 (legacy routes + Bridge dispatch — the 409 must survive route-catch translation, a different oracle), #12/#13 (seat-write chokepoints — separate seat-guards file), attendance-parity, attendance-FK-migration — separate sibling files/jobs per the taskbook split; redemption 判据 II/IV still not covered (depend on WI-10/11/12)"
            echo "sentinelArmed=EXPECT_DB=1"
            echo "customerSourceAccess=NOT_INVOLVED"
            echo "flagChanged=false"
            echo "externalWrite=false"
          } | tee -a "$GITHUB_STEP_SUMMARY"
