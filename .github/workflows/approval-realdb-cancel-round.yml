name: Approval real-DB acceptance (cancel-round)

# EVIDENCE LANE for the "already-approved document cancel-round" slice
# (approval-change-request-design-lock-draft-20260915.md v5.9, owner-ratified;
# impl-taskbook-C-change-request-20260918.md). This lane will grow one sibling job per landed
# `approval-cancel-round-*.db.test.ts` file as WI-0/4/6/7/8/9/12/13/16 land (taskbook §3.1 — "a
# new independent workflow file, not a job folded into approval-realdb-acceptance.yml", precisely
# so this file's own edits do not collide with that lane's).
#
# THIS COMMIT wires exactly one job: WI-0's lock-order census, Q-A slice 1
# (tests/integration/approval-cancel-round-lock-order-census.db.test.ts) — two real Postgres
# connections constructing the attendance class-`00` rollout advisory lock (real production key
# derivation, `w4c0-identity.ts`) against a real `approval_instances` row lock, in both the
# §9-4 order and a deliberately reversed order proven to deadlock deterministically (40P01).
# Ephemeral first-party PostgreSQL container; no customer source, no deployment, no flag change.
#
# WHY A STANDALONE FILE, not a plugin-tests.yml allowlist entry: plugin-tests.yml is an s6a
# sha256-pinned provenance input (sealed-export-package-provenance.cjs PINNED_EVIDENCE_FILES), so
# every edit forces an s6a re-pin and a merge-serialisation race. This mirrors the sibling
# approval-realdb-org-writer-w4-s1.yml / approval-realdb-comments.yml lanes. plugin-tests.yml is
# left byte-identical by this PR.
#
# TWO-POINT WIRING (the other half): each suite this lane runs is excluded from the no-DB default
# vitest config (packages/core-backend/vitest.config.ts) in the SAME commit that adds it here, so
# the required `test (18.x/20.x)` job no longer collect-and-skip-greens it. This workflow is where
# the suite actually EXECUTES, with EXPECT_DB=1 arming each suite's top-level anti-skip-green
# sentinel: a run in this lane with a missing/broken DATABASE_URL goes RED instead of silently
# reporting the whole file as skipped.

on:
  workflow_dispatch:
  # NO `merge_group:` — deliberately, matching the sibling approval-realdb-* evidence lanes (see
  # approval-realdb-history-guard.yml's comment for the full rationale: a `merge_group` event does
  # not honour the `paths` filter the way `pull_request` does, so declaring it would spin up this
  # PostgreSQL job for every merge group regardless of relevance).
  pull_request:
    # No `branches:` filter (mirrors the sibling approval-realdb-* precedents): a brand-new
    # workflow cannot be workflow_dispatch-ed until it has run once via a trigger it responds to.
    # The `paths` filter keeps it off unrelated PRs.
    paths:
      - 'packages/core-backend/tests/integration/approval-cancel-round-*.db.test.ts'
      - 'packages/core-backend/tests/helpers/approval-cancel-round-seed.ts'
      - 'packages/core-backend/src/attendance/w4c0-identity.ts'
      - 'packages/core-backend/src/services/ApprovalCancelRoundService.ts'
      - 'packages/core-backend/src/services/ApprovalProductService.ts'
      - 'packages/core-backend/src/services/ApprovalBridgeService.ts'
      - 'packages/core-backend/src/routes/approvals.ts'
      - 'packages/core-backend/src/attendance/w4c3b-request-operation-boundary.ts'
      - 'packages/core-backend/src/attendance/w4c3b-approved-leave-cancellation.ts'
      - 'packages/core-backend/src/db/migrations/zzzz20260918090000_create_approval_rounds.ts'
      - 'plugins/plugin-attendance/index.cjs'
      - 'packages/core-backend/tests/helpers/approval-schema-bootstrap.ts'
      - 'packages/core-backend/vitest.config.ts'
      - 'packages/core-backend/vitest.integration.config.ts'
      - '.github/workflows/approval-realdb-cancel-round.yml'
  push:
    branches: [main]
    paths:
      - 'packages/core-backend/tests/integration/approval-cancel-round-*.db.test.ts'
      - 'packages/core-backend/tests/helpers/approval-cancel-round-seed.ts'
      - 'packages/core-backend/src/attendance/w4c0-identity.ts'
      - 'packages/core-backend/src/services/ApprovalCancelRoundService.ts'
      - 'packages/core-backend/src/services/ApprovalProductService.ts'
      - 'packages/core-backend/src/services/ApprovalBridgeService.ts'
      - 'packages/core-backend/src/routes/approvals.ts'
      - 'packages/core-backend/src/attendance/w4c3b-request-operation-boundary.ts'
      - 'packages/core-backend/src/attendance/w4c3b-approved-leave-cancellation.ts'
      - 'packages/core-backend/src/db/migrations/zzzz20260918090000_create_approval_rounds.ts'
      - 'plugins/plugin-attendance/index.cjs'
      - 'packages/core-backend/tests/helpers/approval-schema-bootstrap.ts'
      - 'packages/core-backend/vitest.config.ts'
      - 'packages/core-backend/vitest.integration.config.ts'
      - '.github/workflows/approval-realdb-cancel-round.yml'

permissions:
  contents: read

jobs:
  approval-cancel-round-lock-order-census:
    name: approval-cancel-round-lock-order-census (WI-0, Q-A slice 1)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metasheet_approval_realdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d metasheet_approval_realdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/metasheet_approval_realdb
      # Arms the suite's top-level sentinel: in THIS lane a missing DATABASE_URL is a red run,
      # never a silent skipped-green.
      EXPECT_DB: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Use empty npmrc for pnpm
        run: |
          echo "" > /tmp/empty-npmrc
          echo "NPM_CONFIG_USERCONFIG=/tmp/empty-npmrc" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run DB migrations
        env:
          # Same per-PR-gate exclusion list as plugin-tests.yml's "Run DB migrations" step
          # (see packages/core-backend/MIGRATION_EXCLUDE_TRACKING.md) — this lane provisions the
          # identical schema the approval real-DB steps run against.
          MIGRATION_EXCLUDE: 008_plugin_infrastructure.sql,048_create_event_bus_tables.sql,049_create_bpmn_workflow_tables.sql,042a_core_model_views.sql,20250924140000_create_gantt_tables.ts,20250925_create_view_tables.sql
        run: pnpm --filter @metasheet/core-backend db:migrate

      - name: Run WI-0 lock-order census (Q-A, slice 1 — whole file)
        # WHOLE FILE, --reporter=verbose: a name filter matching zero tests would exit green and
        # hide regressions; verbose prints every collected test so an empty collection shows in
        # the log.
        run: >-
          pnpm --filter @metasheet/core-backend exec vitest
          --config vitest.integration.config.ts run
          tests/integration/approval-cancel-round-lock-order-census.db.test.ts
          --reporter=verbose

      - name: Values-free evidence (this job)
        run: |
          {
            echo "evidenceKind=CONTROLLED_SYNTHETIC_FUNCTIONAL"
            echo "suites=approval-cancel-round-lock-order-census.db.test.ts"
            echo "scope=WI-0 lock-order census, Q-A slice 1 only — approval_instances row lock vs. attendance class-00 rollout advisory lock (forward-order block/proceed, reversed-order deterministic 40P01, positive control)"
            echo "notCovered=Q-B (attendance_requests vs class-10/11), Q-C (record-link:row-auth vs class-00), Q-D (W7-session-lock reverse edge re-confirmation)"
            echo "sentinelArmed=EXPECT_DB=1"
            echo "customerSourceAccess=NOT_INVOLVED"
            echo "flagChanged=false"
            echo "externalWrite=false"
          } | tee -a "$GITHUB_STEP_SUMMARY"
