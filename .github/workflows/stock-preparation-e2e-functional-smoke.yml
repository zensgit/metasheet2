          MSSQL_PASSWORD: 'E2eFunc!Probe2026'
          E2E_S6A_ARM: rejection
          # Same rationale as scale-midtier above: the S10 effective row count, no `|| '3'` fallback,
          # this job only runs when scale is requested. The rejection arm's OWN row count is always
          # MAX_BUSINESS_LINES+1 regardless of the exact value here — this env var only feeds the script's
          # S6A_SCALE_REQUESTED gate (see runS6ARejectionArm's caller in main()).
          E2E_S6A_ROW_COUNT: ${{ (github.event.inputs.lab_mode == 'true' && (github.event.inputs.s6a_row_count == '' || github.event.inputs.s6a_row_count == '3')) && '24999' || (github.event.inputs.s6a_row_count || '3') }}
        run: node scripts/ops/stock-preparation-e2e-functional-smoke.mjs

      - name: Write step summary
        if: always()
        run: |
          echo "## Stock Preparation E2E Functional Smoke (R9 rejection scale arm)" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Functional testing on synthetic data only. Does NOT substitute for the #4695 controlled" >> "$GITHUB_STEP_SUMMARY"
          echo "acceptance and establishes no real-customer, external-write, or rollout claim." >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat output/stock-preparation-e2e-functional-smoke/summary.txt 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || echo "no summary produced" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Extract R9 arm evidence as job outputs (rejection arm; NOT_RUN if the field is absent)
        id: arm_outputs
        if: always()
        run: |
          # `set +e` is deliberate and load-bearing — see the SAME step in the functional-smoke job above.
          set +e
          set -u
          file="output/stock-preparation-e2e-functional-smoke/summary.txt"
          field() {
            local v
            if [[ -f "$file" ]]; then
              v=$(grep -E "^$1=" "$file" | tail -1 | cut -d= -f2-)
            else
              v=""
            fi
            if [[ -z "$v" ]]; then echo "NOT_RUN"; else echo "$v"; fi
          }
          {
            echo "row_count=$(field s6aRejectionRowCount)"
            echo "duration_ms=$(field s6aRejectionPostDurationMs)"
            echo "run=$(field s6aRejectionRun)"
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload values-free evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-preparation-e2e-functional-smoke-scale-rejection
          path: |
            output/stock-preparation-e2e-functional-smoke/summary.txt
            output/stock-preparation-e2e-functional-smoke/checks.json
          if-no-files-found: warn
          retention-days: 14

  scale-slope:
    name: R9 scale-leg slope (values-free; NOT_RUN if either data point is missing)
    # always(): this job must run — and correctly report NOT_RUN — even at the default input (where
    # scale-midtier/scale-rejection are skipped), and even if a scale job itself went red. Its own
    # plumbing self-check (see scripts/ops/stock-preparation-e2e-compute-scale-slope.mjs) is what keeps
    # THAT from silently reading as an honest NOT_RUN.
    if: always() && github.event_name == 'workflow_dispatch'
    needs: [functional-smoke, scale-midtier, scale-rejection]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Compute R9 two-point slope from job outputs (values-free; NOT_RUN if either data point is missing)
        id: slope
        env:
          # The SAME raw inputs the scale jobs' own `if:` gates use — computed independently here rather
          # than inferred from whether those jobs ran, so a gate malfunction (job ran/skipped when it
          # should not have) is DETECTABLE by comparing the two, not assumed away. Both terms are passed
          # RAW; the script re-derives "was scale requested" from them itself (S10 — a lab-mode dispatch
          # requests scale without naming a row count, so the row count alone no longer decides).
          SCALE_REQUESTED_INPUT: ${{ github.event.inputs.s6a_row_count }}
          LAB_MODE_INPUT: ${{ github.event.inputs.lab_mode }}
          # Bracket notation is required for hyphenated job ids in an expression context — dot notation on
          # `needs.scale-midtier` is not "scale" minus "midtier", it silently resolves to nothing.
          PRIMARY_JOB_RESULT: ${{ needs['functional-smoke'].result }}
          PRIMARY_ROW_COUNT: ${{ needs['functional-smoke'].outputs.primary_row_count }}
          PRIMARY_DURATION_MS: ${{ needs['functional-smoke'].outputs.primary_duration_ms }}
          PRIMARY_RUN: ${{ needs['functional-smoke'].outputs.primary_run }}
          MAX_BUSINESS_LINES: ${{ needs['functional-smoke'].outputs.max_business_lines }}
          MIDTIER_JOB_RESULT: ${{ needs['scale-midtier'].result }}
          MIDTIER_ROW_COUNT: ${{ needs['scale-midtier'].outputs.midtier_row_count }}
          MIDTIER_DURATION_MS: ${{ needs['scale-midtier'].outputs.midtier_duration_ms }}
          MIDTIER_RUN: ${{ needs['scale-midtier'].outputs.midtier_run }}
          REJECTION_JOB_RESULT: ${{ needs['scale-rejection'].result }}
          REJECTION_ROW_COUNT: ${{ needs['scale-rejection'].outputs.rejection_row_count }}
          REJECTION_DURATION_MS: ${{ needs['scale-rejection'].outputs.rejection_duration_ms }}
          REJECTION_RUN: ${{ needs['scale-rejection'].outputs.rejection_run }}
        run: node scripts/ops/stock-preparation-e2e-compute-scale-slope.mjs

      - name: Write step summary
        if: always()
        run: |
          echo "## Stock Preparation E2E — R9 scale-leg slope" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Reassembled from the functional-smoke/scale-midtier/scale-rejection jobs' own outputs —" >> "$GITHUB_STEP_SUMMARY"
          echo "see each job's own summary for that arm's full evidence. slopePlumbingCheck is about THIS" >> "$GITHUB_STEP_SUMMARY"
          echo "job's own wiring (did every job that reported success publish its duration, did the scale" >> "$GITHUB_STEP_SUMMARY"
          echo "jobs' gate skip them correctly when scale was not requested) — never about whether an" >> "$GITHUB_STEP_SUMMARY"
          echo "individual arm's S6-A walk passed, which is that arm's own job colour." >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat output/stock-preparation-e2e-scale-slope/summary.txt 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || echo "no summary produced" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload values-free evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stock-preparation-e2e-scale-slope
          path: output/stock-preparation-e2e-scale-slope/summary.txt
          if-no-files-found: warn
          retention-days: 14

  negative-control:
    name: negative control (green iff the harness can still genuinely fail)
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metasheet
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Use empty npmrc for pnpm
        run: |
          echo "" > /tmp/empty-npmrc
          echo "NPM_CONFIG_USERCONFIG=/tmp/empty-npmrc" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run migrations (plain — no sealed-export roles needed; flag stays absent in this job)
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/metasheet
        run: pnpm --filter @metasheet/core-backend run migrate

      - name: Generate CI-local ephemeral secrets (masked, never logged, scoped to this run only)
        run: |
          set -euo pipefail
          jwt_secret="$(openssl rand -hex 32)"
          enc_key="$(openssl rand -hex 32)"
          echo "::add-mask::$jwt_secret"
          echo "::add-mask::$enc_key"
          {
            echo "E2E_JWT_SECRET=$jwt_secret"
            echo "E2E_INTEGRATION_ENCRYPTION_KEY=$enc_key"
          } >> "$GITHUB_ENV"

      - name: Run negative control and assert it went RED for the RIGHT reason
        env:
          DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/metasheet
          E2E_JWT_SECRET: ${{ env.E2E_JWT_SECRET }}
          E2E_INTEGRATION_ENCRYPTION_KEY: ${{ env.E2E_INTEGRATION_ENCRYPTION_KEY }}
        run: |
          # `set +e` is deliberate and load-bearing. GitHub runs `run:` under `bash -e`, and the script
          # below is EXPECTED to exit non-zero — under `-e` the step dies on that pipeline before a single
          # assertion runs, which is exactly how the first attempt at this gate failed (run 30870041141:
          # the script emitted all-correct fields, no FATAL was printed, step still exited 1).
          # `-e` must therefore be OFF here; every failure path below is explicit and ends at `exit "$fail"`.
          # Do not "tidy" this back to `set -e`.
          set +e
          set -u
          out_file="$RUNNER_TEMP/negative-control.out"
          node scripts/ops/stock-preparation-e2e-negative-control.mjs | tee "$out_file"
          script_exit=${PIPESTATUS[0]}

          # Read a field, or the sentinel <ABSENT>. An absent field must FAIL, never silently pass:
          # a check that could not be evaluated is not a check that passed.
          field() {
            local v
            v=$(grep -E "^$1=" "$out_file" | tail -1 | cut -d= -f2-)
            if [[ -z "$v" ]]; then echo "<ABSENT>"; else echo "$v"; fi
          }
          observed=$(field negativeControlObservedConclusion)
          expected=$(field expectedConclusion)
          reached=$(field negativeControlReachedAssertion)
          recorded=$(field negativeControlChecksRecorded)
          because=$(field negativeControlRedBecause)

          fail=0
          note() { echo "FATAL: $1" >&2; fail=1; }

          # 1. The script must have exited non-zero. Necessary, NOT sufficient — a crash also does this,
          #    which is exactly why the remaining conditions exist.
          [[ "$script_exit" -ne 0 ]] || note "negative control exited 0 — the harness can no longer fail (a neutered must() does this)"
          # 2. Observed conclusion must be RED and must equal what the script itself declared it expects.
          [[ "$observed" == "RED" ]]   || note "observedConclusion=$observed (want RED)"
          [[ "$expected" == "RED" ]]   || note "expectedConclusion=$expected (want RED)"
          [[ "$observed" == "$expected" ]] || note "observed/expected diverged: $observed vs $expected"
          # 3. The assertion must actually have been reached, and exactly one must() call recorded.
          #    Guards the crash path (reached=false) and the deleted-assertion path (recorded=0).
          [[ "$reached" == "true" ]]   || note "reachedAssertion=$reached — the script died before asserting; a crash is not a working discriminator"
          [[ "$recorded" == "1" ]]     || note "checksRecorded=$recorded (want exactly 1)"
          # 4. RED for the RIGHT reason. HARNESS_ERROR is a crash; GATE_BROKEN_PROBE_RETURNED_200 is a
          #    live product bug that must surface as a product bug, not be absorbed into "harness can fail".
          [[ "$because" == "ASSERTION_FAILED_AS_INTENDED" ]] || note "redBecause=$because (want ASSERTION_FAILED_AS_INTENDED)"

          {
            echo "negativeControlScriptExit=${script_exit}"
            echo "negativeControlObservedConclusion=${observed}"
            echo "negativeControlExpectedConclusion=${expected}"
            echo "negativeControlReachedAssertion=${reached}"
            echo "negativeControlChecksRecorded=${recorded}"
            echo "negativeControlRedBecause=${because}"
            echo "negativeControlDiscriminatorIntact=$([[ $fail -eq 0 ]] && echo PASS || echo FAIL)"
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$fail"
