name: Production restore inputs evidence read-only

on:
  push:
    branches: [codex/permission-prod-readonly-20261126-a8]
    paths: ['.github/workflows/permission-prod-restore-inputs-20261126.yml']

permissions:
  contents: read

jobs:
  inspect:
    if: github.repository == 'zensgit/metasheet2' && github.actor == 'zensgit'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the read-only inventory
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify inventory integrity
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ATTEMPT" == 1 ]]
          printf '%s\n' '7ef61cb007a724c86b8b34e288ab51518d420fe3b0e553b060492214cc44b02c  scripts/ops/tmp-permission-prod-restore-inputs-20261126.sh' | sha256sum -c --strict
      - name: Inspect the production Compose project and recovery artifacts
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          tmp=$(mktemp -d)
          trap 'rm -f -- "$tmp/key" "$tmp/known_hosts" "$tmp/stdout" "$tmp/stderr"; rmdir -- "$tmp"' EXIT
          [[ "$DEPLOY_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.:-]*$ && "$DEPLOY_USER" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.-]*$ ]]
          [[ -n "$DEPLOY_KNOWN_HOSTS" && -n "$DEPLOY_SSH_KEY_B64" ]]
          printf '%s' "$DEPLOY_SSH_KEY_B64" | base64 -d > "$tmp/key"
          if ! decoded=$(printf '%s' "$DEPLOY_KNOWN_HOSTS" | base64 -d 2>/dev/null) || ! grep -Eq 'ssh-ed25519|ssh-rsa|ecdsa-sha2' <<< "$decoded"; then
            decoded=$DEPLOY_KNOWN_HOSTS
          fi
          grep -Eq 'ssh-ed25519|ssh-rsa|ecdsa-sha2' <<< "$decoded"
          printf '%s\n' "$decoded" > "$tmp/known_hosts"
          unset DEPLOY_SSH_KEY_B64 DEPLOY_KNOWN_HOSTS decoded

          rc=0
          {
            cat scripts/ops/tmp-permission-prod-restore-inputs-20261126.sh
          } | timeout 80s ssh -T -F /dev/null -o BatchMode=yes -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$tmp/known_hosts" -o GlobalKnownHostsFile=/dev/null \
              -o IdentitiesOnly=yes -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=2 \
              -i "$tmp/key" "$DEPLOY_USER@$DEPLOY_HOST" 'timeout 55s bash -s' > "$tmp/stdout" 2> "$tmp/stderr" || rc=$?

          grep -E '^(RESTORE_INPUTS_STARTED|restore_inputs=unavailable|source_postgres_version=([0-9]+\.[0-9]+(\.[0-9]+)?|unknown)|archived_search_path_shim_candidates=[0-9]+|(archive_metadata_matches|database_archive_size_matches|old_env_snapshot_hash_matches|global_roles_archive_present|bootstrap_role_recorded|old_database_ssl_explicitly_disabled|database_name_matches_old_config|appdata_expected|appdata_present|appdata_listing_present|backend_recorded_image_digest_matches|web_recorded_image_digest_matches)=(true|false))$' "$tmp/stdout" || true
          if [[ "$rc" != 0 ]]; then
            echo 'The authorized production recovery inventory did not complete'
            exit "$rc"
          fi
