name: Multitable Recovery-Flag Containment Check

# W0 recovery-posture witness (owner-directed, 2026-07-14; rung-aware 2026-08-24). The default
# `posture=inert` preserves the original containment contract: all recovery flags are inactive and all
# nine authority triggers are DISABLED. Fixed later-rung postures let the same read-only workflow prove
# an exact intentional staging/production state instead of teaching operators that a red containment
# result is "expected". Code defaults and a failing helper are never evidence about a live environment.
#
# READ-ONLY: ssh + `docker ps` + `docker exec <backend> node` flag classification + catalog-only database reads +
# `docker inspect` + `docker compose config`. No writes, no restarts, no config edits.
#
# THREE MODES (`mode` fixed choice):
#   • predeploy-flags — Leg 1 (running env) + Leg 3 (next-restart compose) FLAG checks only; Leg 2
#     (live-DB schema) is skipped. Works on the CURRENTLY deployed image, BEFORE #4654's schema helper +
#     trigger migrations exist. Distinct PASS sentinel explicitly states the schema was not verified.
#   • postdeploy-full — the above PLUS Leg 2 (schema helper: exact disabled/armed state for all 9 triggers,
#     6 function fingerprints, no meta_links.foreign_record_id FK). Requires the matching deployed image.
#   • l1-postgres-window — a fixed, staging-only, values-free PostgreSQL server-log witness for the
#     closed L1 observation window. It proves log retention with four constructed battery windows, then
#     fails if any recovery-authority marker appears outside those windows or any deadlock is observed.
#   The schema leg is gated by `if [ "$MODE" = "postdeploy-full" ]`: predeploy-flags skips it entirely, and
#   postdeploy-full cannot bypass it (that guard is the only path to the schema check).
#
# `target`, `mode`, and `posture` are fixed `choice` inputs — NEVER free text. `choice` is a UI-only
# guardrail (the REST API can still send arbitrary strings), so all three are re-validated with exact-match
# `case` statements before the ssh call. Only validated, no-space enum tokens reach the command line.
# The target → hard-coded expected-container list mapping (the real `container_name:`
# values from docker-compose.app.yml / docker-compose.app.staging.yml on origin/main: `metasheet-backend`
# for production, `metasheet-staging-backend` for staging) happens a second time, independently, INSIDE
# the remote heredoc — so no multi-word, space-containing value (e.g. `both`'s two container names) is
# ever passed as an env-assignment on the ssh command line. ssh concatenates all trailing arguments into
# one string and re-parses it through the remote login shell, so a space there previously became "run
# this as a second, bogus command" (the `both` path failed at runtime with exit 127 before this fix).
#
# Host identity is pinned: StrictHostKeyChecking=yes against a `DEPLOY_KNOWN_HOSTS`-derived known_hosts
# file (never `StrictHostKeyChecking=no` — an unauthenticated responder, e.g. a MITM or the wrong host,
# could otherwise produce a meaningless "containment PASS"). Required secrets: `DEPLOY_HOST`,
# `DEPLOY_USER`, `DEPLOY_SSH_KEY_B64` (base64-encoded private key), and `DEPLOY_KNOWN_HOSTS`
# (base64-encoded or raw known_hosts content for DEPLOY_HOST, e.g. the output of
# `ssh-keyscan -H <host>`, optionally piped through `base64`). Missing `DEPLOY_KNOWN_HOSTS` fails the job
# closed with an explicit error — it is never silently treated as "skip verification".
#
# Three verification legs, all fail-closed:
#   1. Running env: every expected container must be observed running and have its live env checked;
#      missing ANY expected container ⇒ FAIL (a substring match on some unrelated container never suffices).
#   2. Running database schema: the backend container runs the read-only, values-free schema helper.
#      The nine recovery-authority triggers must match the exact disabled/armed state declared by the
#      requested posture; their six function bodies must match exactly, and NO foreign key may cover
#      meta_links.foreign_record_id — any FK on that column fails regardless of constraint name,
#      referenced table/column, validation state, or ON DELETE action. Missing DATABASE_URL/helper/
#      permissions, a trigger-state mismatch, or any shape drift ⇒ FAIL.
#   3. Next-restart (authoritative): the compose project's OWN config is derived from the running
#      container's own labels (`com.docker.compose.project.config_files` /
#      `com.docker.compose.project.working_dir`), then rendered read-only via `docker compose config` —
#      this covers env_file AND compose YAML/override merges, not just a directory's top-level `.env*`
#      files — and all five ladder flags are compared with the posture's exact active set.
#
# Intentionally NOT scheduled; dispatch manually. FAIL-CLOSED throughout: expected-active flags must be
# exactly `true`; any unexpected `true`/`1`, missing expected-active flag, trigger mismatch, missing expected
# container, broken/implausible observation, or unresolved compose project fails. Nothing-observed is never
# a PASS.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which stack to verify. Fixed choices only — never free text reaches the remote host.'
        required: true
        type: choice
        options: [staging, production, both]
        default: both
      mode:
        description: 'predeploy-flags = exact running/next-restart flag set only. postdeploy-full = also verifies live-DB recovery schema. l1-postgres-window = fixed staging-only L1 PostgreSQL log witness. Fixed choices only.'
        required: true
        type: choice
        options: [predeploy-flags, postdeploy-full, l1-postgres-window]
        default: postdeploy-full
      posture:
        description: 'Exact ladder posture to witness. inert is the default/rollback state; later choices are staging/production rung states. Fixed choices only.'
        required: true
        type: choice
        options: [inert, l1-armed, l2-fence, l2-checkpoint, l3-strict, l4-revert, l5-reset]
        default: inert

concurrency:
  group: multitable-recovery-flag-containment-check
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  containment-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify exact recovery ladder posture on the deploy host
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          TARGET: ${{ github.event.inputs.target }}
          MODE: ${{ github.event.inputs.mode }}
          POSTURE: ${{ github.event.inputs.posture }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh

          # --- Host authentication (fail-closed): without a pinned known_hosts entry there is no way
          # to prove the ssh responder on DEPLOY_HOST is actually the deploy host — StrictHostKeyChecking
          # =no would let a MITM, or simply the wrong host, answer and the containment "PASS" below would
          # be meaningless. Never silently fall back to no-verify.
          if [ -z "${DEPLOY_KNOWN_HOSTS:-}" ]; then
            echo "::error::DEPLOY_KNOWN_HOSTS required for host-authenticated containment evidence — refusing to fall back to no-verify"
            exit 1
          fi
          # Accept either a base64-encoded or a raw known_hosts blob: try base64-decoding first and only
          # keep the decoded form if it actually looks like known_hosts content (a recognizable key-type
          # token); otherwise write the secret through unmodified. Either way, the resulting file is
          # verified below to actually contain a key-type token — a garbled/misconfigured secret fails
          # closed instead of silently producing an unusable (and therefore no-verify-equivalent) file.
          decoded_known_hosts="$(printf '%s' "$DEPLOY_KNOWN_HOSTS" | base64 -d 2>/dev/null || true)"
          if printf '%s' "$decoded_known_hosts" | grep -Eq 'ssh-ed25519|ssh-rsa|ecdsa-sha2|ssh-dss'; then
            printf '%s\n' "$decoded_known_hosts" > ~/.ssh/known_hosts
          else
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          fi
          chmod 644 ~/.ssh/known_hosts
          if ! grep -Eq 'ssh-ed25519|ssh-rsa|ecdsa-sha2|ssh-dss' ~/.ssh/known_hosts; then
            echo "::error::DEPLOY_KNOWN_HOSTS did not resolve to a recognizable known_hosts entry — refusing to fall back to no-verify"
            exit 1
          fi

          printf '%s' "$DEPLOY_SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh_opts="-o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -i ~/.ssh/deploy_key"

          # Validate `target` is EXACTLY one of the fixed choices before anything reaches the ssh
          # command line — this is the real injection boundary (see header comment). Every branch here
          # is a no-op pass-through; the unmapped default fails closed rather than letting a
          # non-enum / space-containing / metacharacter-containing TARGET anywhere near ssh.
          case "$TARGET" in
            staging|production|both)
              ;;
            *)
              echo "::error::unexpected target '${TARGET}' (expected staging|production|both) — refusing to proceed"
              exit 1
              ;;
          esac

          echo "target='${TARGET}'"

          # Validate `mode` is EXACTLY one of the fixed choices before it reaches the ssh command line
          # (same injection-boundary discipline as target; the unmapped default fails closed).
          case "$MODE" in
            predeploy-flags|postdeploy-full|l1-postgres-window)
              ;;
            *)
              echo "::error::unexpected mode '${MODE}' (expected predeploy-flags|postdeploy-full|l1-postgres-window) — refusing to proceed"
              exit 1
              ;;
          esac

          echo "mode='${MODE}'"

          # POSTURE also reaches the ssh command line, so validate it at the same local injection
          # boundary as TARGET/MODE. Every accepted token is a fixed, metacharacter-free enum value.
          case "$POSTURE" in
            inert|l1-armed|l2-fence|l2-checkpoint|l3-strict|l4-revert|l5-reset)
              ;;
            *)
              echo "::error::unexpected posture '${POSTURE}' — refusing to proceed"
              exit 1
              ;;
          esac

          # The historical L1 log witness is intentionally narrower than the general containment
          # modes. Keep the production boundary and rung identity outside the remote command entirely.
          if [ "$MODE" = "l1-postgres-window" ]; then
            if [ "$TARGET" != "staging" ] || [ "$POSTURE" != "l1-armed" ]; then
              echo "::error::l1-postgres-window requires target=staging and posture=l1-armed — refusing to proceed"
              exit 1
            fi
          fi

          echo "posture='${POSTURE}'"

          # Remote script (single-quoted heredoc — nothing expands locally). Verdict lines are
          # machine-greppable. TARGET/MODE/POSTURE are already validated as fixed, single-word enums;
          # they are the only input-derived tokens interpolated onto the ssh command line. The target
          # -> container-name mapping and posture mapping are redone independently inside the remote
          # heredoc below — no space-containing constant (e.g. the old
          # `both` -> "metasheet-backend metasheet-staging-backend" EXPECTED_CONTAINERS) is ever passed
          # as an env-assignment on the ssh command line, because ssh concatenates all trailing arguments
          # into a single string and re-parses it through the remote login shell — a space there
          # previously caused the second word to be parsed as a bogus extra command (exit 127).
          ssh $ssh_opts "$DEPLOY_USER@$DEPLOY_HOST" TARGET="$TARGET" MODE="$MODE" POSTURE="$POSTURE" 'bash -s' <<'REMOTE' | tee containment-report.txt
          set -uo pipefail
          FLAGS="MULTITABLE_ENABLE_SHEET_REVERT MULTITABLE_ENABLE_PIT_RESET MULTITABLE_HISTORY_CONTIGUITY_STRICT MULTITABLE_ENABLE_WRITER_FENCE MULTITABLE_ENABLE_TRUST_CHECKPOINT_ACTIVATION"
          SCHEMA_HELPER_SHA256="f1c17af1b9091c82dce8ec899f0e7480ecfa810087e4a34d506c118775a44d82"
          SCHEMA_PASS_LINE_DISABLED="VERDICT: PASS - recovery authority triggers/functions match the expected default-inert schema posture and no foreign_record_id FK exists on meta_links"
          SCHEMA_PASS_LINE_ARMED="VERDICT: PASS - recovery authority triggers/functions match the expected armed schema posture and no foreign_record_id FK exists on meta_links"
          FLAG_CLASSIFIER_JS='const fs=require("node:fs");const [mode,container,...keys]=process.argv.slice(1);let source;if(mode==="running"){source=process.env}else if(mode==="compose"){const config=JSON.parse(fs.readFileSync(0,"utf8"));const matches=Object.values(config.services??{}).filter((service)=>service&&service.container_name===container);if(matches.length!==1)process.exit(3);source=matches[0].environment??{};if(!source||Array.isArray(source)||typeof source!=="object")process.exit(4)}else{process.exit(2)}for(const key of keys){const present=Object.prototype.hasOwnProperty.call(source,key);const normalized=present?String(source[key]??"").trim().toLowerCase():"";const state=!present?"unset":normalized==="true"?"true":normalized==="1"?"one":"inactive";process.stdout.write(`${key}\t${state}\n`)}'
          fail=0
          checked=0

          # Re-map the (already-validated, single-word) TARGET to the hard-coded, known-safe container
          # list HERE, on the remote side. This case statement is the ONLY place EXPECTED_CONTAINERS is
          # produced; every branch yields a fixed constant (the real container_name values below), and
          # the unmapped default fails closed instead of ever falling through to a false PASS.
          case "$TARGET" in
            staging)
              EXPECTED_CONTAINERS="metasheet-staging-backend"
              ;;
            production)
              EXPECTED_CONTAINERS="metasheet-backend"
              ;;
            both)
              EXPECTED_CONTAINERS="metasheet-backend metasheet-staging-backend"
              ;;
            *)
              echo "VERDICT: FAIL — unexpected target '${TARGET:-}' (expected staging|production|both) — refusing to proceed"
              exit 2
              ;;
          esac

          echo "target='${TARGET:-}' -> EXPECTED_CONTAINERS='${EXPECTED_CONTAINERS}'"

          # Re-validate MODE on the remote side (defense in depth, mirrors the TARGET re-mapping above);
          # anything outside the fixed set fails closed rather than falling through to a mode-less run.
          case "${MODE:-}" in
            predeploy-flags|postdeploy-full|l1-postgres-window)
              ;;
            *)
              echo "VERDICT: FAIL — unexpected mode '${MODE:-}' (expected predeploy-flags|postdeploy-full|l1-postgres-window) — refusing to proceed"
              exit 2
              ;;
          esac
          echo "mode='${MODE}'"

          # One-time L1 observation witness. All bounds, positive-control windows, marker text, and
          # container identity are reviewed constants; no caller value can widen the log read. Raw log
          # lines never leave the host. PostgreSQL logs every authority-busy raise, while four known
          # battery runs prove the retained log spans the full observation window.
          if [ "$MODE" = "l1-postgres-window" ]; then
            if [ "$TARGET" != "staging" ] || [ "$POSTURE" != "l1-armed" ]; then
              echo "VERDICT: FAIL — l1-postgres-window requires target=staging and posture=l1-armed"
              exit 2
            fi
            if ! command -v docker >/dev/null 2>&1; then
              echo "VERDICT: FAIL — docker not available on host (observation broken)"
              exit 2
            fi

            PG_CONTAINER="metasheet-staging-postgres"
            OBS_START="2026-08-24T10:25:17.641000000Z"
            OBS_END="2026-08-25T14:55:51.000000000Z"
            DOCKER_LOG_UNTIL="2026-08-25T14:55:51.000000001Z"
            export LC_ALL=C
            running_names=$(docker ps --format '{{.Names}}')
            if ! printf '%s\n' "$running_names" | grep -qxF "$PG_CONTAINER"; then
              echo "VERDICT: FAIL (positive control) — expected staging PostgreSQL container is not running"
              exit 2
            fi

            started_at=$(docker inspect "$PG_CONTAINER" --format '{{.State.StartedAt}}' 2>/dev/null || true)
            started_at_seconds=$(printf '%s\n' "$started_at" | sed -E 's/\.[0-9]+Z$/Z/')
            if ! printf '%s\n' "$started_at_seconds" | grep -Eq '^20[0-9][0-9]-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]Z$'; then
              echo "VERDICT: FAIL — PostgreSQL container start time is unavailable or malformed"
              exit 2
            fi
            if [[ "$started_at_seconds" > "2026-08-24T10:25:17Z" || "$started_at_seconds" = "2026-08-24T10:25:17Z" ]]; then
              echo "VERDICT: FAIL — PostgreSQL container did not start strictly before the observation window opened"
              exit 2
            fi

            log_driver=$(docker inspect "$PG_CONTAINER" --format '{{.HostConfig.LogConfig.Type}}' 2>/dev/null || true)
            case "$log_driver" in
              json-file|local)
                ;;
              *)
                echo "VERDICT: FAIL — PostgreSQL container log driver does not provide the required ordered-retention contract"
                exit 2
                ;;
            esac

            pg_log=$(mktemp)
            pg_summary=$(mktemp)
            cleanup_l1_pg_witness() { rm -f "$pg_log" "$pg_summary"; }
            trap cleanup_l1_pg_witness EXIT
            if ! docker logs --timestamps --since "$OBS_START" --until "$DOCKER_LOG_UNTIL" "$PG_CONTAINER" >"$pg_log" 2>&1; then
              echo "VERDICT: FAIL — PostgreSQL log observation failed"
              exit 2
            fi

            if ! awk \
              -v obs_start="$OBS_START" \
              -v obs_end="$OBS_END" \
              -v log_driver="$log_driver" \
              -v marker="METASHEET_RECOVERY_AUTHORITY_BUSY" \
              -v w1_start="2026-08-24T10:25:17.641000000Z" -v w1_end="2026-08-24T10:25:40.999999999Z" \
              -v w2_start="2026-08-25T10:26:50.000000000Z" -v w2_end="2026-08-25T10:27:25.999999999Z" \
              -v w3_start="2026-08-25T13:14:38.000000000Z" -v w3_end="2026-08-25T13:15:15.999999999Z" \
              -v w4_start="2026-08-25T14:54:30.000000000Z" -v w4_end="2026-08-25T14:55:05.999999999Z" '
              function normalize_timestamp(raw, base, fraction) {
                if (raw !~ /^20[0-9][0-9]-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](\.[0-9]+)?Z$/) return ""
                base = raw
                sub(/(\.[0-9]+)?Z$/, "", base)
                fraction = raw
                if (fraction ~ /\./) {
                  sub(/^.*\./, "", fraction)
                  sub(/Z$/, "", fraction)
                  if (length(fraction) > 9) return ""
                } else {
                  fraction = ""
                }
                while (length(fraction) < 9) fraction = fraction "0"
                return base "." fraction "Z"
              }
              function in_window(value, start, finish) { return value >= start && value <= finish }
              {
                timestamp = normalize_timestamp($1)
                if (timestamp == "") { parse_errors++; next }
                if (timestamp < obs_start || timestamp > obs_end) next
                lowered = tolower($0)
                if (index($0, marker) > 0) {
                  marker_total++
                  constructed = 0
                  if (in_window(timestamp, w1_start, w1_end)) { w1++; constructed = 1 }
                  if (in_window(timestamp, w2_start, w2_end)) { w2++; constructed = 1 }
                  if (in_window(timestamp, w3_start, w3_end)) { w3++; constructed = 1 }
                  if (in_window(timestamp, w4_start, w4_end)) { w4++; constructed = 1 }
                  if (constructed) marker_constructed++; else marker_outside++
                }
                if (index(lowered, "deadlock detected") > 0) deadlocks++
              }
              END {
                controls = (w1 == 11) + (w2 == 11) + (w3 == 11) + (w4 == 11)
                printf "window_start=%s\nwindow_end=%s\nlog_driver=%s\nbattery_marker_counts=%d,%d,%d,%d\npositive_controls=%d/4\nauthority_busy_total=%d\nauthority_busy_constructed=%d\nauthority_busy_outside_constructed=%d\ndeadlocks=%d\nparse_errors=%d\n", obs_start, obs_end, log_driver, w1, w2, w3, w4, controls, marker_total, marker_constructed, marker_outside, deadlocks, parse_errors
                if (parse_errors > 0 || controls != 4 || marker_outside != 0 || deadlocks != 0) exit 2
              }
            ' "$pg_log" >"$pg_summary"; then
              cat "$pg_summary"
              echo "VERDICT: FAIL — L1 PostgreSQL observation window is incomplete or contains a non-constructed recovery anomaly"
              exit 2
            fi

            cat "$pg_summary"
            echo "VERDICT: PASS (l1-postgres-window) — ordered PostgreSQL logs contain exactly 11 markers in each constructed battery window; no authority-busy marker occurred outside them and no deadlock was observed"
            exit 0
          fi

          # Exact rung contract. No caller-supplied list reaches the comparison logic: each posture maps
          # to a hard-coded trigger state and exact active-flag set. l2-checkpoint is intentionally
          # transient: the activation flag is on only while minting the named canary checkpoint.
          case "${POSTURE:-}" in
            inert)
              EXPECTED_TRIGGER_STATE="disabled"
              EXPECTED_ACTIVE_FLAGS=""
              ;;
            l1-armed)
              EXPECTED_TRIGGER_STATE="armed"
              EXPECTED_ACTIVE_FLAGS=""
              ;;
            l2-fence)
              EXPECTED_TRIGGER_STATE="armed"
              EXPECTED_ACTIVE_FLAGS="MULTITABLE_ENABLE_WRITER_FENCE"
              ;;
            l2-checkpoint)
              EXPECTED_TRIGGER_STATE="armed"
              EXPECTED_ACTIVE_FLAGS="MULTITABLE_ENABLE_WRITER_FENCE MULTITABLE_ENABLE_TRUST_CHECKPOINT_ACTIVATION"
              ;;
            l3-strict)
              EXPECTED_TRIGGER_STATE="armed"
              EXPECTED_ACTIVE_FLAGS="MULTITABLE_ENABLE_WRITER_FENCE MULTITABLE_HISTORY_CONTIGUITY_STRICT"
              ;;
            l4-revert)
              EXPECTED_TRIGGER_STATE="armed"
              EXPECTED_ACTIVE_FLAGS="MULTITABLE_ENABLE_WRITER_FENCE MULTITABLE_HISTORY_CONTIGUITY_STRICT MULTITABLE_ENABLE_SHEET_REVERT"
              ;;
            l5-reset)
              EXPECTED_TRIGGER_STATE="armed"
              EXPECTED_ACTIVE_FLAGS="MULTITABLE_ENABLE_WRITER_FENCE MULTITABLE_HISTORY_CONTIGUITY_STRICT MULTITABLE_ENABLE_SHEET_REVERT MULTITABLE_ENABLE_PIT_RESET"
              ;;
            *)
              echo "VERDICT: FAIL — unexpected posture '${POSTURE:-}' — refusing to proceed"
              exit 2
              ;;
          esac
          echo "posture='${POSTURE}' expected_trigger_state='${EXPECTED_TRIGGER_STATE}' expected_active_flags='${EXPECTED_ACTIVE_FLAGS:-<none>}'"

          flag_expected_active() {
            case " ${EXPECTED_ACTIVE_FLAGS} " in
              *" $1 "*) return 0 ;;
              *) return 1 ;;
            esac
          }

          check_flag_snapshot() {
            context="$1"
            snapshot="$2"
            snapshot_count=$(printf '%s\n' "$snapshot" | awk 'NF { count++ } END { print count+0 }')
            if [ "$snapshot_count" -ne 5 ]; then
              echo "VERDICT: FAIL — ${context} flag snapshot count=${snapshot_count}, expected=5 (observation broken)"
              fail=1
              return
            fi
            for f in $FLAGS; do
              match_count=$(printf '%s\n' "$snapshot" | awk -F '\t' -v key="$f" '$1 == key { count++ } END { print count+0 }')
              state=$(printf '%s\n' "$snapshot" | awk -F '\t' -v key="$f" '$1 == key { print $2 }')
              if [ "$match_count" -ne 1 ]; then
                echo "   [${context}] $f: observed ${match_count} classifier rows, expected exactly 1 — POSTURE MISMATCH"
                fail=1
                continue
              fi
              if flag_expected_active "$f"; then
                if [ "$state" = "true" ]; then
                  echo "   [${context}] $f=true — ACTIVE AS EXPECTED"
                else
                  echo "   [${context}] $f: expected ACTIVE(true), observed state=${state} — POSTURE MISMATCH"
                  fail=1
                fi
              else
                if [ "$state" = "true" ] || [ "$state" = "one" ]; then
                  echo "   [${context}] $f=$state — UNEXPECTED ACTIVE ⇒ POSTURE MISMATCH"
                  fail=1
                elif [ "$state" = "unset" ] || [ "$state" = "inactive" ]; then
                  echo "   [${context}] $f — INACTIVE AS EXPECTED"
                else
                  echo "   [${context}] $f: unknown classifier state=${state:-empty} — POSTURE MISMATCH"
                  fail=1
                fi
              fi
            done
          }

          if ! command -v docker >/dev/null 2>&1; then
            echo "VERDICT: FAIL — docker not available on host (observation broken)"
            exit 2
          fi
          if ! docker compose version >/dev/null 2>&1; then
            echo "VERDICT: FAIL — 'docker compose' v2 plugin not available (next-restart check unavailable)"
            exit 2
          fi
          # Defense in depth: the remote script must not trust the caller to have supplied a
          # non-empty EXPECTED_CONTAINERS. An empty/blank value would otherwise make the loop
          # below a no-op — checked=0, fail=0 — and fall through to a false PASS. Nothing
          # expected is not containment evidence either.
          if [ -z "${EXPECTED_CONTAINERS// /}" ]; then
            echo "VERDICT: FAIL (positive control) — EXPECTED_CONTAINERS is empty; refusing to report PASS on zero expectations"
            exit 2
          fi

          echo "== expected containers: ${EXPECTED_CONTAINERS} =="
          running_names=$(docker ps --format '{{.Names}}')

          for name in $EXPECTED_CONTAINERS; do
            checked=$((checked+1))
            echo "-- container: $name"
            if ! printf '%s\n' "$running_names" | grep -qxF "$name"; then
              echo "VERDICT: FAIL (positive control) — expected container '$name' is NOT running; nothing observed is not containment evidence"
              fail=1
              continue
            fi

            # Leg 1: classify the exact environment Node exposes to application code. Line-oriented
            # `env | grep` is unsound for values containing newlines (e.g. "\ntrue" is active after
            # the application's trim(), but its physical FLAG= line looks empty).
            if ! running_snapshot=$(docker exec "$name" node -e "$FLAG_CLASSIFIER_JS" running _ $FLAGS 2>/dev/null); then
              echo "VERDICT: FAIL — cannot classify the running Node environment in $name (observation broken)"
              fail=1
              continue
            fi
            check_flag_snapshot "running" "$running_snapshot"

            # Leg 2 (postdeploy-full mode ONLY): the schema helper + trigger migrations exist only on the
            # deployed closeout image; requiring them on the pre-#4654 image would always FAIL (missing
            # helper). predeploy-flags SKIPS this leg entirely so legs 1+3 still yield pre-deploy flag
            # evidence. In postdeploy-full this guard is the ONLY thing gating the helper — full can never
            # bypass it (there is no other exit from the schema check).
            if [ "$MODE" = "postdeploy-full" ]; then
            # Leg 2: live database schema. The helper runs inside the backend container so it observes
            # the service's own DATABASE_URL without ever exporting or printing it. Its output contract
            # is values-free: object counts, deterministic fingerprints, and PASS/FAIL only. Missing DB
            # access/permissions/helper are hard failures, and exit 0 alone is insufficient: the exact
            # helper source hash and PASS sentinel must both match this reviewed workflow revision.
            schema_out="$(mktemp)"
            helper_sha="$(docker exec "$name" sha256sum scripts/ops/multitable-recovery-schema-containment.mjs 2>/dev/null | awk '{print $1}' || true)"
            if [ "$helper_sha" != "$SCHEMA_HELPER_SHA256" ]; then
              echo "VERDICT: FAIL — schema containment helper is missing or differs from the reviewed fingerprint for $name"
              rm -f "$schema_out"
              fail=1
              continue
            fi
            if [ "$EXPECTED_TRIGGER_STATE" = "armed" ]; then
              schema_pass_line="$SCHEMA_PASS_LINE_ARMED"
            else
              schema_pass_line="$SCHEMA_PASS_LINE_DISABLED"
            fi
            if ! docker exec "$name" node scripts/ops/multitable-recovery-schema-containment.mjs \
              "--expected-trigger-state=${EXPECTED_TRIGGER_STATE}" >"$schema_out" 2>&1; then
              echo "VERDICT: FAIL — schema containment helper failed for $name (DB/helper/permission observation unavailable)"
              sed 's/^/   schema: /' "$schema_out"
              rm -f "$schema_out"
              fail=1
              continue
            fi
            sed 's/^/   schema: /' "$schema_out"
            if ! grep -qxF "$schema_pass_line" "$schema_out"; then
              echo "VERDICT: FAIL — schema containment helper did not emit its exact PASS sentinel for $name"
              rm -f "$schema_out"
              fail=1
              continue
            fi
            rm -f "$schema_out"
            fi
            # end Leg 2 (postdeploy-full only)

            # Leg 3: authoritative next-restart check. Derive the compose project's OWN config from the
            # running container's own compose labels (covers env_file AND compose YAML/override merges,
            # not just a directory's top-level .env* files), then render the fully-resolved config
            # read-only with `docker compose config` and verdict against that rendering.
            config_files=$(docker inspect "$name" --format '{{ index .Config.Labels "com.docker.compose.project.config_files" }}' 2>/dev/null || true)
            working_dir=$(docker inspect "$name" --format '{{ index .Config.Labels "com.docker.compose.project.working_dir" }}' 2>/dev/null || true)
            if [ -z "$config_files" ] || [ -z "$working_dir" ]; then
              echo "VERDICT: FAIL — cannot resolve compose project labels for $name (next-restart check unavailable)"
              fail=1
              continue
            fi

            compose_args=()
            old_ifs="$IFS"
            IFS=','
            for cf in $config_files; do
              compose_args+=(-f "$cf")
            done
            IFS="$old_ifs"

            cfg_out="$(mktemp)"
            cfg_err="$(mktemp)"
            if ! docker compose "${compose_args[@]}" --project-directory "$working_dir" config --format json >"$cfg_out" 2>"$cfg_err"; then
              echo "VERDICT: FAIL — 'docker compose config --format json' failed for $name (next-restart check broken)"
              echo "   compose-config-stderr: suppressed (values-free evidence boundary)"
              rm -f "$cfg_out" "$cfg_err"
              fail=1
              continue
            fi
            if ! compose_snapshot=$(docker exec -i "$name" node -e "$FLAG_CLASSIFIER_JS" compose "$name" $FLAGS <"$cfg_out" 2>/dev/null); then
              echo "VERDICT: FAIL — cannot classify the rendered Compose environment for $name (observation broken or service identity ambiguous)"
              rm -f "$cfg_out" "$cfg_err"
              fail=1
              continue
            fi
            check_flag_snapshot "next-restart" "$compose_snapshot"
            rm -f "$cfg_out" "$cfg_err"
          done

          echo "== summary =="
          echo "containers expected: $checked"
          if [ "$fail" -ne 0 ]; then echo "VERDICT: FAIL — requested ladder posture mismatched or observation broken (see above)"; exit 1; fi
          # Two DISTINCT PASS sentinels — a predeploy-flags PASS must never be mistaken for a full
          # containment PASS: it explicitly states the database schema was NOT verified in this mode.
          if [ "$MODE" = "postdeploy-full" ]; then
            echo "VERDICT: PASS (postdeploy-full) — exact ladder posture '${POSTURE}' matches running/next-restart flags and database recovery schema matches its expected trigger posture"
          else
            echo "VERDICT: PASS (predeploy-flags) — exact ladder posture '${POSTURE}' matches running AND next-restart flags; database recovery schema NOT verified in this mode"
          fi
          REMOTE

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: containment-report
          path: containment-report.txt
          retention-days: 30
