          node --test scripts/ops/attendance-w4c4-openapi-contract.test.mjs

      # #4556 W4C-0 Stage D / W4C-4 §12.7: source/effect/result mechanical bypass guard plus
      # generated calculation/segment current-history SELECT inventory. A
      # node:test (.test.mjs) file — invisible to both `pnpm --filter core-backend test` and
      # vitest.config.ts's exclude list — so it must be named explicitly here or it silently
      # never runs. Scans the exact-head worktree for new/renamed/unclassified attendance DML
      # against the pinned e0defbe26 debt baseline and its curated P01-P28/X01-X05 entries, and
      # re-proves the pinned baseline artifact is byte-reproducible from that ref.
      - name: Run attendance W4C-0 Stage D §8.4 and W4C-4 §12.7 inventory collectors
        run: |
          # The byte-reproducibility leg re-generates the baseline manifest FROM the pinned
          # commit itself (git ls-tree against e0defbe26…). actions/checkout is a shallow
          # clone, so that commit object is absent — fetch exactly that one commit first.
          # Deliberately NOT a conditional skip: a skip here would let the reproducibility
          # leg silently never run in CI (skip-shaped-green).
          git fetch --no-tags --depth=1 origin e0defbe26d7f2e1747e74aa908ca710422812bf7 || \
            git fetch --no-tags origin e0defbe26d7f2e1747e74aa908ca710422812bf7
