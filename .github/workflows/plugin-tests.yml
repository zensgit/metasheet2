name: Plugin System Tests

on:
  workflow_dispatch:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main, develop]
    paths:
      - 'packages/core-backend/**'
      - 'plugins/**'
      - 'apps/web/src/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/*.yml'
  pull_request:
    branches: [main, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dingtalk-p4-ops-regression-gate:
    name: DingTalk P4 ops regression gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Run DingTalk P4 ops regression gate
        run: |
          node scripts/ops/dingtalk-p4-regression-gate.mjs \
            --profile ops \
            --output-dir output/dingtalk-p4-regression-gate/ci

      - name: Upload DingTalk P4 ops regression gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dingtalk-p4-ops-regression-gate
          path: output/dingtalk-p4-regression-gate/ci/
          if-no-files-found: ignore

  k3wise-offline-poc:
    name: K3 WISE offline PoC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Run K3 WISE offline PoC readiness smoke
        run: |
          pnpm run verify:integration-k3wise:poc

      # REVIEW P2-1: the rehearsal harness asserts the two guards the owner's HOLD points 3 and 4
      # depend on (the mock's session gate, and the call logger the workflow's Submit/Audit
      # absence-check reads). It shipped in ZERO workflows, so those guards' only behavioural
      # evidence was ungated — a coverage regression, not a coverage gap. Gated here alongside
      # its sibling mock-server test.
      - name: Run K3 WISE rehearsal harness contract tests
        run: |
          node --test \
            scripts/ops/fixtures/integration-k3wise/rehearsal-harness.test.mjs \
            scripts/ops/fixtures/integration-k3wise/rehearsal-driver-contract.test.mjs

      - name: Run on-prem package apply and archive contract tests
        run: |
          node --test \
            scripts/ops/onprem-windows-system-hardening.test.mjs \
            scripts/ops/multitable-onprem-package-no-node-modules.test.mjs

      - name: Run DingTalk OAuth-stability metrics-auth contract test (DT-CLOSE-01)
        run: |
          node --test scripts/ops/dingtalk-oauth-stability-metrics-auth-contract.test.mjs

      - name: Run DingTalk closeout env-contract test (DT-CLOSE-02)
        run: |
          node --test scripts/ops/dingtalk-closeout-env-contract.test.mjs
          node --test scripts/ops/attendance-remote-docker-gc-workflow-contract.test.mjs
          node --test scripts/ops/directory-grant-table-ci-wiring.test.mjs
          node --test scripts/ops/directory-activation-source-lock-ci-wiring.test.mjs
          node --test scripts/ops/directory-deprovision-ledger-ci-wiring.test.mjs
          node --test scripts/ops/directory-deprovision-writer-ci-wiring.test.mjs
          node --test scripts/ops/directory-access-graph-mutex-ci-wiring.test.mjs

      - name: Run DingTalk OAuth-stability metrics-only contract test (DT-CLOSE-01B)
        run: |
          node --test scripts/ops/dingtalk-oauth-stability-metrics-only-contract.test.mjs

      - name: Run DingTalk OAuth-stability metrics-only full-script test (DT-CLOSE-01B)
        run: |
          node --test scripts/ops/dingtalk-oauth-stability-metrics-only-fullscript.test.mjs

      - name: Run DingTalk OAuth-stability ARG_MAX payload-handoff test (DT-CLOSE-01C)
        run: |
          node --test scripts/ops/dingtalk-oauth-stability-argmax-payload.test.mjs

      - name: Run DingTalk OAuth-stability summary + workflow contract tests (DT-CLOSE-01B)
        run: |
          node --test \
            scripts/ops/github-dingtalk-oauth-stability-summary.test.mjs \
            scripts/ops/dingtalk-oauth-stability-workflow-contract.test.mjs

  stock-prep-powershell51:
    name: stock-prep PowerShell 5.1 acceptance
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      # The release package runs this acceptance boundary under Windows PowerShell 5.1. pwsh 7 has
      # different native-stderr semantics and cannot stand in for the target shell contract.
      - name: Run target-shell smoke capture regression
        shell: powershell
        run: |
          $powershell51 = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          & $powershell51 -NoProfile -ExecutionPolicy Bypass -File `
            scripts/ops/__tests__/stock-preparation-onprem-acceptance.ps51.tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $powershell51 -NoProfile -ExecutionPolicy Bypass -File `
            scripts/ops/__tests__/stock-preparation-s6a-onprem-acceptance.ps51.tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $powershell51 -NoProfile -ExecutionPolicy Bypass -File scripts/ops/__tests__/stock-preparation-rca-window.ps51.tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $powershell51 -NoProfile -ExecutionPolicy Bypass -File scripts/ops/__tests__/stock-preparation-rca-window.behavior.tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # S6-A win32 artifact-root ACL + attestation (follow-up 1 of
      # docs/development/stock-preparation-s6a-windows-runtime-parity-20260818.md). This is the
      # only job with a real NTFS volume and a real icacls.exe, so the layer-3 checks (apply, verify,
      # idempotent re-run, tampered-ACL retraction against a throwaway TEMP directory) can only run
      # here. Both shells are exercised: the deploy path runs under whichever PowerShell the operator
      # host provides, and 5.1's native-stderr semantics differ from pwsh 7's.
      - name: Run S6-A artifact-root ACL attestation tests (Windows PowerShell 5.1 + pwsh 7)
        shell: powershell
        run: |
          $powershell51 = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          & $powershell51 -NoProfile -ExecutionPolicy Bypass -File `
            scripts/ops/__tests__/multitable-onprem-s6a-artifact-root-acl.tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & pwsh -NoProfile -ExecutionPolicy Bypass -File `
            scripts/ops/__tests__/multitable-onprem-s6a-artifact-root-acl.tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # R12-C: the Global History flag manifest is an operator contract — the status helper reads it to
      # decide safe flag combinations. This node:test (no deps, no DB) is source-derived: it fails if a
      # MULTITABLE_ flag read in packages/core-backend/src is missing from the manifest. Runs early so a
      # manifest/source drift fails the required `test` check fast, before the pnpm install/build.
      - name: Global History flag manifest contract (R12-C)
        run: node --test scripts/ops/global-history-flag-manifest.test.mjs scripts/ops/multitable-global-history-flag-status.test.mjs scripts/ops/multitable-recovery-schema-containment.test.mjs

      # W0 L6/L7 CI two-point wiring contract (no DB): both exact-anchor real-DB suites must stay
      # excluded from the no-DB Vitest lane and named in the multitable real-DB whole-file step.
      - name: W0 exact-anchor L6/L7 CI wiring contract
        run: node --test scripts/ops/multitable-exact-anchor-ci-wiring.test.mjs

      # Time Machine D2a CI two-point wiring contract: the archive-catalog proof must remain
      # excluded from no-DB collection and named exactly once by the multitable real-DB step.
      # This pre-install half is dependency-free; the real Vitest sentinel runs after install.
      - name: Time Machine D2a archive-catalog CI wiring contract
        run: node --test scripts/ops/multitable-d2-archive-ci-wiring.test.mjs

      # Production maintenance can prune Docker data on the deploy host. Keep its SSH host-identity
      # contract in the required Node 20 context so host-key pinning cannot regress behind a green PR.
      - name: Production maintenance SSH host-identity contract (required lane)
        id: production-maintenance-ssh-host-identity-contract
        if: matrix.node-version == '20.x'
        run: node --test scripts/ops/attendance-remote-docker-gc-workflow-contract.test.mjs

      # DingTalk production-readiness inventory (manual-only, values-free, read-only) + OAuth
      # stability SSH host-identity hardening. Wired into required test (20.x) so host-key
      # pinning and values-free/read-only rails cannot regress behind a green PR.
      - name: DingTalk production-readiness inventory contract (required lane)
        id: dingtalk-production-readiness-inventory-contract
        if: matrix.node-version == '20.x'
        run: |
          node --test scripts/ops/dingtalk-production-readiness-inventory-contract.test.mjs
          node --test scripts/ops/dingtalk-interactive-card-stream-staging-uat-contract.test.mjs
          node --test scripts/ops/dingtalk-oauth-stability-workflow-contract.test.mjs

      # REVIEW NIT-2 (exact-head round): these two suites already ran in `k3wise-offline-poc`, but
      # that job's check is "K3 WISE offline PoC", which is NOT one of main's required contexts --
      # so a red there did not block a merge. The suites carry the ONLY mechanical guard on the
      # rehearsal driver's step predicates, including the one that discriminates the owner's
      # reported P1. A guard that cannot block is documentation, not a gate.
      #
      # Invoked here as well, in the REQUIRED `test` job (test (20.x) is a required context), so
      # the guard actually gates. The duplicate run costs ~1s and is deliberate: leaving the
      # original in place keeps the offline-PoC job self-contained.
      - name: K3 WISE rehearsal driver contract (required lane)
        run: |
          node --test \
            scripts/ops/fixtures/integration-k3wise/rehearsal-harness.test.mjs \
            scripts/ops/fixtures/integration-k3wise/rehearsal-driver-contract.test.mjs

      # #4802 — SEVEN K3/stock-prep-line `scripts/ops` suites executed by NOTHING. A repo-wide sweep
      # (not just this workflow's own list) found these seven `*.test.mjs` files referenced by no
      # workflow, no package.json script, and no shell script. The single non-docs hit,
      # scripts/ops/multitable-onprem-package-verify.sh:532, is a `search_fixed_string` assertion
      # that a COMMAND STRING appears in a document — it does not execute the suite.
      #
      # All seven pass. Inert, not broken — which is worse, because the directory listing reads like
      # coverage. The one that makes this urgent is
      # `multitable-onprem-package-verify-k3-helper-contract.test.mjs`: it guards the CONTENT
      # CONTRACT of the on-prem deployment package (the thing the physical-machine window installs).
      # Measured on #4802: dropping `packages/mssql-readonly-utils` — the shared helper package the
      # K3 SQL Server executor seam resolves against — from
      # `multitable-onprem-package-build.sh`'s payload list and then re-pinning the provenance
      # manifest as usual REDS that suite and NOTHING ELSE (161 chained suites RED = 0). i.e. an
      # on-prem package missing that helper shipped GREEN through every executed check.
      #
      # Wired into the REQUIRED `test (20.x)` context, not `k3wise-offline-poc` (whose check name
      # "K3 WISE offline PoC" is not one of main's required contexts, so a red there does not block
      # a merge — the owner's standard: "写进 workflow 但未进入 required context 不算完成").
      #
      # `if: matrix.node-version == '20.x'` is deliberate and is itself byte-pinned by the contract
      # (see below): 20.x IS the required leg, and flipping this string to '18.x' is mutation class
      # #1 in scripts/ops/ci-realdb-step-contract.mjs's header — the step disappears from the
      # required leg while every membership assertion stays green.
      #
      # All seven are pure node:test over node: builtins + sibling .mjs modules (the SSH-fallback
      # legs shim a fake `ssh` onto PATH), so this runs before the pnpm install, like the steps
      # above it. This step's `id`, its `if`, the absence of `continue-on-error`, and the presence
      # of ALL SEVEN paths as whole-file args of a real `node --test` invocation are pinned by
      # scripts/ops/integration-guard-required-wiring-contract.test.mjs (Pin 18), which runs in this
      # same required context and in `integration-guard`.
      - name: Run K3-line ops suites (required lane, #4802)
        id: k3-line-ops-suites
        if: matrix.node-version == '20.x'
        run: |
          node --test \
            scripts/ops/integration-erp-plm-deploy-readiness.test.mjs \
            scripts/ops/integration-k3wise-postdeploy-smoke.test.mjs \
            scripts/ops/integration-k3wise-postdeploy-summary.test.mjs \
            scripts/ops/integration-k3wise-postdeploy-workflow-contract.test.mjs \
            scripts/ops/integration-k3wise-signoff-gate.test.mjs \
            scripts/ops/multitable-onprem-package-verify-k3-helper-contract.test.mjs \
            scripts/ops/resolve-k3wise-smoke-token.test.mjs

      # Same promotion, same reason (adversarial review of #4646, P3): the D3 deprovision-ledger
      # CI-wiring contract is the ONLY mechanical guard proving the ledger real-DB suites stay in
      # the required run-list and excluded from the no-DB job. Its original home is the
      # k3wise-offline-poc job, whose check cannot block a merge — invoked here as well so it
      # actually gates. Duplicate run costs <1s; the original stays for job self-containment.
      - name: Directory deprovision ledger CI-wiring contract (required lane)
        run: node --test scripts/ops/directory-deprovision-ledger-ci-wiring.test.mjs

      # Same promotion (post-merge review of #4846, P2): the activation-source-lock wiring
      # contract's original home is the k3wise-offline-poc job, whose check cannot block a merge,
      # so de-listing the suite + repinning would pass all 9 required checks while the real-DB
      # golden silently stops running. Invoked here in the required test lane so it actually gates.
      - name: Directory activation source-lock CI-wiring contract (required lane)
        run: node --test scripts/ops/directory-activation-source-lock-ci-wiring.test.mjs

      # Integration Guard required-wiring contract (governance slice, standalone from #4603/#4604/
      # #4610 by owner instruction; hardened 2026-07-25 after a P1x2/P2 review — see the workflow's own
      # header for the corrected rationale). Mixed YAML-shape + BEHAVIOURAL contract that makes
      # .github/workflows/integration-guard.yml's produced `integration-guard` check safe to later mark
      # as a required context:
      #   - YAML-shape: on.pull_request has NO paths: filter, on.merge_group exists, the job is present
      #     under the exact expected name with no matrix suffix, the job/classifier/real-branch/
      #     terminal-assertion steps carry none of `if` (job-level)/`needs`/`continue-on-error`, the
      #     classifier step invokes the extracted script (not inline bash), and the terminal safety-net
      #     step exists with `if: always()` wired to the three branch steps' outcomes;
      #   - behavioural: scripts/ops/integration-guard-classify.mjs's classify() is driven directly with
      #     synthetic plugin-only/web-only/both/neither file lists (including a deeply-nested plugin
      #     path, closing a glob-semantics regression class), and scripts/ops/integration-guard-assert-
      #     branch.mjs's assertBranch() is driven directly with the full relevant/outcome state matrix
      #     (including `relevant: 'unknown'`) — these do not depend on GitHub Actions actually running.
      # Deliberately NOT a copy of the integration suite itself — that stays in integration-guard.yml
      # only (owner ruling: two copies would drift apart). See scripts/ops/integration-guard-required-
      # wiring-contract.test.mjs for the full rationale and an explicit note on what each layer can and
      # cannot prove.
      #
      # #4614 P1 (owner review, 2026-07-26): before this step carried `id: integration-guard-contract`,
      # this was the contract's ONLY executable caller, and neither this workflow's own path nor the
      # contract test's own path was in integration-guard.yml's guarded-path roster — so deleting this
      # one step made this job silently stop running the contract WHILE integration-guard.yml classified
      # the change as out-of-scope and no-op'd green: both gates green, contract fully disconnected.
      # Closed by a two-point wiring: integration-guard.yml now ALSO runs this same contract file
      # unconditionally from its own job (id: contract-self-check), and the contract itself pins THIS
      # step's presence (by this exact `id:`) in reverse — deleting either call site now reds the
      # OTHER caller's copy of the contract on its own specific pin. See integration-guard.yml's header
      # for the full account.
      #
      # #4614 P1 (sixth review round, 2026-07-26) — SUBTEST-COUNT FLOOR. `node --test` treats a child
      # process that exits 0 as a PASSING FILE. The contract statically imports four extracted modules
      # (integration-guard-assert-branch/-classify/-guarded-paths/-resolve-diff.mjs) at the top of the
      # file, so a single `process.exit(0)` inserted at the top of ANY of the four aborts the test file
      # during import evaluation, before a single subtest body runs — and the whole contract collapses
      # to `tests 1 / pass 1 / fail 0`, exit 0. Nothing pinned the expected subtest count, so BOTH
      # callers of this contract reported that collapse as green. The floor below is that missing pin:
      # a run that reports fewer than MIN_CONTRACT_TESTS subtests fails the step. Keep this block
      # BYTE-IDENTICAL to the `contract-self-check` step in .github/workflows/integration-guard.yml —
      # the contract exact-pins BOTH copies against the same literal (not against each other, so
      # mutating both copies identically does not stay green).
      - name: Integration Guard required-wiring contract
        id: integration-guard-contract
        shell: bash
        run: |
          set -euo pipefail
          MIN_CONTRACT_TESTS=62
          if ! contract_out="$(node --test scripts/ops/integration-guard-required-wiring-contract.test.mjs 2>&1)"; then
            printf '%s\n' "$contract_out"
            echo "integration-guard contract: node --test exited non-zero (output above)" >&2
            exit 1
          fi
          printf '%s\n' "$contract_out"
          contract_tests="$(printf '%s\n' "$contract_out" | grep -Eo 'tests [0-9]+$' | tail -n 1 | grep -Eo '[0-9]+$' || true)"
          if [ -z "$contract_tests" ]; then
            echo "integration-guard contract: no 'tests <N>' summary line found — refusing to report green" >&2
            exit 1
          fi
          if [ "$contract_tests" -lt "$MIN_CONTRACT_TESTS" ]; then
            echo "integration-guard contract: only $contract_tests subtests ran, expected at least $MIN_CONTRACT_TESTS — an import-time abort in one of the extracted .mjs modules collapses this contract into a passing 1-subtest file" >&2
            exit 1
          fi
          echo "integration-guard contract: $contract_tests subtests ran (floor $MIN_CONTRACT_TESTS)."

      # PB4-2 CI two-point wiring contract (no DB): the archive-read-only two-connection suite must
      # stay wired into BOTH vitest.config.ts (exclude) AND plugin-tests.yml (directory real-DB step).
      # Dropping either point makes the whole barrier suite silently never run while CI stays green.
      - name: PB4-2 archive-read-only CI wiring contract
        run: node --test scripts/ops/pb4-2-archive-readonly-ci-wiring.test.mjs

      # PB4-3 CI two-point wiring contract (no DB): the cycle-detection suite (advisory-lock barrier
      # + termination proof) must stay wired into BOTH vitest.config.ts (exclude) AND plugin-tests.yml
      # (directory real-DB step). Dropping either point silently disables the concurrency proof.
      - name: PB4-3 cycle-detection CI wiring contract
        run: node --test scripts/ops/pb4-3-cycle-detection-ci-wiring.test.mjs

      # PB4-4 CI two-point wiring contract (no DB): the reactivation suite (2-way/5-way concurrency
      # single-audit proof) must stay wired into BOTH vitest.config.ts (exclude) AND plugin-tests.yml
      # (directory real-DB step). Dropping either point silently disables the reactivation proof.
      - name: PB4-4 reactivation CI wiring contract
        run: node --test scripts/ops/pb4-4-reactivation-ci-wiring.test.mjs

      # B4 CI two-point wiring contract (no DB): the department-bindings FK-chain suite must stay
      # wired into BOTH vitest.config.ts (exclude) AND plugin-tests.yml (directory real-DB step).
      # Dropping either point silently disables the cross-org-FK-impossible proof.
      - name: B4 department-bindings CI wiring contract
        run: node --test scripts/ops/b4-department-bindings-ci-wiring.test.mjs

      # B5-a CI two-point wiring contract (no DB): the routing-policy schema suite must stay wired
      # into BOTH vitest.config.ts (exclude) AND plugin-tests.yml (directory real-DB step).
      - name: B5-a routing-policy CI wiring contract
        run: node --test scripts/ops/b5a-routing-policy-ci-wiring.test.mjs

      # E-learning V0.1 L0-F3A: content/assessment schema gate two-point wiring (no DB).
      # The real-Postgres suite must stay excluded from the no-DB job AND named as a
      # whole-file arg of the 20.x step that runs after db:migrate with DATABASE_URL.
      - name: E-learning V0.1 content/assessment CI wiring contract
        run: node --test scripts/ops/elearning-v01-content-assessment-ci-wiring.test.mjs

      # E-learning L0 jobs claim-lease CI two-point wiring (no DB): the real-Postgres
      # suite must stay excluded from the no-DB job AND named as a whole-file arg of
      # the 20.x schema/service step that runs after db:migrate with DATABASE_URL.
      - name: E-learning L0 jobs CI wiring contract
        run: node --test scripts/ops/elearning-jobs-ci-wiring.test.mjs

      # E-learning L2 batch assignment CI two-point wiring: focused units stay
      # in the no-DB canary and both real-Postgres suites run post-migrate.
      - name: E-learning L2 batch assignment CI wiring contract
        run: node --test scripts/ops/elearning-batch-assignment-ci-wiring.test.mjs

      # E-learning L2 B1 assignment lifecycle CI two-point wiring: focused
      # units stay in the no-DB canary and the real-Postgres suite runs
      # post-migrate.
      - name: E-learning L2 assignment lifecycle CI wiring contract
        run: node --test scripts/ops/elearning-assignment-lifecycle-ci-wiring.test.mjs

      # E-learning L2 training-plan CI two-point wiring: focused units stay in
      # the no-DB canary and the real-Postgres suite runs post-migrate.
      - name: E-learning L2 training-plan CI wiring contract
        run: node --test scripts/ops/elearning-training-plan-ci-wiring.test.mjs

      # E-learning L2 atomic plan-assignment CI two-point wiring: focused units
      # stay in the no-DB canary; the PostgreSQL suite runs after migrations.
      - name: E-learning L2 plan-assignment CI wiring contract
        run: node --test scripts/ops/elearning-training-plan-assignment-ci-wiring.test.mjs

      # E-learning L2 delegated administration CI wiring: focused ACL/scope
      # units stay in the no-DB canary; the PostgreSQL suite runs post-migrate.
      - name: E-learning L2 admin-scope ACL CI wiring contract
        run: node --test scripts/ops/elearning-admin-access-ci-wiring.test.mjs

      # E-learning L2 durable notification-intent CI wiring: the internal unit
      # stays in the no-DB canary and the ledger/FK/concurrency suite runs only
      # after migrations on real PostgreSQL. This slice sends no notification.
      - name: E-learning L2 notification-delivery CI wiring contract
        run: node --test scripts/ops/elearning-notification-delivery-ci-wiring.test.mjs

      # E-learning L2 notification claim-lease worker CI wiring (no DB): the
      # plugin kernel stays in the package chain and the real-Postgres suite
      # must stay excluded from the no-DB job AND named as a whole-file arg of
      # the 20.x schema/service step that runs after db:migrate with DATABASE_URL.
      - name: E-learning L2 notification-worker CI wiring contract
        run: node --test scripts/ops/elearning-notification-worker-ci-wiring.test.mjs

      # E-learning V0.1: every unit file must stay in the no-DB vitest job (not
      # excluded) and named as a whole-file arg of the unit canary; real-DB
      # suites stay in the post-migrate 20.x steps; frontend specs stay in
      # elearning-web-guard.yml and run-required-web-tests.sh.
      - name: E-learning V0.1 media CI wiring contract
        run: node --test scripts/ops/elearning-media-ci-wiring.test.mjs

      # E-learning V0.1 auth/tenant/RBAC gate wiring (no DB): dedicated config +
      # setup + whole-file real JWT suite must stay pinned on the 20.x post-migrate
      # step. Dropping the contract, swapping to a name filter, or folding the
      # suite into vitest.integration.config.ts silently disables the proof.
      - name: E-learning V0.1 auth/tenant/RBAC CI wiring contract
        run: node --test scripts/ops/elearning-v01-auth-ci-wiring.test.mjs

      # B5-b CI two-point wiring contract (no DB): the routing-policy RESOLVER suite must stay wired
      # into BOTH vitest.config.ts (exclude) AND plugin-tests.yml (directory real-DB step).
      - name: B5-b routing-resolver CI wiring contract
