      # #4612 gate4 round 4 (P3-4): the seven W4C-2 real-DB attendance suites (including this
      # PR's own primary evidence file) had no source-level two-point wiring guard of their own.
      # #4612 gate4 round 5 correction: this is NOT "every other real-DB family already had one" —
      # multitable (216 multitable-* files across this workflow's three real-DB steps' file lists)
