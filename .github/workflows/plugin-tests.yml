name: Plugin System Tests

on:
  workflow_dispatch:
  merge_group:
    types: [checks_requested]
  push:
    branches: [main, develop]
    paths:
      - 'packages/core-backend/**'
      - 'plugins/**'
      - 'apps/web/src/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/*.yml'
  pull_request:
    branches: [main, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dingtalk-p4-ops-regression-gate:
    name: DingTalk P4 ops regression gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Run DingTalk P4 ops regression gate
        run: |
          node scripts/ops/dingtalk-p4-regression-gate.mjs \
            --profile ops \
            --output-dir output/dingtalk-p4-regression-gate/ci

      - name: Upload DingTalk P4 ops regression gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dingtalk-p4-ops-regression-gate
          path: output/dingtalk-p4-regression-gate/ci/
          if-no-files-found: ignore

  k3wise-offline-poc:
    name: K3 WISE offline PoC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Run K3 WISE offline PoC readiness smoke
        run: |
          pnpm run verify:integration-k3wise:poc

      - name: Run on-prem package apply and archive contract tests
        run: |
          node --test \
            scripts/ops/onprem-windows-system-hardening.test.mjs \
            scripts/ops/multitable-onprem-package-no-node-modules.test.mjs

      - name: Run DingTalk OAuth-stability metrics-auth contract test (DT-CLOSE-01)
        run: |
          node --test scripts/ops/dingtalk-oauth-stability-metrics-auth-contract.test.mjs

      - name: Run DingTalk closeout env-contract test (DT-CLOSE-02)
        run: |
          node --test scripts/ops/dingtalk-closeout-env-contract.test.mjs

      - name: Run DingTalk OAuth-stability metrics-only contract test (DT-CLOSE-01B)
        run: |
          node --test scripts/ops/dingtalk-oauth-stability-metrics-only-contract.test.mjs

      - name: Run DingTalk OAuth-stability metrics-only full-script test (DT-CLOSE-01B)
        run: |
          node --test scripts/ops/dingtalk-oauth-stability-metrics-only-fullscript.test.mjs

      - name: Run DingTalk OAuth-stability summary + workflow contract tests (DT-CLOSE-01B)
        run: |
          node --test \
            scripts/ops/github-dingtalk-oauth-stability-summary.test.mjs \
            scripts/ops/dingtalk-oauth-stability-workflow-contract.test.mjs

  stock-prep-powershell51:
    name: stock-prep PowerShell 5.1 acceptance
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      # The release package runs this acceptance boundary under Windows PowerShell 5.1. pwsh 7 has
      # different native-stderr semantics and cannot stand in for the target shell contract.
      - name: Run target-shell smoke capture regression
        shell: powershell
        run: |
          $powershell51 = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
          & $powershell51 -NoProfile -ExecutionPolicy Bypass -File `
            scripts/ops/__tests__/stock-preparation-onprem-acceptance.ps51.tests.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # R12-C: the Global History flag manifest is an operator contract — the status helper reads it to
      # decide safe flag combinations. This node:test (no deps, no DB) is source-derived: it fails if a
      # MULTITABLE_ flag read in packages/core-backend/src is missing from the manifest. Runs early so a
      # manifest/source drift fails the required `test` check fast, before the pnpm install/build.
      - name: Global History flag manifest contract (R12-C)
        run: node --test scripts/ops/global-history-flag-manifest.test.mjs scripts/ops/multitable-global-history-flag-status.test.mjs

      # PB4-2 CI two-point wiring contract (no DB): the archive-read-only two-connection suite must
      # stay wired into BOTH vitest.config.ts (exclude) AND plugin-tests.yml (directory real-DB step).
      # Dropping either point makes the whole barrier suite silently never run while CI stays green.
      - name: PB4-2 archive-read-only CI wiring contract
        run: node --test scripts/ops/pb4-2-archive-readonly-ci-wiring.test.mjs

      # PB4-3 CI two-point wiring contract (no DB): the cycle-detection suite (advisory-lock barrier
      # + termination proof) must stay wired into BOTH vitest.config.ts (exclude) AND plugin-tests.yml
      # (directory real-DB step). Dropping either point silently disables the concurrency proof.
      - name: PB4-3 cycle-detection CI wiring contract
        run: node --test scripts/ops/pb4-3-cycle-detection-ci-wiring.test.mjs

      # PB4-4 CI two-point wiring contract (no DB): the reactivation suite (2-way/5-way concurrency
      # single-audit proof) must stay wired into BOTH vitest.config.ts (exclude) AND plugin-tests.yml
      # (directory real-DB step). Dropping either point silently disables the reactivation proof.
      - name: PB4-4 reactivation CI wiring contract
        run: node --test scripts/ops/pb4-4-reactivation-ci-wiring.test.mjs

      # B4 CI two-point wiring contract (no DB): the department-bindings FK-chain suite must stay
      # wired into BOTH vitest.config.ts (exclude) AND plugin-tests.yml (directory real-DB step).
      # Dropping either point silently disables the cross-org-FK-impossible proof.
      - name: B4 department-bindings CI wiring contract
        run: node --test scripts/ops/b4-department-bindings-ci-wiring.test.mjs

      # The production monitor invokes the same state helper covered here.
      # Keep this in the required 18/20 matrix so HTTP classification, silence
      # barriers, and alert/recovery streak semantics cannot drift silently.
      - name: Prod health probe monitor contract
        run: node --test scripts/ops/prod-health-probe-state.test.mjs

      # #4210 T9: the stock-preparation one-click acceptance script's cross-platform contract + behavioural
      # tests are pure pwsh 7 + tar + node. Run once in the required 20.x arm. The package's target-shell
      # semantics are covered separately by the Windows PowerShell 5.1 job above; neither shell substitutes
      # for the other.
      - name: Run stock-preparation on-prem acceptance tests (T9, pwsh)
        if: matrix.node-version == '20.x'
        shell: pwsh
        run: |
          ./scripts/ops/__tests__/stock-preparation-onprem-acceptance.tests.ps1
          ./scripts/ops/__tests__/stock-preparation-onprem-acceptance.behavior.tests.ps1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false
      - name: Show pnpm version
        run: pnpm -v
      - name: Use empty npmrc for pnpm
        run: |
          echo "" > /tmp/empty-npmrc
          echo "NPM_CONFIG_USERCONFIG=/tmp/empty-npmrc" >> "$GITHUB_ENV"

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies (with log)
        run: |
          set -o pipefail
          pnpm install --frozen-lockfile 2>&1 | tee install.log
      - name: Upload install log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: install-log-${{ matrix.node-version }}
          path: install.log

      - name: Run linting
        if: matrix.node-version == '20.x'
        run: |
          pnpm lint

      - name: Run type checking
        if: matrix.node-version == '20.x'
        run: |
          pnpm type-check

      - name: Run core-backend tests
        run: |
          pnpm --filter @metasheet/core-backend test

      - name: Run rich-text longText XSS write-sanitizer canaries
        # Security-critical: the write-path sanitizer is the authoritative XSS defense
        # for rich-text longText. Run the canary suite explicitly (and fail-fast) so it
        # stays gated even if the default vitest discovery globs ever change.
        run: |
          pnpm --filter @metasheet/core-backend exec vitest run tests/unit/richtext-longtext-sanitizer.test.ts --reporter=dot

      - name: Run F3 storage-integrity canaries
        # Security-critical (F3 path-traversal + storage integrity): the LocalStorageProvider
        # server-key/containment/index-free read, the controlled url-fallback accept/reject, and the
        # three-state ACL are the authoritative defenses. Run them explicitly (fail-fast) so they stay
        # gated even if the default vitest discovery globs ever change.
        run: |
          pnpm --filter @metasheet/core-backend exec vitest run \
            tests/unit/storageServiceLocalProvider.test.ts \
            tests/unit/filesStorageKey.test.ts \
            tests/unit/filesAcl.test.ts \
            --reporter=dot

      - name: Start Postgres
        uses: ankane/setup-postgres@v1
        with:
          postgres-version: 14
          user: postgres
      - name: Create test database
        run: |
          createdb -U postgres metasheet_test || true

      - name: Run DB migrations
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/metasheet_test
          # T8 (migration-exclusion docs+guard hardening) note: this MIGRATION_EXCLUDE is the
          # CI per-PR gate's list, a DIFFERENT mechanism from migration-replay.yml's own subset
          # (narrower job: run db:migrate twice, assert idempotency) and from
          # SUPERSEDED_LEGACY_SQL_MIGRATIONS in packages/core-backend/src/db/migration-provider.ts
          # (no-ops a migration's body but keeps its name; this drops name+body entirely). See
          # packages/core-backend/MIGRATION_EXCLUDE_TRACKING.md and
          # docs/development/superseded-legacy-migrations-gap-audit-20260710.md for the full
          # cross-list picture. #4162 follow-up (2026-07-13): the views/view_states migration
          # and the three snapshot-cluster migrations are re-enabled below (in all five
          # workflow lists at once), so their up() bodies now DO get per-PR green CI runs.
          # Remaining asymmetry: production/on-prem db:migrate runs with no exclude at all,
          # so the STILL-excluded items (008/048/049, 042a, gantt, 20250925) keep that gap.
          # Exclude problematic migrations (see migration-replay.yml for the per-item detail
          # this workflow shares):
          # 008_plugin_infrastructure.sql - has idempotency issue with scope column
          # 048/049 (event bus / BPMN) - Phase 2 migrations with complex SQL syntax issues
          # 042a_core_model_views.sql - References non-existent last_accessed column
          # Re-enabled per #4162 (2026-07-13): 20250924120000_create_views_view_states.ts and the three
          # snapshot-cluster migrations (20251117000001_add_snapshot_labels, 20251117000002_create_protection_rules,
          # 20251201000001_create_change_management_tables) now RUN here. Their old per-item exclusion reasons were
          # re-tested and are stale (same class as the 20250925 one #3627 fixed): fresh-DB migrate, second-pass
          # replay, and the snapshot-protection E2E (21/21) all pass with them applied.
          # 20250924140000_create_gantt_tables.ts - FK points at pre-fix text view ids
          # 20250925_create_view_tables.sql - legacy owner_id FK assumes pre-text user ids during replay.
          #   NOTE: this exact bug was fixed by #3627, and migration-replay.yml already dropped
          #   this exclusion in #3632 (verified passing there); this workflow was never
          #   re-verified/updated to match, so this exclusion may now be stale rather than still
          #   required — needs re-verification before removal, not a piecemeal drop (see #4162).
          # NOTE: zzzz20260114110000_create_user_orgs_table.ts is intentionally NOT in this
          #   list (unlike observability-*.yml/safety-guard-e2e.yml/migration-replay.yml, which
          #   all exclude it because it hits a legacy user_orgs is_active replay incompatibility
          #   there): this job's attendance integration step needs the user_orgs table applied,
          #   so it was deliberately removed from here in b1fc1e19d1
          #   ("ci(attendance): run integration gate against postgres") — "Include the user_orgs
          #   migration in plugin-test database setup because attendance auto-absence now
          #   depends on that table."
          MIGRATION_EXCLUDE: 008_plugin_infrastructure.sql,048_create_event_bus_tables.sql,049_create_bpmn_workflow_tables.sql,042a_core_model_views.sql,20250924140000_create_gantt_tables.ts,20250925_create_view_tables.sql
        run: |
          pnpm --filter @metasheet/core-backend db:migrate

      - name: Run required after-sales install integration
        if: matrix.node-version == '20.x'
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/metasheet_test
        run: |
          : "${DATABASE_URL:?DATABASE_URL is required for after-sales integration}"
          pnpm --filter @metasheet/core-backend exec vitest --config vitest.integration.config.ts run tests/integration/after-sales-plugin.install.test.ts --reporter=dot

      # Real-APP-ASSEMBLY guard. Route-level unit tests mount ONE router in isolation, so every path they
      # exercise belongs to that router — mount order and the SCOPE of middleware added inside a router are
      # structurally invisible to them. This boots the real MetaSheetServer and asserts that no router
      # mounted under /api intercepts traffic it does not own. Excluded from the no-DB default job
      # (vitest.config.ts) so it cannot skip-green, and wired here as a WHOLE FILE — this repo's two-point
      # wiring. --reporter=verbose prints every collected file and test name, so an empty collection shows
      # up in the log instead of reading as green.
      - name: Run real-app assembly guard (router isolation)
        if: matrix.node-version == '20.x'
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/metasheet_test
        run: |
          : "${DATABASE_URL:?DATABASE_URL is required for the real-app assembly guard}"
          pnpm --filter @metasheet/core-backend exec vitest --config vitest.integration.config.ts run \
            tests/integration/router-isolation.smoke.test.ts \
            --reporter=verbose

      # Snapshot Protection System E2E (GHSA-h8mf). Boots the real MetaSheetServer and asserts the
      # platform-admin gate + restore-scope invariant on every snapshot mutation surface (create /
      # delete / label / restore). Excluded from the no-DB default job (vitest.config.ts) because it
      # needs a real DB + server — so before this it ran in NO CI job at all (excluded but never
      # wired into a real-DB step): a silent false-green. Wired here as a WHOLE FILE (this repo's
      # two-point wiring). Its beforeAll HARD-FAILS (throws) on any setup failure rather than
      # `return`ing empty, and --reporter=verbose prints the collected file+tests so an empty run
      # shows in the log instead of reading as green. This suite has caught an app-level middleware
      # leak; keeping it out of CI is not an acceptable long-term state.
      - name: Run snapshot-protection E2E (GHSA-h8mf authz)
        if: matrix.node-version == '20.x'
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/metasheet_test
        run: |
          : "${DATABASE_URL:?DATABASE_URL is required for the snapshot-protection E2E}"
          pnpm --filter @metasheet/core-backend exec vitest --config vitest.integration.config.ts run \
            tests/integration/snapshot-protection.test.ts \
            --reporter=verbose

      - name: Run multitable real-DB integration (permission golden + view-aggregate + formula dry-run + read-path field mask + foreign-field taint mask + dashboard authz + realtime invalidation + automation retry provenance + cross-base governed automation writes + webhook outbound chain + AI shortcut run + AI ledger retention sweep + record-level version restore + rollup countall non-gating characterization + rollup filter condition fail-closed + rollup string/boolean reducers + dashboard non-numeric rollup rejection + dashboard-level filtering (narrow/AND/row-deny/no-side-channel) + record recycle-bin delete/restore + field type-retype revert schema-only scalar-gated + cross-base relation-agg authorized-reader read gate + dangling-link repair-on-read + sheet-delete cascade + oapi-4a per-base/sheet scope guard + oapi-4a REST token-create scope + mirror-read-only enumeration hardening + cross-base editable-mirror write-through op + cross-base mirror write-through Decision-F concurrency + personal-views slice-1 actor-scoped isolation + W1-2 permission-matrix B1 side-door goldens (Yjs bridge flush actor-tier/lock/row-deny/rule-deny, OAPI token write re-gate parity, base-write/sheet-write non-intersection) + W1-2 permission-matrix B2 oracle/no-leak goldens (G-5 row-level-read-deny zero-presence on export + history, G-4 OAPI token-vs-interactive read-mask parity across the 5 records:read routes) + W1-2 permission-matrix B3 management-surface 403 matrix (field/view CRUD, sheet-permission grant, sheet_config flag + conditional-rules, across A3/A4/A5/A6 actor tiers) + W1-2 permission-matrix B4 G-7 export⊆read differential (field-mask/row-deny/taint modifier combinations, same actor) + W1-1 formula freshness goldens (Yjs-bridge formula recompute GF1-GF4/GF9 + expression-change bulk recompute GF5-GF8/GF12) + W1-3 per-subject field-write gate goldens (Yjs bridge flush GW1-GW3 headline/positive-control/atomic-mixed, single-record PATCH GW4-GW6 mst_-token/session-JWT dual-caller + regression spot-check) + W3-5 batchId===null default (record-service.ts single-record self-referential batch_id vs record-write-service.ts bulk fresh-id control) + W1-2 permission-matrix B4 G-8 comments sheet-visibility gate (comments:read/write actor 403'd on a no-read sheet across list/summary/presence read + create write + no identifier/content leak) + LOCK-12 partial-success bulk PATCH shared-batch grouping + 4c-2 forward tombstone-capture flag-off/on/cap goldens (field-delete value+link+auto-number capture, record-delete inbound-only capture, R1 undelete rehydration + masking parity, retention keep-days sweep) + D-6 config-restore-execute metaFieldCache invalidation golden + F2 attachment-download read-gate row-deny/field-mask security regression guard + AI-fields S1 write-provenance/batch-grouping goldens + A6-3-3a automation branch-local-wait suspend/resume goldens + Phase C2 cross-base automation governed DELETE/LOCK goldens + C1 automation real-time fan-out goldens + duplicate/clone record route security goldens + T3-6 approval-record multitable projection goldens — six previously skip-green DB-gated specs now actually executing + D-1c §0.6 HISTORY_INCOMPLETE fail-closed precheck goldens G-HI-1..4 + D-1c W0 slice ① form-submit CREATE/EDIT public-form revision goldens, incl. zero-row concurrent-delete fail-closed + D-1c W0 slice ② plugin-SDK createRecord/patchRecord revision goldens, incl. genuine-lock-race concurrent-delete fail-closed + D-1c W0 slice ③ automation create_record/update_record revision goldens, incl. genuine-lock-race concurrent-delete fail-closed + D-1c W0 slice ④ approval resultWriteback revision goldens, incl. genuine-lock-race concurrent-delete fail-closed + D-1c W0 slice ⑤ (FINAL) attachment-delete cell-strip revision goldens, incl. zero-row concurrent-delete fail-closed + W0 tail field-undelete rehydration revision goldens (version-bump + emit-at-new-version, W0-1 contiguity/content-projection positive control, zero-row concurrent-delete fail-closed — un-pends the last OD-6 KNOWN_REVISION_GAPS entry) + W0-1 L4 all-writer canonical fence goldens (module fence-before-check/durable-block claim-reclaim-refuse/CHECK closed-set, per-fenced-family production-wiring refusal for REST create/patch/delete + bulk + plugin patch + plugin recoverable delete, partial-fence gap exposure for plugin create + auto-number backfill, flag-off parity, constructed TOCTOU race via pg_blocking_pids, exact-bigint synthetic-seq ordering) + W0-1 v3.7 L5 trust-checkpoint schema goldens (building→active state machine, partial-unique one-active guard + concurrent double-activation race, seq-based + display-T totally-ordered selection across the 2^53 boundary, floor-clamped retention prune, non-forgeable server-owned system_kind, P3-2 fail-closed strict-enablement precondition) + W0-1 L6-a sealed operation-endpoint ledger goldens (endpoint-last exact count/max validation, DEFERRABLE-FK write-events-but-never-seal fails at COMMIT, append-after-seal refusal, endpoint-before-events refusal, legacy-NULL exemption, exact-bigint 2^53 neighbours, G-BATCH-ENDPOINT bulk multi-row anchor + REST create/patch mint-under-fence wiring, G-MULTIOP one-commit-N-transactions batch↔operation decouple, §F2 UPDATE-immutability, §H1 DELETE-immutability + retention-only deletion, §H2 whole-operation atomic retention prune, §H3 fail-closed schema probe, flag-off parity))
        if: matrix.node-version == '20.x'
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/metasheet_test
          METASHEET_REAL_DB_TEST_STEP: '1' # marks the real-DB allowlist step so a fail-not-skip sentinel can scope its throw here only
        run: |
          : "${DATABASE_URL:?DATABASE_URL is required for multitable real-DB integration}"
          pnpm --filter @metasheet/core-backend exec vitest --config vitest.integration.config.ts run \
            tests/integration/multitable-permission-golden-d3d1.test.ts \
            tests/integration/multitable-permission-golden-d3d2.test.ts \
            tests/integration/multitable-context.api.test.ts \
            tests/integration/multitable-view-aggregate.test.ts \
            tests/integration/multitable-typed-query-numeric-view.test.ts \
            tests/integration/multitable-formula-over-lookup-view.test.ts \
            tests/integration/multitable-formula-over-lookup-create-view.test.ts \
            tests/integration/multitable-formula-over-lookup-afull-view.test.ts \
            tests/integration/multitable-fol1-related-invalidation.test.ts \
            tests/integration/multitable-bidirectional-mirror-links.test.ts \
            tests/integration/multitable-formula-dryrun.test.ts \
            tests/integration/multitable-records-read-field-mask.test.ts \
            tests/integration/multitable-readpath-search-filter-field-mask.test.ts \
            tests/integration/multitable-viewconfig-filter-literal-redaction.test.ts \
            tests/integration/multitable-viewconfig-resave-guard.test.ts \
            tests/integration/multitable-records-list-authz.test.ts \
            tests/integration/multitable-rowlevel-readdeny-enforce.test.ts \
            tests/integration/multitable-conditional-rule-enforce-realdb.test.ts \
            tests/integration/multitable-conditional-rule-trash-realdb.test.ts \
            tests/integration/multitable-oapi1-token-read-realdb.test.ts \
            tests/integration/multitable-oapi1-comments-read-realdb.test.ts \
            tests/integration/multitable-oapi2a-token-write-realdb.test.ts \
            tests/integration/multitable-oapi2a-comments-write-realdb.test.ts \
            tests/integration/multitable-oapi2a-ratelimit-realdb.test.ts \
            tests/integration/multitable-oapi-scope-guard-realdb.test.ts \
            tests/integration/multitable-oapi-token-create-scope.api.test.ts \
            tests/integration/multitable-permmatrix-b1-oapi-token-write-realdb.test.ts \
            tests/integration/multitable-permmatrix-b2-g4-oapi-mask-parity-realdb.test.ts \
            tests/integration/multitable-mirror-readonly-enumeration-realdb.test.ts \
            tests/integration/multitable-crossbase-mirror-writethrough-realdb.test.ts \
            tests/integration/multitable-crossbase-mirror-writethrough-concurrency-realdb.test.ts \
            tests/integration/multitable-fieldperm-write-gate-patch-realdb.test.ts \
            tests/integration/multitable-patch-batchid-echo-realdb.test.ts \
            tests/integration/multitable-lock12-partialsuccess-shared-batch-realdb.test.ts \
            tests/integration/multitable-permmatrix-b3-mgmt-403-matrix-realdb.test.ts \
            tests/integration/multitable-w13-fieldperm-writegate-bridge-realdb.test.ts \
            tests/integration/multitable-w13-fieldperm-writegate-singlerecord-realdb.test.ts \
            tests/integration/multitable-conditional-rules-api.test.ts \
            tests/integration/multitable-rowlevel-readdeny-xrec.test.ts \
            tests/integration/multitable-rowlevel-readdeny-flag-endpoint.test.ts \
            tests/integration/multitable-permmatrix-b2-g5-collection-noleak-realdb.test.ts \
            tests/integration/multitable-permmatrix-b4-g7-export-subset-read-realdb.test.ts \
            tests/integration/multitable-permmatrix-b4-g8-comments-visibility-realdb.test.ts \
            tests/integration/multitable-record-history-field-mask.test.ts \
            tests/integration/multitable-record-restore.test.ts \
            tests/integration/multitable-restore-backreference-realdb.test.ts \
            tests/integration/multitable-record-recycle-bin.test.ts \
