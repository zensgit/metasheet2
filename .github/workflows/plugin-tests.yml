      # DT-CLOSE-01C: the ARG_MAX / E2BIG payload-handoff regression of the scheduled
      # "DingTalk OAuth Stability Recording (Lite)" workflow (rc=126). This drives the real
      # dingtalk-oauth-stability-check.sh against a PATH-shimmed ssh whose /metrics/prom response is
      # larger than the machine's own `getconf ARG_MAX`, and includes a red-under-revert mutation.
