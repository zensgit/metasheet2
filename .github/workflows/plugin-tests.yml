      # job's vitest.config.ts AND carried EXACTLY ONCE by a provably-executed real-DB invocation,
      # and must exist on disk. NEITHER is REFUSED: the exit that let a suite submit a "positive
      # proof" of DB-independence is DELETED (4828, 2026-08-09). Placed BEFORE the install: a break reds
      # this required check in seconds. That is also why the corpus is derived statically rather
      # than from vitest's own collection, which does not exist yet at this point in the job.
      - name: Attendance W4C-2 CI wiring contract
        run: node --test scripts/ops/attendance-w4c2-ci-wiring.test.mjs

      # #4556 W4C-3c P15/P16: node:test behavior contracts are not discovered
