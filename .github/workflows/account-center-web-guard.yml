name: Account Center Web Guard

# Account center web guard. Whole spec paths prevent an empty name filter from passing without running tests.
# Path-filtered PR and push runs deliberately have no merge_group trigger.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/web/src/components/AuthorizationAuditFeed.vue'
      - 'apps/web/src/views/AdminAuditView.vue'
      - 'apps/web/src/router/appRoutes.ts'
      - 'apps/web/src/utils/api.ts'
      - 'apps/web/tests/authorizationAuditFeed.spec.ts'
      - 'apps/web/tests/adminAuditView.spec.ts'
      - 'apps/web/tests/public-multitable-form.spec.ts'
      - 'apps/web/scripts/run-required-web-tests.sh'
      - 'apps/web/scripts/run-required-web-tests.tokens'
      - 'apps/web/vite.config.ts'
      - 'apps/web/package.json'
      - 'packages/core-backend/src/admin/authorization-operation-audit-feed.ts'
      - 'packages/core-backend/src/routes/admin-users.ts'
      - 'packages/core-backend/src/auth/security-action-proof.ts'
      - 'packages/core-backend/src/auth/admin-login-grant-command.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/account-center-web-guard.yml'
      - 'apps/web/src/account/accountCenterContract.ts'
      - 'apps/web/src/account/useAccountCenterRead.ts'
      - 'apps/web/tests/accountCenterRead.spec.ts'
  push:
    branches: [main]
    paths:
      - 'apps/web/src/components/AuthorizationAuditFeed.vue'
      - 'apps/web/src/views/AdminAuditView.vue'
      - 'apps/web/src/router/appRoutes.ts'
      - 'apps/web/src/utils/api.ts'
      - 'apps/web/tests/authorizationAuditFeed.spec.ts'
      - 'apps/web/tests/adminAuditView.spec.ts'
      - 'apps/web/tests/public-multitable-form.spec.ts'
      - 'apps/web/scripts/run-required-web-tests.sh'
      - 'apps/web/scripts/run-required-web-tests.tokens'
      - 'apps/web/vite.config.ts'
      - 'apps/web/package.json'
      - 'packages/core-backend/src/admin/authorization-operation-audit-feed.ts'
      - 'packages/core-backend/src/routes/admin-users.ts'
      - 'packages/core-backend/src/auth/security-action-proof.ts'
      - 'packages/core-backend/src/auth/admin-login-grant-command.ts'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/account-center-web-guard.yml'
      - 'apps/web/src/account/accountCenterContract.ts'
      - 'apps/web/src/account/useAccountCenterRead.ts'
      - 'apps/web/tests/accountCenterRead.spec.ts'

permissions:
  contents: read

jobs:
  account-center-web-guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false
      - name: Use empty npmrc for pnpm
        run: |
          echo "" > /tmp/empty-npmrc
          echo "NPM_CONFIG_USERCONFIG=/tmp/empty-npmrc" >> "$GITHUB_ENV"
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run account center web specs
        working-directory: apps/web
        env:
          DATABASE_URL: postgres://127.0.0.1:1/none
        run: pnpm exec vitest run tests/authorizationAuditFeed.spec.ts tests/adminAuditView.spec.ts tests/public-multitable-form.spec.ts tests/accountCenterRead.spec.ts
      - name: Type-check the web app
        working-directory: apps/web
        run: node --max-old-space-size=4096 node_modules/vue-tsc/bin/vue-tsc.js -b
