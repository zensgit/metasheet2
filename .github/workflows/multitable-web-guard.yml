jobs:
  multitable-web-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Use empty npmrc for pnpm
        run: |
          echo "" > /tmp/empty-npmrc
          echo "NPM_CONFIG_USERCONFIG=/tmp/empty-npmrc" >> "$GITHUB_ENV"

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run multitable web guard specs (targeted)
        # A1: meta-grid-table (windowing + infinite-scroll trigger) + multitable-grid (useMultitableGrid
        # accumulation/loadMore) added so the grid virtualization ACTIVATION has real CI enforcement —
        # the guard already triggers on MetaGridTable.vue / useMultitableGrid.ts / MultitableWorkbench.vue
        # edits but, before this, ran none of those specs (and plugin-tests.yml only build-checks web).
        #
        # 20260705 gap-closure: field-visibility / required-if / conditional-formatting added.
        # field-visibility.ts + MetaFormView.vue (the public-form conditional show-IF/required-IF
        # gate) and conditional-formatting.ts (the shared rule evaluator both reuse) had NO CI teeth
        # at all — not a path trigger on this workflow, not in this vitest filter, and the only other
        # lane touching conditional-formatting.ts (multitable-browser-verify.yml) is a Playwright
        # render/screenshot check, not a unit test of the pure evaluator/guard functions. A regressed
        # "hidden field is never conditionally required" invariant (MetaFormView `validate()`) could
        # land green and silently block public-form submission. See docs/development/
        # multitable-formview-conditional-guard-{design,verification}-20260705.md.
        # UF-3: status-color convergence — statusTag (StatusTag.vue + statusDomains.ts unit/mount
        # coverage), AutomationExecutionsView + parallelBranchRunsView (automationRun domain status
        # badges, run + step level, including the parallel-branch readability regression).
        # L1c: HistoryBatchChangesList.vue's only behavioral coverage — 3 specs that mount the real
        # component tree via HistoryCenterModal (inline-diff, ai-shortcut-label, pinned-batch-deeplink)
        # — were exercised in NO CI gate; added alongside their new path triggers above.
        run: pnpm --filter @metasheet/web exec vitest run automation-action-summary automation-recipes automation-save-block-reasons automation-target-sheet-options AutomationExecutionsView meta-automation-labels meta-filter-group meta-grid-table meta-toolbar-filter-builder migration multitable-automation-manager multitable-automation-rule-editor multitable-cell-renderer-person-inactive multitable-conditional-formatting multitable-conditional-rule multitable-config-history-modal multitable-config-revert-refresh multitable-field-manager multitable-field-visibility multitable-grid multitable-history-center-ai-shortcut-label multitable-history-center-inline-diff multitable-history-center-pinned-batch-deeplink multitable-history-fe multitable-kanban-view multitable-person-picker multitable-record-permission-manager multitable-reorder-view-fields multitable-required-if multitable-reset-confirm-dialog multitable-reset-tsource-picker multitable-restore-batch-dialog multitable-restore-preview-dialog multitable-rollup-aggregation-fe multitable-sheet-cursor-state multitable-sheet-permission-manager multitable-trash-fe multitable-workbench-history-field-scope-wiring multitable-workbench-restore-wiring multitable-yjs-cell-editor multitable-yjs-scalar-cell parallelBranchRunsView statusTag --reporter=dot
