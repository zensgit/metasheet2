name: Admin Users Real DB Review

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/core-backend/src/admin/**'
      - 'packages/core-backend/src/auth/**'
      - 'packages/core-backend/src/multitable/api-token-service.ts'
      - 'packages/core-backend/src/routes/admin-user*.ts'
      - 'packages/core-backend/src/directory/access-graph-mutex.ts'
      - 'packages/core-backend/src/rbac/role-assignment.ts'
      - 'packages/core-backend/src/rbac/namespace-admission.ts'
      - 'packages/core-backend/src/routes/attendance-admin.ts'
      - 'packages/core-backend/src/routes/permissions.ts'
      - 'packages/core-backend/src/rbac/service.ts'
      - 'packages/core-backend/src/services/stock-preparation-members.ts'
      - 'packages/core-backend/src/db/migrations/**'
      - 'packages/core-backend/tests/integration/admin-user-*.db.test.ts'
      - 'packages/core-backend/tests/integration/permission-ux-*.db.test.ts'
      - 'packages/core-backend/tests/utils/permission-lifecycle-setup.ts'
      - 'packages/core-backend/tests/utils/permission-ux-*.ts'
      - 'packages/core-backend/vitest.admin-users-realdb.config.ts'
      - 'packages/core-backend/vitest.permission-ux-*.config.ts'
      - '.github/workflows/admin-users-realdb-review.yml'
  push:
    branches: [main]
    paths:
      - 'packages/core-backend/src/admin/**'
      - 'packages/core-backend/src/auth/**'
      - 'packages/core-backend/src/multitable/api-token-service.ts'
      - 'packages/core-backend/src/routes/admin-user*.ts'
      - 'packages/core-backend/src/directory/access-graph-mutex.ts'
      - 'packages/core-backend/src/rbac/role-assignment.ts'
      - 'packages/core-backend/src/rbac/namespace-admission.ts'
      - 'packages/core-backend/src/routes/attendance-admin.ts'
      - 'packages/core-backend/src/routes/permissions.ts'
      - 'packages/core-backend/src/rbac/service.ts'
      - 'packages/core-backend/src/services/stock-preparation-members.ts'
      - 'packages/core-backend/src/db/migrations/**'
      - 'packages/core-backend/tests/integration/admin-user-*.db.test.ts'
      - 'packages/core-backend/tests/integration/permission-ux-*.db.test.ts'
      - 'packages/core-backend/tests/utils/permission-lifecycle-setup.ts'
      - 'packages/core-backend/tests/utils/permission-ux-*.ts'
      - 'packages/core-backend/vitest.admin-users-realdb.config.ts'
      - 'packages/core-backend/vitest.permission-ux-*.config.ts'
      - '.github/workflows/admin-users-realdb-review.yml'

permissions:
  contents: read

jobs:
  admin-users-realdb-review:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        slice: [batch, recycle, permission-ux-admin, permission-ux-legacy, permission-ux-witness]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: admin_review_synthetic
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d admin_review_synthetic"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/admin_review_synthetic
      EXPECT_DB: '1'
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_ENV: development
      - name: Apply real migration chain
        run: pnpm --filter @metasheet/core-backend migrate
      - name: Batch regression tests against isolated PostgreSQL
        if: matrix.slice == 'batch'
        run: |
          mkdir -p artifacts/admin-users-realdb
          pnpm --filter @metasheet/core-backend exec vitest run --config vitest.admin-users-realdb.config.ts \
            tests/integration/admin-user-batch-review.db.test.ts \
            --reporter=verbose --reporter=json --outputFile.json=../../artifacts/admin-users-realdb/batch-vitest.json
          node scripts/ops/vitest-zero-skip.mjs artifacts/admin-users-realdb/batch-vitest.json 1
      - name: Recycle regression tests against isolated PostgreSQL
        if: matrix.slice == 'recycle'
        run: |
          mkdir -p artifacts/admin-users-realdb
          pnpm --filter @metasheet/core-backend exec vitest run --config vitest.admin-users-realdb.config.ts \
            tests/integration/admin-user-recycle-review.db.test.ts \
            --reporter=verbose --reporter=json --outputFile.json=../../artifacts/admin-users-realdb/recycle-vitest.json
          node scripts/ops/vitest-zero-skip.mjs artifacts/admin-users-realdb/recycle-vitest.json 1
      - name: Permission management UX against isolated PostgreSQL
        if: startsWith(matrix.slice, 'permission-ux-')
        run: |
          mkdir -p artifacts/admin-users-realdb
          pnpm --filter @metasheet/core-backend exec vitest run --config vitest.${{ matrix.slice }}.config.ts \
            --reporter=verbose --reporter=json --outputFile.json=../../artifacts/admin-users-realdb/${{ matrix.slice }}-vitest.json
          node scripts/ops/vitest-zero-skip.mjs artifacts/admin-users-realdb/${{ matrix.slice }}-vitest.json 1
      - name: Upload real database verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-users-realdb-${{ matrix.slice }}
          path: artifacts/admin-users-realdb/*-vitest.json
          if-no-files-found: warn
