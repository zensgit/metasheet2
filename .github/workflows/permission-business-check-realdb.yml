name: Permission Business Check Real DB

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/core-backend/src/**'
      - 'packages/core-backend/tests/integration/business-check-realdb.test.ts'
      - 'packages/core-backend/tests/utils/permission-lifecycle-preflight.ts'
      - 'packages/core-backend/vitest.business-check-realdb.config.ts'
      - 'packages/core-backend/package.json'
      - 'packages/core-backend/vitest.config.ts'
      - 'packages/core-backend/vitest.integration.config.ts'
      - 'plugins/plugin-integration-core/lib/**'
      - 'scripts/ops/permission-business-check-realdb*.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/permission-business-check-realdb.yml'
  push:
    branches: [main]
    paths:
      - 'packages/core-backend/src/**'
      - 'packages/core-backend/tests/integration/business-check-realdb.test.ts'
      - 'packages/core-backend/tests/utils/permission-lifecycle-preflight.ts'
      - 'packages/core-backend/vitest.business-check-realdb.config.ts'
      - 'packages/core-backend/package.json'
      - 'packages/core-backend/vitest.config.ts'
      - 'packages/core-backend/vitest.integration.config.ts'
      - 'plugins/plugin-integration-core/lib/**'
      - 'scripts/ops/permission-business-check-realdb*.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/permission-business-check-realdb.yml'

permissions:
  contents: read

jobs:
  business-check-realdb:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic
          POSTGRES_DB: permission_check_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d permission_check_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:synthetic@127.0.0.1:5432/permission_check_test
      PERMISSION_CHECK_DISPOSABLE_DB: permission_check_test
      DELEGATED_SCOPE_EXACT_DEPARTMENT_ENABLED: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify runner fail-closed checks
        run: node --test scripts/ops/permission-business-check-realdb.test.mjs
      - name: Run trust-off and trust-on HTTP against isolated PostgreSQL
        run: node scripts/ops/permission-business-check-realdb.mjs
