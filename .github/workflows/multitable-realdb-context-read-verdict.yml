name: Multitable real-DB acceptance (/context read verdict)

# EVIDENCE LANE for GET /api/multitable/context taking its sheet read verdict, its sibling-sheet list
# and its capability block from the shared fenced resolvers (resolveSheetCapabilitiesForAccess /
# filterReadableSheetRowsForAccess, multitable/permission-service.ts):
#   - tests/integration/multitable-context-read-verdict.db.test.ts — real approval provisioning
#     (createTemplate / publishTemplate / createApproval → reconcile()), an e-learning read-model sheet
#     in the mapping migration's shape, a stock-preparation overview sheet and ordinary fixtures. Pins:
#     a sheet the shared resolver does not let the caller read answers byte-identically to an absent
#     sheet for that same caller (by sheet id and through a view); a system read-model base with no
#     readable sheet answers like an absent base; participants see their own sheet, the read plane
#     only, no sibling, whether the sheet is addressed or chosen from the base; callers with no read
#     authority keep the shared 403; an ordinary sheet's whole response is unchanged, and admins,
#     e-learning administrators of the sheet's organisation, sheet-scoped grant holders on their
#     sheets and the stock-preparation overview clamp keep their access.
# Ephemeral first-party PostgreSQL container; no customer source, no deployment, no flag change.
#
# WHY A STANDALONE FILE, not a plugin-tests.yml allowlist entry: plugin-tests.yml is an s6a
# sha256-pinned provenance input (sealed-export-package-provenance.cjs PINNED_EVIDENCE_FILES), so
# every edit forces an s6a re-pin and a merge-serialisation race. This mirrors the sibling
# approval-realdb-* lanes. plugin-tests.yml is left byte-identical.
#
# TWO-POINT WIRING (the other half): the suite is excluded from the no-DB default vitest config
# (packages/core-backend/vitest.config.ts) in the SAME commit that adds this file, so the required
# `test (18.x/20.x)` job cannot collect-and-skip-green it. EXPECT_DB=1 below arms the suite's
# top-level anti-skip-green sentinel: a run in this lane with a missing/broken DATABASE_URL goes RED
# instead of silently reporting the whole file as skipped.

on:
  workflow_dispatch:
  # NO `merge_group:` — deliberately, matching the sibling approval-realdb-* evidence lanes: a
  # `merge_group` event does not honour the `paths` filter the way `pull_request` does.
  pull_request:
    # No `branches:` filter (mirrors the sibling precedents): a brand-new workflow cannot be
    # workflow_dispatch-ed until it has run once via a trigger it responds to. The `paths` filter
    # keeps it off unrelated PRs.
    paths:
      - 'packages/core-backend/tests/integration/multitable-context-read-verdict.db.test.ts'
      - 'packages/core-backend/tests/utils/sheet-existence-oracle.ts'
      - 'packages/core-backend/tests/utils/pinned-server.ts'
      - 'packages/core-backend/src/routes/univer-meta.ts'
      - 'packages/core-backend/src/multitable/permission-service.ts'
      - 'packages/core-backend/src/multitable/access.ts'
      - 'packages/core-backend/src/multitable/sheet-refusals.ts'
      - 'packages/core-backend/src/multitable/sheet-liveness.ts'
      - 'packages/core-backend/src/multitable/system-sheet-predicate.ts'
      - 'packages/core-backend/src/multitable/approval-projection-constants.ts'
      - 'packages/core-backend/src/multitable/approval-record-projection-service.ts'
      - 'packages/core-backend/src/multitable/elearning-projection-access.ts'
      - 'packages/core-backend/src/multitable/elearning-projection-constants.ts'
      - 'packages/core-backend/src/multitable/stock-preparation-overview-contract.ts'
      - 'packages/core-backend/src/multitable/business-timezone.ts'
      - 'packages/core-backend/src/multitable/personal-view-config.ts'
      - 'packages/core-backend/src/services/ApprovalProductService.ts'
      - 'packages/core-backend/src/rbac/service.ts'
      - 'packages/core-backend/src/integration/db/connection-pool.ts'
      - 'packages/core-backend/src/integration/events/event-bus.ts'
      - 'packages/core-backend/src/db/migrations/**'
      - 'packages/core-backend/tests/setup.integration.ts'
      - 'packages/core-backend/vitest.integration.config.ts'
      # Not a runtime input for this job — it is the SIBLING half of the two-point wiring.
      - 'packages/core-backend/vitest.config.ts'
      - '.github/workflows/multitable-realdb-context-read-verdict.yml'
  push:
    branches: [main]
    paths:
      - 'packages/core-backend/tests/integration/multitable-context-read-verdict.db.test.ts'
      - 'packages/core-backend/tests/utils/sheet-existence-oracle.ts'
      - 'packages/core-backend/tests/utils/pinned-server.ts'
      - 'packages/core-backend/src/routes/univer-meta.ts'
      - 'packages/core-backend/src/multitable/permission-service.ts'
      - 'packages/core-backend/src/multitable/access.ts'
      - 'packages/core-backend/src/multitable/sheet-refusals.ts'
      - 'packages/core-backend/src/multitable/sheet-liveness.ts'
      - 'packages/core-backend/src/multitable/system-sheet-predicate.ts'
      - 'packages/core-backend/src/multitable/approval-projection-constants.ts'
      - 'packages/core-backend/src/multitable/approval-record-projection-service.ts'
      - 'packages/core-backend/src/multitable/elearning-projection-access.ts'
      - 'packages/core-backend/src/multitable/elearning-projection-constants.ts'
      - 'packages/core-backend/src/multitable/stock-preparation-overview-contract.ts'
      - 'packages/core-backend/src/multitable/business-timezone.ts'
      - 'packages/core-backend/src/multitable/personal-view-config.ts'
      - 'packages/core-backend/src/services/ApprovalProductService.ts'
      - 'packages/core-backend/src/rbac/service.ts'
      - 'packages/core-backend/src/integration/db/connection-pool.ts'
      - 'packages/core-backend/src/integration/events/event-bus.ts'
      - 'packages/core-backend/src/db/migrations/**'
      - 'packages/core-backend/tests/setup.integration.ts'
      - 'packages/core-backend/vitest.integration.config.ts'
      - 'packages/core-backend/vitest.config.ts'
      - '.github/workflows/multitable-realdb-context-read-verdict.yml'

permissions:
  contents: read

jobs:
  multitable-realdb-context-read-verdict:
    name: multitable-realdb-context-read-verdict
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metasheet_multitable_realdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d metasheet_multitable_realdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/metasheet_multitable_realdb
      # Arms the suite's top-level sentinel: in THIS lane a missing DATABASE_URL is a red run, never
      # a silent skipped-green.
      EXPECT_DB: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Use empty npmrc for pnpm
        run: |
          echo "" > /tmp/empty-npmrc
          echo "NPM_CONFIG_USERCONFIG=/tmp/empty-npmrc" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run DB migrations
        env:
          # Same per-PR-gate exclusion list as plugin-tests.yml's "Run DB migrations" step
          # (see packages/core-backend/MIGRATION_EXCLUDE_TRACKING.md).
          MIGRATION_EXCLUDE: 008_plugin_infrastructure.sql,048_create_event_bus_tables.sql,049_create_bpmn_workflow_tables.sql,042a_core_model_views.sql,20250924140000_create_gantt_tables.ts,20250925_create_view_tables.sql
        run: pnpm --filter @metasheet/core-backend db:migrate

      - name: Run /context read-verdict real-DB acceptance (whole file)
        # WHOLE FILE, --reporter=verbose: a name filter matching zero tests would exit green and
        # hide regressions; verbose prints every collected test so an empty collection shows in the
        # log.
        run: >-
          pnpm --filter @metasheet/core-backend exec vitest
          --config vitest.integration.config.ts run
          tests/integration/multitable-context-read-verdict.db.test.ts
          --reporter=verbose

      - name: Values-free evidence (this job)
        run: |
          {
            echo "evidenceKind=CONTROLLED_SYNTHETIC_FUNCTIONAL"
            echo "suites=multitable-context-read-verdict.db.test.ts"
            echo "scope=GET /context takes its sheet read verdict, sibling list and capability block from the shared fenced resolvers; a sheet the resolver refuses answers byte-identically to an absent sheet for the same caller; a system read-model base with no readable sheet answers like an absent base; participants get their own sheet and the read plane only; ordinary sheets unchanged byte-for-byte; admins, e-learning organisation administrators, sheet-scoped grants and the stock-preparation overview clamp keep their access"
            echo "sentinelArmed=EXPECT_DB=1"
            echo "customerSourceAccess=NOT_INVOLVED"
            echo "flagChanged=false"
            echo "externalWrite=false"
          } | tee -a "$GITHUB_STEP_SUMMARY"
