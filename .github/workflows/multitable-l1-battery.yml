name: Multitable L1 Battery (Staging)

run-name: "Multitable L1 Battery (staging): ${{ inputs.intent }}"

# Owner-gated staging runner for the Time Machine O-2 enablement ladder's L1 exercise
# battery (docs/development/multitable-timemachine-o2-enablement-ladder-20260819.md §2,
# "L1 — staging ENABLE triggers"). L1 is the FIRST rung where platform writers actually
# collide with recovery-authority serialization (9/9 triggers ENABLE on staging, the 4
# app-side flags stay OFF). The battery (scripts/ops/multitable-l1-battery.mjs, a
# SIBLING deliverable — NOT part of this workflow) holds an exclusive recovery-authority
# lease and drives platform write surfaces over HTTP, asserting the writes collide with
# named 409s (never an unmapped 500) — the observation the ladder's L1 exit criteria
# requires (§2: "40001 发生率、S2 分类器命中... 零 unmapped 500").
#
# WHEN TO RUN: only at ladder rung L1 (after the L0 preconditions in §1 are met and the
# owner has ENABLEd the 9 triggers on staging), and only on owner instruction. This
# workflow is dispatch-only — it is NOT a required check and NOT scheduled. Running it
# outside L1 (before triggers are enabled) is harmless but pointless (nothing to collide
# with yet); running it against a target other than staging is not offered in v1 —
# production L1 gets its own separate authorization/workflow later (ladder §2 "L7+").
#
# WHAT IT WRITES: the battery creates and deletes STAMPED SYNTHETIC subjects (prefix
# `o2bat_`) on the staging database while it runs, to exercise the platform-authority
# write surfaces (see the 8 tables covered by scripts/ops/multitable-recovery-schema-
# containment.mjs: field_permissions, member_group_members, record_permissions,
# role_permissions, spreadsheet_permissions, user_permissions, user_roles, users). This
# is a WRITE action against a real (if disposable) environment, unlike the read-only
# multitable-recovery-flag-containment-check.yml — hence the mandatory typed
# acknowledgement below. The battery is expected to delete everything it created on both
# its own success and failure exit; this workflow's `residue-check` step is the backstop
# for a run that crashes before it can clean up (it must NOT silently leave synthetic
# users on staging).
#
# GUARD RAILS (house rules this workflow follows):
#   - `target` is a fixed `choice` — production is NOT offered in v1. Hard-restricting
#     the choice IS the guard (a separate, independently-authorized workflow is required
#     before this ever targets production — ladder §2 "L7+").
#   - `intent` is a required, non-empty, single-line free-text field: the operator must
#     say what step this run is for (e.g. "L1-open-battery-run-1"). Refused if empty/
#     whitespace-only (house lesson from #4769: a single online chokepoint requires a
#     mandatory, meaningful intent — see project_k3wise_first_profile_delivery.md).
#   - `acknowledge` must EXACTLY equal the literal phrase
#     `I-UNDERSTAND-THIS-WRITES-SYNTHETIC-DATA-TO-STAGING`. This is a write action;
#     the phrase must be typed, not selected, and any other value refuses loudly.
#   - SSH host identity is pinned exactly like multitable-recovery-flag-containment-
#     check.yml: StrictHostKeyChecking=yes against a DEPLOY_KNOWN_HOSTS-derived
#     known_hosts file, fail-closed if that secret is absent/unrecognizable. NEVER
#     StrictHostKeyChecking=no anywhere (the repo-wide `ssh host-key pin contract`
#     required check greps every workflow for that).
#   - The admin password never appears as a literal `docker exec -e VAR=value` argument
#     (that would put it in the deploy host's own `ps` output for as long as the exec
#     runs), and — owner-review P1, 2026-08-21 — it is never written into the backend
#     container either. It is staged as a chmod-600 file on the runner, scp'd to a
#     chmod-700 per-run directory on the deploy host, and from there PIPED ON STDIN to
#     `docker exec -i` as a two-line `KEY=<base64>` blob that the container-side wrapper
#     reads with `read`, decodes, and exports as BATTERY_ADMIN_* IN-PROCESS. The blob is
#     assembled with redirections only, so the value exists as a file only on the two
#     hosts (both scrubbed), and inside the container only as process environ — never as
#     argv, and never as a container file.
#   - NO SECRET IS EVER `docker cp`'d INTO THE CONTAINER. This is the P1 the owner found
#     and proved with real Docker: the previous implementation copied the email/password
#     into `/tmp/o2bat-creds-<stamp>/` inside the container, which puts them in the
#     container's WRITABLE LAYER, where they OUTLIVE the run. A stopped container is
#     absent from `docker ps` — so the scrub step below skipped its in-container branch
#     and still printed `VERDICT: PASS` — yet
#     `docker cp <stopped-container>:/tmp/o2bat-creds-<stamp>/password -` still returns
#     the password bytes. Stdin-only ingestion removes the persistence at its source:
#     there is no in-container credential for a stopped or killed container to strand.
#     The only `docker cp` left in this workflow copies the (non-secret) evidence JSON
#     OUT of the container; a container-prefixed cp DESTINATION is a contract violation.
#   - Credential lifecycle (staged → used → scrubbed): the email/password files are
#     STAGED on the runner and on the deploy host (stage-creds) only — never in the
#     container — then USED for exactly one run. Cleanup does NOT rely solely on the
#     battery step's own best-effort in-script `rm -rf` (lines inside its REMOTE heredoc,
#     kept as defense in depth) — that path is skipped entirely by a cancelled run, an SSH
#     drop, a runner kill, or any remote-script failure before those lines run. A
#     dedicated, always()-gated `scrub-creds` step (id: scrub-creds, placed after
#     residue-check) is the actual backstop: it removes the CURRENT run's host secrets dir
#     unconditionally, SWEEPS the host for STALE (>24h) secrets dirs left by any earlier
#     crashed run, and PROVES — state-independently — that no in-container credential path
#     exists. That in-container proof is deliberately NOT gated on `docker ps`: it uses
#     `docker cp`, which reads a STOPPED container's writable layer (where `docker exec`
#     refuses), behind a `/etc/hostname` positive control and a docker-daemon liveness
#     control, so an unreachable daemon or an unusable probe FAILS instead of masquerading
#     as "absent". Unlike the battery step, this step is NOT continue-on-error: a scrub
#     failure (verification finds residue, removal errors, or absence cannot be PROVEN)
#     FAILS THE JOB. A host with stranded admin credentials is worse than a red job.
#   - Producer failure propagates through every grep: the battery's real exit code is
#     captured via `${PIPESTATUS[0]}` on the ssh invocation (never trusted to a
#     downstream `grep`'s own exit status), and a captured `rc=0` that carries no
#     `VERDICT: PASS` line is itself treated as a failure (fail-closed — an unverifiable
#     "pass" is not a pass).
#
# REQUIRED SECRETS (existing repo-wide deploy secrets):
#   DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY_B64, DEPLOY_KNOWN_HOSTS
# REQUIRED SECRETS (NEW — the owner must create these; this workflow never invents a
# value for either):
#   STAGING_BATTERY_ADMIN_EMAIL, STAGING_BATTERY_ADMIN_PASSWORD — credentials for a
#   staging-only platform admin account the battery logs in as (POST /api/auth/login,
#   never a minted token — project convention, see feedback_prod_token_via_login_not_
#   minting.md). This account must already exist on staging before dispatch; this
#   workflow does not create/bootstrap it.
#
# CONTRACT ASSUMPTIONS ABOUT scripts/ops/multitable-l1-battery.mjs (sibling deliverable,
# NOT built here — the sibling lane must confirm/reconcile every one of these):
#   1. env DATABASE_URL — NOT set explicitly by this workflow. The battery runs via
#      `docker exec` *inside* the metasheet-staging-backend container, so it inherits
#      the container's own already-configured DATABASE_URL for free (same mechanism
#      scripts/ops/multitable-recovery-schema-containment.mjs already relies on).
#   2. env APP_URL — set by this workflow to the container-LOCAL backend URL
#      `http://127.0.0.1:<PORT>` (PORT read from the container's own env, falling back
#      to 8900 — the value baked into Dockerfile.backend / docker-compose.app.staging.yml).
#   3. env BATTERY_ADMIN_EMAIL / BATTERY_ADMIN_PASSWORD — set by this workflow from the
#      two staged secret files, which are piped to `docker exec -i` on STDIN and exported
#      by a container-side wrapper IN-PROCESS (see guard rails above). The battery itself
#      is unchanged: it still reads `env.BATTERY_ADMIN_EMAIL` / `env.BATTERY_ADMIN_PASSWORD`
#      and knows nothing about how they got there. Its own stdin is `/dev/null`.
#   4. `--out <path>` — the battery writes its evidence JSON to exactly the path given;
#      this workflow supplies a per-run path inside the container and `docker cp`'s it
#      back out.
#   5. Exit code 0 = pass, nonzero = fail.
#   6. Stdout carries at least one line beginning literally `VERDICT:`, and the pass
#      sentinel begins literally `VERDICT: PASS`. This workflow greps that line for the
#      step summary and additionally treats "exit 0 but no VERDICT: PASS* line" as a
#      failure (see guard rails above) — if the real script's pass sentinel text differs,
#      that check will need updating.
#   7. The battery deletes every synthetic subject it created, on BOTH its own success
#      and failure exit path, using the literal prefix `o2bat_`. This workflow's
#      `residue-check` step scans `users.id`/`users.email`, `platform_member_groups.name`,
#      `roles.name`, and `spreadsheets`/`meta_sheets` `id`/`name` (existence-guarded) —
#      reconciled against the battery's actual seed surface. Original narrower note (the two free-text
#      identity columns on the one table these 9 triggers actually gate that can carry an
#      arbitrary stamped string — packages/core-backend/migrations/054_create_users_
#      table.sql) and `platform_member_groups.name` (packages/core-backend/src/db/
#      migrations/zzzz20260409154000_..., in case the battery also creates a synthetic
#      group to exercise member_group_members). It does NOT scan the other 6
#      permission tables directly, on the assumption their rows are FK-owned by
#      users/platform_member_groups with ON DELETE CASCADE (true for
#      platform_member_group_members per that migration) and so cannot outlive their
#      parent row. If the battery stamps `o2bat_` into any OTHER table/column not FK-
#      cascaded from users or platform_member_groups, this residue-check will not see
#      it — the sibling lane must extend the query in that case.
#   8. The script is baked into the deployed backend image at
#      /app/scripts/ops/multitable-l1-battery.mjs (same `COPY scripts ./scripts`
#      convention Dockerfile.backend already uses for every other scripts/ops/*.mjs
#      helper invoked this way).
#   9. The battery acquires and releases its own exclusive recovery-authority lease for
#      the duration of one run; this workflow does not manage that lease, it only
#      guarantees at most one dispatch of ITSELF runs at a time (concurrency group
#      below) — it cannot defend against some independent process also holding the
#      lease.
#  10. This workflow invokes `docker exec <container> ...` directly (the established
#      convention in multitable-recovery-flag-containment-check.yml), NOT literally
#      `docker compose exec` — no compose project file is synced to this workflow, and
#      `docker exec` by the known container_name achieves the same "run inside the
#      container, inherit its env" goal without that extra machinery. Flagging this as a
#      deliberate deviation from the literal wording of the build brief, for the parent
#      to reconcile if `docker compose exec` semantics turn out to matter.
#
# NOT a required check. NOT scheduled. Modeled on multitable-recovery-flag-containment-
# check.yml (host-key pinning, verdict-line discipline) and attendance-staging-window-
# runner.yml (remote-action / artifact / step-summary shape).

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which stack to run the battery against. Fixed choice only — production is not offered in v1; it gets its own separate authorization at ladder rung L7+.'
        required: true
        type: choice
        options: [staging]
        default: staging
      intent:
        description: 'Required: what step this run is for, e.g. "L1-open-battery-run-1". Refused if empty/whitespace-only.'
        required: true
        type: string
        default: ''
      acknowledge:
        description: 'Type EXACTLY: I-UNDERSTAND-THIS-WRITES-SYNTHETIC-DATA-TO-STAGING (the battery creates and deletes stamped synthetic subjects on staging — this is a write action).'
        required: true
        type: string
        default: ''

concurrency:
  group: multitable-l1-battery-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  l1-battery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate inputs
        id: validate
        env:
          TARGET: ${{ inputs.target }}
          INTENT: ${{ inputs.intent }}
          ACKNOWLEDGE: ${{ inputs.acknowledge }}
        run: |
          set -euo pipefail

          # `choice` is a UI-only guardrail — the REST dispatch API can still send an
          # arbitrary string — so re-validate with an exact-match case (default branch
          # fails closed), same discipline as multitable-recovery-flag-containment-check.yml.
          case "$TARGET" in
            staging)
              ;;
            *)
              echo "::error::unexpected target '${TARGET}' (only 'staging' is offered in v1 — production L1 requires its own separate authorization) — refusing to proceed"
              exit 1
              ;;
          esac
          echo "target='${TARGET}'"

          if [[ "$INTENT" == *$'\n'* || "$INTENT" == *$'\r'* ]]; then
            echo "::error::intent must be a single line (no embedded newline/CR)"
            exit 1
          fi
          trimmed_intent="$(printf '%s' "$INTENT" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          if [[ -z "$trimmed_intent" ]]; then
            echo "::error::intent is required and must not be empty/whitespace-only — the operator must state what step this run is for (e.g. 'L1-open-battery-run-1'); house lesson from #4769: a single online chokepoint requires a mandatory, meaningful intent."
            exit 1
          fi
          if [[ ${#INTENT} -gt 200 ]]; then
            echo "::error::intent is too long (${#INTENT} chars, max 200)"
            exit 1
          fi
          if [[ ! "$INTENT" =~ ^[A-Za-z0-9][A-Za-z0-9._:/\ -]*$ ]]; then
            echo "::error::intent contains unsupported characters — use plain ASCII letters/digits/space/._:/- only, got: '${INTENT}'"
            exit 1
          fi
          echo "intent='${INTENT}'"

          EXPECTED_ACK='I-UNDERSTAND-THIS-WRITES-SYNTHETIC-DATA-TO-STAGING'
          if [[ "$ACKNOWLEDGE" != "$EXPECTED_ACK" ]]; then
            echo "::error::acknowledge must exactly equal '${EXPECTED_ACK}' — this run WRITES stamped synthetic (o2bat_) subjects to the staging database. Refusing to proceed without the exact literal acknowledgement."
            exit 1
          fi
          echo "acknowledge=confirmed"

          echo "inputs OK"

      - name: Set up SSH identity (pinned host key)
        id: ssh-setup
        env:
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh

          # Host authentication (fail-closed): identical rationale/mechanism to
          # multitable-recovery-flag-containment-check.yml — StrictHostKeyChecking=no
          # would let a MITM or simply the wrong host answer, making everything
          # downstream meaningless. Never silently fall back to no-verify.
          if [ -z "${DEPLOY_KNOWN_HOSTS:-}" ]; then
            echo "::error::DEPLOY_KNOWN_HOSTS required for a host-authenticated connection — refusing to fall back to no-verify"
            exit 1
          fi
          decoded_known_hosts="$(printf '%s' "$DEPLOY_KNOWN_HOSTS" | base64 -d 2>/dev/null || true)"
          if printf '%s' "$decoded_known_hosts" | grep -Eq 'ssh-ed25519|ssh-rsa|ecdsa-sha2|ssh-dss'; then
            printf '%s\n' "$decoded_known_hosts" > ~/.ssh/known_hosts
          else
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          fi
          chmod 644 ~/.ssh/known_hosts
          if ! grep -Eq 'ssh-ed25519|ssh-rsa|ecdsa-sha2|ssh-dss' ~/.ssh/known_hosts; then
            echo "::error::DEPLOY_KNOWN_HOSTS did not resolve to a recognizable known_hosts entry — refusing to fall back to no-verify"
            exit 1
          fi

          if [ -z "${DEPLOY_SSH_KEY_B64:-}" ]; then
            echo "::error::DEPLOY_SSH_KEY_B64 required"
            exit 1
          fi
          printf '%s' "$DEPLOY_SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "ssh identity staged"

      - name: Stage battery admin credentials on the deploy host
        id: stage-creds
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          BATTERY_ADMIN_EMAIL: ${{ secrets.STAGING_BATTERY_ADMIN_EMAIL }}
          BATTERY_ADMIN_PASSWORD: ${{ secrets.STAGING_BATTERY_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          # Demote (dingtalk-lifecycle-staging-canary.yml precedent): copy into
          # non-exported shell vars, then unset the exported names so no child process
          # (mktemp/ssh/scp) inherits raw secret env.
          _EMAIL="${BATTERY_ADMIN_EMAIL-}"
          _PASSWORD="${BATTERY_ADMIN_PASSWORD-}"
          unset BATTERY_ADMIN_EMAIL BATTERY_ADMIN_PASSWORD
          if [[ -z "$_EMAIL" || -z "$_PASSWORD" ]]; then
            echo "::error::STAGING_BATTERY_ADMIN_EMAIL / STAGING_BATTERY_ADMIN_PASSWORD secrets are required (the owner must set them; this workflow never invents a value) — refusing to proceed"
            unset _EMAIL _PASSWORD
            exit 1
          fi

          ssh_opts="-o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o GlobalKnownHostsFile=/dev/null -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -i $HOME/.ssh/deploy_key"

          secrets_dir="$(mktemp -d "${RUNNER_TEMP}/l1-battery-admin-creds.XXXXXX")"
          cleanup_local_secrets() { rm -rf "$secrets_dir"; }
          trap cleanup_local_secrets EXIT INT TERM
          chmod 700 "$secrets_dir"
          umask 077
          printf '%s' "$_EMAIL" > "${secrets_dir}/email"
          printf '%s' "$_PASSWORD" > "${secrets_dir}/password"
          unset _EMAIL _PASSWORD
          chmod 600 "${secrets_dir}/email" "${secrets_dir}/password"
          [[ -s "${secrets_dir}/email" && -s "${secrets_dir}/password" ]] \
            || { echo "::error::secret file empty after materialize" >&2; exit 1; }

          remote_secrets_dir="/tmp/l1-battery-creds-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "remote_secrets_dir=${remote_secrets_dir}" >> "$GITHUB_OUTPUT"
          ssh $ssh_opts "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -o pipefail -c 'set -euo pipefail; mkdir -p ${remote_secrets_dir}; chmod 700 ${remote_secrets_dir}'"
          scp $ssh_opts "${secrets_dir}/email" "${secrets_dir}/password" \
            "$DEPLOY_USER@$DEPLOY_HOST:${remote_secrets_dir}/"
          ssh $ssh_opts "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -o pipefail -c 'set -euo pipefail; chmod 600 ${remote_secrets_dir}/email ${remote_secrets_dir}/password'"
          echo "credentials staged on deploy host"

      - name: Run L1 battery on staging
        id: battery
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REMOTE_SECRETS_DIR: ${{ steps.stage-creds.outputs.remote_secrets_dir }}
        run: |
          set -euo pipefail
          ssh_opts="-o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o GlobalKnownHostsFile=/dev/null -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -i $HOME/.ssh/deploy_key"

          if [[ -z "${REMOTE_SECRETS_DIR:-}" ]]; then
            echo "::error::remote_secrets_dir missing (stage-creds step did not succeed)"
            echo "rc=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          mkdir -p output/l1-battery
          remote_output_dir="/tmp/l1-battery-out-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          run_stamp="gh${GITHUB_RUN_ID}a${GITHUB_RUN_ATTEMPT}"
          artifact_name="multitable-l1-battery-staging-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "artifact_name=${artifact_name}" >> "$GITHUB_OUTPUT"

          set +e
          # Non-secret, single-word, space-free values only are ever passed as ssh
          # command-line VAR=value prefixes (same discipline as multitable-recovery-flag-
          # containment-check.yml's TARGET/MODE) — the admin credentials themselves never
          # touch this command line; they were already scp'd to REMOTE_SECRETS_DIR above.
          ssh $ssh_opts "$DEPLOY_USER@$DEPLOY_HOST" \
            REMOTE_SECRETS_DIR="$REMOTE_SECRETS_DIR" RUN_STAMP="$run_stamp" OUTPUT_DIR="$remote_output_dir" \
            'bash -s' <<'REMOTE' 2>&1 | tee output/l1-battery/ssh.log
          set -uo pipefail
          CONTAINER="metasheet-staging-backend"

          mkdir -p "$OUTPUT_DIR"

          running="$(docker ps --format '{{.Names}}' 2>/dev/null || true)"
          if ! printf '%s\n' "$running" | grep -qxF "$CONTAINER"; then
            msg="VERDICT: FAIL — expected container '${CONTAINER}' is not running"
            echo "$msg" > "${OUTPUT_DIR}/battery-stdout.log"
            echo "$msg" > "${OUTPUT_DIR}/verdict.txt"
            echo "1" > "${OUTPUT_DIR}/battery.rc"
            exit 2
          fi

          port="$(docker exec "$CONTAINER" printenv PORT 2>/dev/null || true)"
          port="${port:-8900}"
          # A1.3 provenance capture (deep review B4). NON-SECRET identifiers, captured from the RUNNING
          # container so the evidence names exactly what was exercised — not what we think is deployed:
          #   image_digest — the image's repo digest (falls back to the image id when a digest is absent,
          #                  e.g. a locally-built image that was never pushed);
          #   build_commit — the commit the container itself reports, when the image records one.
          # Both are best-effort: an empty value flows through as null in evidence.provenance, which makes
          # a MISSING binding visible in the artifact rather than silently absent. Never fail the run on
          # these — a battery PASS must not be lost because a label was unset; A1.3's binding requirement
          # is then judged from the evidence, where its absence is explicit.
          image_digest="$(docker inspect --format '{{ index .RepoDigests 0 }}' "$CONTAINER" 2>/dev/null || true)"
          if [ -z "$image_digest" ]; then
            image_digest="$(docker inspect --format '{{ .Image }}' "$CONTAINER" 2>/dev/null || true)"
          fi
          build_commit="$(docker exec "$CONTAINER" printenv BUILD_COMMIT 2>/dev/null || true)"
          if [ -z "$build_commit" ]; then
            build_commit="$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$CONTAINER" 2>/dev/null || true)"
          fi
          log "provenance: image=${image_digest:-<unset>} commit=${build_commit:-<unset>}"

          app_url="http://127.0.0.1:${port}"

          evidence_in_container="/tmp/o2bat-evidence-${RUN_STAMP}.json"

          # ---- credential ingestion: STDIN ONLY, never the container filesystem ------
          # Owner-review P1 (2026-08-21). This used to be:
          #     docker exec "$CONTAINER" mkdir -p "/tmp/o2bat-creds-${RUN_STAMP}"
          #     docker cp "${REMOTE_SECRETS_DIR}/email"    "${CONTAINER}:.../email"
          #     docker cp "${REMOTE_SECRETS_DIR}/password" "${CONTAINER}:.../password"
          # which writes the staging admin password into the container's WRITABLE LAYER,
          # where it outlives the process. Proven with real Docker: after `docker stop`
          # the container is absent from `docker ps` (so the scrub step's gate skipped it
          # and still printed VERDICT: PASS) and `docker exec` refuses — yet
          # `docker cp <stopped>:/tmp/o2bat-creds-<stamp>/password -` still returns the
          # password bytes. So the copy is gone: nothing is written into the container.
          #
          # The two values are piped to `docker exec -i` on STDIN as a two-line
          # `KEY=<base64>` blob and become process environ IN-PROCESS inside the
          # container. base64 is an ENCODING, not a protection — it is there so each
          # value occupies exactly one line and survives byte-exact (a password may
          # contain spaces, quotes, tabs, or newlines). The protection is that the bytes
          # never touch a container filesystem and never appear in an argv: the blob is
          # assembled with redirections and shell builtins only, so no secret is ever a
          # command-line argument on the deploy host either.
          if [[ ! -s "${REMOTE_SECRETS_DIR}/email" || ! -s "${REMOTE_SECRETS_DIR}/password" ]]; then
            msg="VERDICT: FAIL — staged credential file missing or empty on the deploy host (${REMOTE_SECRETS_DIR}) — refusing to run the battery with an empty credential"
            echo "$msg" > "${OUTPUT_DIR}/battery-stdout.log"
            echo "$msg" > "${OUTPUT_DIR}/verdict.txt"
            echo "1" > "${OUTPUT_DIR}/battery.rc"
            exit 2
          fi

          {
            printf 'BATTERY_ADMIN_EMAIL_B64='
            base64 < "${REMOTE_SECRETS_DIR}/email" | tr -d '\n'
            printf '\nBATTERY_ADMIN_PASSWORD_B64='
            base64 < "${REMOTE_SECRETS_DIR}/password" | tr -d '\n'
            printf '\n'
          } | docker exec -i "$CONTAINER" sh -c '
            set -eu
            # Credentials arrive on STDIN as exactly two KEY=<base64> lines. They are
            # decoded into shell variables and exported here, in this process — never
            # written to any file, so a stopped or killed container has no in-container
            # credential to strand. Only non-secret values (APP_URL, the evidence path)
            # are passed as argv.
            # Each `read` is checked explicitly. Left bare, a short stream would abort
            # under `set -e` with a bare exit 1 and NO message — fail-closed, but not
            # diagnosable, which on a credential path is its own cost.
            if ! IFS= read -r line_email; then
              echo "battery wrapper: credential stream ended before the email line" >&2
              exit 90
            fi
            if ! IFS= read -r line_password; then
              echo "battery wrapper: credential stream ended before the password line" >&2
              exit 90
            fi
            case "$line_email" in
              BATTERY_ADMIN_EMAIL_B64=*) ;;
              *) echo "battery wrapper: malformed credential stream (email line)" >&2; exit 90 ;;
            esac
            case "$line_password" in
              BATTERY_ADMIN_PASSWORD_B64=*) ;;
              *) echo "battery wrapper: malformed credential stream (password line)" >&2; exit 90 ;;
            esac
            e_b64="${line_email#BATTERY_ADMIN_EMAIL_B64=}"
            p_b64="${line_password#BATTERY_ADMIN_PASSWORD_B64=}"
            # The trailing X is appended INSIDE the substitution and stripped right after,
            # so a value that legitimately ends in a newline survives byte-exact; command
            # substitution on its own eats every trailing newline.
            # The `|| true` is load-bearing: `set -e` is inherited by the command
            # substitution subshell, so without it a failing `base64 -d` kills the subshell
            # BEFORE `printf X`, and the whole wrapper dies with a bare exit 1 and no
            # message. With it, a decode failure yields an empty value and falls through to
            # the explicit, diagnosable refusal below.
            BATTERY_ADMIN_EMAIL="$(printf %s "$e_b64" | base64 -d 2>/dev/null || true; printf X)"
            BATTERY_ADMIN_EMAIL="${BATTERY_ADMIN_EMAIL%X}"
            BATTERY_ADMIN_PASSWORD="$(printf %s "$p_b64" | base64 -d 2>/dev/null || true; printf X)"
            BATTERY_ADMIN_PASSWORD="${BATTERY_ADMIN_PASSWORD%X}"
            # Fail-closed. A missing base64 binary or a corrupt blob yields an EMPTY
            # value, and an empty credential must never be handed to the battery as if it
            # were real (the battery would report NOT_ARMED, or worse, attempt a login
            # with an empty password). The runner already asserted both staged files
            # non-empty, so empty here means the transport broke.
            if [ -z "$BATTERY_ADMIN_EMAIL" ] || [ -z "$BATTERY_ADMIN_PASSWORD" ]; then
              echo "battery wrapper: credential decode produced an empty value - refusing to run" >&2
              exit 91
            fi
            unset line_email line_password e_b64 p_b64
            export BATTERY_ADMIN_EMAIL BATTERY_ADMIN_PASSWORD
            export APP_URL="$1"
            # A1.3 provenance (deep review B4): the amendment requires the exit evidence to name the
            # image/head the PASS was produced against. These are NON-SECRET identifiers passed as
            # argv (unlike the credentials, which never touch argv); the battery records them under
            # evidence.provenance, and records null when absent so a missing binding is VISIBLE.
            export BATTERY_IMAGE_DIGEST="$3"
            export BATTERY_BUILD_COMMIT="$4"
            # </dev/null: the battery must take its credentials from the environ this
            # wrapper just set, and must never be able to read the credential stream.
            exec node scripts/ops/multitable-l1-battery.mjs --out "$2" </dev/null
          ' sh "$app_url" "$evidence_in_container" "$image_digest" "$build_commit" \
            > "${OUTPUT_DIR}/battery-stdout.log" 2>&1
          # `set -o pipefail` is in force, so this is the rightmost non-zero status in the
          # pipeline: a broken blob assembly on the host side cannot be reported as a pass.
          battery_rc=$?
          echo "$battery_rc" > "${OUTPUT_DIR}/battery.rc"

          docker cp "${CONTAINER}:${evidence_in_container}" "${OUTPUT_DIR}/evidence.json" \
            >> "${OUTPUT_DIR}/battery-stdout.log" 2>&1 \
            || echo "[warn] could not copy evidence JSON out of the container (battery_rc=${battery_rc})" >> "${OUTPUT_DIR}/battery-stdout.log"

          # Best-effort per-run scratch cleanup. There is no in-container CREDENTIAL dir
          # to remove any more (stdin-only ingestion never creates one); the only
          # in-container per-run artifact left is the evidence JSON, which carries no
          # credential — the battery redacts DATABASE_URL, the admin password and the
          # synthetic password from it, and the same file is deliberately published as
          # this run's CI artifact. Never touches anything outside these per-run paths.
          docker exec "$CONTAINER" rm -f "$evidence_in_container" >/dev/null 2>&1 || true
          rm -rf "$REMOTE_SECRETS_DIR" >/dev/null 2>&1 || true

          grep -E '^VERDICT:' "${OUTPUT_DIR}/battery-stdout.log" > "${OUTPUT_DIR}/verdict.txt" \
            || echo "VERDICT: MISSING — battery produced no VERDICT line" > "${OUTPUT_DIR}/verdict.txt"

          exit "$battery_rc"
          REMOTE
          rc=${PIPESTATUS[0]}

          scp $ssh_opts -r "$DEPLOY_USER@$DEPLOY_HOST:${remote_output_dir}/." output/l1-battery/ 2>&1 \
            | tee -a output/l1-battery/ssh.log
          scp_rc=${PIPESTATUS[0]}

          ssh $ssh_opts "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -o pipefail -c 'rm -rf ${remote_output_dir} ${REMOTE_SECRETS_DIR}'" \
            >> output/l1-battery/ssh.log 2>&1
          set -e

          if [[ "$rc" == "0" && "$scp_rc" != "0" ]]; then
            rc="$scp_rc"
            echo "[warn] battery exited 0 but evidence retrieval (scp) failed — treating as failure (unverifiable pass)" >> output/l1-battery/ssh.log
          fi

          verdict_line="$(head -1 output/l1-battery/verdict.txt 2>/dev/null || true)"
          if [[ "$rc" == "0" && "$verdict_line" != VERDICT:\ PASS* ]]; then
            echo "[warn] battery exited 0 but did not produce a 'VERDICT: PASS' line (got: '${verdict_line:-<none>}') — fail-closed: nothing-observed is not evidence of pass" >> output/l1-battery/ssh.log
            rc=97
          fi

          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          echo "verdict_line=${verdict_line:-<none>}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Residue check — o2bat_% leftovers on staging
        id: residue
        if: always() && steps.ssh-setup.outcome == 'success'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          ssh_opts="-o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o GlobalKnownHostsFile=/dev/null -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -i $HOME/.ssh/deploy_key"
          mkdir -p output/l1-battery
          ssh $ssh_opts "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE' 2>&1 | tee output/l1-battery/residue-check.log
          set -euo pipefail
          POSTGRES_CONTAINER="metasheet-staging-postgres"
          log() { echo "[l1-battery-residue] $*"; }
          fail() { echo "[l1-battery-residue][error] $*" >&2; exit 1; }

          running="$(docker ps --format '{{.Names}}' 2>/dev/null || true)"
          printf '%s\n' "$running" | grep -qxF "$POSTGRES_CONTAINER" \
            || fail "expected container '${POSTGRES_CONTAINER}' is not running (residue observation broken)"

          pg_user="$(docker exec "$POSTGRES_CONTAINER" printenv POSTGRES_USER 2>/dev/null || true)"
          pg_db="$(docker exec "$POSTGRES_CONTAINER" printenv POSTGRES_DB 2>/dev/null || true)"
          [[ -n "$pg_user" ]] || fail "could not resolve POSTGRES_USER from ${POSTGRES_CONTAINER}'s own env"
          [[ -n "$pg_db" ]] || fail "could not resolve POSTGRES_DB from ${POSTGRES_CONTAINER}'s own env"

          # residue_check <name> <sql>: runs ONE read-only bare-integer count via
          # `docker exec metasheet-staging-postgres psql -tA`. A non-integer result
          # (bad SQL, connection drop) is a hard failure — never silently "0 residue".
          # Diagnostics go to stderr (log/fail) so they never contaminate the captured
          # stdout value (same pitfall documented in attendance-staging-window-runner-
          # remote.sh's own residue_check).
          residue_check() {
            local name="$1" sql="$2" value
            value="$(docker exec "$POSTGRES_CONTAINER" psql -U "$pg_user" -d "$pg_db" -v ON_ERROR_STOP=1 -tA -c "$sql" | tr -d '[:space:]')"
            [[ "$value" =~ ^[0-9]+$ ]] || fail "residue query '${name}' did not return a bare integer (got '${value}'); sql: ${sql}"
            log "residue ${name}=${value}" >&2
            printf '%s' "$value"
          }

          users_count="$(residue_check users "SELECT COUNT(*) FROM users WHERE id LIKE 'o2bat\\_%' ESCAPE '\\' OR email LIKE 'o2bat\\_%' ESCAPE '\\';")"
          groups_count="$(residue_check platform_member_groups "SELECT COUNT(*) FROM platform_member_groups WHERE name LIKE 'o2bat\\_%' ESCAPE '\\';")"
          # The battery also seeds stamped ROLE rows (one per driven surface, via /api/roles)
          # and a stamped sheet parent into BOTH spreadsheet parent tables (spreadsheets +
          # meta_sheets — it seeds whichever exists, so both are scanned here, existence-
          # guarded the same way the battery itself guards its seeding). Scanning only
          # users/groups (the first version of this step) would have missed all three —
          # reconciled against the battery's actual seed surface, not assumed.
          roles_count="$(residue_check roles "SELECT COUNT(*) FROM roles WHERE name LIKE 'o2bat\\_%' ESCAPE '\\';")"
          # P1-1 (gate): user_invites is written by the battery's POST /api/admin/users seed via
          # invite-ledger.ts and has NO FK cascade from users, so it survives a crashed run invisibly.
          invites_count="$(residue_check user_invites "SELECT COUNT(*) FROM user_invites WHERE email LIKE 'o2bat\\_%' ESCAPE '\\';")"
          sheets_count=0
          for sheet_table in spreadsheets meta_sheets; do
            exists="$(residue_check "${sheet_table}_exists" "SELECT (to_regclass('public.${sheet_table}') IS NOT NULL)::int;")"
            if [[ "$exists" == "1" ]]; then
              c="$(residue_check "$sheet_table" "SELECT COUNT(*) FROM ${sheet_table} WHERE id LIKE 'o2bat\\_%' ESCAPE '\\' OR name LIKE 'o2bat\\_%' ESCAPE '\\';")"
              sheets_count=$((sheets_count + c))
            fi
          done
          total=$((users_count + groups_count + roles_count + sheets_count + invites_count))

          echo "== o2bat_% residue summary =="
          echo "users leftover: ${users_count}"
          echo "platform_member_groups leftover: ${groups_count}"
          echo "roles leftover: ${roles_count}"
          echo "sheets leftover: ${sheets_count}"
          echo "user_invites leftover: ${invites_count}"
          echo "total: ${total}"
          if [[ "$total" -ne 0 ]]; then
            echo "VERDICT: FAIL — ${total} o2bat_% synthetic subject(s) left on staging (users=${users_count}, platform_member_groups=${groups_count}, roles=${roles_count}, sheets=${sheets_count}, user_invites=${invites_count}) — the battery must clean up after itself; a crashed run must not silently leave synthetic subjects on staging"
            exit 1
          fi
          echo "VERDICT: PASS — zero o2bat_% residue on staging (users, platform_member_groups, roles, spreadsheets/meta_sheets, user_invites all checked)"
          REMOTE

      - name: Scrub credentials on deploy host
        id: scrub-creds
        # Deliberately NOT continue-on-error: a host with stranded admin credentials is
        # worse than a red job. The battery step above IS continue-on-error so residue-
        # check and THIS step always get their turn even when the battery itself fails;
        # scrub has no downstream step to defer to, so a scrub failure fails the job.
        if: always() && steps.ssh-setup.outcome == 'success' && steps.stage-creds.outcome != 'skipped'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          REMOTE_SECRETS_DIR: ${{ steps.stage-creds.outputs.remote_secrets_dir }}
        run: |
          set -euo pipefail
          ssh_opts="-o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o GlobalKnownHostsFile=/dev/null -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -i $HOME/.ssh/deploy_key"
          mkdir -p output/l1-battery

          # RUN_STAMP mirrors the battery step's own construction exactly (gh<run>a<attempt>)
          # so this step targets the SAME in-container path the battery step staged into.
          run_stamp="gh${GITHUB_RUN_ID}a${GITHUB_RUN_ATTEMPT}"

          # REMOTE_SECRETS_DIR / RUN_STAMP reach the remote shell via `VAR=value` ssh
          # command-line prefixes only (non-secret, single-word values) — never inline-
          # interpolated into the heredoc body itself, same env-passing discipline the
          # "Fail on battery error" step below uses for BATTERY_RC/BATTERY_VERDICT_LINE.
          ssh $ssh_opts "$DEPLOY_USER@$DEPLOY_HOST" \
            REMOTE_SECRETS_DIR="${REMOTE_SECRETS_DIR:-}" RUN_STAMP="$run_stamp" \
            'bash -s' <<'REMOTE' 2>&1 | tee output/l1-battery/scrub.log
          set -uo pipefail
          CONTAINER="metasheet-staging-backend"
          fail=0
          log() { echo "[scrub] $*"; }

          # ---- current run: host-side secrets dir ----------------------------------
          if [[ -n "${REMOTE_SECRETS_DIR:-}" ]]; then
            log "removing current-run host secrets dir: ${REMOTE_SECRETS_DIR}"
            rm -rf "${REMOTE_SECRETS_DIR}"
          else
            log "no current-run REMOTE_SECRETS_DIR (stage-creds did not reach the point of creating one) — nothing to remove on host for this run"
          fi

          # ---- docker daemon liveness: the control for EVERY claim below -------------
          # Every "no in-container credential" statement below is a POSITIVE claim. A
          # docker command that fails for an unrelated reason (daemon down, socket
          # permissions, binary missing) must never be readable as "absent" — that is the
          # same error-absence shape the ABSENT/PRESENT probe already fail-closes on. So
          # probe the daemon FIRST; if it is unreachable, FAIL rather than assert absence.
          docker_ok=0
          if docker version --format '{{.Server.Version}}' >/dev/null 2>&1; then
            docker_ok=1
          else
            log "VERIFY-FAIL: docker daemon is unreachable on the deploy host — in-container credential absence CANNOT be asserted"
            fail=1
          fi

          # ---- current run: in-container credential residue (STATE-INDEPENDENT) ------
          # Owner-review P1 (2026-08-21). This branch used to be gated on `docker ps`:
          # if the container was not RUNNING it logged "nothing to scrub inside a dead
          # container" and the step still printed VERDICT: PASS. That was false. A
          # stopped container is absent from `docker ps`, but its WRITABLE LAYER is
          # intact, and the previous ingestion had `docker cp`'d the admin password into
          # it — proven with real Docker:
          #     docker cp <stopped-container>:/tmp/o2bat-creds-<stamp>/password -
          # still returns the password bytes while `docker exec` refuses.
          # The battery step no longer copies any credential in (stdin-only ingestion),
          # so NO /tmp/o2bat-creds-* path may exist. The check below PROVES that, using
          # `docker cp` — which reads a non-running container's writable layer — so it is
          # valid for a stopped/created/exited container, not just a running one.
          container_present=0
          container_state=""
          if [[ "$docker_ok" == "1" ]]; then
            if docker inspect --type container "$CONTAINER" >/dev/null 2>&1; then
              container_present=1
              container_state="$(docker inspect --type container -f '{{.State.Status}}' "$CONTAINER" 2>/dev/null || true)"
              if [[ -z "$container_state" ]]; then
                log "VERIFY-FAIL: container '${CONTAINER}' exists but its state probe returned nothing — cannot assert anything about its writable layer"
                fail=1
              else
                log "container '${CONTAINER}' state=${container_state}"
              fi
            else
              # The daemon IS reachable and reports no such container. Removing a
              # container destroys its writable layer with it, so no in-container
              # credential can survive. That is a positive fact discriminated by the
              # daemon control above, not an unverified assumption.
              log "container '${CONTAINER}' does not exist (docker daemon reachable, no such container) — its writable layer was destroyed with it; no in-container credential can persist"
            fi
          fi

          container_up=0
          if [[ "$container_state" == "running" ]]; then
            container_up=1
          fi

          if [[ "$container_present" == "1" ]]; then
            container_creds_dir="/tmp/o2bat-creds-${RUN_STAMP}"
            # Positive control FIRST: prove `docker cp` can read THIS container in ITS
            # CURRENT state, using a path Docker guarantees exists. Without it, a daemon
            # or permission flake would make the absence probe below fail and look
            # exactly like "the credential path is absent".
            if docker cp "${CONTAINER}:/etc/hostname" - >/dev/null 2>&1; then
              log "docker cp probe usable against '${CONTAINER}' (state=${container_state}) — control path /etc/hostname read back from its writable layer"
              if docker cp "${CONTAINER}:${container_creds_dir}" - >/dev/null 2>&1; then
                log "VERIFY-FAIL: in-container credential path EXISTS in the writable layer: ${container_creds_dir} — stdin-only ingestion must never create one"
                fail=1
                if [[ "$container_up" == "1" ]]; then
                  docker exec "$CONTAINER" rm -rf "$container_creds_dir" >/dev/null 2>&1 || true
                  log "removal attempted via docker exec (container is running); the job still FAILS so the regression is not hidden by a successful cleanup"
                else
                  log "container is ${container_state} (not running) — the path cannot be removed without starting it; failing rather than reporting PASS"
                fi
              else
                log "in-container credential path absent, PROVEN by positive-controlled docker cp (valid for a non-running container too): ${container_creds_dir}"
              fi
            else
              log "VERIFY-FAIL: docker cp cannot read container '${CONTAINER}' (state=${container_state}) even for a control path that must exist — the in-container residue probe is unusable, so absence CANNOT be asserted"
              fail=1
            fi
          fi

          # ---- stale sweep (>24h) — host --------------------------------------------
          log "stale host secrets-dir sweep (l1-battery-creds-*, older than 24h)"
          find /tmp -maxdepth 1 -name 'l1-battery-creds-*' -type d -mmin +1440 -print | while IFS= read -r d; do
            log "removing stale host dir: ${d}"
          done
          find /tmp -maxdepth 1 -name 'l1-battery-creds-*' -type d -mmin +1440 -exec rm -rf {} +

          # ---- stale sweep (>24h) — container, RUNNING only --------------------------
          # NAMED ASYMMETRY (deliberate, for the record): for a RUNNING container this
          # sweeps and verifies only dirs older than 24h — unchanged from before the P1
          # fix — whereas the non-running branch below fails on ANY o2bat-creds-* path.
          # The reason is what each state can DO about a find: a running container can be
          # cleaned (and a <24h dir may belong to a still-live sibling run), while a
          # non-running one cannot be cleaned at all, so its only honest options are
          # "provably none" or FAIL. A regression that recreated the in-container copy
          # would carry THIS run's stamp and is caught by the current-run probe above in
          # either state; what this asymmetry leaves uncaught is only a <24h path from a
          # pre-fix run in a RUNNING container, which the next sweep removes.
          if [[ "$container_up" == "1" ]]; then
            log "stale in-container secrets-dir sweep (o2bat-creds-*, older than 24h)"
            docker exec "$CONTAINER" sh -c "find /tmp -maxdepth 1 -name 'o2bat-creds-*' -type d -mmin +1440 -print" 2>/dev/null | while IFS= read -r d; do
              log "removing stale in-container dir: ${d}"
            done
            docker exec "$CONTAINER" sh -c "find /tmp -maxdepth 1 -name 'o2bat-creds-*' -type d -mmin +1440 -exec rm -rf {} +" >/dev/null 2>&1 || true
          fi

          # ---- legacy residue — container PRESENT but NOT RUNNING --------------------
          # `docker exec` cannot reach a non-running container and `docker cp` cannot
          # delete, so for this state the only honest outcomes are "provably none" or
          # FAIL — never the old "nothing to scrub inside a dead container" skip. A
          # pre-fix run (or any future regression) could have left an o2bat-creds-*
          # directory in a container that is now stopped, and that directory is still
          # readable out of the writable layer. Enumerating it means streaming the
          # container /tmp as a tar and listing the member names. That stream is
          # unbounded in principle; this branch only runs when the container is NOT
          # running, and a backend container /tmp holds scratch, not payloads. The whole
          # stream is consumed (no early exit) so `docker cp` never takes an EPIPE that
          # would be indistinguishable from a real failure.
          if [[ "$container_present" == "1" && "$container_up" != "1" ]]; then
            # `awk` always prints an integer and always exits 0, so the VALUE is a
            # positive result; `pipefail` (set at the top) separately carries a
            # docker-cp/tar failure into cenum_rc. `grep -c` was rejected here on
            # purpose: it exits 1 on zero matches, which would make "no residue" and
            # "the probe itself failed" indistinguishable.
            # The counter collapses each match to its TOP-LEVEL credential path and
            # counts DISTINCT ones, so a directory holding N files still counts as one
            # stranded credential path (a member-line count would report N+1 and make
            # the number meaningless).
            cenum_out="$(docker cp "${CONTAINER}:/tmp" - 2>/dev/null | tar -tf - 2>/dev/null | awk '{ if (match($0, /^(\.\/)?tmp\/o2bat-creds-[^\/]*/)) { seen[substr($0, RSTART, RLENGTH)] = 1 } } END { n = 0; for (k in seen) n++; print n+0 }')"
            cenum_rc=$?
            if [[ "$cenum_rc" != "0" ]] || ! [[ "${cenum_out:-}" =~ ^[0-9]+$ ]]; then
              log "VERIFY-FAIL: could not enumerate in-container credential paths in non-running container '${CONTAINER}' (rc=${cenum_rc}, out='${cenum_out:-<empty>}') — absence CANNOT be asserted"
              fail=1
            elif [[ "$cenum_out" != "0" ]]; then
              log "VERIFY-FAIL: ${cenum_out} in-container credential path(s) exist in non-running container '${CONTAINER}' and cannot be removed without starting it — an operator must start it and remove /tmp/o2bat-creds-*"
              fail=1
            else
              log "no o2bat-creds-* path exists anywhere in non-running container '${CONTAINER}' /tmp — enumerated from its writable layer via docker cp + tar"
            fi
          fi

          # ---- verify-after-scrub ----------------------------------------------------
          if [[ -n "${REMOTE_SECRETS_DIR:-}" ]] && [[ -d "${REMOTE_SECRETS_DIR}" ]]; then
            log "VERIFY-FAIL: host secrets dir still present after rm -rf: ${REMOTE_SECRETS_DIR}"
            fail=1
          fi
          # (The in-container current-run credential path is verified ABOVE, by the
          # state-independent positive-controlled `docker cp` probe — deliberately not
          # here, because a `docker exec`-based verification cannot run at all against a
          # stopped container, which is precisely the case the owner-review P1 was about.)

          # NIT (gate): the >24h stale sweep above uses `-exec rm` under `set -uo pipefail`
          # (host) and `|| true` (container), so a failed sweep would leave stale credential
          # dirs AND still report PASS — a false-green on credential hygiene. Assert no stale
          # (>24h) dir REMAINS after the sweep; any remainder fails the job.
          host_stale_left="$(find /tmp -maxdepth 1 -name 'l1-battery-creds-*' -type d -mmin +1440 2>/dev/null | wc -l | tr -d '[:space:]')"
          if [[ "${host_stale_left:-0}" != "0" ]]; then
            log "VERIFY-FAIL: ${host_stale_left} stale (>24h) host credential dir(s) remain after sweep"
            fail=1
          fi
          if [[ "$container_up" == "1" ]]; then
            # Positive-result assertion (same discipline as the current-run verify): the exec
            # must affirmatively print an integer count; a docker-exec failure yields empty and
            # is treated as a verification failure, not a silent pass.
            cstale_out="$(docker exec "$CONTAINER" sh -c "find /tmp -maxdepth 1 -name 'o2bat-creds-*' -type d -mmin +1440 2>/dev/null | wc -l | tr -d '[:space:]'" 2>/dev/null || true)"
            if [[ ! "$cstale_out" =~ ^[0-9]+$ ]]; then
              log "VERIFY-FAIL: in-container stale-sweep verification did not return a count (got '${cstale_out:-<empty>}')"
              fail=1
            elif [[ "$cstale_out" != "0" ]]; then
              log "VERIFY-FAIL: ${cstale_out} stale (>24h) in-container credential dir(s) remain after sweep"
              fail=1
            fi
          fi

          if [[ "$fail" != "0" ]]; then
            log "VERDICT: FAIL — credential residue remains after scrub; a stranded credential file is worse than a red job"
            exit 1
          fi
          # Each PASS below states only what was actually PROVEN in that state. The
          # container-down wording in particular is no longer "we skipped the container":
          # it reports an enumeration of the stopped container's own writable layer.
          if [[ "$container_present" != "1" ]]; then
            log "VERDICT: PASS — current-run credentials scrubbed on host; stale (>24h) host sweep verified: none remain; container '${CONTAINER}' does not exist, so its writable layer is gone and no in-container credential can persist"
          elif [[ "$container_up" == "1" ]]; then
            log "VERDICT: PASS — current-run credentials scrubbed on host; no in-container credential path exists (stdin-only ingestion, proven by positive-controlled docker cp); stale (>24h) sweep verified: none remain"
          else
            log "VERDICT: PASS — current-run credentials scrubbed on host; container '${CONTAINER}' is ${container_state} (not running) and its writable layer was ENUMERATED via docker cp: no o2bat-creds-* path exists; stale (>24h) host sweep verified: none remain"
          fi
          REMOTE

      - name: Write step summary
        if: always()
        env:
          TARGET: ${{ inputs.target }}
          INTENT: ${{ inputs.intent }}
          BATTERY_RC: ${{ steps.battery.outputs.rc }}
          ARTIFACT_NAME: ${{ steps.battery.outputs.artifact_name }}
          RESIDUE_OUTCOME: ${{ steps.residue.outcome }}
          SCRUB_OUTCOME: ${{ steps.scrub-creds.outcome }}
        run: |
          set -euo pipefail
          {
            echo "## Multitable L1 Battery — staging"
            echo ""
            echo "- Target: \`${TARGET}\`"
            echo "- Intent: \`${INTENT}\`"
            echo "- Battery rc: \`${BATTERY_RC:-missing}\`"
            echo "- Residue check: \`${RESIDUE_OUTCOME:-skipped}\`"
            echo "- Credential scrub: \`${SCRUB_OUTCOME:-skipped}\`"
            echo "- Artifact: \`${ARTIFACT_NAME:-missing}\`"
            if [[ -f output/l1-battery/verdict.txt ]]; then
              echo ""
              echo "### battery verdict"
              echo '```text'
              cat output/l1-battery/verdict.txt
              echo '```'
            fi
            if [[ -f output/l1-battery/residue-check.log ]]; then
              echo ""
              echo "### residue-check (tail)"
              echo '```text'
              tail -8 output/l1-battery/residue-check.log
              echo '```'
            fi
            if [[ -f output/l1-battery/scrub.log ]]; then
              echo ""
              echo "### credential scrub (tail)"
              echo '```text'
              tail -8 output/l1-battery/scrub.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.battery.outputs.artifact_name || format('multitable-l1-battery-staging-{0}-{1}', github.run_id, github.run_attempt) }}
          retention-days: 30
          path: output/l1-battery

      - name: Fail on battery error
        if: steps.battery.outputs.rc != '0'
        # P3-3 (gate): the battery rc and (deploy-host-derived) verdict line reach the shell via
        # env, never interpolated directly into the script body — an interpolated `verdict_line`
        # containing a quote or `$(...)` would otherwise be evaluated by the runner's shell.
        env:
          BATTERY_RC: ${{ steps.battery.outputs.rc }}
          BATTERY_VERDICT_LINE: ${{ steps.battery.outputs.verdict_line }}
        run: |
          echo "::error::L1 battery did not pass (rc=${BATTERY_RC}, verdict='${BATTERY_VERDICT_LINE}') — see the evidence artifact and step summary"
          exit 1
