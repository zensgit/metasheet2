name: Stock-prep S6-A PostgreSQL 17 validation (frozen package)

# EVIDENCE ONLY — T1 for issue #4695 gap 2 ("PostgreSQL is 17 while the
# unchanged packet is validated only on 15/16").
#
# This workflow downloads the ALREADY-PUBLISHED, FROZEN S6-A release asset
# named below, verifies its bytes against the pinned SHA-256 before any use
# (fail closed), runs the existing scripts/ops/multitable-onprem-package-verify.sh
# five-check verifier against it unmodified, and exercises the package's own
# migration runner (packages/core-backend/dist/src/db/migrate.js) against
# ephemeral, isolated PostgreSQL 15/16/17 service containers so the same
# migrations proven on 15/16 elsewhere are also proven to apply cleanly on 17.
#
# It never rebuilds or repacks the package, never sets or flips
# MULTITABLE_STOCK_PREP_SQLSERVER_SEALED_SNAPSHOT_ENABLED (the flag stays
# default/OFF and is never referenced here), never connects a customer
# source, never provisions SQL Server or any customer-facing role, and never
# touches an entity machine. A passing run here is CONTROLLED SYNTHETIC
# FUNCTIONAL evidence only — it does not establish real-customer production,
# sealed-snapshot semantics, high scale, external write, rollout, or
# PLM/ERP/CRM/SRM generalization (see #4695). It also does not close #4695
# gap 3 (isolated-database / SELECT-only-principal creation) — the ephemeral
# CI database here is not a DBA-provisioned entity-machine database.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RELEASE_TAG: stock-prep-onprem-s6a-20260731-a45a2fe3f
  PACKAGE_FILE: metasheet-multitable-onprem-v2.5.0-s6a-a45a2fe3f-20260731.zip
  # FROZEN S6-A PINS (#4695). LAW — never recomputed, only verified against.
  PACKAGE_SHA256_PIN: 0b80d927732e4866296e053a88958fc0b9fb44ee648cb200ee7116a3cdd72759
  SERVICE_RUNTIME_SHA_PIN: a45a2fe3fa818b6b90830418a55a6b9f635e91c9
  PACKAGE_PROVENANCE_MANIFEST_DIGEST_PIN: b5f40b3c9d56c04d4ff9001678f2cd9603c1bb1665bfe27decc0411a0e0270e6

jobs:
  # ---------------------------------------------------------------------
  # Job 1: download the frozen asset, verify it fail-closed, and prove the
  # negative control actually discriminates (mandatory per task spec).
  # ---------------------------------------------------------------------
  verify-frozen-package:
    name: Verify frozen package (fail-closed) + one-byte negative control
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Environment guard (pwsh required by the packaged zip verifier)
        run: |
          set -euo pipefail
          command -v pwsh >/dev/null 2>&1 || {
            echo "ENVIRONMENT GAP: pwsh not found on this runner; the packaged"
            echo "verifier's Windows ZipFile extraction smoke cannot run."
            exit 1
          }

      - name: Download frozen release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            -p "$PACKAGE_FILE" \
            -p "SHA256SUMS" \
            --clobber

      - name: Fail-closed — downloaded bytes must equal the frozen pin
        run: |
          set -euo pipefail
          actual="$(sha256sum "$PACKAGE_FILE" | awk '{print $1}')"
          echo "computedPackageSha256=${actual}"
          if [[ "$actual" != "$PACKAGE_SHA256_PIN" ]]; then
            echo "FATAL: downloaded package SHA-256 does not equal the frozen packageSha256 pin. Aborting — never proceeding to 'test it anyway'." >&2
            exit 1
          fi
          echo "packageSha256PinMatch=PASS"

      - name: Run existing multitable-onprem-package-verify.sh (report-comparable with postfreeze-zip.verify.json)
        run: |
          set -euo pipefail
          chmod +x scripts/ops/multitable-onprem-package-verify.sh
          mkdir -p "${RUNNER_TEMP}/pkgroot-verify"
          EXTRACT_ROOT="${RUNNER_TEMP}/pkgroot-verify" \
          VERIFY_REPORT_JSON="${RUNNER_TEMP}/verify-report.json" \
          VERIFY_REPORT_MD="${RUNNER_TEMP}/verify-report.md" \
            scripts/ops/multitable-onprem-package-verify.sh "$PACKAGE_FILE"
          echo "PKG_ROOT=${RUNNER_TEMP}/pkgroot-verify/${PACKAGE_FILE%.zip}" >> "$GITHUB_ENV"

      - name: Build provenance gitCommit must equal serviceRuntimeSha pin
        run: |
          set -euo pipefail
          actual_git_commit="$(node -e "console.log(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).gitCommit)" "${PKG_ROOT}/BUILD_PROVENANCE.json")"
          echo "buildProvenanceGitCommit=${actual_git_commit}"
          if [[ "$actual_git_commit" != "$SERVICE_RUNTIME_SHA_PIN" ]]; then
            echo "FATAL: BUILD_PROVENANCE.json gitCommit does not equal the frozen serviceRuntimeSha pin." >&2
            exit 1
          fi
          echo "buildProvenanceGitCommitPinMatch=PASS"

      - name: Sealed-export frozenManifestDigest must equal packageProvenanceManifestDigest pin
        run: |
          set -euo pipefail
          actual_digest="$(node -e "
            const p = require(process.argv[1]);
            const r = p.verifySealedExportRuntimePackageProvenance({ repoRoot: process.argv[2] });
            if (r.verified !== true) { process.exit(1); }
            console.log(r.frozenManifestDigest);
          " "${PKG_ROOT}/plugins/plugin-integration-core/lib/sealed-export/sealed-export-package-provenance.cjs" "${PKG_ROOT}")"
          echo "frozenManifestDigest=${actual_digest}"
          if [[ "$actual_digest" != "$PACKAGE_PROVENANCE_MANIFEST_DIGEST_PIN" ]]; then
            echo "FATAL: frozenManifestDigest does not equal the frozen packageProvenanceManifestDigest pin." >&2
            exit 1
          fi
          echo "frozenManifestDigestPinMatch=PASS"

      - name: One-byte negative control — mandatory, exclusive, hard-fails the job if it does not fire
        run: |
          set -euo pipefail
          mkdir -p neg-control/positive neg-control/negative
          cp "$PACKAGE_FILE" "neg-control/positive/$PACKAGE_FILE"
          cp SHA256SUMS "neg-control/positive/SHA256SUMS"
          cp "$PACKAGE_FILE" "neg-control/negative/$PACKAGE_FILE"
          cp SHA256SUMS "neg-control/negative/SHA256SUMS"

          # Flip exactly one byte (bitwise complement, i.e. XOR 0xFF) at a fixed
          # offset in the negative copy only. Pure dd/od/printf — no heredoc, so
          # there is no risk of YAML block-scalar indentation corrupting a
          # nested script (e.g. a Python IndentationError from inherited spaces).
          negfile="neg-control/negative/$PACKAGE_FILE"
          offset=2048
          orig_byte_dec="$(dd if="$negfile" bs=1 skip="$offset" count=1 2>/dev/null | od -An -tu1 | tr -d ' ')"
          flipped_byte_dec=$(( 255 - orig_byte_dec ))
          flipped_octal_escape="$(printf '\\%03o' "$flipped_byte_dec")"
          printf "$flipped_octal_escape" | dd of="$negfile" bs=1 seek="$offset" count=1 conv=notrunc 2>/dev/null

          pos_sha="$(sha256sum "neg-control/positive/$PACKAGE_FILE" | awk '{print $1}')"
          neg_sha="$(sha256sum "neg-control/negative/$PACKAGE_FILE" | awk '{print $1}')"
          echo "positiveArmSha256=${pos_sha}"
          echo "negativeArmSha256=${neg_sha}"
          if [[ "$pos_sha" != "$PACKAGE_SHA256_PIN" ]]; then
            echo "FATAL: positive arm (unmutated copy) does not match the pin — negative control setup is broken." >&2
            exit 1
          fi
          if [[ "$neg_sha" == "$PACKAGE_SHA256_PIN" ]]; then
            echo "FATAL: one-byte mutation did not change the SHA-256 (should be impossible)." >&2
            exit 1
          fi

          set +e
          scripts/ops/multitable-onprem-package-verify.sh "neg-control/positive/$PACKAGE_FILE" >pos.log 2>&1
          pos_rc=$?
          scripts/ops/multitable-onprem-package-verify.sh "neg-control/negative/$PACKAGE_FILE" >neg.log 2>&1
          neg_rc=$?
          set -e

          echo "positiveArmExitCode=${pos_rc}"
          echo "negativeArmExitCode=${neg_rc}"
          echo "--- positive arm output ---"
          cat pos.log
          echo "--- negative arm output ---"
          cat neg.log

          if [[ "$pos_rc" -ne 0 ]]; then
            echo "FATAL: positive arm (identical layout, unmutated bytes) unexpectedly failed verification." >&2
            exit 1
          fi
          if [[ "$neg_rc" -eq 0 ]]; then
            echo "FATAL P0: one-byte mutation did NOT cause verification to fail. The negative control did not fire — 'verification passed' would be indistinguishable from 'verification did not run'." >&2
            exit 1
          fi
          # Checksum-specific strings only. A bare "FAILED"/"-i" pattern would
          # also match unrelated failures (e.g. verify_windows_zip_zipfile_smoke's
          # "Windows ZipFile extraction smoke failed for zip package"), which
          # would let an environment problem masquerade as the negative control
          # firing. verify_sha() runs before any archive/pwsh checks in
          # multitable-onprem-package-verify.sh, so on a genuine byte flip only
          # these checksum-specific strings can appear — but the guard must
          # assert that itself, not rely on step ordering silently holding.
          if ! grep -qE "did NOT match|Checksum mismatch for" neg.log; then
            echo "FATAL: negative arm failed for a reason other than the checksum (not exclusive to the byte flip) — cannot attribute the failure to the mutation." >&2
            exit 1
          fi
          echo "oneByteNegativeCheck=PASS"

      - name: Upload verify evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t1-verify-frozen-package-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/verify-report.json
            ${{ runner.temp }}/verify-report.md
            pos.log
            neg.log

      - name: Values-free evidence (this job)
        run: |
          {
            echo "releaseTag=${RELEASE_TAG}"
            echo "packageFile=${PACKAGE_FILE}"
            echo "packageSha256=${PACKAGE_SHA256_PIN}"
            echo "packageSha256PinMatch=PASS"
            echo "packageVerification=PASS"
            echo "buildProvenanceGitCommitPinMatch=PASS"
            echo "frozenManifestDigestPinMatch=PASS"
            echo "oneByteNegativeCheck=PASS"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # Job 2: exercise the frozen, verified package's own migration runner
  # against ephemeral PostgreSQL 15/16/17 so a reader sees the matrix, not
  # a single green cell. 15/16 are the already-validated control legs; 17
  # is the gap this workflow exists to close.
  # ---------------------------------------------------------------------
  migrate-postgres:
    name: Migrate on PostgreSQL ${{ matrix.pg }}
    needs: verify-frozen-package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        pg: ['15', '16', '17']
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metasheet_s6a_t1
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d metasheet_s6a_t1"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/metasheet_s6a_t1
      JWT_SECRET: t1-ci-synthetic-not-a-secret
      PGPASSWORD: postgres
      # WHY THIS EXISTS, and why the list is migration-replay.yml's and not plugin-tests.yml's.
      #
      # Without it this job cannot go green, for reasons that have nothing to do with
      # PostgreSQL 17. The frozen S6-A package ships migrations that EVERY fresh-database
      # lane in this repository already excludes for documented, still-open defects
      # (008 idempotency on the scope column; the gantt FK pointing at pre-fix text view
      # ids; the legacy user_orgs is_active incompatibility). They are NOT neutralised by
      # SUPERSEDED_LEGACY_SQL_MIGRATIONS, which only no-ops 042a/048/049.
      #
      # This repository keeps TWO deliberately different lists (they are documented as
      # solving different problems and as not required to converge — see
      # packages/core-backend/MIGRATION_EXCLUDE_TRACKING.md). This job's shape — fresh
      # database, apply latest, assert Pending 0, then re-run latest and assert
      # idempotency — is migration-replay.yml's shape, so it takes migration-replay.yml's
      # list verbatim. plugin-tests.yml's list differs in its final entry and is the
      # per-PR gate's, not this one's.
      #
      # WHAT THIS NARROWS THE CLAIM TO. Evidence from this job means: the frozen
      # package's migrations, MINUS the six excluded below, apply cleanly and idempotently
      # on the matrix PostgreSQL major version. It does NOT mean the full unexcluded set
      # applies on any version — that has never had a green run on any version in this
      # repository (see #4162), so it is not a PostgreSQL 17 question.
      MIGRATION_EXCLUDE: 008_plugin_infrastructure.sql,048_create_event_bus_tables.sql,049_create_bpmn_workflow_tables.sql,042a_core_model_views.sql,20250924140000_create_gantt_tables.ts,zzzz20260114110000_create_user_orgs_table.ts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frozen release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            -p "$PACKAGE_FILE" \
            -p "SHA256SUMS" \
            --clobber

      - name: Fail-closed — downloaded bytes must equal the frozen pin
        run: |
          set -euo pipefail
          actual="$(sha256sum "$PACKAGE_FILE" | awk '{print $1}')"
          if [[ "$actual" != "$PACKAGE_SHA256_PIN" ]]; then
            echo "FATAL: downloaded package SHA-256 does not equal the frozen packageSha256 pin. Aborting." >&2
            exit 1
          fi
          echo "packageSha256PinMatch=PASS"

      - name: Run existing multitable-onprem-package-verify.sh
        run: |
          set -euo pipefail
          chmod +x scripts/ops/multitable-onprem-package-verify.sh
          mkdir -p "${RUNNER_TEMP}/pkgroot"
          EXTRACT_ROOT="${RUNNER_TEMP}/pkgroot" \
            scripts/ops/multitable-onprem-package-verify.sh "$PACKAGE_FILE"
          echo "PKG_ROOT=${RUNNER_TEMP}/pkgroot/${PACKAGE_FILE%.zip}" >> "$GITHUB_ENV"

      - name: Confirm the live server actually is PostgreSQL ${{ matrix.pg }}
        run: |
          set -euo pipefail
          command -v psql >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          server_version_num="$(psql -h 127.0.0.1 -U postgres -d metasheet_s6a_t1 -tAc 'SHOW server_version_num')"
          server_major=$(( server_version_num / 10000 ))
          echo "postgresServerVersionMajor=${server_major}"
          if [[ "${server_major}" != "${{ matrix.pg }}" ]]; then
            echo "FATAL: live server major version (${server_major}) does not match the matrix leg (${{ matrix.pg }}) — evidence would not actually distinguish PostgreSQL versions." >&2
            exit 1
          fi
          echo "postgresServerVersionPinMatch=PASS"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # Matches the package's own package.json packageManager pin
          # (verified by multitable-onprem-package-verify.sh) and the
          # multitable-onprem-package-build.yml build/apply contract.
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install the frozen package's own pinned dependencies (frozen lockfile — never relaxed)
        working-directory: ${{ env.PKG_ROOT }}
        run: pnpm install --frozen-lockfile --reporter=append-only

      - name: Migration status before apply (expect a fresh, unmigrated database)
        working-directory: ${{ env.PKG_ROOT }}
        run: |
          set -euo pipefail
          node packages/core-backend/dist/src/db/migrate.js --list | tee "${RUNNER_TEMP}/migrate-list-pre.log"
          applied_pre="$(grep -oE '^Applied: [0-9]+' "${RUNNER_TEMP}/migrate-list-pre.log" | awk '{print $2}')"
          echo "migrationsAppliedPre=${applied_pre}"
          if [[ "${applied_pre}" != "0" ]]; then
            echo "FATAL: database was not fresh before apply (Applied != 0) — a positive result afterward would not prove real work happened." >&2
            exit 1
          fi

      - name: Apply all migrations (packages/core-backend/dist/src/db/migrate.js, default latest)
        working-directory: ${{ env.PKG_ROOT }}
        run: node packages/core-backend/dist/src/db/migrate.js

      - name: Migration status after apply (expect zero pending)
        working-directory: ${{ env.PKG_ROOT }}
        run: |
          set -euo pipefail
          node packages/core-backend/dist/src/db/migrate.js --list | tee "${RUNNER_TEMP}/migrate-list-post.log"
          pending_post="$(grep -oE '^Pending: [0-9]+' "${RUNNER_TEMP}/migrate-list-post.log" | awk '{print $2}')"
          applied_post="$(grep -oE '^Applied: [0-9]+' "${RUNNER_TEMP}/migrate-list-post.log" | awk '{print $2}')"
          echo "migrationsAppliedPost=${applied_post}"
          echo "migrationsPendingPost=${pending_post}"
          if [[ "${pending_post}" != "0" ]]; then
            echo "FATAL: migrations did not apply cleanly end to end (Pending != 0 after latest)." >&2
            exit 1
          fi

      - name: Confirm migration 073 (sealed-export stock-prep runtime authority) specifically applied
        working-directory: ${{ env.PKG_ROOT }}
        run: node packages/core-backend/dist/src/db/migrate.js --confirm 073_create_sealed_export_stock_prep_runtime_authority

      - name: Idempotent replay — re-run latest against an already-migrated database
        working-directory: ${{ env.PKG_ROOT }}
        run: node packages/core-backend/dist/src/db/migrate.js

      - name: Upload per-version evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t1-migrate-postgres-${{ matrix.pg }}-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/migrate-list-pre.log
            ${{ runner.temp }}/migrate-list-post.log

      - name: Values-free evidence (this leg)
        run: |
          {
            echo "postgresMajorVersion=${{ matrix.pg }}"
            echo "postgresServerVersionPinMatch=PASS"
            echo "packageSha256PinMatch=PASS"
            echo "dependencyInstall=PASS"
            echo "migrationsAppliedPre=0"
            echo "migrationApply=PASS"
            echo "migrationsPendingPost=0"
            echo "migration073Confirmed=PASS"
            echo "migrationReplayIdempotent=PASS"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # Job 2b: ROLE-BOUND migration arm — the branch job 2 never reaches.
  #
  # WHAT JOB 2 ABOVE ACTUALLY PROVES, AND WHAT IT DOES NOT.
  #   Job 2 sets no PGOPTIONS and no `metasheet.sealed_export_*_role` settings.
  #   With neither setting present, migrations 073, 074 and 075 all take their
  #   documented latent branch and RETURN before granting anything:
  #     073:462-466, 074:75-79, 075:118-122
  #       IF runtime_role IS NULL AND provisioning_role IS NULL THEN
  #         RAISE NOTICE '... privilege grants remain latent'; RETURN;
  #   So job 2's green means "the DDL applies on 15/16/17". It does NOT touch
  #   the role-safety predicate (073:498-518, 074:111-131, 075:154-174) and it
  #   does NOT execute a single GRANT. Note also that the latent branch only
  #   RAISEs a NOTICE: node-postgres does not print notices, so job 2's logs
  #   look identical whether the grants landed or not. Absence of an error is
  #   not evidence here.
  #
  #   Before this job existed, the predicate and the GRANTs were proven ONLY by
  #   the vitest lane (packages/core-backend/tests/integration/
  #   sealed-export-s6a-runtime-authority.db.test.ts:81-89), which creates both
  #   roles as the superuser `postgres`. A real on-prem host follows
  #   docs/operations/stock-preparation-s6a-sqlserver-onprem-runbook-20260731.md
  #   §2 (:73-112) instead, where a DBA — not necessarily a superuser — creates
  #   them. That path had never been exercised anywhere in CI.
  #
  # WHAT THIS JOB ADDS.
  #   POSITIVE ARM: create the two separated NOSUPERUSER login roles with the
  #   exact attribute set the runbook prescribes (:82-89), export PGOPTIONS
  #   exactly as the runbook prescribes (:98), run the SAME frozen package
  #   migration runner, then assert the NON-latent branch actually executed by
  #   measuring the grants it is the only thing that could have created. Grants
  #   present is the discriminator: had the latent branch run, they would be
  #   absent. The over-grant guards in the same step keep "granted" from
  #   sliding into "granted too much".
  #
  #   NEGATIVE ARM (PG16/17): PostgreSQL 16 changed CREATEROLE. A non-superuser
  #   CREATEROLE role that creates a role is now automatically granted ADMIN
  #   OPTION on it, which is a row in pg_auth_members; the `createrole_self_grant`
  #   GUC only decides whether SET and/or INHERIT ride along on that same grant,
  #   it does not decide whether the row exists. The predicate requires ZERO
  #   pg_auth_members rows in EITHER direction (073:508-514, 074:121-127,
  #   075:164-170), so a PG16/17 DBA who creates the roles that way trips
  #   'sealed-export role has unsafe authority' with no hint as to why. This arm
  #   reproduces that exactly, proves the refusal is attributable to the
  #   membership row ALONE (every other predicate leg is measured and shown
  #   passing on the same roles), and emits the diagnostic tokens naming
  #   pg_auth_members and createrole_self_grant that the migration itself cannot
  #   carry — 073 is digest-frozen (see below). PG15 runs the same setup as a
  #   contrast leg and asserts the auto-membership does NOT occur there.
  #
  # WHY THE DIAGNOSTIC IS NOT IN THE MIGRATION.
  #   073 is a content-digest pin of the frozen S6-A package:
  #   plugins/plugin-integration-core/lib/sealed-export/vectors/
  #   s6a-package-provenance-pins.json migrations."073" is a SHA-256 of the file
  #   text, asserted by verifySealedExportRuntimePackageProvenance ->
  #   verifyPinnedMigrations (sealed-export-package-provenance.cjs:454-483), and
  #   that manifest's own digest is the PACKAGE_PROVENANCE_MANIFEST_DIGEST_PIN
  #   this workflow verifies fail-closed in job 1. Editing 073 by one byte
  #   breaks the frozen package. 074 and 075 are already applied on main, so an
  #   in-place edit would never re-run on any existing deployment either. The
  #   diagnostic therefore lives in the runbook (§2) and in
  #   scripts/ops/stock-preparation-e2e-provision-postgres-roles-and-migrate.mjs
  #   as a pre-migration probe, plus the tokens this job emits. The predicate
  #   itself is NOT weakened anywhere.
  #
  # WHY NOT REUSE THE E2E PROVISIONING SCRIPT HERE.
  #   scripts/ops/stock-preparation-e2e-provision-postgres-roles-and-migrate.mjs
  #   resolves `pg` through createRequire against the REPO checkout's
  #   packages/core-backend/package.json (:29-32) and shells out to
  #   `pnpm --filter @metasheet/core-backend run migrate` in REPO_ROOT (:83).
  #   This lane installs dependencies only inside the extracted frozen package
  #   and must migrate with the PACKAGE's own dist runner, never a rebuilt one.
  #   The script does not fit; its role-creation SQL and its PGOPTIONS
  #   construction are mirrored here instead, and the diagnostic added to it
  #   covers the lane that does use it.
  # ---------------------------------------------------------------------
  migrate-postgres-role-bound:
    name: Role-bound migrate on PostgreSQL ${{ matrix.pg }}
    needs: verify-frozen-package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        pg: ['15', '16', '17']
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metasheet_s6a_rolebound
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d metasheet_s6a_rolebound"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/metasheet_s6a_rolebound
      JWT_SECRET: t1-ci-synthetic-not-a-secret
      PGPASSWORD: postgres
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      # Same list, same reason, as the migrate-postgres job above. See that
      # job's MIGRATION_EXCLUDE comment for WHY this lane carries one at all and
      # what it narrows the claim to.
      MIGRATION_EXCLUDE: 008_plugin_infrastructure.sql,048_create_event_bus_tables.sql,049_create_bpmn_workflow_tables.sql,042a_core_model_views.sql,20250924140000_create_gantt_tables.ts,zzzz20260114110000_create_user_orgs_table.ts
      # Synthetic, ephemeral, single-run CI identities. These are role NAMES and
      # throwaway passwords for a container destroyed with the job; they are not
      # secrets and are deliberately not read from the secret store, so nothing
      # real can leak through this workflow's logs.
      RUNTIME_ROLE: s6a_ci_runtime
      RUNTIME_PASSWORD: s6a-ci-synthetic-not-a-secret-runtime
      PROVISIONING_ROLE: s6a_ci_provisioning
      PROVISIONING_PASSWORD: s6a-ci-synthetic-not-a-secret-provisioning
      NEG_DB: metasheet_s6a_negctl
      NEG_DBA_ROLE: s6a_ci_negctl_dba
      NEG_DBA_PASSWORD: s6a-ci-synthetic-not-a-secret-dba
      NEG_RUNTIME_ROLE: s6a_ci_negctl_runtime
      NEG_PROVISIONING_ROLE: s6a_ci_negctl_provisioning
      NEG_ROLE_PASSWORD: s6a-ci-synthetic-not-a-secret-negctl
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download frozen release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            -p "$PACKAGE_FILE" \
            -p "SHA256SUMS" \
            --clobber

      - name: Fail-closed — downloaded bytes must equal the frozen pin
        run: |
          set -euo pipefail
          actual="$(sha256sum "$PACKAGE_FILE" | awk '{print $1}')"
          if [[ "$actual" != "$PACKAGE_SHA256_PIN" ]]; then
            echo "FATAL: downloaded package SHA-256 does not equal the frozen packageSha256 pin. Aborting." >&2
            exit 1
          fi
          echo "packageSha256PinMatch=PASS"

      - name: Run existing multitable-onprem-package-verify.sh
        run: |
          set -euo pipefail
          chmod +x scripts/ops/multitable-onprem-package-verify.sh
          mkdir -p "${RUNNER_TEMP}/pkgroot"
          EXTRACT_ROOT="${RUNNER_TEMP}/pkgroot" \
            scripts/ops/multitable-onprem-package-verify.sh "$PACKAGE_FILE"
          echo "PKG_ROOT=${RUNNER_TEMP}/pkgroot/${PACKAGE_FILE%.zip}" >> "$GITHUB_ENV"

      - name: Install psql and confirm the live server actually is PostgreSQL ${{ matrix.pg }}
        run: |
          set -euo pipefail
          command -v psql >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          server_version_num="$(psql -U postgres -d metasheet_s6a_rolebound -tAc 'SHOW server_version_num')"
          server_major=$(( server_version_num / 10000 ))
          echo "postgresServerVersionMajor=${server_major}"
          if [[ "${server_major}" != "${{ matrix.pg }}" ]]; then
            echo "FATAL: live server major version (${server_major}) does not match the matrix leg (${{ matrix.pg }}) — evidence would not actually distinguish PostgreSQL versions." >&2
            exit 1
          fi
          echo "postgresServerVersionPinMatch=PASS"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install the frozen package's own pinned dependencies (frozen lockfile — never relaxed)
        working-directory: ${{ env.PKG_ROOT }}
        run: pnpm install --frozen-lockfile --reporter=append-only

      # -------------------------------------------------------------------
      # POSITIVE ARM
      # -------------------------------------------------------------------
      - name: Create the two sealed-export roles exactly as runbook §2 prescribes
        run: |
          set -euo pipefail
          # Attribute set copied from
          # docs/operations/stock-preparation-s6a-sqlserver-onprem-runbook-20260731.md:82-89
          # verbatim. If that list and this list ever diverge, CI stops
          # exercising what the runbook actually tells a DBA to do.
          for pair in "${RUNTIME_ROLE}|${RUNTIME_PASSWORD}" "${PROVISIONING_ROLE}|${PROVISIONING_PASSWORD}"; do
            role="${pair%%|*}"
            pw="${pair##*|}"
            psql -U postgres -d metasheet_s6a_rolebound -v ON_ERROR_STOP=1 -q -c \
              "CREATE ROLE \"${role}\" LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS NOINHERIT PASSWORD '${pw}'"
          done
          echo "sealedExportRolesCreated=PASS"

      - name: Roles must satisfy every leg of the 073/074/075 safety predicate before migrating
        run: |
          set -euo pipefail
          # This is the precondition the predicate (073:498-518) checks. Asserting
          # it here means a later refusal in the NEGATIVE arm can be attributed to
          # the ONE leg that differs there, instead of to a role that was
          # malformed in some other way.
          attrs="$(psql -U postgres -d metasheet_s6a_rolebound -tAc "
            SELECT count(*) FILTER (WHERE TRUE)::text || ':' || bool_and(
              NOT rolsuper AND NOT rolcreatedb AND NOT rolcreaterole
              AND NOT rolreplication AND NOT rolbypassrls
              AND rolcanlogin AND NOT rolinherit
            )::text
            FROM pg_roles
            WHERE rolname IN ('${RUNTIME_ROLE}', '${PROVISIONING_ROLE}')")"
          echo "sealedRoleAttributeProbe=${attrs}"
          if [[ "$attrs" != "2:true" ]]; then
            echo "FATAL: the two sealed-export roles do not carry the runbook attribute set; the arm would not be testing the runbook's role shape." >&2
            exit 1
          fi
          echo "sealedRoleAttributesRunbookConformant=PASS"

          members="$(psql -U postgres -d metasheet_s6a_rolebound -tAc "
            SELECT count(*) FROM pg_auth_members m
            WHERE m.roleid IN (SELECT oid FROM pg_roles WHERE rolname IN ('${RUNTIME_ROLE}', '${PROVISIONING_ROLE}'))
               OR m.member IN (SELECT oid FROM pg_roles WHERE rolname IN ('${RUNTIME_ROLE}', '${PROVISIONING_ROLE}'))")"
          echo "sealedRolePgAuthMembersRows=${members}"
          if [[ "$members" != "0" ]]; then
            echo "FATAL: sealed-export roles already participate in a pg_auth_members grant; 073:508-514 will refuse them." >&2
            exit 1
          fi
          echo "sealedRoleZeroMembership=PASS"

      - name: Migration status before apply (expect a fresh, unmigrated database)
        working-directory: ${{ env.PKG_ROOT }}
        run: |
          set -euo pipefail
          node packages/core-backend/dist/src/db/migrate.js --list | tee "${RUNNER_TEMP}/rolebound-list-pre.log"
          applied_pre="$(grep -oE '^Applied: [0-9]+' "${RUNNER_TEMP}/rolebound-list-pre.log" | awk '{print $2}')"
          echo "migrationsAppliedPre=${applied_pre}"
          if [[ "${applied_pre}" != "0" ]]; then
            echo "FATAL: database was not fresh before apply (Applied != 0) — a positive result afterward would not prove real work happened." >&2
            exit 1
          fi

      - name: Apply all migrations with PGOPTIONS set exactly as runbook §2 prescribes
        working-directory: ${{ env.PKG_ROOT }}
        env:
          # Runbook :98, in the POSIX form. This deliberately exercises the
          # runbook's OWN mechanism (the PGOPTIONS environment variable reaching
          # the packaged Node runner) rather than the `?options=` connection-string
          # form the e2e script uses. If this step ends with the grants absent,
          # the finding is that the runbook's instruction does not reach the
          # packaged runner — a real defect, not a CI defect.
          PGOPTIONS: -c metasheet.sealed_export_runtime_role=s6a_ci_runtime -c metasheet.sealed_export_provisioning_role=s6a_ci_provisioning
        run: |
          set -euo pipefail
          node packages/core-backend/dist/src/db/migrate.js | tee "${RUNNER_TEMP}/rolebound-apply.log"

      - name: Migration status after apply (expect zero pending) and confirm 073/074/075
        working-directory: ${{ env.PKG_ROOT }}
        env:
          PGOPTIONS: -c metasheet.sealed_export_runtime_role=s6a_ci_runtime -c metasheet.sealed_export_provisioning_role=s6a_ci_provisioning
        run: |
          set -euo pipefail
          node packages/core-backend/dist/src/db/migrate.js --list | tee "${RUNNER_TEMP}/rolebound-list-post.log"
          pending_post="$(grep -oE '^Pending: [0-9]+' "${RUNNER_TEMP}/rolebound-list-post.log" | awk '{print $2}')"
          echo "migrationsPendingPost=${pending_post}"
          if [[ "${pending_post}" != "0" ]]; then
            echo "FATAL: migrations did not apply cleanly end to end (Pending != 0 after latest)." >&2
            exit 1
          fi
          node packages/core-backend/dist/src/db/migrate.js --confirm 073_create_sealed_export_stock_prep_runtime_authority
          node packages/core-backend/dist/src/db/migrate.js --confirm 074_repair_sealed_export_runtime_authority_privileges
          node packages/core-backend/dist/src/db/migrate.js --confirm 075_grant_sealed_export_runtime_authority_row_lock
          echo "migration073Confirmed=PASS"
          echo "migration074Confirmed=PASS"
          echo "migration075Confirmed=PASS"

      - name: Prove the NON-latent branch executed — the grants must exist
        run: |
          set -euo pipefail
          # `--confirm` proves a migration was RECORDED. It does NOT prove the
          # grants exist, because the latent branch records the migration too
          # (runbook :113-131). Only the grants discriminate, so measure them.
          # These are the runbook's own three predicates plus one 073-specific
          # table grant, so a reader can map each line to the migration that
          # must have run the non-latent branch to produce it.
          probe() {
            psql -U postgres -d metasheet_s6a_rolebound -tAc "$1"
          }
          g073_table="$(probe "SELECT has_table_privilege('${RUNTIME_ROLE}', 'integration_sealed_export_stock_prep_runs', 'INSERT')")"
          g073_audit="$(probe "SELECT has_table_privilege('${RUNTIME_ROLE}', 'integration_sealed_export_generation_audit', 'SELECT')")"
          g074_lock="$(probe "SELECT has_column_privilege('${PROVISIONING_ROLE}', 'integration_sealed_export_signer_public_keys', 'updated_at', 'UPDATE')")"
          g075_lock="$(probe "SELECT has_column_privilege('${RUNTIME_ROLE}', 'integration_sealed_export_authority_state', 'updated_at', 'UPDATE')")"
          echo "grant073RuntimeStockPrepRunsInsert=${g073_table}"
          echo "grant073Or074RuntimeGenerationAuditSelect=${g073_audit}"
          echo "grant074ProvisioningSignerKeyRowLock=${g074_lock}"
          echo "grant075RuntimeAuthorityStateRowLock=${g075_lock}"
          for v in "$g073_table" "$g073_audit" "$g074_lock" "$g075_lock"; do
            if [[ "$v" != "t" ]]; then
              echo "FATAL: a required grant is absent — the migrations took the LATENT branch (073:462-466 / 074:75-79 / 075:118-122) even though PGOPTIONS was set. The role-bound path did NOT execute." >&2
              exit 1
            fi
          done
          echo "latentBranchTaken=false"
          echo "roleBoundGrantsPresent=PASS"

      - name: Over-grant guards — "granted" must not have become "granted too much"
        run: |
          set -euo pipefail
          probe() {
            psql -U postgres -d metasheet_s6a_rolebound -tAc "$1"
          }
          # 075:53-58 and 074:25-26: the row-lock grants are COLUMN level, so
          # table-level UPDATE must stay FALSE. If these flip to true the
          # migrations granted a wider authority than the ratified matrix.
          t075="$(probe "SELECT has_table_privilege('${RUNTIME_ROLE}', 'integration_sealed_export_authority_state', 'UPDATE')")"
          t074="$(probe "SELECT has_table_privilege('${PROVISIONING_ROLE}', 'integration_sealed_export_signer_public_keys', 'UPDATE')")"
          # 074:33-38: the audit ledger stays append-only for the runtime role.
          taudit="$(probe "SELECT has_table_privilege('${RUNTIME_ROLE}', 'integration_sealed_export_generation_audit', 'UPDATE') OR has_table_privilege('${RUNTIME_ROLE}', 'integration_sealed_export_generation_audit', 'DELETE')")"
          echo "runtimeAuthorityStateTableUpdate=${t075}"
          echo "provisioningSignerKeysTableUpdate=${t074}"
          echo "runtimeGenerationAuditMutate=${taudit}"
          for v in "$t075" "$t074" "$taudit"; do
            if [[ "$v" != "f" ]]; then
              echo "FATAL: an over-grant was detected — the column-level row-lock convention was widened to table level." >&2
              exit 1
            fi
          done
          echo "overGrantGuards=PASS"

      - name: Idempotent replay with the roles still bound
        working-directory: ${{ env.PKG_ROOT }}
        env:
          PGOPTIONS: -c metasheet.sealed_export_runtime_role=s6a_ci_runtime -c metasheet.sealed_export_provisioning_role=s6a_ci_provisioning
        run: |
          set -euo pipefail
          node packages/core-backend/dist/src/db/migrate.js | tee "${RUNNER_TEMP}/rolebound-replay.log"
          echo "migrationReplayIdempotent=PASS"

      # -------------------------------------------------------------------
      # NEGATIVE CONTROL — PG16/17 createrole_self_grant / auto ADMIN membership
      # -------------------------------------------------------------------
      - name: Negative control setup — a CREATEROLE non-superuser DBA creates the roles
        if: matrix.pg != '15'
        run: |
          set -euo pipefail
          psql -U postgres -d postgres -v ON_ERROR_STOP=1 -q -c \
            "CREATE ROLE \"${NEG_DBA_ROLE}\" LOGIN CREATEROLE NOSUPERUSER PASSWORD '${NEG_DBA_PASSWORD}'"
          psql -U postgres -d postgres -v ON_ERROR_STOP=1 -q -c \
            "CREATE DATABASE \"${NEG_DB}\""

          # Record that the GUC is at its shipped default; this control must be
          # about DEFAULT behaviour, not about a setting CI quietly changed.
          selfgrant="$(PGPASSWORD="${NEG_DBA_PASSWORD}" psql -U "${NEG_DBA_ROLE}" -d "${NEG_DB}" -tAc 'SHOW createrole_self_grant')"
          echo "createroleSelfGrantSettingIsDefaultEmpty=$([[ -z "${selfgrant// /}" ]] && echo PASS || echo FAIL)"
          if [[ -n "${selfgrant// /}" ]]; then
            echo "FATAL: createrole_self_grant is not at its default; this arm would not be reproducing default DBA behaviour." >&2
            exit 1
          fi

          # The runbook's OWN CREATE ROLE text (:82-89), issued by a
          # non-superuser CREATEROLE role. Nothing about the statement differs
          # from the positive arm — only who runs it.
          for pair in "${NEG_RUNTIME_ROLE}|${NEG_ROLE_PASSWORD}" "${NEG_PROVISIONING_ROLE}|${NEG_ROLE_PASSWORD}"; do
            role="${pair%%|*}"
            pw="${pair##*|}"
            PGPASSWORD="${NEG_DBA_PASSWORD}" psql -U "${NEG_DBA_ROLE}" -d "${NEG_DB}" -v ON_ERROR_STOP=1 -q -c \
              "CREATE ROLE \"${role}\" LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS NOINHERIT PASSWORD '${pw}'"
          done
          echo "negativeControlRolesCreatedByCreateroleNonSuperuser=PASS"

      - name: Negative control premise — the auto ADMIN grant must actually be present
        if: matrix.pg != '15'
        run: |
          set -euo pipefail
          probe() {
            psql -U postgres -d "${NEG_DB}" -tAc "$1"
          }
          # PostgreSQL 16 grants the creating CREATEROLE non-superuser membership
          # WITH ADMIN OPTION in every role it creates. That grant is a
          # pg_auth_members row, and it exists regardless of createrole_self_grant
          # (that GUC only adds SET and/or INHERIT to the same grant). If this
          # probe finds nothing, the control never set up the condition it claims
          # to test and a later "refused" would prove nothing.
          members="$(probe "SELECT count(*) FROM pg_auth_members m
            WHERE m.roleid IN (SELECT oid FROM pg_roles WHERE rolname IN ('${NEG_RUNTIME_ROLE}', '${NEG_PROVISIONING_ROLE}'))
               OR m.member IN (SELECT oid FROM pg_roles WHERE rolname IN ('${NEG_RUNTIME_ROLE}', '${NEG_PROVISIONING_ROLE}'))")"
          echo "negativeControlPgAuthMembersRows=$([[ "$members" -gt 0 ]] && echo NONZERO || echo ZERO)"
          if [[ "$members" -le 0 ]]; then
            echo "FATAL: no pg_auth_members row was auto-created; the createrole_self_grant negative control did not set up its own premise." >&2
            exit 1
          fi

          # EXCLUSIVITY: every OTHER leg of the predicate must pass on these same
          # roles, so the refusal below can only be the membership row.
          attrs="$(probe "
            SELECT count(*) FILTER (WHERE TRUE)::text || ':' || bool_and(
              NOT rolsuper AND NOT rolcreatedb AND NOT rolcreaterole
              AND NOT rolreplication AND NOT rolbypassrls
              AND rolcanlogin AND NOT rolinherit
            )::text
            FROM pg_roles
            WHERE rolname IN ('${NEG_RUNTIME_ROLE}', '${NEG_PROVISIONING_ROLE}')")"
          echo "negativeControlAttributeProbe=${attrs}"
          if [[ "$attrs" != "2:true" ]]; then
            echo "FATAL: the negative-control roles differ from the positive arm in some attribute as well; the refusal would not be attributable to pg_auth_members alone." >&2
            exit 1
          fi
          echo "negativeControlExclusiveToPgAuthMembers=PASS"

      - name: Negative control — the predicate MUST refuse these roles
        if: matrix.pg != '15'
        working-directory: ${{ env.PKG_ROOT }}
        run: |
          set -euo pipefail
          # Migrations run as the superuser here on purpose. Who applies the
          # migration is orthogonal to the finding; running as the DBA would risk
          # an unrelated permission failure on one of the ~70 earlier migrations
          # and destroy the attribution.
          set +e
          DATABASE_URL="postgresql://postgres:postgres@127.0.0.1:5432/${NEG_DB}" \
          PGOPTIONS="-c metasheet.sealed_export_runtime_role=${NEG_RUNTIME_ROLE} -c metasheet.sealed_export_provisioning_role=${NEG_PROVISIONING_ROLE}" \
            node packages/core-backend/dist/src/db/migrate.js > "${RUNNER_TEMP}/negctl-apply.log" 2>&1
          rc=$?
          set -e
          echo "negativeControlExitCode=${rc}"
          echo "--- negative control output (tail) ---"
          tail -n 40 "${RUNNER_TEMP}/negctl-apply.log" || true

          if [[ "$rc" -eq 0 ]]; then
            echo "FATAL P0: a sealed-export role auto-granted into pg_auth_members by a CREATEROLE non-superuser was ACCEPTED. The role-safety predicate did not fire." >&2
            exit 1
          fi
          if ! grep -qF 'sealed-export role has unsafe authority' "${RUNNER_TEMP}/negctl-apply.log"; then
            echo "FATAL: the negative arm failed for a reason other than the role-safety predicate — the failure is not attributable to the auto-membership row." >&2
            exit 1
          fi
          if ! grep -qF '073_create_sealed_export_stock_prep_runtime_authority' "${RUNNER_TEMP}/negctl-apply.log"; then
            echo "FATAL: the refusal is not attributed to migration 073." >&2
            exit 1
          fi
          echo "negativeControlRefused=PASS"

          # DIAGNOSTIC. Migration 073 cannot carry this text: it is a content
          # digest pin of the frozen S6-A package (see this job's header), so the
          # operator-facing hint lives in the runbook, in the e2e provisioning
          # script's pre-migration probe, and in these lines.
          {
            echo "diagnosticCause=PG16_CREATEROLE_AUTO_ADMIN_MEMBERSHIP_ROW_IN_pg_auth_members"
            echo "diagnosticRelatedSetting=createrole_self_grant"
            echo "diagnosticNote=createrole_self_grant only adds SET/INHERIT to that grant; the pg_auth_members row exists either way"
            echo "diagnosticRemedy=create the two sealed-export roles as a SUPERUSER, or REVOKE the auto ADMIN grant before migrating"
            echo "diagnosticRunbook=docs/operations/stock-preparation-s6a-sqlserver-onprem-runbook-20260731.md#2"
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: PG15 contrast leg — the auto-membership does NOT occur before PostgreSQL 16
        if: matrix.pg == '15'
        run: |
          set -euo pipefail
          # Same setup as the 16/17 negative control, minus the migrate run. This
          # is what makes "the negative control is 16/17 only" a measured claim
          # rather than an assumption about version behaviour.
          psql -U postgres -d postgres -v ON_ERROR_STOP=1 -q -c \
            "CREATE ROLE \"${NEG_DBA_ROLE}\" LOGIN CREATEROLE NOSUPERUSER PASSWORD '${NEG_DBA_PASSWORD}'"
          psql -U postgres -d postgres -v ON_ERROR_STOP=1 -q -c \
            "CREATE DATABASE \"${NEG_DB}\""
          for pair in "${NEG_RUNTIME_ROLE}|${NEG_ROLE_PASSWORD}" "${NEG_PROVISIONING_ROLE}|${NEG_ROLE_PASSWORD}"; do
            role="${pair%%|*}"
            pw="${pair##*|}"
            PGPASSWORD="${NEG_DBA_PASSWORD}" psql -U "${NEG_DBA_ROLE}" -d "${NEG_DB}" -v ON_ERROR_STOP=1 -q -c \
              "CREATE ROLE \"${role}\" LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS NOINHERIT PASSWORD '${pw}'"
          done
          members="$(psql -U postgres -d "${NEG_DB}" -tAc "SELECT count(*) FROM pg_auth_members m
            WHERE m.roleid IN (SELECT oid FROM pg_roles WHERE rolname IN ('${NEG_RUNTIME_ROLE}', '${NEG_PROVISIONING_ROLE}'))
               OR m.member IN (SELECT oid FROM pg_roles WHERE rolname IN ('${NEG_RUNTIME_ROLE}', '${NEG_PROVISIONING_ROLE}'))")"
          echo "negativeControlPgAuthMembersRows=$([[ "$members" -gt 0 ]] && echo NONZERO || echo ZERO)"
          if [[ "$members" -ne 0 ]]; then
            echo "FATAL: PostgreSQL 15 auto-granted membership too — the version boundary this workflow documents is wrong." >&2
            exit 1
          fi
          echo "negativeControlApplicable=false"
          echo "pg15NoAutoMembershipContrast=PASS"

      - name: Upload per-version role-bound evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t1-rolebound-postgres-${{ matrix.pg }}-evidence
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/rolebound-list-pre.log
            ${{ runner.temp }}/rolebound-list-post.log
            ${{ runner.temp }}/rolebound-apply.log
            ${{ runner.temp }}/rolebound-replay.log
            ${{ runner.temp }}/negctl-apply.log

      - name: Values-free evidence (this leg)
        run: |
          {
            echo "postgresMajorVersion=${{ matrix.pg }}"
            echo "postgresServerVersionPinMatch=PASS"
            echo "packageSha256PinMatch=PASS"
            echo "roleProvisioningSource=RUNBOOK_SECTION_2"
            echo "sealedExportRolesCreated=PASS"
            echo "sealedRoleAttributesRunbookConformant=PASS"
            echo "sealedRoleZeroMembership=PASS"
            echo "gucMechanism=PGOPTIONS"
            echo "migrationsAppliedPre=0"
            echo "migrationsPendingPost=0"
            echo "migration073Confirmed=PASS"
            echo "migration074Confirmed=PASS"
            echo "migration075Confirmed=PASS"
            echo "latentBranchTaken=false"
            echo "roleBoundGrantsPresent=PASS"
            echo "overGrantGuards=PASS"
            echo "migrationReplayIdempotent=PASS"
            if [[ "${{ matrix.pg }}" == "15" ]]; then
              echo "negativeControlApplicable=false"
              echo "pg15NoAutoMembershipContrast=PASS"
            else
              echo "negativeControlApplicable=true"
              echo "negativeControlExclusiveToPgAuthMembers=PASS"
              echo "negativeControlRefused=PASS"
            fi
            echo "predicateWeakened=false"
            echo "migrationFilesModified=false"
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------
  # Job 3: gate on both jobs above and publish one combined, values-free
  # evidence block.
  # ---------------------------------------------------------------------
  evidence-summary:
    name: T1 evidence summary
    needs: [verify-frozen-package, migrate-postgres, migrate-postgres-role-bound]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every upstream job to have fully succeeded
        env:
          VERIFY_RESULT: ${{ needs.verify-frozen-package.result }}
          MIGRATE_RESULT: ${{ needs.migrate-postgres.result }}
          ROLE_BOUND_RESULT: ${{ needs.migrate-postgres-role-bound.result }}
        run: |
          set -euo pipefail
          echo "verify-frozen-package result: ${VERIFY_RESULT}"
          echo "migrate-postgres (all of 15/16/17) result: ${MIGRATE_RESULT}"
          echo "migrate-postgres-role-bound (all of 15/16/17) result: ${ROLE_BOUND_RESULT}"
          if [[ "${VERIFY_RESULT}" != "success" || "${MIGRATE_RESULT}" != "success" || "${ROLE_BOUND_RESULT}" != "success" ]]; then
            echo "One or more T1 gates did not pass; overall FAIL." >&2
            exit 1
          fi

      - name: Values-free combined evidence block
        run: |
          {
            echo "evidenceKind=CONTROLLED_SYNTHETIC_FUNCTIONAL"
            echo "serviceRuntimeSha=${SERVICE_RUNTIME_SHA_PIN}"
            echo "releaseTag=${RELEASE_TAG}"
            echo "packageFile=${PACKAGE_FILE}"
            echo "packageSha256=${PACKAGE_SHA256_PIN}"
            echo "packageProvenanceManifestDigest=${PACKAGE_PROVENANCE_MANIFEST_DIGEST_PIN}"
            echo "packageVerification=PASS"
            echo "oneByteNegativeCheck=PASS"
