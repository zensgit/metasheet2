name: Approval real-DB acceptance (P3-2a projection entry)

# EVIDENCE LANE for the approval detail response's `projectionEntry` navigation handle
# (design-lock 2026-09-12, "entry only; reuse the participant predicate; projection form-content
# stays fenced behind O-4"):
#   - tests/integration/approval-projection-entry.db.test.ts — the CANONICAL participant predicate
#     (`loadApprovalProjectionParticipantSheetIds`) resolved against a real `meta_sheets` JOIN
#     `meta_records`, and the default-view lookup against real `meta_views`, over real HTTP:
#     a readable instance with no projection row materialized yet returns `null`, not a 500; the
#     REQUESTER seeded as the projection row's participant gets the SERVER-resolved
#     `{sheetId, viewId}` handle; a SEAT-HOLDING approver (S1 admits them, 200) who is NOT yet a
#     projection participant gets `null` until the SAME instance's projection row names them
#     (positive control, both facts pinned on the one instance); and the P3-1 regression case —
#     the DISPATCH ACTION response (`POST /api/approvals/:id/actions`, which returns
#     `ApprovalProductService.getApproval`'s DTO, a DIFFERENT DTO builder than the GET detail
#     read's `ApprovalBridgeService.getApproval`) carries the handle too, so it does not EVAPORATE
#     after an approve/reject the way `nodeOperations` once did.
# Ephemeral first-party PostgreSQL container; no customer source, no deployment, no flag change.
#
# WHY A STANDALONE FILE, not a plugin-tests.yml allowlist entry: plugin-tests.yml is an s6a
# sha256-pinned provenance input (sealed-export-package-provenance.cjs PINNED_EVIDENCE_FILES), so
# every edit forces an s6a re-pin and a merge-serialisation race. This mirrors the sibling
# approval-realdb-can-decide-current-node.yml / approval-realdb-comments.yml lanes and the
# precedent they cite. plugin-tests.yml is left byte-identical. Promoting this suite into
# plugin-tests.yml's own approval real-DB step (one extra line there would do it) is a separate,
# owner-level decision about widening the REQUIRED set — not made by this lane.
#
# TWO-POINT WIRING (the other half): the suite is excluded from the no-DB default vitest config
# (packages/core-backend/vitest.config.ts) in the SAME commit that adds this file, so the required
# `test (18.x/20.x)` job cannot collect-and-skip-green it. EXPECT_DB=1 below arms the suite's
# top-level anti-skip-green sentinel: a run in this lane with a missing/broken DATABASE_URL goes
# RED instead of silently reporting the whole file as skipped.

on:
  workflow_dispatch:
  # NO `merge_group:` — deliberately, matching the sibling approval-realdb-* evidence lanes (a
  # `merge_group` event does not honour the `paths` filter the way `pull_request` does, so
  # declaring it would spin up this PostgreSQL job for every merge group regardless of relevance).
  pull_request:
    # No `branches:` filter (mirrors the sibling approval-realdb-* precedents): a brand-new
    # workflow cannot be workflow_dispatch-ed until it has run once via a trigger it responds to.
    # The `paths` filter keeps it off unrelated PRs.
    paths:
      - 'packages/core-backend/tests/integration/approval-projection-entry.db.test.ts'
      - 'packages/core-backend/src/multitable/approval-record-projection-service.ts'
      - 'packages/core-backend/src/multitable/permission-service.ts'
      - 'packages/core-backend/src/multitable/approval-projection-constants.ts'
      - 'packages/core-backend/src/services/ApprovalBridgeService.ts'
      - 'packages/core-backend/src/services/ApprovalProductService.ts'
      - 'packages/core-backend/src/services/approval-bridge-types.ts'
      - 'packages/core-backend/src/routes/approvals.ts'
      - 'packages/core-backend/src/index.ts'
      - 'packages/core-backend/tests/helpers/approval-schema-bootstrap.ts'
      - 'packages/core-backend/vitest.config.ts'
      - 'packages/core-backend/vitest.integration.config.ts'
      - 'packages/core-backend/tests/setup.integration.ts'
      - 'packages/core-backend/tests/globalTeardown.ts'
      - '.github/workflows/approval-realdb-projection-entry.yml'
  push:
    branches: [main]
    paths:
      - 'packages/core-backend/tests/integration/approval-projection-entry.db.test.ts'
      - 'packages/core-backend/src/multitable/approval-record-projection-service.ts'
      - 'packages/core-backend/src/multitable/permission-service.ts'
      - 'packages/core-backend/src/multitable/approval-projection-constants.ts'
      - 'packages/core-backend/src/services/ApprovalBridgeService.ts'
      - 'packages/core-backend/src/services/ApprovalProductService.ts'
      - 'packages/core-backend/src/services/approval-bridge-types.ts'
      - 'packages/core-backend/src/routes/approvals.ts'
      - 'packages/core-backend/src/index.ts'
      - 'packages/core-backend/tests/helpers/approval-schema-bootstrap.ts'
      - 'packages/core-backend/vitest.config.ts'
      - 'packages/core-backend/vitest.integration.config.ts'
      - 'packages/core-backend/tests/setup.integration.ts'
      - 'packages/core-backend/tests/globalTeardown.ts'
      - '.github/workflows/approval-realdb-projection-entry.yml'

permissions:
  contents: read

jobs:
  approval-realdb-projection-entry:
    name: approval-realdb-projection-entry
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metasheet_approval_realdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d metasheet_approval_realdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/metasheet_approval_realdb
      # Arms the suite's top-level sentinel: in THIS lane a missing DATABASE_URL is a red run,
      # never a silent skipped-green.
      EXPECT_DB: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Use empty npmrc for pnpm
        run: |
          echo "" > /tmp/empty-npmrc
          echo "NPM_CONFIG_USERCONFIG=/tmp/empty-npmrc" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run DB migrations
        env:
          # Same per-PR-gate exclusion list as plugin-tests.yml's "Run DB migrations" step
          # (see packages/core-backend/MIGRATION_EXCLUDE_TRACKING.md) — this lane provisions the
          # identical schema the approval real-DB steps run against.
          MIGRATION_EXCLUDE: 008_plugin_infrastructure.sql,048_create_event_bus_tables.sql,049_create_bpmn_workflow_tables.sql,042a_core_model_views.sql,20250924140000_create_gantt_tables.ts,20250925_create_view_tables.sql
        run: pnpm --filter @metasheet/core-backend db:migrate

      - name: Run P3-2(a) projection-entry real-DB acceptance (whole file)
        # WHOLE FILE, --reporter=verbose: a name filter matching zero tests would exit green and
        # hide regressions; verbose prints every collected test so an empty collection shows in
        # the log.
        run: >-
          pnpm --filter @metasheet/core-backend exec vitest
          --config vitest.integration.config.ts run
          tests/integration/approval-projection-entry.db.test.ts
          --reporter=verbose

      - name: Values-free evidence (this job)
        run: |
          {
            echo "evidenceKind=CONTROLLED_SYNTHETIC_FUNCTIONAL"
            echo "suites=approval-projection-entry.db.test.ts"
            echo "scope=P3-2(a) approval detail projectionEntry handle: canonical participant predicate real JOIN, default-view lookup, GET detail read + dispatch-action DTO parity (P3-1)"
            echo "sentinelArmed=EXPECT_DB=1"
            echo "customerSourceAccess=NOT_INVOLVED"
            echo "flagChanged=false"
            echo "externalWrite=false"
          } | tee -a "$GITHUB_STEP_SUMMARY"
