name: Approved staging directory candidate (standby branch only)
on:
  workflow_dispatch:
    inputs:
      expected_controller_sha:
        required: true
        type: string
      source_sha:
        required: true
        type: string
      publish_approved:
        required: true
        type: boolean
        default: false
concurrency:
  group: approved-staging-handover-e94c982b66
  cancel-in-progress: false
permissions:
  contents: read
  packages: write
jobs:
  candidate:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    env:
      EXPECTED_CONTROLLER_SHA: ${{ inputs.expected_controller_sha }}
      SOURCE_SHA: ${{ inputs.source_sha }}
      PUBLISH_APPROVED: ${{ inputs.publish_approved }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Controller safety tests
        run: |
          node --test controller/scripts/ops/staging-directory-candidate.test.mjs
          python3 controller/scripts/ops/staging_candidate_receipt_test.py
      - name: Frozen source and publication preflight
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node controller/scripts/ops/staging-directory-candidate.mjs preflight
      - uses: actions/checkout@v4
        with:
          ref: e94c982b66a0d41a2eeb7e49a1a367934f39a2b6
          path: source
          persist-credentials: false
      - name: Build candidate images without latest
        env:
          VITE_ENABLE_YJS_COLLAB: 'false'
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "$SOURCE_SHA"
          CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for ROLE in backend web; do
            FILE=backend
            if [ "$ROLE" = web ]; then FILE=frontend; fi
            docker build --platform linux/amd64 -f "source/Dockerfile.$FILE" \
              --build-arg "VCS_REF=$SOURCE_SHA" \
              --build-arg BUILD_IMAGE_TAG=staging-directory-handover-e94c982b66 \
              --build-arg BUILD_IMAGE_SOURCE=https://github.com/zensgit/metasheet2 \
              --build-arg "BUILD_CREATED=$CREATED" \
              --build-arg "VITE_ENABLE_YJS_COLLAB=$VITE_ENABLE_YJS_COLLAB" \
              -t "ghcr.io/zensgit/metasheet2-$ROLE:staging-directory-handover-e94c982b66" source
          done
      - name: Validate actual candidate payloads
        run: node controller/scripts/ops/staging-directory-candidate-validate.mjs
      - name: Isolated image upgrade, backup, restore and rollback
        run: python3 controller/scripts/ops/staging-handover-rehearsal.py
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish only approved candidate tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node controller/scripts/ops/staging-directory-candidate.mjs publish
      - name: Upload values-free candidate receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-directory-candidate-receipts
          path: |
            candidate-error-sanitized.log
            publication-before.json
            candidate-validation.json
            publication-receipt.json
            candidate-provider-names.json
            candidate-rehearsal.json
            candidate-receipt-transport.json
            candidate-ledger-reconciliation.json
            candidate-db-tests.json
            candidate-db-test-assembly.json
            candidate-cli-receipt.json
            candidate-backup-restore.json
            candidate-runtime-receipts.json
            candidate-source-migration-hashes.json
            candidate-synthetic-browser.json
            candidate-ui-*.png
            frontend-candidate-tests.json
            backend-candidate-tests.json
          if-no-files-found: ignore
