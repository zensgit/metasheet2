name: PLM on-prem startup readiness

on:
  pull_request:
    paths:
      - 'scripts/ops/multitable-onprem-deploy-easy.sh'
      - 'scripts/ops/multitable-onprem-startup-readiness.test.mjs'
      - 'scripts/ops/multitable-onprem-private-command-logs.test.mjs'
      - 'scripts/ops/multitable-onprem-manager-handoff.test.mjs'
      - '.github/workflows/plm-onprem-startup-readiness.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/ops/multitable-onprem-deploy-easy.sh'
      - 'scripts/ops/multitable-onprem-startup-readiness.test.mjs'
      - 'scripts/ops/multitable-onprem-private-command-logs.test.mjs'
      - 'scripts/ops/multitable-onprem-manager-handoff.test.mjs'
      - '.github/workflows/plm-onprem-startup-readiness.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    name: Actual shell and loopback HTTP contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: >-
          node --test scripts/ops/multitable-onprem-startup-readiness.test.mjs
          scripts/ops/multitable-onprem-private-command-logs.test.mjs
          scripts/ops/multitable-onprem-manager-handoff.test.mjs
