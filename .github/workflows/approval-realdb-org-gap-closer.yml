name: Approval real-DB acceptance (Lock-11 §10.3 gap-closer — Migration-B->W1W2 window)

# EVIDENCE LANE for Lock-11 §10.3 (docs/development/approval-lock11-writer-org-derivation-20260822.md,
# seventh by-reference ruling, item 1, AUTHORIZED 2026-08-22): the gap-closer migration
# (zzzz20260823150000_close_approval_instance_org_id_gap_window.ts) that stamps org_id on
# approval_instances rows created AFTER Migration B's own recorded execution and BEFORE the W-1/W-2
# writer slice deploys — the Migration-B->W1W2 NULL-row creation window. Same (i)-guarded pattern
# as Migration B's class-6 revision: single-active-org premise self-asserted INSIDE the migration,
# values-free FAIL-LOUD, idempotent (org_id IS NULL scoped), prefix-guarded (plm:/afs: untouched).
#
# Gates: G1 (window row + single active org -> stamped), G2 (+ positive control: the temporal
# guard is load-bearing — a pre-window row of the identical shape is left untouched), G3/G3b
# (two-org / zero-org fixture -> ABORT before any UPDATE, values-free), G4 (idempotent — a second
# run with a DIFFERENT single active org never re-stamps an already-resolved row), G5/G6 (plm:/afs:
# prefix guards), G7 (source_system guard), G8 (Migration B not recorded -> safe no-op), G9 (an
# already-stamped row is never re-derived).
#
# Ephemeral first-party PostgreSQL container; no customer source, no deployment, no flag change.
#
# WHY A STANDALONE FILE, not a plugin-tests.yml allowlist entry: plugin-tests.yml is an s6a
# sha256-pinned provenance input (sealed-export-package-provenance.cjs PINNED_EVIDENCE_FILES), so
# every edit forces an s6a re-pin and a merge-serialisation race. This mirrors the sibling
# approval-realdb-org-writer-w1w2-s1.yml / approval-realdb-org-backfill-b.yml lanes. plugin-tests.yml
# is left byte-identical.
#
# TWO-POINT WIRING (the other half): the suite is excluded from the no-DB default vitest config
# (packages/core-backend/vitest.config.ts) in the SAME commit that adds this file, so the required
# `test (18.x/20.x)` job no longer collect-and-skip-greens it. This workflow is where the suite
# actually EXECUTES, with EXPECT_DB=1 arming the suite's top-level anti-skip-green sentinel: a run
# in this lane with a missing/broken DATABASE_URL goes RED instead of silently reporting the whole
# file as skipped.

on:
  workflow_dispatch:
  # NO `merge_group:` — deliberately, matching the sibling approval-realdb-* evidence lanes (a
  # merge_group event does not honour the `paths` filter the way `pull_request` does, so declaring
  # it would spin up this PostgreSQL job for every merge group regardless of relevance).
  pull_request:
    # No `branches:` filter (mirrors the sibling approval-realdb-* precedents): a brand-new
    # workflow cannot be workflow_dispatch-ed until it has run once via a trigger it responds to.
    # The `paths` filter keeps it off unrelated PRs.
    paths:
      - 'packages/core-backend/tests/integration/approval-org-instance-gap-closer.db.test.ts'
      - 'packages/core-backend/src/db/migrations/zzzz20260823150000_close_approval_instance_org_id_gap_window.ts'
      - 'packages/core-backend/src/db/migrations/zzzz20260823100000_backfill_approval_instance_org_id.ts'
      - 'packages/core-backend/src/db/migrations/zzzz20260114110000_create_user_orgs_table.ts'
      - 'packages/core-backend/vitest.config.ts'
      - '.github/workflows/approval-realdb-org-gap-closer.yml'
  push:
    branches: [main]
    paths:
      - 'packages/core-backend/tests/integration/approval-org-instance-gap-closer.db.test.ts'
      - 'packages/core-backend/src/db/migrations/zzzz20260823150000_close_approval_instance_org_id_gap_window.ts'
      - 'packages/core-backend/src/db/migrations/zzzz20260823100000_backfill_approval_instance_org_id.ts'
      - 'packages/core-backend/src/db/migrations/zzzz20260114110000_create_user_orgs_table.ts'
      - 'packages/core-backend/vitest.config.ts'
      - '.github/workflows/approval-realdb-org-gap-closer.yml'

permissions:
  contents: read

jobs:
  approval-realdb-org-gap-closer:
    name: approval-realdb-org-gap-closer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metasheet_approval_realdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d metasheet_approval_realdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/metasheet_approval_realdb
      # Arms the suite's top-level sentinel: in THIS lane a missing DATABASE_URL is a red run,
      # never a silent skipped-green.
      EXPECT_DB: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Use empty npmrc for pnpm
        run: |
          echo "" > /tmp/empty-npmrc
          echo "NPM_CONFIG_USERCONFIG=/tmp/empty-npmrc" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run DB migrations
        env:
          # Same per-PR-gate exclusion list as plugin-tests.yml's "Run DB migrations" step
          # (see packages/core-backend/MIGRATION_EXCLUDE_TRACKING.md) — this lane provisions the
          # identical schema the approval real-DB steps run against.
          MIGRATION_EXCLUDE: 008_plugin_infrastructure.sql,048_create_event_bus_tables.sql,049_create_bpmn_workflow_tables.sql,042a_core_model_views.sql,20250924140000_create_gantt_tables.ts,20250925_create_view_tables.sql
        run: pnpm --filter @metasheet/core-backend db:migrate

      - name: Run Lock-11 §10.3 gap-closer real-DB acceptance (whole file)
        # WHOLE FILE, --reporter=verbose: a name filter matching zero tests would exit green and
        # hide regressions; verbose prints every collected test so an empty collection shows in
        # the log.
        run: >-
          pnpm --filter @metasheet/core-backend exec vitest
          --config vitest.integration.config.ts run
          tests/integration/approval-org-instance-gap-closer.db.test.ts
          --reporter=verbose

      - name: Values-free evidence (this job)
        run: |
          {
            echo "evidenceKind=CONTROLLED_SYNTHETIC_FUNCTIONAL"
            echo "suites=approval-org-instance-gap-closer.db.test.ts"
            echo "scope=Lock-11 §10.3 gap-closer — Migration-B->W1W2 NULL-row creation window (G1-G9)"
            echo "sentinelArmed=EXPECT_DB=1"
            echo "customerSourceAccess=NOT_INVOLVED"
            echo "flagChanged=false"
            echo "externalWrite=false"
          } | tee -a "$GITHUB_STEP_SUMMARY"
