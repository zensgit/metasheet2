# Tasks real-DB lane. §13-12 (b): no paths filter, merge_group declared.
# Branch-protection append is a later owner step (POST, not PUT) after this
# job has run on main. This file does not change production or TASKS_ENABLED.
name: Tasks real DB

on:
  workflow_dispatch:
  merge_group:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tasks-realdb:
    name: tasks-realdb
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metasheet_tasks_realdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d metasheet_tasks_realdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/metasheet_tasks_realdb
      EXPECT_DB: '1'
      TASKS_ENABLED: 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false
      - name: Use empty npmrc for pnpm
        run: |
          echo "" > /tmp/empty-npmrc
          echo "NPM_CONFIG_USERCONFIG=/tmp/empty-npmrc" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run DB migrations
        env:
          MIGRATION_EXCLUDE: 008_plugin_infrastructure.sql,048_create_event_bus_tables.sql,049_create_bpmn_workflow_tables.sql,042a_core_model_views.sql,20250924140000_create_gantt_tables.ts,20250925_create_view_tables.sql
        run: pnpm --filter @metasheet/core-backend db:migrate
      - name: Run tasks P0-A real-DB file
        run: >-
          pnpm --filter @metasheet/core-backend exec vitest
          --config vitest.integration.config.ts run
          tests/integration/tasks-p0a.db.test.ts
          --reporter=verbose
