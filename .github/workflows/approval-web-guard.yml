jobs:
  approval-web-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Use empty npmrc for pnpm
        run: |
          echo "" > /tmp/empty-npmrc
          echo "NPM_CONFIG_USERCONFIG=/tmp/empty-npmrc" >> "$GITHUB_ENV"

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run approval web guard specs (targeted)
        # detail/sub-form (明细) FE helpers: frozen-schema row render + fill-row seeding +
        # column-draft validation (mirrors backend normalizeDetailFieldParts) + buildFormSchema
        # detail emit/round-trip + validateTemplateDraft detail branch.
        # G-1 complex-graph load-preserve: anti-flatten round-trip (condition/parallel/cc save
        # byte-identical) + isComplexApprovalGraph + graphReadOnlyReason vs unsupportedReason split.
        # G-2 condition editor: topology-preserving edit (rule/conjunction/defaultEdgeKey change →
        # only the condition node config changes; all other nodes + edges byte-identical; parallel/cc
        # untouched) + seeding round-trip + validation preview (fieldId / outgoing default edge).
        # Common-template presets: the first three preset payloads stay linear/editable and the
        # authoring page button creates a draft through the real createTemplate wrapper, never publish.
        # G-3 parallel editor: topology-preserving joinMode edit (only that parallel node's joinMode
        # changes; branches/joinNodeKey + all other nodes + edges byte-identical) + cross-phase
        # compose (condition G-2 + parallel G-3 both land) + seeding round-trip + validation preview
        # (joinMode in backend-accepted {'all','any'}; cc untouched / G-4).
        # T3-1 mobile v0: i18n retrofit (locale-aware labels, fail-first RED on hardcoded-Chinese
        # revert) + responsive/flag-off gate — FE-only, had NO required gate before this wiring (#3607).
        # UF-2 (ui-foundation-design-lock-20260706.md §6): PageShell/PageHeader — the shared page
        # container + header components all approval views converged on. pageShell.spec.ts locks
        # the width-tier→token mapping + title/subtitle/actions/meta slots + the back-navigation
        # contract (backTo path-push vs back event-delegation, and back taking priority over backTo).
        # UF-3: status-color convergence — statusTag (StatusTag.vue + statusDomains.ts unit/mount
        # coverage), approval-e2e-lifecycle (ApprovalDetailView header StatusTag regression),
        # approval-inbox-auth-guard (ApprovalInboxView, had no gate before this wiring),
        # myDelegationView/approvalDelegationView (MyDelegationView/DelegationSettingsView status
        # cell), approvalDelegationStatus (delegationStatus.ts, had no gate before this wiring).
        # UF-3b: approvalTemplate status domain — statusTag's new domain cases (published/draft/
        # archived tone+label) and approval-e2e-permissions (TemplateDetailView header StatusTag
        # regression via data-status selector; had no gate before this wiring, 40 tests).
        run: pnpm --filter @metasheet/web exec vitest run approval-common-template-presets approvalTemplateAuthoring approval-detail-field approval-template-authoring-detail approval-template-authoring-graph-preserve approval-template-authoring-condition-edit approval-template-authoring-parallel-edit approval-template-authoring-cc-edit approval-template-authoring-approval-node-edit approval-template-authoring-complex-node-config-allowlist approval-graph-topology-edit approval-graph-layout amountAutoSum useAutoSumTotal lineDerivation approvalMobileI18n approvalMobileResponsive pageShell statusTag approval-e2e-lifecycle approval-inbox-auth-guard myDelegationView approvalDelegationView approvalDelegationStatus approval-e2e-permissions --reporter=dot
