name: Approval sequential mode real-DB acceptance (Lock-1 K6)

# Dedicated whole-file PostgreSQL gate for Lock-1 K6 sequential approval. The suite is excluded
# from the default no-DB Vitest job in the same commit, and its top-level EXPECT_DB sentinel makes
# a missing DATABASE_URL fail loudly instead of skip-green.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/core-backend/src/routes/approvals.ts'
      - 'packages/core-backend/src/services/ApprovalGraphExecutor.ts'
      - 'packages/core-backend/src/services/ApprovalProductService.ts'
      - 'packages/core-backend/src/services/approval-effective-node-operations.ts'
      - 'packages/core-backend/src/services/approval-sequential-mode.ts'
      - 'packages/core-backend/src/types/approval-product.ts'
      - 'packages/core-backend/tests/helpers/approval-schema-bootstrap.ts'
      - 'packages/core-backend/tests/integration/approval-sequential-mode.db.test.ts'
      - 'packages/core-backend/vitest.config.ts'
      - '.github/workflows/approval-realdb-sequential-mode.yml'
  push:
    branches: [main]
    paths:
      - 'packages/core-backend/src/routes/approvals.ts'
      - 'packages/core-backend/src/services/ApprovalGraphExecutor.ts'
      - 'packages/core-backend/src/services/ApprovalProductService.ts'
      - 'packages/core-backend/src/services/approval-effective-node-operations.ts'
      - 'packages/core-backend/src/services/approval-sequential-mode.ts'
      - 'packages/core-backend/src/types/approval-product.ts'
      - 'packages/core-backend/tests/helpers/approval-schema-bootstrap.ts'
      - 'packages/core-backend/tests/integration/approval-sequential-mode.db.test.ts'
      - 'packages/core-backend/vitest.config.ts'
      - '.github/workflows/approval-realdb-sequential-mode.yml'

permissions:
  contents: read

jobs:
  approval-realdb-sequential-mode:
    name: approval-realdb-sequential-mode (pg${{ matrix.postgres }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        postgres: ['15', '16']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metasheet_approval_sequential
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d metasheet_approval_sequential"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/metasheet_approval_sequential
      EXPECT_DB: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Use empty npmrc for pnpm
        run: |
          echo "" > /tmp/empty-npmrc
          echo "NPM_CONFIG_USERCONFIG=/tmp/empty-npmrc" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify no-DB exclusion and suite sentinel wiring
        run: |
          grep -Fq "'tests/integration/approval-sequential-mode.db.test.ts'," packages/core-backend/vitest.config.ts
          grep -Fq "sentinel: EXPECT_DB lane must have DATABASE_URL" packages/core-backend/tests/integration/approval-sequential-mode.db.test.ts
          expect_key=EXPECT_DB
          grep -Eq "^      ${expect_key}: '1'$" .github/workflows/approval-realdb-sequential-mode.yml

      - name: Assert fail-loud DB contract
        run: |
          test "${EXPECT_DB:-}" = '1'
          test -n "${DATABASE_URL:-}"

      - name: Run DB migrations
        env:
          MIGRATION_EXCLUDE: 008_plugin_infrastructure.sql,048_create_event_bus_tables.sql,049_create_bpmn_workflow_tables.sql,042a_core_model_views.sql,20250924140000_create_gantt_tables.ts,20250925_create_view_tables.sql
        run: pnpm --filter @metasheet/core-backend db:migrate

      - name: Run Lock-1 K6 sequential approval real-DB acceptance (whole file)
        run: >-
          pnpm --filter @metasheet/core-backend exec vitest
          --config vitest.integration.config.ts run
          tests/integration/approval-sequential-mode.db.test.ts
          --reporter=verbose

      - name: Values-free evidence
        run: |
          {
            echo "evidenceKind=CONTROLLED_SYNTHETIC_FUNCTIONAL"
            echo "suite=approval-sequential-mode.db.test.ts"
            echo "lock=approval-lock1-assignee-catalog-20260817 K6"
            echo "postgres=${{ matrix.postgres }}"
            echo "sentinelArmed=EXPECT_DB=1"
            echo "customerSourceAccess=NOT_INVOLVED"
            echo "flagChanged=false"
            echo "externalWrite=false"
          } | tee -a "$GITHUB_STEP_SUMMARY"
