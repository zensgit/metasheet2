name: Phase 5 SLO Validation (Local CI)

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18.x'

      - name: Enable corepack and install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.16.1 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unified Phase 5 CI
        id: phase5
        env:
          PHASE5_ARTIFACT_DIR: ${{ runner.temp }}/phase5-validation/${{ github.run_id }}-${{ github.run_attempt }}
          FEATURE_CACHE: 'true'
          ENABLE_FALLBACK_TEST: 'true'
          COUNT_CACHE_MISS_AS_FALLBACK: 'false'
          API_BASE: 'http://127.0.0.1:8900'
          METRICS_URL: 'http://127.0.0.1:8900/metrics/prom'
          ARTIFACT_JSON: ${{ runner.temp }}/phase5-validation/${{ github.run_id }}-${{ github.run_attempt }}/phase5.json
          ARTIFACT_MD: ${{ runner.temp }}/phase5-validation/${{ github.run_id }}-${{ github.run_attempt }}/phase5.md
          SERVER_LOG: ${{ runner.temp }}/phase5-validation/${{ github.run_id }}-${{ github.run_attempt }}/server.log
        run: |
          mkdir -p "$PHASE5_ARTIFACT_DIR"
          bash scripts/phase5-ci-run.sh

      - name: Write values-free artifact summary
        if: always()
        shell: bash
        env:
          PHASE5_ARTIFACT_DIR: ${{ runner.temp }}/phase5-validation/${{ github.run_id }}-${{ github.run_attempt }}
          PHASE5_RUNNER_OUTCOME: ${{ steps.phase5.outcome }}
        run: |
          mkdir -p "$PHASE5_ARTIFACT_DIR"
          summary_path="$PHASE5_ARTIFACT_DIR/summary.json"
          if [[ -s "$PHASE5_ARTIFACT_DIR/phase5.json" ]] && jq -e '
            (.summary | type == "object") and
            (.summary.overall_status == "pass" or .summary.overall_status == "fail") and
            (.summary.passed | type == "number" and floor == . and . >= 0) and
            (.summary.failed | type == "number" and floor == . and . >= 0) and
            (.summary.na | type == "number" and floor == . and . >= 0)
          ' "$PHASE5_ARTIFACT_DIR/phase5.json" >/dev/null 2>&1; then
            jq -c --arg outcome "$PHASE5_RUNNER_OUTCOME" '{
              status: (if .summary.overall_status == "pass" and $outcome == "success" and .summary.passed > 0 and .summary.failed == 0 and .summary.na == 0 then "pass" else "fail" end),
              runner_outcome: (if $outcome == "success" then "success" else "failure" end),
              passed: .summary.passed,
              failed: .summary.failed,
              na: .summary.na
            }' "$PHASE5_ARTIFACT_DIR/phase5.json" > "$summary_path"
          else
            jq -cn --arg outcome "$PHASE5_RUNNER_OUTCOME" '{
              status: "unavailable",
              runner_outcome: (if $outcome == "success" then "success" else "failure" end)
            }' > "$summary_path"
          fi

      - name: Upload values-free summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-validation
          if-no-files-found: ignore
          path: ${{ runner.temp }}/phase5-validation/${{ github.run_id }}-${{ github.run_attempt }}/summary.json
