name: Approval real-DB acceptance (C1 /context projection fence)

# EVIDENCE LANE for C1 — GET /api/multitable/context now routes its sheet readability AND its
# capability booleans through the SAME fenced resolvers every other sheet-addressed route in
# univer-meta.ts already uses (resolveSheetCapabilitiesForAccess / filterReadableSheetRowsForAccess),
# instead of a bare deriveCapabilities + a route-local unfiltered SQL filter:
#   - tests/integration/multitable-context-approval-projection-fence-realdb.test.ts — provisions REAL
#     approval-projection sheets via getApprovalRecordProjectionService().reconcile() (not hand-typed
#     projection rows) and asserts: a non-admin, non-participant actor holding only global
#     multitable:read gets a byte-identical-shape 404 for the projection sheet as for a sheetId that
#     does not exist (no 403-vs-404 existence oracle); the projection base's sheets[] listing never
#     names the sibling sheet; an ordinary sheet, no-grant actor still gets the pre-existing 403 (the
#     fence changes ONLY the projection/elearning refusal, nothing else); the SAME entitled reader still
#     gets 403 (not the fence's 404) for the People list-filter sentinel sheet and for a baseId/sheetId
#     cross-base mismatch on a sheet that actually exists and is otherwise readable — the 404 anti-oracle
#     treatment is scoped to the actual projection fence, not to any sheet absent from the readable set;
#     a writer participant still gets zero write/manage capability from the returned capability booleans
#     (the fence applies to the capability plane, not only the readability gate); an admin is unaffected;
#     and an ordinary sheet's response is byte-identical to the pre-change shape.
# Ephemeral first-party PostgreSQL container; no customer source, no deployment, no flag change.
#
# WHY A STANDALONE FILE, not a plugin-tests.yml allowlist entry: plugin-tests.yml is an s6a
# sha256-pinned provenance input (sealed-export-package-provenance.cjs PINNED_EVIDENCE_FILES;
# evidenceFiles.pluginTestsWorkflow), so every edit forces an s6a re-pin and a merge-serialisation
# race. This mirrors the sibling approval-realdb-can-decide-current-node.yml /
# approval-realdb-comments.yml lanes and the precedent they cite. plugin-tests.yml is left
# byte-identical by this slice.
#
# TWO-POINT WIRING (the other half): the suite is excluded from the no-DB default vitest config
# (packages/core-backend/vitest.config.ts) in the SAME commit that adds this file, so the required
# `test (18.x/20.x)` job cannot collect-and-skip-green it. EXPECT_DB=1 below arms the suite's
# top-level anti-skip-green sentinel: a run in this lane with a missing/broken DATABASE_URL goes RED
# instead of silently reporting the whole file as skipped.

on:
  workflow_dispatch:
  # NO `merge_group:` — deliberately, matching the sibling approval-realdb-* evidence lanes: a
  # `merge_group` event does not honour the `paths` filter the way `pull_request` does, so declaring
  # it would spin up this PostgreSQL job for every merge group regardless of relevance.
  pull_request:
    # No `branches:` filter (mirrors the sibling approval-realdb-* precedents): a brand-new workflow
    # cannot be workflow_dispatch-ed until it has run once via a trigger it responds to. The `paths`
    # filter keeps it off unrelated PRs.
    paths:
      - 'packages/core-backend/src/routes/univer-meta.ts'
      - 'packages/core-backend/src/multitable/permission-service.ts'
      # Imported directly by the spec (`poolManager`) for its own fixture setup/teardown queries.
      - 'packages/core-backend/src/integration/db/connection-pool.ts'
      - 'packages/core-backend/src/multitable/approval-record-projection-service.ts'
      - 'packages/core-backend/src/multitable/approval-projection-constants.ts'
      - 'packages/core-backend/src/multitable/system-sheet-predicate.ts'
      - 'packages/core-backend/src/multitable/elearning-projection-access.ts'
      - 'packages/core-backend/src/multitable/elearning-projection-constants.ts'
      - 'packages/core-backend/tests/integration/multitable-context-approval-projection-fence-realdb.test.ts'
      - 'packages/core-backend/tests/setup.integration.ts'
      - 'packages/core-backend/src/db/migrations/**'
      # The config this job actually runs under. Its absence was a real wiring hole (see the sibling
      # approval-realdb-export-csv.yml, which documents the same lesson by name): the original filter
      # listed vitest.config.ts (which this job does NOT use) and omitted this one (which it does).
      - 'packages/core-backend/vitest.integration.config.ts'
      # Not a runtime input for this job — it is the SIBLING half of the two-point wiring. This suite
      # must stay excluded there so the no-DB job cannot skip-green it; if that entry is removed this
      # lane should run and say so.
      - 'packages/core-backend/vitest.config.ts'
      - '.github/workflows/approval-realdb-context-projection-fence.yml'
  push:
    branches: [main]
    paths:
      - 'packages/core-backend/src/routes/univer-meta.ts'
      - 'packages/core-backend/src/multitable/permission-service.ts'
      # Imported directly by the spec (`poolManager`) for its own fixture setup/teardown queries.
      - 'packages/core-backend/src/integration/db/connection-pool.ts'
      - 'packages/core-backend/src/multitable/approval-record-projection-service.ts'
      - 'packages/core-backend/src/multitable/approval-projection-constants.ts'
      - 'packages/core-backend/src/multitable/system-sheet-predicate.ts'
      - 'packages/core-backend/src/multitable/elearning-projection-access.ts'
      - 'packages/core-backend/src/multitable/elearning-projection-constants.ts'
      - 'packages/core-backend/tests/integration/multitable-context-approval-projection-fence-realdb.test.ts'
      - 'packages/core-backend/tests/setup.integration.ts'
      - 'packages/core-backend/src/db/migrations/**'
      # The config this job actually runs under. Its absence was a real wiring hole (see the sibling
      # approval-realdb-export-csv.yml, which documents the same lesson by name): the original filter
      # listed vitest.config.ts (which this job does NOT use) and omitted this one (which it does).
      - 'packages/core-backend/vitest.integration.config.ts'
      # Not a runtime input for this job — it is the SIBLING half of the two-point wiring. This suite
      # must stay excluded there so the no-DB job cannot skip-green it; if that entry is removed this
      # lane should run and say so.
      - 'packages/core-backend/vitest.config.ts'
      - '.github/workflows/approval-realdb-context-projection-fence.yml'

permissions:
  contents: read

jobs:
  approval-realdb-context-projection-fence:
    name: approval-realdb-context-projection-fence
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metasheet_approval_realdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d metasheet_approval_realdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/metasheet_approval_realdb
      # Arms the suite's top-level sentinel: in THIS lane a missing DATABASE_URL is a red run, never
      # a silent skipped-green.
      EXPECT_DB: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Use empty npmrc for pnpm
        run: |
          echo "" > /tmp/empty-npmrc
          echo "NPM_CONFIG_USERCONFIG=/tmp/empty-npmrc" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run DB migrations
        env:
          # Same per-PR-gate exclusion list as plugin-tests.yml's "Run DB migrations" step
          # (see packages/core-backend/MIGRATION_EXCLUDE_TRACKING.md).
          MIGRATION_EXCLUDE: 008_plugin_infrastructure.sql,048_create_event_bus_tables.sql,049_create_bpmn_workflow_tables.sql,042a_core_model_views.sql,20250924140000_create_gantt_tables.ts,20250925_create_view_tables.sql
        run: pnpm --filter @metasheet/core-backend db:migrate

      - name: Run C1 /context projection fence real-DB acceptance (whole file)
        # WHOLE FILE, --reporter=verbose: a name filter matching zero tests would exit green and
        # hide regressions; verbose prints every collected test so an empty collection shows in the
        # log.
        run: >-
          pnpm --filter @metasheet/core-backend exec vitest
          --config vitest.integration.config.ts run
          tests/integration/multitable-context-approval-projection-fence-realdb.test.ts
          --reporter=verbose

      - name: Values-free evidence (this job)
        run: |
          {
            echo "evidenceKind=CONTROLLED_SYNTHETIC_FUNCTIONAL"
            echo "suites=multitable-context-approval-projection-fence-realdb.test.ts"
            echo "scope=GET /context readability + capability-plane fence for approval/elearning projection sheets: non-participant 404 anti-oracle parity with nonexistent sheetId, sibling-sheet no-leak on base listing, ordinary-sheet 403 unchanged, People-sentinel and cross-base-mismatch 403 unchanged (fence scope), writer-participant capability-plane fence, admin unaffected, ordinary-sheet byte parity"
            echo "sentinelArmed=EXPECT_DB=1"
            echo "customerSourceAccess=NOT_INVOLVED"
            echo "flagChanged=false"
            echo "externalWrite=false"
          } | tee -a "$GITHUB_STEP_SUMMARY"
