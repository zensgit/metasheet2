name: Approval real-DB acceptance (Lock-5 per-node operation policy)

# EVIDENCE LANE for the Lock-5 per-node operation & member-action policy (`操作权限`) real-DB
# acceptance suite (tests/integration/approval-node-operation-policy.db.test.ts — gates A-1, A-2
# server door, A-4, A-5, A-6, D-1, D-2, D-3, D-4, F-1, X-1, X-2, plus the Lock-3 handler-verb
# interplay and the ungated-verb invariance, each with its positive control). Ephemeral first-party
# PostgreSQL container; no customer source, no deployment, no flag change.
#
# WHY A STANDALONE FILE, not a plugin-tests.yml allowlist entry: plugin-tests.yml is an s6a
# sha256-pinned provenance input (sealed-export-package-provenance.cjs PINNED_EVIDENCE_FILES), so
# every edit forces an s6a re-pin and a merge-serialisation race. This mirrors the sibling
# approval-realdb-l6a-roundscoping.yml / approval-realdb-handler.yml /
# approval-template-policy-carrier-realdb.yml lanes and the sealed-export-s6a-authority-row-lock.yml
# precedent they cite. plugin-tests.yml is left byte-identical.
#
# TWO-POINT WIRING (the other half): the suite is excluded from the no-DB default vitest config
# (packages/core-backend/vitest.config.ts) in the SAME commit that adds this file, so the required
# `test (18.x/20.x)` job no longer collect-and-skip-greens it. This workflow is where the suite
# actually EXECUTES, with EXPECT_DB=1 arming the suite's top-level anti-skip-green sentinel: a run
# in this lane with a missing/broken DATABASE_URL goes RED instead of silently reporting the whole
# file as skipped.

on:
  workflow_dispatch:
  # NO `merge_group:` — deliberately, and matching all five sibling real-DB lanes
  # (approval-realdb-handler / -l6a-roundscoping / -field-edit / -acceptance /
  # approval-template-policy-carrier-realdb, none of which declare it). A `merge_group` event does
  # not honour the `paths` filter below the way `pull_request` does, so declaring it would spin up
  # this ~25-minute PostgreSQL job for EVERY merge group — including groups that touch nothing in
  # this area — and serialise the queue behind it. The web guards took `merge_group` in #4970
  # because they are cheap and broadly relevant; an evidence lane is neither.
  pull_request:
    # No `branches:` filter (mirrors the sibling approval-realdb-* precedents): a brand-new workflow
    # cannot be workflow_dispatch-ed until it has run once via a trigger it responds to, and a
    # stacked-base PR would silently skip a branch-filtered trigger. The `paths` filter keeps it off
    # unrelated PRs.
    paths:
      - 'packages/core-backend/tests/integration/approval-node-operation-policy.db.test.ts'
      - 'packages/core-backend/tests/integration/approval-add-sign-honesty.db.test.ts'
      - 'packages/core-backend/tests/integration/approval-comment-required.db.test.ts'
      - 'packages/core-backend/src/services/approval-effective-node-operations.ts'
      - 'packages/core-backend/src/services/ApprovalCardDeliveryAction.ts'
      - 'packages/core-backend/tests/helpers/approval-schema-bootstrap.ts'
      - 'packages/core-backend/src/services/ApprovalProductService.ts'
      - 'packages/core-backend/src/services/ApprovalBridgeService.ts'
      - 'packages/core-backend/src/routes/approvals.ts'
      - 'packages/core-backend/src/routes/approval-history.ts'
      - 'packages/core-backend/src/types/approval-product.ts'
      - 'packages/core-backend/src/db/migrations/zzzz20260818090000_add_policy_denied_action_to_approval_records.ts'
      - 'packages/core-backend/vitest.config.ts'
      - '.github/workflows/approval-realdb-node-operation-policy.yml'
  push:
    branches: [main]
    paths:
      - 'packages/core-backend/tests/integration/approval-node-operation-policy.db.test.ts'
      - 'packages/core-backend/tests/integration/approval-add-sign-honesty.db.test.ts'
      - 'packages/core-backend/tests/integration/approval-comment-required.db.test.ts'
      - 'packages/core-backend/src/services/approval-effective-node-operations.ts'
      - 'packages/core-backend/src/services/ApprovalCardDeliveryAction.ts'
      - 'packages/core-backend/tests/helpers/approval-schema-bootstrap.ts'
      - 'packages/core-backend/src/services/ApprovalProductService.ts'
      - 'packages/core-backend/src/services/ApprovalBridgeService.ts'
      - 'packages/core-backend/src/routes/approvals.ts'
      - 'packages/core-backend/src/routes/approval-history.ts'
      - 'packages/core-backend/src/types/approval-product.ts'
      - 'packages/core-backend/src/db/migrations/zzzz20260818090000_add_policy_denied_action_to_approval_records.ts'
      - 'packages/core-backend/vitest.config.ts'
      - '.github/workflows/approval-realdb-node-operation-policy.yml'

permissions:
  contents: read

jobs:
  approval-realdb-node-operation-policy:
    name: approval-realdb-node-operation-policy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metasheet_approval_realdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d metasheet_approval_realdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/metasheet_approval_realdb
      # Arms the suite's top-level sentinel: in THIS lane a missing DATABASE_URL is a red run,
      # never a silent skipped-green.
      EXPECT_DB: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Use empty npmrc for pnpm
        run: |
          echo "" > /tmp/empty-npmrc
          echo "NPM_CONFIG_USERCONFIG=/tmp/empty-npmrc" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run DB migrations
        env:
          # Same per-PR-gate exclusion list as plugin-tests.yml's "Run DB migrations" step
          # (see packages/core-backend/MIGRATION_EXCLUDE_TRACKING.md) — this lane provisions the
          # identical schema the approval real-DB steps run against. The Lock-5 CHECK widening
          # (zzzz20260818090000_add_policy_denied_action_to_approval_records) is NOT excluded, so
          # gate D-1's constraint assertion runs against the real migrated constraint.
          MIGRATION_EXCLUDE: 008_plugin_infrastructure.sql,048_create_event_bus_tables.sql,049_create_bpmn_workflow_tables.sql,042a_core_model_views.sql,20250924140000_create_gantt_tables.ts,20250925_create_view_tables.sql
        run: pnpm --filter @metasheet/core-backend db:migrate

      - name: Run Lock-5 node-operation-policy real-DB acceptance (whole file)
        # WHOLE FILE, --reporter=verbose: a name filter matching zero tests would exit green and hide
        # regressions; verbose prints every collected test so an empty collection shows in the log.
        run: >-
          pnpm --filter @metasheet/core-backend exec vitest
          --config vitest.integration.config.ts run
          tests/integration/approval-node-operation-policy.db.test.ts
          --reporter=verbose

      - name: Run Lock-5 B-2 add-sign honesty real-DB acceptance (whole file)
        # WHOLE FILE, --reporter=verbose — same anti-empty-collection discipline as the step above.
        run: >-
          pnpm --filter @metasheet/core-backend exec vitest
          --config vitest.integration.config.ts run
          tests/integration/approval-add-sign-honesty.db.test.ts
          --reporter=verbose

      - name: Run Lock-5 §1.3 commentRequired real-DB acceptance (whole file)
        run: >-
          pnpm --filter @metasheet/core-backend exec vitest
          --config vitest.integration.config.ts run
          tests/integration/approval-comment-required.db.test.ts
          --reporter=verbose

      - name: Values-free evidence (this job)
        run: |
          {
            echo "evidenceKind=CONTROLLED_SYNTHETIC_FUNCTIONAL"
            echo "suites=approval-node-operation-policy.db.test.ts,approval-add-sign-honesty.db.test.ts,approval-comment-required.db.test.ts"
            echo "lock=approval-lock5-node-operation-policy-20260817"
            echo "gates=A-1,A-2(server+FE-carrier),A-4,A-5,A-6,B-2,CR-1,CR-2,D-1,D-2,D-3,D-4,F-1,X-1,X-2"
            echo "sentinelArmed=EXPECT_DB=1"
            echo "customerSourceAccess=NOT_INVOLVED"
            echo "flagChanged=false"
            echo "externalWrite=false"
          } | tee -a "$GITHUB_STEP_SUMMARY"
