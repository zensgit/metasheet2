name: Events API real-DB integration (/api/events subscribe egress guard)

# EVIDENCE LANE for POST /api/events/subscribe delivering through the S0-a egress guard (#6941):
#   - tests/integration/events-api.test.ts — the whole server (`MetaSheetServer`, `eventsRouter()` with no
#     seams, exactly as production mounts it) on a database migrated by the real migration chain. Pins:
#     non-admins are refused the event bus routes; the pre-guard receiver shape (loopback http) is refused
#     at subscribe, values-free, and stores no subscription; a delivery goes through the pinned transport
#     to the approved address and the bus books it `success = true`; a name that resolves to a private
#     address is refused at delivery, nothing is sent, and the bus books `success = false` with the
#     closed-set token; a resolution slower than the subscription's budget is booked as the closed-set
#     timeout and its late answer sends nothing (one deadline for resolution and exchange).
#   The pinned transport is a recorder (no socket) and the resolver answers two test names only, so the
#   job makes no outbound request and no external DNS lookup for a webhook target.
# Ephemeral first-party PostgreSQL container; no customer source, no deployment, no flag change.
#
# WHY A STANDALONE FILE, not a plugin-tests.yml step: plugin-tests.yml is an s6a sha256-pinned
# provenance input and its step list is frozen by scripts/ops/plugin-tests-parallel-contract.test.mjs, so
# every edit forces a re-pin and a merge-serialisation race with the open PRs that touch it. This mirrors
# the sibling approval-realdb-* and multitable-realdb-* lanes. plugin-tests.yml is left byte-identical.
#
# WHY THE FILE NEVER RAN BEFORE: it carried its own Kysely migrator over the TypeScript migrations only,
# in an isolated schema. That is not the migration chain (no SQL migrations, no exclusion list) and it
# stopped on an old migration before any route ran; and the file is excluded from the no-DB default
# config. It now uses the database the step below migrates, like every other wired real-DB suite.
#
# TWO-POINT WIRING (the other half): the suite stays excluded from the no-DB default vitest config
# (packages/core-backend/vitest.config.ts), so the required `test` jobs cannot collect-and-skip-green it.
# EXPECT_DB=1 arms the suite's top-level sentinel (a missing DATABASE_URL throws instead of skipping), and
# the zero-skip check over the JSON report refuses any skipped, todo or missing case.

on:
  workflow_dispatch:
  # NO `merge_group:` — deliberately, matching the sibling evidence lanes: a `merge_group` event does not
  # honour the `paths` filter the way `pull_request` does.
  pull_request:
    # No `branches:` filter (mirrors the sibling precedents): a brand-new workflow cannot be
    # workflow_dispatch-ed until it has run once via a trigger it responds to.
    paths:
      - 'packages/core-backend/tests/integration/events-api.test.ts'
      - 'packages/core-backend/src/core/event-webhook-delivery.ts'
      - 'packages/core-backend/src/core/EventBusService.ts'
      - 'packages/core-backend/src/routes/events.ts'
      - 'packages/core-backend/src/multitable/webhook-ssrf-guard.ts'
      - 'packages/core-backend/src/multitable/webhook-pinned-fetch.ts'
      - 'packages/core-backend/src/multitable/webhook-refusal-class.ts'
      - 'packages/core-backend/src/db/migrations/**'
      - 'packages/core-backend/migrations/**'
      - 'packages/core-backend/tests/setup.integration.ts'
      - 'packages/core-backend/tests/globalTeardown.ts'
      - 'packages/core-backend/vitest.integration.config.ts'
      # Not a runtime input for this job — it is the SIBLING half of the two-point wiring.
      - 'packages/core-backend/vitest.config.ts'
      - 'scripts/ops/vitest-zero-skip.mjs'
      - '.github/workflows/events-api-realdb.yml'
  push:
    branches: [main]
    paths:
      - 'packages/core-backend/tests/integration/events-api.test.ts'
      - 'packages/core-backend/src/core/event-webhook-delivery.ts'
      - 'packages/core-backend/src/core/EventBusService.ts'
      - 'packages/core-backend/src/routes/events.ts'
      - 'packages/core-backend/src/multitable/webhook-ssrf-guard.ts'
      - 'packages/core-backend/src/multitable/webhook-pinned-fetch.ts'
      - 'packages/core-backend/src/multitable/webhook-refusal-class.ts'
      - 'packages/core-backend/src/db/migrations/**'
      - 'packages/core-backend/migrations/**'
      - 'packages/core-backend/tests/setup.integration.ts'
      - 'packages/core-backend/tests/globalTeardown.ts'
      - 'packages/core-backend/vitest.integration.config.ts'
      - 'packages/core-backend/vitest.config.ts'
      - 'scripts/ops/vitest-zero-skip.mjs'
      - '.github/workflows/events-api-realdb.yml'

permissions:
  contents: read

jobs:
  events-api-realdb:
    name: events-api-realdb
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        # Same major version as plugin-tests.yml's real-DB lanes.
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metasheet_events_api_realdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d metasheet_events_api_realdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/metasheet_events_api_realdb
      # Arms the suite's top-level sentinel: in THIS lane a missing DATABASE_URL is a red run, never a
      # silent skipped-green.
      EXPECT_DB: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Use empty npmrc for pnpm
        run: |
          echo "" > /tmp/empty-npmrc
          echo "NPM_CONFIG_USERCONFIG=/tmp/empty-npmrc" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run DB migrations
        env:
          # Same per-PR-gate exclusion list as plugin-tests.yml's "Run DB migrations" step
          # (see packages/core-backend/MIGRATION_EXCLUDE_TRACKING.md). The event bus tables come from the
          # TypeScript migrations (20250924200000_create_event_bus_tables + the 20260401 runtime alignment).
          MIGRATION_EXCLUDE: 008_plugin_infrastructure.sql,048_create_event_bus_tables.sql,049_create_bpmn_workflow_tables.sql,042a_core_model_views.sql,20250924140000_create_gantt_tables.ts,20250925_create_view_tables.sql
        run: pnpm --filter @metasheet/core-backend db:migrate

      - name: Run events API real-DB integration (whole file, zero skip)
        # WHOLE FILE: a name filter matching zero tests would exit green. The zero-skip check refuses any
        # skipped / todo / missing case in the JSON report (exactly one file expected).
        run: |
          mkdir -p artifacts/events-api-realdb
          pnpm --filter @metasheet/core-backend exec vitest --config vitest.integration.config.ts run \
            tests/integration/events-api.test.ts \
            --reporter=verbose --reporter=json --outputFile.json=../../artifacts/events-api-realdb/events-api-vitest.json
          node scripts/ops/vitest-zero-skip.mjs artifacts/events-api-realdb/events-api-vitest.json 1

      - name: Upload real database verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: events-api-realdb
          path: artifacts/events-api-realdb/*-vitest.json
          if-no-files-found: warn

      - name: Values-free evidence (this job)
        run: |
          {
            echo "evidenceKind=CONTROLLED_SYNTHETIC_FUNCTIONAL"
            echo "suites=events-api.test.ts"
            echo "scope=POST /api/events/subscribe on the real server mount: subscribe-time refusal (values-free, nothing stored), delivery through the pinned transport booked success=true, delivery-time refusal booked success=false with the closed-set token and nothing sent, a resolution slower than the budget booked as the closed-set timeout with zero sends after it"
            echo "sentinelArmed=EXPECT_DB=1"
            echo "zeroSkip=vitest-zero-skip.mjs"
            echo "customerSourceAccess=NOT_INVOLVED"
            echo "flagChanged=false"
            echo "externalWrite=false"
          } | tee -a "$GITHUB_STEP_SUMMARY"
