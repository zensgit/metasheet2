name: Sealed-export S6-A authority row-lock (migration 075) gate

# EVIDENCE ONLY. Ephemeral first-party PostgreSQL container. This workflow
# proves that migration 075 grants the runtime role exactly the privilege
# PostgreSQL requires for the row lock the ratified design mandates in the final
# activation transaction — and nothing more. It does not connect a customer
# source, deploy a package, enable a flag, or authorize rollout.
#
# WHY workflow_dispatch IS FIRST-CLASS HERE, not a convenience.
# This gate ships on a STACKED branch whose PR base is not `main`, so a
# `pull_request: branches: [main, develop]` trigger does NOT fire for it (see
# feedback: "stacked PRs' required checks do not run"). A green PR badge would
# therefore be a workflow that never ran. Judge this gate by a DISPATCHED run.
#
# It deliberately lives in its own workflow file rather than extending
# .github/workflows/sealed-export-s6a-grant-repair.yml (074's gate) or
# .github/workflows/sealed-export-s5-sqlserver.yml — the latter is a PINNED
# evidence input of the frozen S6-A package
# (sealed-export-package-provenance.cjs PINNED_EVIDENCE_FILES
# 's5EvidenceWorkflow'), so editing it would change frozen package-provenance
# evidence. Both are left byte-identical by this PR.

on:
  workflow_dispatch:
  pull_request:
    # Deliberately NO `branches:` filter, unlike 074's gate. Two reasons, both
    # load-bearing:
    #   1. This gate ships on a STACKED branch. `branches: [main, develop]`
    #      would silently skip it on exactly the PR that introduces it, and a
    #      skipped job is not a passing job.
    #   2. GitHub will not let a brand-new workflow_dispatch workflow living on
    #      a feature branch be dispatched until it has run at least once via a
    #      trigger it responds to — the same idiom
    #      stock-preparation-e2e-functional-smoke.yml documents.
    # The `paths` filter below still keeps it off unrelated PRs.
    paths:
      - 'packages/core-backend/migrations/057_create_integration_core_tables.sql'
      - 'packages/core-backend/migrations/068_create_integration_sealed_export_ingestion.sql'
      - 'packages/core-backend/migrations/069_create_integration_sealed_export_generation_kernel.sql'
      - 'packages/core-backend/migrations/070_create_integration_sealed_export_signer_authority.sql'
      - 'packages/core-backend/migrations/071_harden_integration_sealed_export_authority_lifecycle.sql'
      - 'packages/core-backend/migrations/072_harden_integration_sealed_export_terminal_signer_history.sql'
      - 'packages/core-backend/migrations/073_create_sealed_export_stock_prep_runtime_authority.sql'
      - 'packages/core-backend/migrations/074_repair_sealed_export_runtime_authority_privileges.sql'
      - 'packages/core-backend/migrations/075_grant_sealed_export_runtime_authority_row_lock.sql'
      - 'packages/core-backend/tests/integration/sealed-export-s6a-authority-row-lock.db.test.ts'
      - 'packages/core-backend/tests/integration/sealed-export-s6a-runtime-authority.db.test.ts'
      - 'plugins/plugin-integration-core/lib/db.cjs'
      - 'plugins/plugin-integration-core/lib/sealed-export/generation-kernel.cjs'
      - 'plugins/plugin-integration-core/lib/sealed-export/generation-store.cjs'
      - '.github/workflows/sealed-export-s6a-authority-row-lock.yml'

permissions:
  contents: read

jobs:
  authority-row-lock-gate:
    name: Sealed-export S6-A authority row-lock gate (pg${{ matrix.pg }})
    strategy:
      fail-fast: false
      matrix:
        # 074/075 had ZERO PostgreSQL 17 coverage: the only pg17 lane in the repo validates the
        # FROZEN package, whose migration tree stops at 073. Column-level GRANT semantics are
        # exactly the kind of thing that can differ across majors, so the gate must run on both.
        pg: ['16', '17']
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:${{ matrix.pg }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metasheet_s6a_authority_lock
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d metasheet_s6a_authority_lock"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/metasheet_s6a_authority_lock
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Use empty npmrc for pnpm
        run: |
          echo "" > /tmp/empty-npmrc
          echo "NPM_CONFIG_USERCONFIG=/tmp/empty-npmrc" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run real-Postgres S6-A authority row-lock gate (migration 075)
        run: >-
          pnpm --filter @metasheet/core-backend exec vitest
          --config vitest.integration.config.ts run
          tests/integration/sealed-export-s6a-authority-row-lock.db.test.ts
          --reporter=verbose

      - name: Re-run the ratified 073 capability matrix (its corrected assertion)
        run: >-
          pnpm --filter @metasheet/core-backend exec vitest
          --config vitest.integration.config.ts run
          tests/integration/sealed-export-s6a-runtime-authority.db.test.ts
          --reporter=verbose

      - name: Re-run 074's grant-repair gate (unchanged by this PR)
        run: >-
          pnpm --filter @metasheet/core-backend exec vitest
          --config vitest.integration.config.ts run
          tests/integration/sealed-export-s6a-grant-repair.db.test.ts
          --reporter=dot

      - name: Confirm the pinned S5 evidence workflow was not modified
        run: |
          pinned="$(node -e "
            const pins = require('./plugins/plugin-integration-core/lib/sealed-export/vectors/s6a-package-provenance-pins.json');
            process.stdout.write(pins.evidenceFiles.s5EvidenceWorkflow);
          ")"
          actual="$(sha256sum .github/workflows/sealed-export-s5-sqlserver.yml | cut -d' ' -f1)"
          if [ "$pinned" != "$actual" ]; then
            echo "pinned S5 evidence workflow digest drifted"
            exit 1
          fi
          echo "pinned S5 evidence workflow digest unchanged"

      - name: Confirm the re-pinned ratified test digest matches the tree
        run: |
          pinned="$(node -e "
            const pins = require('./plugins/plugin-integration-core/lib/sealed-export/vectors/s6a-package-provenance-pins.json');
            process.stdout.write(pins.evidenceFiles.s6aRuntimeAuthorityRealDbTest);
          ")"
          actual="$(sha256sum packages/core-backend/tests/integration/sealed-export-s6a-runtime-authority.db.test.ts | cut -d' ' -f1)"
          echo "pinnedRatifiedTestDigest=${pinned}"
          if [ "$pinned" != "$actual" ]; then
            echo "FATAL: the ratified test was edited without re-pinning the package-provenance manifest." >&2
            exit 1
          fi
          echo "ratifiedTestRepinMatch=PASS"

      - name: Confirm migrations 073 and 074 were not modified
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          for m in 073_create_sealed_export_stock_prep_runtime_authority 074_repair_sealed_export_runtime_authority_privileges; do
            if ! git diff --quiet FETCH_HEAD -- "packages/core-backend/migrations/${m}.sql"; then
              echo "FATAL: migration ${m}.sql differs from origin/main; 073 and 074 must not be amended in place." >&2
              exit 1
            fi
            echo "migrationUnmodified=${m}"
          done

      - name: Values-free evidence (this job)
        run: |
          {
            echo "evidenceKind=CONTROLLED_SYNTHETIC_FUNCTIONAL"
            echo "postgresMajorVersion=16"
            echo "migration075Gate=PASS"
            echo "ratified073MatrixGate=PASS"
            echo "grantRepair074Gate=PASS"
            echo "ratifiedTestRepinMatch=PASS"
            echo "pinnedS5EvidenceWorkflowUnchanged=true"
            echo "migrations073And074Unmodified=true"
            echo "customerSourceAccess=NOT_INVOLVED"
            echo "entityMachineInvolved=false"
            echo "flagChanged=false"
            echo "externalWrite=false"
          } | tee -a "$GITHUB_STEP_SUMMARY"
