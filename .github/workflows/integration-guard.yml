jobs:
  integration-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Unconditional (not gated on relevant==true) — the classifier step immediately below needs
      # `node` available regardless of its own verdict.
      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      # #4614 P2 fix: this used to be piped straight into the classifier step
      # (`resolve-diff | classify`), where a shell `pipefail` mechanism claim was made about how a
      # resolve-diff failure would be observed — but `classify.mjs` still runs to completion on the
      # resulting EMPTY stdin (an empty diff classifies as `relevant=false`, its own documented,
      # correct behaviour for a genuinely empty change list) and writes that to $GITHUB_OUTPUT
      # BEFORE exiting 0, so the pipeline's overall exit code (rightmost non-zero, i.e.
      # resolve-diff's 1) and `steps.resolve-diff`'s outputs would have disagreed with what
      # `steps.changes.outputs.relevant` ended up holding. Splitting into two steps removes that
      # ambiguity entirely: this step's own exit code IS resolve-diff's exit code, with no pipeline
      # involved, and — because it has no `if` at all — a failure here (non-zero exit) means
      # GitHub's own default step-skip-on-earlier-failure leaves the classify step below UNRUN, so
      # `steps.changes.outputs.relevant` is never set to anything at all (not `'false'`, just
      # absent) — which is exactly the unambiguous "classification never happened" signal
      # scripts/ops/integration-guard-assert-branch.mjs's relevant!=='true'/'false' check expects.
      # `$RUNNER_TEMP` below is a GitHub Actions-provided per-job scratch directory env var (always
      # set on a real runner); it is NOT set when hand-running this step's `run:` text locally —
      # export it yourself first, or point at another writable path, if reproducing this by hand.
      - name: Resolve Integration Guard diff target (fail-closed on missing/zero/malformed BASE_SHA)
        id: resolve-diff
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node scripts/ops/integration-guard-resolve-diff.mjs > "$RUNNER_TEMP/integration-guard-diff.nul"

      - name: Detect relevant integration changes
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ops/integration-guard-classify.mjs < "$RUNNER_TEMP/integration-guard-diff.nul"

      # Not gated on relevant==true/false (no `if` at all) — #4614 P1 two-point wiring: the OTHER
      # executable caller of this contract is plugin-tests.yml's required `test (20.x)` job (`node
      # --test scripts/ops/integration-guard-required-wiring-contract.test.mjs`). Before this step
      # existed, deleting that one line in plugin-tests.yml meant test (20.x) silently stopped
      # running the contract WHILE this workflow (having no caller of its own) never noticed —
      # both gates green, contract fully disconnected. Running it here too, ungated on the scope
      # verdict, means deleting either call site is still caught by the other: the contract's own
      # Pins assert plugin-tests.yml still carries its invocation line AND that this job still
      # carries this step — see the contract test file for both pins. (Like every other un-`if`'d
      # step here, GitHub's implicit `if: success()` still skips this one if `resolve-diff` above
      # failed closed — that path already fails the job on its own, so this is not a gap.)
      #
      # #4614 P1 (sixth review round, 2026-07-26) — SUBTEST-COUNT FLOOR. `node --test` treats a child
      # process that exits 0 as a PASSING FILE. The contract statically imports four extracted modules
      # (integration-guard-assert-branch/-classify/-guarded-paths/-resolve-diff.mjs) at the top of the
      # file, so a single `process.exit(0)` inserted at the top of ANY of the four aborts the test file
      # during import evaluation, before a single subtest body runs — and the whole contract collapses
      # to `tests 1 / pass 1 / fail 0`, exit 0. Nothing pinned the expected subtest count, so BOTH
      # callers of this contract reported that collapse as green. The floor below is that missing pin:
      # a run that reports fewer than MIN_CONTRACT_TESTS subtests fails the step. Keep this block
      # BYTE-IDENTICAL to the `integration-guard-contract` step in .github/workflows/plugin-tests.yml —
      # the contract exact-pins BOTH copies against the same literal (not against each other, so
      # mutating both copies identically does not stay green).
      - name: Integration Guard required-wiring contract (self-check, ungated on the scope verdict)
        id: contract-self-check
        shell: bash
        run: |
          set -euo pipefail
          MIN_CONTRACT_TESTS=59
          if ! contract_out="$(node --test scripts/ops/integration-guard-required-wiring-contract.test.mjs 2>&1)"; then
            printf '%s\n' "$contract_out"
            echo "integration-guard contract: node --test exited non-zero (output above)" >&2
            exit 1
          fi
          printf '%s\n' "$contract_out"
          contract_tests="$(printf '%s\n' "$contract_out" | grep -Eo 'tests [0-9]+$' | tail -n 1 | grep -Eo '[0-9]+$' || true)"
          if [ -z "$contract_tests" ]; then
            echo "integration-guard contract: no 'tests <N>' summary line found — refusing to report green" >&2
            exit 1
          fi
          if [ "$contract_tests" -lt "$MIN_CONTRACT_TESTS" ]; then
            echo "integration-guard contract: only $contract_tests subtests ran, expected at least $MIN_CONTRACT_TESTS — an import-time abort in one of the extracted .mjs modules collapses this contract into a passing 1-subtest file" >&2
            exit 1
          fi
          echo "integration-guard contract: $contract_tests subtests ran (floor $MIN_CONTRACT_TESTS)."

      - name: No-op (out of scope) — deliberate success, not a skipped job
        id: noop
        if: steps.changes.outputs.relevant == 'false'
        run: bash scripts/ops/integration-guard-noop.sh

      - name: Setup pnpm
        if: steps.changes.outputs.relevant == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Use empty npmrc for pnpm
        if: steps.changes.outputs.relevant == 'true'
        run: |
          echo "" > /tmp/empty-npmrc
          echo "NPM_CONFIG_USERCONFIG=/tmp/empty-npmrc" >> "$GITHUB_ENV"

      - name: Get pnpm store directory
        if: steps.changes.outputs.relevant == 'true'
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        if: steps.changes.outputs.relevant == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run plugin-integration-core CJS test chain (hermetic, no DB)
        id: plugin-core-tests
        if: steps.changes.outputs.relevant == 'true'
        run: pnpm --filter plugin-integration-core test

      # NOTE (IU-4, #3803): this step previously had THREE duplicate `run:` keys in a single step —
      # invalid-but-tolerated YAML where every parser (this repo's included) silently keeps only the
      # LAST one, so 6 already-listed specs (IntegrationBridgeAgentSection, IntegrationPipelineRunSection,
      # IntegrationStockPrepPanel, IntegrationExternalWritePanel, IntegrationTableActionsPanel,
      # IntegrationFieldOptionSyncPanel) were silently NOT running despite appearing in the file.
      # Consolidated at the time into a single unioned list — do not reintroduce a second `run:` key.
      # #4614 maintenance-cost ruling (2026-07-26): that unioned spec list is now extracted into
      # scripts/ops/integration-guard-run-web-specs.sh (owner did not accept long-term exact-copying
      # of this huge command inside the contract test's pin) — add new specs to that file, not here;
      # this step pins only the single-line invocation.
      - name: Run integration web guard specs (targeted)
        id: web-guard-specs
        if: steps.changes.outputs.relevant == 'true'
        run: bash scripts/ops/integration-guard-run-web-specs.sh

      # Terminal runtime safety net (P1 hardening, 2026-07-25): runs regardless of what happened above
      # (`if: always()`) and FAILS the job unless `relevant` came out strictly 'true'/'false' AND
      # exactly the corresponding branch's steps ran to completion (plugin-core-tests + web-guard-specs
      # succeeded and noop was skipped, XOR noop succeeded and both real steps were skipped). See
      # scripts/ops/integration-guard-assert-branch.mjs for the full rationale — this is one of TWO
      # independent doors against the classifier producing an ambiguous verdict (the other is that
      # scripts/ops/integration-guard-classify.mjs's classify() only ever returns a JS boolean).
      - name: Assert scope classification is decisive (terminal safety net)
        id: assert-branch
        if: always()
        run: node scripts/ops/integration-guard-assert-branch.mjs
        env:
          RELEVANT: ${{ steps.changes.outputs.relevant }}
          NOOP_OUTCOME: ${{ steps.noop.outcome }}
          PLUGIN_OUTCOME: ${{ steps.plugin-core-tests.outcome }}
          WEB_OUTCOME: ${{ steps.web-guard-specs.outcome }}
