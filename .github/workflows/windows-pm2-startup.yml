name: Windows PM2 startup regression

on:
  workflow_dispatch:
  merge_group:
    types: [checks_requested]
  pull_request:
    branches: [main, develop]
    paths:
      - 'scripts/ops/attendance-onprem-start-pm2.ps1'
      - 'scripts/ops/attendance-onprem-start-pm2.test.mjs'
      - '.github/workflows/windows-pm2-startup.yml'
  push:
    branches: [main, develop]
    paths:
      - 'scripts/ops/attendance-onprem-start-pm2.ps1'
      - 'scripts/ops/attendance-onprem-start-pm2.test.mjs'
      - '.github/workflows/windows-pm2-startup.yml'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  startup:
    name: PM2 startup (${{ matrix.shell }})
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell.exe, pwsh.exe]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - name: Run native PM2 startup regression
        shell: pwsh
        env:
          ONPREM_PM2_TEST_SHELL: ${{ matrix.shell }}
        run: |
          node --test scripts/ops/attendance-onprem-start-pm2.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
