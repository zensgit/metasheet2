# Attendance web guard (targeted gate).
#
# Why this exists: the main PR gate (plugin-tests.yml) runs core-backend tests and only
# `pnpm --filter @metasheet/web build` for the web app — it does NOT run apps/web vitest
# specs. As a result, employee/admin surface guard regressions in AttendanceView slipped
# through green CI (e.g. the overview admin-only-preload guard going red unnoticed).
#
# Scope (deliberately TARGETED): run the green attendance admin-surface guard specs —
# attendance-admin-regressions.spec.ts (overview admin-only-preload guard + AE-3
# result-edit modal matrix), attendance-admin-anchor-nav.spec.ts (member resolve / nav
# guards), AttendanceRequestCenterSection.result-edit.spec.ts (request-center parity
# for the shared AE-3 result-edit callback), attendance-selfservice-dashboard.spec.ts,
# attendance-caliber-transparency.spec.ts (display-only 口径透明 slice — #3575 design-lock:
# G1 records-header title, G2 team-availability legend equation, G3 caliber-guide card),
# attendance-punch-outcome.spec.ts (punch outcome clarity: 202 pendingApproval /
# OUTDOOR_NOTE_REQUIRED / LOCATION_RESTRICTED — see
# docs/development/attendance-punch-outcome-clarity-design-lock-20260705.md), and
# attendance-import-override-guard.spec.ts (override-import confirm gate: forced-preview
# submit-disable, in-DOM confirm with rowCount/date-range/user-count lines + generic
# irreversible warning (never a precise overwrite count), export-backup wire shape, merge
# one-click, G3 manual-adjustment ledger note — see
# docs/development/attendance-override-import-guard-design-lock-20260705.md, PR #3597), and
# attendance-halfday-leave-helper.spec.ts (display-only half-day leave helper: G1 full-day/
# morning-half/afternoon-half quick-fill buttons that prefill the inline leave request's
# requestedInAt/requestedOutAt/minutes from the effective shift window's time midpoint, G2
# minutes -> day-equivalent hint against the selected leave type's defaultMinutesPerDay — see
# docs/development/attendance-halfday-leave-helper-design-lock-20260705.md, PR #3605), and
# attendance-schedule-bulk-apply.spec.ts (pure-module tests for the bulk-apply schedule
# assignment slice: G1 checkbox-list (user, date) cell expansion + cap, G2 sequential
# schedule-drafts/assignments writes with per-cell idempotencyKey + confirm-gated submit, G3
# per-cell 409 conflict / 422 compliance-cap / 422 edit-window / 403 scope classification with
# an enum-strict generic fallback — see
# docs/development/attendance-schedule-bulk-apply-design-lock-20260705.md, #3616; DOM-level
# confirm-gate / exact-POST-body / cap-block / partial-failure coverage for the same slice
# lives in attendance-admin-regressions.spec.ts, already covered by this guard),
# attendance-import-file-guard.spec.ts + attendance-import-preview-regression.spec.ts +
# useAttendanceAdminImportWorkflow.spec.ts (xlsx/xls spreadsheet rejection at CSV import
# file selection — extension + PK/OLE2 magic bytes, no import API call, actionable zh
# guidance; plus the pre-existing import preview/commit regression coverage — see
# docs/development/attendance-import-xlsx-guard-design-lock-20260706.md),
# attendance-import-template-columns.spec.ts (field-picker template builder: grouping/
# dedupe/Chinese-first naming + backend fixture-sync of the default selection — see
# docs/development/attendance-import-section-ux-design-lock-20260706.md), and
# attendance-import-header-recognition.spec.ts (selection-time column recognition:
# quote-aware header parse + green/grey/missing-required classification, key families
# fixture-synced to the backend — see
# docs/development/attendance-import-column-recognition-design-lock-20260706.md), and
# dingtalk-container.spec.ts (E2 DingTalk container detection / JSAPI readiness /
# 免登 authCode util — see docs/development/attendance-e2-container-shell-design-lock-20260707.md).
# The full
# `@metasheet/web` vitest suite still has historical/flaky failures, so wiring the whole
# suite as a required gate now would be red on arrival. Keep expanding the `vitest run`
# filter (or move to the full web suite) as more web specs are cleaned up.
name: Attendance Web Guard

on:
  pull_request:
    paths:
      - 'apps/web/src/views/AttendanceView.vue'
      - 'apps/web/src/views/attendance/**'
      - 'apps/web/tests/attendance-admin-regressions.spec.ts'
      - 'apps/web/tests/attendance-admin-anchor-nav.spec.ts'
      - 'apps/web/tests/AttendanceRequestCenterSection.result-edit.spec.ts'
      - 'apps/web/tests/attendance-selfservice-dashboard.spec.ts'
      - 'apps/web/tests/attendance-caliber-transparency.spec.ts'
      - 'apps/web/tests/attendance-punch-outcome.spec.ts'
      - 'apps/web/tests/attendance-import-override-guard.spec.ts'
      - 'apps/web/tests/attendance-halfday-leave-helper.spec.ts'
      - 'apps/web/tests/attendance-schedule-bulk-apply.spec.ts'
      - 'apps/web/tests/attendance-import-file-guard.spec.ts'
      - 'apps/web/tests/attendance-import-preview-regression.spec.ts'
      - 'apps/web/tests/useAttendanceAdminImportWorkflow.spec.ts'
      - 'apps/web/tests/attendance-import-template-columns.spec.ts'
      - 'apps/web/tests/attendance-import-header-recognition.spec.ts'
      - 'apps/web/tests/attendance-import-xlsx-convert.spec.ts'
      - 'apps/web/tests/useAttendanceAdminImportBatches.spec.ts'
      - 'apps/web/src/utils/dingtalkContainer.ts'
      - 'apps/web/tests/dingtalk-container.spec.ts'
      - '.github/workflows/attendance-web-guard.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/src/views/AttendanceView.vue'
      - 'apps/web/src/views/attendance/**'
      - 'apps/web/tests/attendance-admin-regressions.spec.ts'
      - 'apps/web/tests/attendance-admin-anchor-nav.spec.ts'
      - 'apps/web/tests/AttendanceRequestCenterSection.result-edit.spec.ts'
      - 'apps/web/tests/attendance-selfservice-dashboard.spec.ts'
      - 'apps/web/tests/attendance-caliber-transparency.spec.ts'
      - 'apps/web/tests/attendance-punch-outcome.spec.ts'
      - 'apps/web/tests/attendance-import-override-guard.spec.ts'
      - 'apps/web/tests/attendance-halfday-leave-helper.spec.ts'
      - 'apps/web/tests/attendance-schedule-bulk-apply.spec.ts'
      - 'apps/web/tests/attendance-import-file-guard.spec.ts'
      - 'apps/web/tests/attendance-import-preview-regression.spec.ts'
      - 'apps/web/tests/useAttendanceAdminImportWorkflow.spec.ts'
      - 'apps/web/tests/attendance-import-template-columns.spec.ts'
      - 'apps/web/tests/attendance-import-header-recognition.spec.ts'
      - 'apps/web/tests/attendance-import-xlsx-convert.spec.ts'
      - 'apps/web/tests/useAttendanceAdminImportBatches.spec.ts'
      - 'apps/web/src/utils/dingtalkContainer.ts'
      - 'apps/web/tests/dingtalk-container.spec.ts'
      - '.github/workflows/attendance-web-guard.yml'

jobs:
  attendance-web-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Use empty npmrc for pnpm
        run: |
          echo "" > /tmp/empty-npmrc
          echo "NPM_CONFIG_USERCONFIG=/tmp/empty-npmrc" >> "$GITHUB_ENV"

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run attendance web guard specs (targeted)
        run: pnpm --filter @metasheet/web exec vitest run attendance-admin-regressions attendance-admin-anchor-nav AttendanceRequestCenterSection.result-edit attendance-selfservice-dashboard attendance-caliber-transparency attendance-punch-outcome attendance-import-override-guard attendance-halfday-leave-helper attendance-schedule-bulk-apply attendance-import-file-guard attendance-import-preview-regression useAttendanceAdminImportWorkflow attendance-import-template-columns attendance-import-header-recognition attendance-import-xlsx-convert useAttendanceAdminImportBatches dingtalk-container --reporter=dot
