name: Approval real-DB acceptance (permission catalogue registration)

# EVIDENCE LANE for the approvals:read permission-catalogue registration real-DB
# acceptance suite (tests/integration/approval-permission-catalogue-grant.db.test.ts) — proves,
# through the real HTTP register → admin-elevate(seed) → grant → gate round trip, that
# migration zzzz20260920130000_add_approval_product_permissions makes approvals:read exist in
# `permissions` and grantable through the product endpoint (routes/permissions.ts:133), and that a
# non-admin holder of a grant then passes rbacGuard('approvals','read') on
# GET /api/approvals/pending-count where it previously 403ed. approvals:write/act are deliberately
# out of scope for this migration and this lane (see the migration's own file header). Ephemeral
# first-party PostgreSQL container; no customer source, no deployment, no flag change, no
# role_permissions default grant.
#
# WHY A STANDALONE FILE, not a plugin-tests.yml allowlist entry: plugin-tests.yml is an s6a
# sha256-pinned provenance input (sealed-export-package-provenance.cjs PINNED_EVIDENCE_FILES), so
# every edit forces an s6a re-pin and a merge-serialisation race. This mirrors the sibling
# approval-realdb-history-guard.yml / approval-realdb-node-operation-policy.yml /
# approval-realdb-handler.yml / approval-realdb-l6a-roundscoping.yml lanes and the
# sealed-export-s6a-authority-row-lock.yml precedent they cite. plugin-tests.yml is left
# byte-identical.
#
# TWO-POINT WIRING (the other half): the suite is excluded from the no-DB default vitest config
# (packages/core-backend/vitest.config.ts) in the SAME commit that adds this file, so the required
# `test (18.x/20.x)` job no longer collect-and-skip-greens it. This workflow is where the suite
# actually EXECUTES, with EXPECT_DB=1 arming the suite's top-level anti-skip-green sentinel: a run
# in this lane with a missing/broken DATABASE_URL goes RED instead of silently reporting the whole
# file as skipped.

on:
  workflow_dispatch:
  # NO `merge_group:` — deliberately, matching the sibling real-DB lanes (see
  # approval-realdb-history-guard.yml's own note): a `merge_group` event ignores the `paths` filter
  # below, so declaring it would spin up this PostgreSQL job for every merge group regardless of
  # relevance. An evidence lane is not cheap/broad enough to earn that the way the web guards are.
  pull_request:
    # No `branches:` filter (mirrors the sibling approval-realdb-* precedents): a brand-new workflow
    # cannot be workflow_dispatch-ed until it has run once via a trigger it responds to, and a
    # stacked-base PR would silently skip a branch-filtered trigger. The `paths` filter keeps it off
    # unrelated PRs.
    paths:
      - 'packages/core-backend/tests/integration/approval-permission-catalogue-grant.db.test.ts'
      - 'packages/core-backend/src/db/migrations/zzzz20260920130000_add_approval_product_permissions.ts'
      - 'packages/core-backend/src/routes/permissions.ts'
      - 'packages/core-backend/src/routes/approvals.ts'
      - 'packages/core-backend/src/rbac/rbac.ts'
      - 'packages/core-backend/src/rbac/service.ts'
      - 'packages/core-backend/src/rbac/namespace-admission.ts'
      - 'packages/core-backend/src/auth/AuthService.ts'
      - 'packages/core-backend/vitest.config.ts'
      - '.github/workflows/approval-realdb-permission-catalogue.yml'
  push:
    branches: [main]
    paths:
      - 'packages/core-backend/tests/integration/approval-permission-catalogue-grant.db.test.ts'
      - 'packages/core-backend/src/db/migrations/zzzz20260920130000_add_approval_product_permissions.ts'
      - 'packages/core-backend/src/routes/permissions.ts'
      - 'packages/core-backend/src/routes/approvals.ts'
      - 'packages/core-backend/src/rbac/rbac.ts'
      - 'packages/core-backend/src/rbac/service.ts'
      - 'packages/core-backend/src/rbac/namespace-admission.ts'
      - 'packages/core-backend/src/auth/AuthService.ts'
      - 'packages/core-backend/vitest.config.ts'
      - '.github/workflows/approval-realdb-permission-catalogue.yml'

permissions:
  contents: read

jobs:
  approval-realdb-permission-catalogue:
    name: approval-realdb-permission-catalogue
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metasheet_approval_realdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d metasheet_approval_realdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/metasheet_approval_realdb
      # Arms the suite's top-level sentinel: in THIS lane a missing DATABASE_URL is a red run,
      # never a silent skipped-green.
      EXPECT_DB: '1'
      # The suite registers 13 real users via POST /api/auth/register from one IP (mechanically
      # counted: `grep -c 'await registerUser(' the suite file, 20260921); the default per-IP
      # register limit (DEFAULT_AUTH_RATE_LIMIT_CONFIG.maxRegisterPerIp = 3) would 429 starting at
      # the 4th. Same override the real-browser acceptance run used for the identical reason
      # (todo-center-real-browser-acceptance-20260920.md §0 table). This count grows whenever a
      # case is added to the suite — re-count rather than assume this number stays 13.
      AUTH_REGISTER_MAX_PER_IP: '50'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Use empty npmrc for pnpm
        run: |
          echo "" > /tmp/empty-npmrc
          echo "NPM_CONFIG_USERCONFIG=/tmp/empty-npmrc" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run DB migrations
        env:
          # Same per-PR-gate exclusion list as plugin-tests.yml's "Run DB migrations" step
          # (see packages/core-backend/MIGRATION_EXCLUDE_TRACKING.md) — this lane provisions the
          # identical schema the approval real-DB steps run against.
          MIGRATION_EXCLUDE: 008_plugin_infrastructure.sql,048_create_event_bus_tables.sql,049_create_bpmn_workflow_tables.sql,042a_core_model_views.sql,20250924140000_create_gantt_tables.ts,20250925_create_view_tables.sql
        run: pnpm --filter @metasheet/core-backend db:migrate

      - name: Run permission-catalogue grant-and-gate real-DB acceptance (whole file)
        # WHOLE FILE, --reporter=verbose: a name filter matching zero tests would exit green and hide
        # regressions; verbose prints every collected test so an empty collection shows in the log.
        run: >-
          pnpm --filter @metasheet/core-backend exec vitest
          --config vitest.integration.config.ts run
          tests/integration/approval-permission-catalogue-grant.db.test.ts
          --reporter=verbose

      - name: Values-free evidence (this job)
        run: |
          {
            echo "evidenceKind=CONTROLLED_SYNTHETIC_FUNCTIONAL"
            echo "suites=approval-permission-catalogue-grant.db.test.ts"
            echo "scope=approvals:read catalogue registration (write/act out of scope) + product grant endpoint + GET /api/approvals/pending-count gate"
            echo "sentinelArmed=EXPECT_DB=1"
            echo "customerSourceAccess=NOT_INVOLVED"
            echo "flagChanged=false"
            echo "defaultRoleGrantAdded=false"
            echo "externalWrite=false"
          } | tee -a "$GITHUB_STEP_SUMMARY"
