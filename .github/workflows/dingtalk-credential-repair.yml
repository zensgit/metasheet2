name: DingTalk credential repair

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'scripts/ops/repairs/dingtalk-group-*'
      - 'packages/core-backend/scripts/ops-tests/dingtalk-*'
      - 'packages/core-backend/vitest.credential-repair-20261030.config.ts'
      - 'packages/core-backend/src/security/encrypted-secrets.ts'
      - 'packages/core-backend/src/security/encrypted-store-probe.ts'
      - 'packages/core-backend/tests/unit/encrypted-store-census.guard.test.ts'
      - 'packages/core-backend/tests/utils/encrypted-store-writer-census.ts'
      - 'docs/ops/dingtalk-group-credential-repair-20261030.md'
      - 'docs/development/dingtalk-credential-repair-pr-verification-20261030.md'
      - '.github/workflows/dingtalk-credential-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dingtalk-credential-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  credential-repair:
    name: credential-repair (PG16)
    # Must remain GitHub-hosted: no shared Mac mini, SSH or application environment.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://postgres@127.0.0.1:5432/credential_repair_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false
      - name: Install frozen dependencies
        shell: bash
        run: |
          set -euo pipefail
          empty_npmrc="$(mktemp)"
          NPM_CONFIG_USERCONFIG="$empty_npmrc" pnpm install --frozen-lockfile
      - name: Verify encrypted-store census and mutation guards
        working-directory: packages/core-backend
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../../artifacts/credential-repair-ci
          pnpm exec vitest run tests/unit/encrypted-store-census.guard.test.ts --retry=0 \
            --reporter=verbose --reporter=json \
            --outputFile.json=../../artifacts/credential-repair-ci/census-result.json
      - name: Start disposable PostgreSQL 16
        uses: ankane/setup-postgres@v1
        with:
          postgres-version: 16
          user: postgres
          database: credential_repair_ci
      - name: Pin matching PostgreSQL clients
        shell: bash
        run: |
          set -euo pipefail
          pg_bin_dir=/usr/lib/postgresql/16/bin
          "$pg_bin_dir/pg_dump" --version | grep -E '^pg_dump \(PostgreSQL\) 16\.'
          "$pg_bin_dir/psql" "$DATABASE_URL" -Atqc "SELECT current_setting('server_version_num')::int / 10000" | grep -x 16
          echo "PG_BIN_DIR=$pg_bin_dir" >> "$GITHUB_ENV"
      - name: Verify atomic repair with real PostgreSQL
        working-directory: packages/core-backend
        shell: bash
        run: |
          set -euo pipefail
          : "${DATABASE_URL:?Disposable test database is required}"
          mkdir -p ../../artifacts/credential-repair-ci
          pnpm exec vitest run --config vitest.credential-repair-20261030.config.ts \
            --reporter=verbose --reporter=json \
            --outputFile.json=../../artifacts/credential-repair-ci/atomic-result.json
      - name: Verify actual backup restore and cleanup
        working-directory: packages/core-backend
        shell: bash
        run: |
          set -euo pipefail
          : "${DATABASE_URL:?Disposable test database is required}"
          : "${PG_BIN_DIR:?Matching PostgreSQL clients are required}"
          python3 scripts/ops-tests/dingtalk-backup-restore-20261030.py 2>&1 | tee ../../artifacts/credential-repair-ci/restore-result.log
      - name: Upload synthetic validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: credential-repair-pg16-evidence
          path: artifacts/credential-repair-ci/
          if-no-files-found: warn
          retention-days: 14
