name: Attendance Staging Window Runner

run-name: "Attendance Staging Window Runner: ${{ inputs.action }}${{ inputs.action == 'smoke' && format(' ({0})', inputs.smoke) || '' }}"

# One dispatch = ONE action of the attendance five-window staging acceptance
# (docs/development/attendance-staging-window-bundle-20260702.md):
#   deploy         — pin staging backend+web to a full-SHA GHCR tag, migrate, verify build+auth
#   smoke          — run one window smoke (ae4 / rd45 / otbank-v18 / mp6 / hmr5) in-container
#   status         — read-only staging snapshot
#   migrate        — backup + clone-rehearsal + apply, per docs/operations/staging-migration-
#                    alignment-runbook.md. The only path forward from action=deploy's migration-
#                    alignment gate reporting `do_not_run_full_migrate`: pg_dump the real staging
#                    DB to a host file (metadata-only in the artifact — never the dump itself),
#                    restore it into a throwaway rehearsal DB inside the same postgres container,
#                    run migrate.js against ONLY the rehearsal DB, and only touch the real staging
#                    DB once that rehearsal is fully green.
#   residue-sweep  — bundle §7 "Consolidated final residue sweep": runs every §7 cross-smoke
#                    SQL count (users/user_orgs/records/requests/deliveries/OT-bank money-path/
#                    approval-engine/MP-6/HMR-5 optional blocks) via `docker exec
#                    metasheet-staging-postgres psql -tA` against the running staging DB, plus
#                    an env-flags + GET /api/attendance/settings capture. Fails iff any §7 count
#                    is nonzero. Takes the `stamps` input (see below); action=status does NOT
#                    run this SQL — this is the only action that does.
#
# W4+W7 COMBINED-SOAK actions (#4556; each is one owner-dispatched step of the soak kickoff,
# in order — the remote script enforces the order mechanically where it is load-bearing):
#   soak-baseline  — capture the O4-2 pre-enablement p95 baseline (p95-baseline-<sha8>-<ts>);
#                    REFUSES if either soak allowlist env is already set on the backend.
#   soak-seed      — idempotently seed the 3 synthetic soak orgs (takes soak_orgs +
#                    soak_opts users_per_org/tz/owner_ref); posture walks go through the
#                    REAL Gate C / W7-3 operator CLIs inside the deployed backend image —
#                    never a bare posture INSERT (the posture tables carry trigger backstops).
#   soak-flags     — write the two soak allowlist env vars into the persistent runner
#                    override (same atomic mechanism as deploy's rd-window env), recreate
#                    ONLY the backend; REFUSES until soak-baseline's marker exists.
#   soak-run       — real-route synthetic load: login every synthetic user via
#                    POST /api/auth/login (never minted), then run the committed
#                    scripts/ops/attendance-w4w7-soak-load-generator.mjs in-container at the
#                    ruled <=1 req/sec ceiling (soak_opts punch_target, default 240 = one
#                    ruled soak-day quota: 3 orgs x 10 users x 8 punches).
#   soak-status    — daily monitoring channel: monitoring-pack Q1-Q16 + the W7-2
#                    compare-window counters via psql; exits nonzero on mechanical alerts.
#
# Modeled on attendance-remote-log-snapshot-prod.yml (SSH via deploy secrets, artifact
# upload, 15-minute timeout, single concurrency group). Remote logic lives in the
# committed scripts/ops/attendance-staging-window-runner-remote.sh, synced per-run;
# every remote command is wrapped in an explicit `bash -o pipefail -c '<script>'`
# (login-shell defaults are never relied on). Pipeline semantics are proven by
# scripts/ops/attendance-window-runner-pipeline.test.mjs (gate-contract strict case).
#
# STAGING ONLY: the remote script fails closed unless it finds
# docker-compose.app.staging.yml defining the metasheet-staging-* containers, and it
# never recreates staging postgres/redis (asserted by container-id comparison).

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What to run against the STAGING stack'
        required: true
        type: choice
        options: [deploy, smoke, status, migrate, residue-sweep, soak-baseline, soak-seed, soak-flags, soak-run, soak-status]
        default: status
      deploy_sha:
        description: 'FULL 40-char commit SHA (GHCR tags are full-SHA). Required for deploy, smoke, and soak-flags (there it must equal the RUNNING image tags — soak-flags flips env only, never images).'
        required: false
        default: ''
      soak_orgs:
        description: 'soak actions: comma-separated org1,org2,org3 (lower-case UUIDs, C3 order: legacy-only, W4-only, both-machines). Required for soak-seed/soak-flags; optional override for soak-status.'
        required: false
        default: ''
      soak_opts:
        description: 'soak actions: ";"-separated key=value pairs. Keys: users_per_org (soak-seed, default 10), tz (soak-seed, IANA name or three "|"-separated, default Asia/Shanghai), w7_target (soak-seed, only group_shadow is runnable at kickoff), owner_ref (soak-seed REQUIRED — names the owner-authored authorization artifact for the transition manifests), punch_target (soak-run, default 240), config (soak-run host config path), window_start (soak-status override, ISO8601 UTC).'
        required: false
        default: ''
      smoke:
        description: 'Which window smoke to run (action=smoke only)'
        required: false
        type: choice
        options: [ae4, rd45, otbank-v18, mp6, hmr5]
        default: ae4
      stamps:
        description: 'action=residue-sweep only: comma-separated ae4,rd45,otbank,mp6,hmr5 STAMP values in that order (bundle §7). ae4/rd45/otbank are required; leave mp6/hmr5 blank if that optional smoke did not run this window, e.g. "ae4-smoke-x,rd45-smoke-x,otbank-v18-smoke-x,,".'
        required: false
        default: ''
      set_window_env:
        description: 'deploy only: rd-window sets ATTENDANCE_SCHEDULER_ENABLED + ATTENDANCE_NOTIFICATION_DELIVERY_WORKER_ENABLED on the staging backend at deploy time (bundle §3.4). The digest gate always stays unset.'
        required: false
        type: choice
        options: [none, rd-window]
        default: none
      force_recreate:
        description: 'deploy only: recreate backend+web even when image/config content is unchanged (used to re-stamp persistent Compose config_files labels). Postgres/Redis remain excluded.'
        required: false
        type: boolean
        default: false
      skip_host_sync:
        description: 'skip the deploy-host repo git sync before smoke (true/false)'
        required: false
        default: 'false'

concurrency:
  group: attendance-staging-window-runner
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    # 40 (was 15): soak-run's bounded generator pass (punch_target<=2000 at the ruled
    # <=1 req/sec ceiling plus per-user logins) and soak-seed's in-container tsx CLI walks
    # legitimately exceed 15 minutes; every pre-soak action still finishes well inside the
    # old budget and the single concurrency group is unchanged.
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate inputs and embedded scripts
        env:
          ACTION: ${{ inputs.action }}
          DEPLOY_SHA: ${{ inputs.deploy_sha }}
          SET_WINDOW_ENV: ${{ inputs.set_window_env }}
          FORCE_RECREATE: ${{ inputs.force_recreate }}
          STAMPS: ${{ inputs.stamps }}
          SOAK_ORGS: ${{ inputs.soak_orgs }}
          SOAK_OPTS: ${{ inputs.soak_opts }}
        run: |
          set -euo pipefail
          case "$ACTION" in deploy|smoke|status|migrate|residue-sweep|soak-baseline|soak-seed|soak-flags|soak-run|soak-status) ;; *) echo "invalid action: $ACTION" >&2; exit 2 ;; esac
          if [[ "$ACTION" == "deploy" || "$ACTION" == "smoke" || "$ACTION" == "soak-flags" ]]; then
            if [[ ! "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "deploy_sha must be the FULL 40-char lowercase commit SHA for action=$ACTION (GHCR tags are full-SHA; short prefixes fail with manifest unknown), got: '$DEPLOY_SHA'" >&2
              exit 2
            fi
          fi
          # soak input scoping + charset validation (the remote prelude single-quotes these,
          # so the safe-charset checks here are what keeps that interpolation quoting-safe).
          uuid_re='^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
          case "$ACTION" in
            soak-seed|soak-flags)
              IFS=',' read -r so1 so2 so3 so_extra <<< "${SOAK_ORGS},"
              if [[ -z "$so1" || -z "$so2" || -z "$so3" || -n "$so_extra" ]]; then
                echo "soak_orgs must be exactly 3 comma-separated org UUIDs for action=$ACTION, got: '$SOAK_ORGS'" >&2
                exit 2
              fi
              for so in "$so1" "$so2" "$so3"; do
                [[ "$so" =~ $uuid_re ]] || { echo "soak_orgs entry must be a LOWER-CASE UUID (case-fold footgun: an upper-case entry silently no-ops server-side), got: '$so'" >&2; exit 2; }
              done
              ;;
            soak-status)
              if [[ -n "$SOAK_ORGS" ]]; then
                IFS=',' read -r so1 so2 so3 so_extra <<< "${SOAK_ORGS},"
                if [[ -z "$so1" || -z "$so2" || -z "$so3" || -n "$so_extra" ]]; then
                  echo "soak_orgs, when given for soak-status, must be exactly 3 comma-separated org UUIDs, got: '$SOAK_ORGS'" >&2
                  exit 2
                fi
                for so in "$so1" "$so2" "$so3"; do
                  [[ "$so" =~ $uuid_re ]] || { echo "soak_orgs entry must be a LOWER-CASE UUID, got: '$so'" >&2; exit 2; }
                done
              fi
              ;;
            *)
              if [[ -n "$SOAK_ORGS" ]]; then
                echo "soak_orgs is only meaningful for soak actions, got action=$ACTION with soak_orgs='$SOAK_ORGS'" >&2
                exit 2
              fi
              ;;
          esac
          if [[ -n "$SOAK_OPTS" ]]; then
            case "$ACTION" in
              soak-baseline|soak-seed|soak-flags|soak-run|soak-status) ;;
              *) echo "soak_opts is only meaningful for soak actions, got action=$ACTION" >&2; exit 2 ;;
            esac
            opt_value_re='^[A-Za-z0-9._:/|-]+$'
            IFS=';' read -ra soak_opt_pairs <<< "$SOAK_OPTS"
            for pair in "${soak_opt_pairs[@]}"; do
              [[ -n "$pair" ]] || continue
              key="${pair%%=*}"; value="${pair#*=}"
              [[ "$pair" == *"="* && -n "$value" ]] || { echo "soak_opts pair must be key=value, got: '$pair'" >&2; exit 2; }
              [[ "$value" =~ $opt_value_re ]] || { echo "soak_opts $key value has unsafe characters: '$value'" >&2; exit 2; }
              case "$key" in
                users_per_org) [[ "$value" =~ ^[1-9][0-9]?$ ]] || { echo "users_per_org must be 1..99, got '$value'" >&2; exit 2; } ;;
                tz) ;;
                w7_target) [[ "$value" == "group_shadow" ]] || { echo "w7_target only supports group_shadow at kickoff (deeper rungs carry compare-window exit predicates and are separate owner-run CLI acts), got '$value'" >&2; exit 2; } ;;
                owner_ref) [[ "$value" =~ ^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$ ]] || { echo "owner_ref must match the manifest reference pattern, got '$value'" >&2; exit 2; } ;;
                punch_target) [[ "$value" =~ ^[1-9][0-9]{0,3}$ ]] || { echo "punch_target must be 1..9999 (remote caps at 2000), got '$value'" >&2; exit 2; } ;;
                config) [[ "$value" =~ ^[A-Za-z0-9._/~-]+$ ]] || { echo "config must be a plain path, got '$value'" >&2; exit 2; } ;;
                window_start) [[ "$value" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}(T[0-9]{2}:[0-9]{2}:[0-9]{2}Z)?$ ]] || { echo "window_start must be YYYY-MM-DD or YYYY-MM-DDTHH:MM:SSZ, got '$value'" >&2; exit 2; } ;;
                *) echo "unknown soak_opts key: '$key' (known: users_per_org, tz, w7_target, owner_ref, punch_target, config, window_start)" >&2; exit 2 ;;
              esac
            done
          fi
          if [[ "$ACTION" != "deploy" && "$SET_WINDOW_ENV" != "none" ]]; then
            echo "set_window_env=$SET_WINDOW_ENV is only meaningful for action=deploy (env flips happen together with the deploy, never mid-smoke — bundle §3.4)" >&2
            exit 2
          fi
          case "$FORCE_RECREATE" in true|false) ;; *) echo "force_recreate must be true or false, got: '$FORCE_RECREATE'" >&2; exit 2 ;; esac
          if [[ "$ACTION" != "deploy" && "$FORCE_RECREATE" == "true" ]]; then
            echo "force_recreate=true is only allowed for action=deploy" >&2
            exit 2
          fi
          if [[ "$ACTION" == "residue-sweep" ]]; then
            IFS=',' read -r sw_ae4 sw_rd45 sw_otbank sw_mp6 sw_hmr5 sw_extra <<< "${STAMPS},__sentinel__"
            if [[ -z "$sw_ae4" || -z "$sw_rd45" || -z "$sw_otbank" || "$sw_extra" != "__sentinel__" ]]; then
              echo "stamps must be exactly 5 comma-separated fields (ae4,rd45,otbank,mp6,hmr5) with ae4/rd45/otbank non-empty for action=residue-sweep (bundle §7), got: '$STAMPS'" >&2
              exit 2
            fi
            [[ "$sw_ae4" =~ ^ae4-smoke-[A-Za-z0-9-]+$ ]] || { echo "stamps field 1 (ae4) must match ^ae4-smoke-[A-Za-z0-9-]+\$, got: '$sw_ae4'" >&2; exit 2; }
            [[ "$sw_rd45" =~ ^rd45-smoke-[A-Za-z0-9-]+$ ]] || { echo "stamps field 2 (rd45) must match ^rd45-smoke-[A-Za-z0-9-]+\$, got: '$sw_rd45'" >&2; exit 2; }
            [[ "$sw_otbank" =~ ^otbank-v18-smoke-[A-Za-z0-9-]+$ ]] || { echo "stamps field 3 (otbank) must match ^otbank-v18-smoke-[A-Za-z0-9-]+\$, got: '$sw_otbank'" >&2; exit 2; }
            [[ -z "$sw_mp6" || "$sw_mp6" =~ ^mp6-smoke-[A-Za-z0-9-]+$ ]] || { echo "stamps field 4 (mp6) must be empty or match ^mp6-smoke-[A-Za-z0-9-]+\$, got: '$sw_mp6'" >&2; exit 2; }
            [[ -z "$sw_hmr5" || "$sw_hmr5" =~ ^hmr5-smoke-[A-Za-z0-9-]+$ ]] || { echo "stamps field 5 (hmr5) must be empty or match ^hmr5-smoke-[A-Za-z0-9-]+\$, got: '$sw_hmr5'" >&2; exit 2; }
          elif [[ -n "$STAMPS" ]]; then
            echo "stamps is only meaningful for action=residue-sweep, got action=$ACTION with stamps='$STAMPS'" >&2
            exit 2
          fi
          bash -n scripts/ops/attendance-staging-window-runner-remote.sh
          bash -n scripts/ops/attendance-window-runner-pipeline.lib.sh
          node --check scripts/ops/attendance-window-runner-mint-token.mjs
          node --check scripts/ops/attendance-w4w7-soak-load-generator.mjs
          node -e "JSON.parse(require('fs').readFileSync('scripts/ops/attendance-w4w7-soak-config.template.json','utf8'))"
          echo "inputs and embedded scripts OK"

      - name: Run pipeline self-test (same shape as the remote invocation)
        run: node --test scripts/ops/attendance-window-runner-pipeline.test.mjs

      - name: Sync runner scripts to deploy host
        id: sync
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY_B64: ${{ secrets.DEPLOY_SSH_KEY_B64 }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          [[ -n "$DEPLOY_KNOWN_HOSTS" ]] || { echo "DEPLOY_KNOWN_HOSTS is required" >&2; exit 2; }
          printf '%s' "$DEPLOY_SSH_KEY_B64" | base64 -d > ~/.ssh/deploy_key
          decoded_known_hosts="$(printf '%s' "$DEPLOY_KNOWN_HOSTS" | base64 -d 2>/dev/null || true)"
          if printf '%s' "$decoded_known_hosts" | grep -Eq 'ssh-ed25519|ssh-rsa|ecdsa-sha2|ssh-dss'; then
            printf '%s\n' "$decoded_known_hosts" > ~/.ssh/known_hosts
          else
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          fi
          grep -Eq 'ssh-ed25519|ssh-rsa|ecdsa-sha2|ssh-dss' ~/.ssh/known_hosts \
            || { echo "DEPLOY_KNOWN_HOSTS did not resolve to a recognizable key" >&2; exit 2; }
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          runner_dir="/tmp/attendance-window-runner-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "runner_dir=$runner_dir" >> "$GITHUB_OUTPUT"
          tar -czf - \
            scripts/ops/attendance-staging-window-runner-remote.sh \
            scripts/ops/attendance-window-runner-pipeline.lib.sh \
            scripts/ops/attendance-window-runner-mint-token.mjs \
            scripts/ops/attendance-w4w7-soak-load-generator.mjs \
          | ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o IdentitiesOnly=yes -i ~/.ssh/deploy_key \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "bash -o pipefail -c 'set -euo pipefail; rm -rf ${runner_dir}; mkdir -p ${runner_dir}; tar -xzf - -C ${runner_dir} --strip-components=2'"
          scp -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o IdentitiesOnly=yes -i ~/.ssh/deploy_key \
            docker-compose.app.staging.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:${runner_dir}/docker-compose.app.staging.yml"

      - name: Run remote action
        id: remote
        continue-on-error: true
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          STAGING_DEPLOY_PATH: ${{ vars.STAGING_DEPLOY_PATH || 'metasheet2-dingtalk-staging' }}
          ACTION: ${{ inputs.action }}
          DEPLOY_SHA: ${{ inputs.deploy_sha }}
          SMOKE_ID: ${{ inputs.smoke }}
          SET_WINDOW_ENV: ${{ inputs.set_window_env }}
          FORCE_RECREATE: ${{ inputs.force_recreate }}
          SKIP_HOST_SYNC: ${{ inputs.skip_host_sync }}
          STAMPS: ${{ inputs.stamps }}
          SOAK_ORGS: ${{ inputs.soak_orgs }}
          SOAK_OPTS: ${{ inputs.soak_opts }}
          RUNNER_DIR: ${{ steps.sync.outputs.runner_dir }}
        run: |
          set -euo pipefail
          ssh_opts="-o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o IdentitiesOnly=yes -i $HOME/.ssh/deploy_key"
          DEPLOY_PATH="${DEPLOY_PATH:-metasheet2}"
          for pair in "DEPLOY_PATH=$DEPLOY_PATH" "STAGING_DEPLOY_PATH=$STAGING_DEPLOY_PATH" "SKIP_HOST_SYNC=$SKIP_HOST_SYNC"; do
            value="${pair#*=}"
            if [[ ! "$value" =~ ^[A-Za-z0-9._/~-]+$ ]]; then
              echo "refusing unsafe characters in ${pair%%=*}: '$value'" >&2
              exit 2
            fi
          done
          remote_output_dir="/tmp/attendance-window-runner-out-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          artifact_name="attendance-staging-window-runner-${ACTION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"
          mkdir -p output/window-runner

          # Everything after this prelude is the committed remote script; the inputs are
          # regex-validated above so the generated prelude is quoting-safe.
          remote_script="set -euo pipefail
          export ACTION='${ACTION}'
          export DEPLOY_SHA='${DEPLOY_SHA}'
          export SMOKE_ID='${SMOKE_ID}'
          export SET_WINDOW_ENV='${SET_WINDOW_ENV}'
          export FORCE_RECREATE='${FORCE_RECREATE}'
          export STAGING_DEPLOY_PATH='${STAGING_DEPLOY_PATH}'
          export DEPLOY_PATH='${DEPLOY_PATH}'
          export SKIP_HOST_SYNC='${SKIP_HOST_SYNC}'
          export STAMPS='${STAMPS}'
          export SOAK_ORGS='${SOAK_ORGS}'
          export SOAK_OPTS='${SOAK_OPTS}'
          export OUTPUT_DIR='${remote_output_dir}'
          export RUN_STAMP='gh${GITHUB_RUN_ID}a${GITHUB_RUN_ATTEMPT}'
          rm -rf '${remote_output_dir}'
          mkdir -p '${remote_output_dir}'
          bash '${RUNNER_DIR}/attendance-staging-window-runner-remote.sh'"
          escaped_script="$(printf '%s' "$remote_script" | sed "s/'/'\\\\''/g")"

          set +e
          # Owner-ruled invocation shape: the remote command is exactly
          # `bash -o pipefail -c '<script>'` — never a login-shell default.
          ssh $ssh_opts "$DEPLOY_USER@$DEPLOY_HOST" "bash -o pipefail -c '${escaped_script}'" 2>&1 \
            | tee output/window-runner/ssh.log
          rc=${PIPESTATUS[0]}
          scp $ssh_opts -r "$DEPLOY_USER@$DEPLOY_HOST:${remote_output_dir}/." output/window-runner/ 2>&1 \
            | tee -a output/window-runner/ssh.log
          scp_rc=${PIPESTATUS[0]}
          # Cleanup removes ONLY the per-run output dir and the checkout tarball dir. It must NEVER
          # touch the persistent runner override at $HOME/.metasheet2/window-runner — the staging
          # containers' compose config_files label points there, so deleting it would re-break the
          # containment check (run 29398270060). The persist dir is deliberately absent from this list.
          ssh $ssh_opts "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash -o pipefail -c 'rm -rf ${remote_output_dir} ${RUNNER_DIR}'" \
            >> output/window-runner/ssh.log 2>&1
          set -e

          if [[ "$rc" == "0" && "$scp_rc" != "0" ]]; then
            rc="$scp_rc"
          fi
          echo "remote_rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write step summary
        if: always()
        env:
          REMOTE_RC: ${{ steps.remote.outputs.remote_rc }}
          ARTIFACT_NAME: ${{ steps.remote.outputs.artifact_name }}
          ACTION: ${{ inputs.action }}
          SMOKE_ID: ${{ inputs.smoke }}
          DEPLOY_SHA: ${{ inputs.deploy_sha }}
          SET_WINDOW_ENV: ${{ inputs.set_window_env }}
          FORCE_RECREATE: ${{ inputs.force_recreate }}
          STAMPS: ${{ inputs.stamps }}
          SOAK_ORGS: ${{ inputs.soak_orgs }}
          SOAK_OPTS: ${{ inputs.soak_opts }}
        run: |
          set -euo pipefail
          {
            echo "## Attendance Staging Window Runner"
            echo ""
            echo "- Action: \`${ACTION}\`"
            if [[ "$ACTION" == "smoke" ]]; then echo "- Smoke: \`${SMOKE_ID}\`"; fi
            if [[ "$ACTION" == "residue-sweep" ]]; then echo "- Stamps: \`${STAMPS:-<none>}\`"; fi
            if [[ "$ACTION" == soak-* ]]; then
              echo "- Soak orgs: \`${SOAK_ORGS:-<none>}\`"
              echo "- Soak opts: \`${SOAK_OPTS:-<none>}\`"
            fi
            echo "- Deploy SHA: \`${DEPLOY_SHA:-<none>}\`"
            echo "- Window env: \`${SET_WINDOW_ENV}\`"
            echo "- Force recreate: \`${FORCE_RECREATE}\`"
            echo "- Remote rc: \`${REMOTE_RC:-missing}\`"
            echo "- Artifact: \`${ARTIFACT_NAME:-missing}\`"
            if [[ -f output/window-runner/summary.txt ]]; then
              echo ""
              echo '```text'
              cat output/window-runner/summary.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.remote.outputs.artifact_name || format('attendance-staging-window-runner-{0}-{1}-{2}', inputs.action, github.run_id, github.run_attempt) }}
          retention-days: 30
          path: output/window-runner

      - name: Fail on remote error
        if: steps.remote.outputs.remote_rc != '0'
        run: exit 1
