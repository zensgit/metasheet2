name: Admin Users Review Guard

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/web/src/views/UserManagementView.vue'
      - 'apps/web/src/views/adminUserBatch.ts'
      - 'apps/web/src/views/userRecycleLabels.ts'
      - 'packages/core-backend/src/admin/user-recycle*.ts'
      - 'packages/core-backend/src/auth/user-activation.ts'
      - 'packages/core-backend/src/auth/AuthService.ts'
      - 'packages/core-backend/src/auth/dingtalk-oauth.ts'
      - 'packages/core-backend/tests/unit/api-token-webhook.test.ts'
      - 'packages/core-backend/tests/unit/dingtalk-oauth-login-gates.test.ts'
      - 'packages/core-backend/src/multitable/api-token-service.ts'
      - 'packages/core-backend/tests/unit/admin-user-recycle*.test.ts'
      - 'packages/core-backend/tests/unit/user-recycle-scheduler.test.ts'
      - 'scripts/ops/global-history-flag-manifest*'
      - 'apps/web/tests/adminUserBatch.spec.ts'
      - 'apps/web/tests/userManagement*.spec.ts'
      - 'packages/core-backend/src/admin/user-batch-plan.ts'
      - 'packages/core-backend/src/routes/admin-user*.ts'
      - 'packages/core-backend/tests/unit/admin-user-batch*.test.ts'
      - 'packages/core-backend/tests/unit/admin-mounts-write-gate-guard.test.ts'
      - '.github/workflows/admin-users-web-guard.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/src/views/UserManagementView.vue'
      - 'apps/web/src/views/adminUserBatch.ts'
      - 'apps/web/src/views/userRecycleLabels.ts'
      - 'packages/core-backend/src/admin/user-recycle*.ts'
      - 'packages/core-backend/src/auth/user-activation.ts'
      - 'packages/core-backend/src/auth/AuthService.ts'
      - 'packages/core-backend/src/auth/dingtalk-oauth.ts'
      - 'packages/core-backend/tests/unit/api-token-webhook.test.ts'
      - 'packages/core-backend/tests/unit/dingtalk-oauth-login-gates.test.ts'
      - 'packages/core-backend/src/multitable/api-token-service.ts'
      - 'packages/core-backend/tests/unit/admin-user-recycle*.test.ts'
      - 'packages/core-backend/tests/unit/user-recycle-scheduler.test.ts'
      - 'scripts/ops/global-history-flag-manifest*'
      - 'apps/web/tests/adminUserBatch.spec.ts'
      - 'apps/web/tests/userManagement*.spec.ts'
      - 'packages/core-backend/src/admin/user-batch-plan.ts'
      - 'packages/core-backend/src/routes/admin-user*.ts'
      - 'packages/core-backend/tests/unit/admin-user-batch*.test.ts'
      - 'packages/core-backend/tests/unit/admin-mounts-write-gate-guard.test.ts'
      - '.github/workflows/admin-users-web-guard.yml'

permissions:
  contents: read

jobs:
  admin-users-web-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x
      - uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Web regression tests
        run: pnpm --filter @metasheet/web exec vitest run --watch=false tests/adminUserBatch.spec.ts tests/userManagementView.spec.ts tests/userManagementRoleMembership.spec.ts
      - name: Batch and permission guard tests
        run: pnpm --filter @metasheet/core-backend exec vitest run tests/unit/admin-user-batch-plan.test.ts tests/unit/admin-user-batch-routes.test.ts tests/unit/admin-mounts-write-gate-guard.test.ts tests/unit/admin-user-recycle.test.ts tests/unit/admin-user-recycle-routes.test.ts tests/unit/user-recycle-scheduler.test.ts tests/unit/user-activation.test.ts tests/unit/role-assignment-boundary.test.ts tests/unit/api-token-webhook.test.ts tests/unit/dingtalk-oauth-login-gates.test.ts
      - name: Flag registry contracts
        run: node --test scripts/ops/global-history-flag-manifest.test.mjs
