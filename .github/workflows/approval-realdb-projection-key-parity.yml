name: Approval real-DB acceptance (projection participant key parity)

# EVIDENCE LANE for the approval-projection participant KEY-DERIVATION fix:
#   - tests/integration/approval-projection-key-parity.db.test.ts — drives the REAL production
#     chain (ApprovalProductService.createApproval → create-hook reconcile;
#     .dispatchAction('approve') → completion-event reconcile) so every row asserted against is a
#     shape production actually writes, then proves the participant carve-out
#     (`loadApprovalProjectionParticipantSheetIds`), BOTH per-row deny arms
#     (`loadApprovalProjectionDeniedRecordIds`, bounded + unbounded), and the independent
#     sheet-capabilities.ts choke (`resolveSheetCapabilitiesForUser`) all read the SAME namespaced
#     key the writer stores (`deriveProjectionFieldId`) across four consumer surfaces: the entry
#     listing (GET /sheets), row read (`requireRecordReadable`), export
#     (GET /sheets/:sheetId/export-xlsx), and the Yjs/API-token capability choke. A genuine
#     requester and a genuine decider each see only their own rows; an ordinary-multitable-read
#     stranger is excluded on every surface (anti-widening control — this bug was fail-closed, not
#     a leak); admin is unaffected. `GET /context` is asserted too, but only as a documented
#     VACUOUS control: that route applies no projection predicate at all (a separate, already
#     confirmed, not-yet-merged defect) and this fix does not touch it.
# Ephemeral first-party PostgreSQL container; no customer source, no deployment, no flag change.
#
# WHY A STANDALONE FILE, not a plugin-tests.yml allowlist entry: plugin-tests.yml is an s6a
# sha256-pinned provenance input (sealed-export-package-provenance.cjs PINNED_EVIDENCE_FILES), so
# every edit forces an s6a re-pin and a merge-serialisation race. This mirrors the sibling
# approval-realdb-can-decide-current-node.yml / approval-realdb-list-scope.yml /
# approval-realdb-node-operation-policy.yml lanes and the precedent they cite. plugin-tests.yml is
# left byte-identical.
#
# TWO-POINT WIRING (the other half): the suite is excluded from the no-DB default vitest config
# (packages/core-backend/vitest.config.ts) in the SAME commit that adds this file, so the required
# `test (18.x/20.x)` job cannot collect-and-skip-green it. EXPECT_DB=1 below arms the suite's
# top-level anti-skip-green sentinel: a run in this lane with a missing/broken DATABASE_URL goes RED
# instead of silently reporting the whole file as skipped.

on:
  workflow_dispatch:
  # NO `merge_group:` — deliberately, matching the sibling approval-realdb-* evidence lanes (see
  # approval-realdb-history-guard.yml's comment for the full rationale: a `merge_group` event does
  # not honour the `paths` filter the way `pull_request` does, so declaring it would spin up this
  # PostgreSQL job for every merge group regardless of relevance).
  pull_request:
    # No `branches:` filter (mirrors the sibling approval-realdb-* precedents): a brand-new workflow
    # cannot be workflow_dispatch-ed until it has run once via a trigger it responds to. The `paths`
    # filter keeps it off unrelated PRs.
    paths:
      - 'packages/core-backend/tests/integration/approval-projection-key-parity.db.test.ts'
      - 'packages/core-backend/src/multitable/approval-projection-constants.ts'
      - 'packages/core-backend/src/multitable/approval-record-projection-service.ts'
      - 'packages/core-backend/src/multitable/permission-service.ts'
      - 'packages/core-backend/src/multitable/sheet-capabilities.ts'
      - 'packages/core-backend/src/services/ApprovalProductService.ts'
      - 'packages/core-backend/src/routes/univer-meta.ts'
      - 'packages/core-backend/vitest.config.ts'
      - 'packages/core-backend/vitest.integration.config.ts'
      - 'packages/core-backend/tests/setup.integration.ts'
      - 'packages/core-backend/src/db/migrations/**'
      - '.github/workflows/approval-realdb-projection-key-parity.yml'
  push:
    branches: [main]
    paths:
      - 'packages/core-backend/tests/integration/approval-projection-key-parity.db.test.ts'
      - 'packages/core-backend/src/multitable/approval-projection-constants.ts'
      - 'packages/core-backend/src/multitable/approval-record-projection-service.ts'
      - 'packages/core-backend/src/multitable/permission-service.ts'
      - 'packages/core-backend/src/multitable/sheet-capabilities.ts'
      - 'packages/core-backend/src/services/ApprovalProductService.ts'
      - 'packages/core-backend/src/routes/univer-meta.ts'
      - 'packages/core-backend/vitest.config.ts'
      - 'packages/core-backend/vitest.integration.config.ts'
      - 'packages/core-backend/tests/setup.integration.ts'
      - 'packages/core-backend/src/db/migrations/**'
      - '.github/workflows/approval-realdb-projection-key-parity.yml'

permissions:
  contents: read

jobs:
  approval-realdb-projection-key-parity:
    name: approval-realdb-projection-key-parity
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metasheet_approval_realdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d metasheet_approval_realdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/metasheet_approval_realdb
      # Arms the suite's top-level sentinel: in THIS lane a missing DATABASE_URL is a red run, never
      # a silent skipped-green.
      EXPECT_DB: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Use empty npmrc for pnpm
        run: |
          echo "" > /tmp/empty-npmrc
          echo "NPM_CONFIG_USERCONFIG=/tmp/empty-npmrc" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run DB migrations
        env:
          # Same per-PR-gate exclusion list as plugin-tests.yml's "Run DB migrations" step
          # (see packages/core-backend/MIGRATION_EXCLUDE_TRACKING.md).
          MIGRATION_EXCLUDE: 008_plugin_infrastructure.sql,048_create_event_bus_tables.sql,049_create_bpmn_workflow_tables.sql,042a_core_model_views.sql,20250924140000_create_gantt_tables.ts,20250925_create_view_tables.sql
        run: pnpm --filter @metasheet/core-backend db:migrate

      - name: Run projection key-parity real-DB acceptance (whole file)
        # WHOLE FILE, --reporter=verbose: a name filter matching zero tests would exit green and
        # hide regressions; verbose prints every collected test so an empty collection shows in the
        # log.
        run: >-
          pnpm --filter @metasheet/core-backend exec vitest
          --config vitest.integration.config.ts run
          tests/integration/approval-projection-key-parity.db.test.ts
          --reporter=verbose

      - name: Values-free evidence (this job)
        run: |
          {
            echo "evidenceKind=CONTROLLED_SYNTHETIC_FUNCTIONAL"
            echo "suites=approval-projection-key-parity.db.test.ts"
            echo "scope=participant carve-out + both per-row deny arms + sheet-capabilities choke read the writer's namespaced projection key; four consumer surfaces (entry listing, row read, export, Yjs/API-token choke) over REAL reconcile() output; requester/decider/stranger/admin; per-row control; /context asserted only as a documented vacuous control"
            echo "sentinelArmed=EXPECT_DB=1"
            echo "customerSourceAccess=NOT_INVOLVED"
            echo "flagChanged=false"
            echo "externalWrite=false"
          } | tee -a "$GITHUB_STEP_SUMMARY"
