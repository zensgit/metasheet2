name: Approval real-DB acceptance (member-display-identity resolve endpoint)

# EVIDENCE LANE for the member-display-identity authorized-scope EXACT batch id->name resolver
# (GET /api/approvals/directory/resolve):
#   - tests/integration/approval-directory-resolve.api.test.ts — union guard (each of
#     approvals:read/:write/:act alone reaches 200), NONE of the three rejected (403), EXACT match
#     (not ILIKE substring — a decoy sharing a prefix must never come back), values-free on miss
#     (inactive user / blank-name user simply omitted, never a raw id / never an error), a stray
#     `roleIds` query param silently ignored (no role lookup — that surface stays admin-only), and
#     the route registered before '/api/approvals/:id'.
# Ephemeral first-party PostgreSQL container per job; no customer source, no deployment, no flag
# change.
#
# WHY A STANDALONE FILE, not a plugin-tests.yml allowlist entry:
# plugin-tests.yml is an s6a sha256-pinned provenance input
# (sealed-export-package-provenance.cjs PINNED_EVIDENCE_FILES), so every edit forces an s6a re-pin
# and a merge-serialisation race. This file mirrors approval-realdb-acceptance.yml, the in-repo
# precedent for exactly this rationale, and leaves plugin-tests.yml byte-identical to main.
#
# TWO-POINT WIRING (the other half): the suite is excluded from the no-DB default vitest config
# (packages/core-backend/vitest.config.ts test.exclude) in the same commit that adds it, so the
# required `test (18.x/20.x)` job no longer collect-and-skip-greens it. THIS workflow is where the
# suite actually EXECUTES. DATABASE_URL is unconditionally hardcoded below — there is no no-DB
# variant of this job to distinguish from, so (matching the approval-realdb-k4 / -k5b posture in
# the sibling file, not the K2/K3/K6 one) no EXPECT_DB env var is set here: the suite's own
# top-level sentinel ("sentinel: DATABASE_URL is set (DB-backed lane must not silently skip)") sits
# INSIDE describeIfDatabase, same as K4/K5b — sufficient in THIS lane because DATABASE_URL is
# unconditionally set above, so there is no no-DB variant of this specific job for it to
# distinguish from. (It is not itself proof against a broken-but-present DATABASE_URL: a dead
# Postgres service throws in beforeAll — a hard red, not a skip — which is the actual protection.)

on:
  workflow_dispatch:
  pull_request:
    # No `branches:` filter, mirroring the s6a precedent: a brand-new workflow cannot be
    # workflow_dispatch-ed until it has run once via a trigger it responds to, and a
    # stacked-base PR would silently skip a branch-filtered trigger. The `paths` filter keeps it
    # off unrelated PRs.
    paths:
      - 'packages/core-backend/tests/integration/approval-directory-resolve.api.test.ts'
      - 'packages/core-backend/tests/helpers/approval-schema-bootstrap.ts'
      - 'packages/core-backend/src/services/approval-directory.ts'
      - 'packages/core-backend/src/routes/approvals.ts'
      - '.github/workflows/approval-realdb-directory-resolve.yml'
  push:
    branches: [main]
    paths:
      - 'packages/core-backend/tests/integration/approval-directory-resolve.api.test.ts'
      - 'packages/core-backend/tests/helpers/approval-schema-bootstrap.ts'
      - 'packages/core-backend/src/services/approval-directory.ts'
      - 'packages/core-backend/src/routes/approvals.ts'
      - '.github/workflows/approval-realdb-directory-resolve.yml'

permissions:
  contents: read

jobs:
  approval-realdb-directory-resolve:
    name: approval-realdb-directory-resolve
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metasheet_approval_realdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d metasheet_approval_realdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/metasheet_approval_realdb
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Use empty npmrc for pnpm
        run: |
          echo "" > /tmp/empty-npmrc
          echo "NPM_CONFIG_USERCONFIG=/tmp/empty-npmrc" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run DB migrations
        env:
          # Same per-PR-gate exclusion list as plugin-tests.yml's "Run DB migrations" step (see the
          # T8 note there and packages/core-backend/MIGRATION_EXCLUDE_TRACKING.md for the per-item
          # detail) — this lane provisions the identical schema the approval real-DB steps run
          # against.
          MIGRATION_EXCLUDE: 008_plugin_infrastructure.sql,048_create_event_bus_tables.sql,049_create_bpmn_workflow_tables.sql,042a_core_model_views.sql,20250924140000_create_gantt_tables.ts,20250925_create_view_tables.sql
        run: pnpm --filter @metasheet/core-backend db:migrate

      - name: Run member-display-identity directory-resolve real-DB acceptance (whole file)
        # WHOLE FILE, --reporter=verbose: a name filter matching zero tests would exit green and
        # hide regressions; verbose prints every collected test so an empty collection shows in the
        # log instead of reading as green.
        run: >-
          pnpm --filter @metasheet/core-backend exec vitest
          --config vitest.integration.config.ts run
          tests/integration/approval-directory-resolve.api.test.ts
          --reporter=verbose

      - name: Values-free evidence (this job)
        run: |
          {
            echo "evidenceKind=CONTROLLED_SYNTHETIC_FUNCTIONAL"
            echo "suite=approval-directory-resolve.api.test.ts"
            echo "lock=member-display-identity 20260819"
            echo "gates=union-guard(read/write/act alone->200), none-of-three->403, exact-not-ilike, values-free-on-miss(inactive/blank-name), roleIds-ignored, route-order-before-:id"
            echo "customerSourceAccess=NOT_INVOLVED"
            echo "flagChanged=false"
            echo "externalWrite=false"
          } | tee -a "$GITHUB_STEP_SUMMARY"
