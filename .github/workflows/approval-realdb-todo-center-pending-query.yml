name: Approval real-DB acceptance (todo-center shared pending query)

# EVIDENCE LANE for todo-center-design-lock v2.14 §3.0/§5's shared "pending" query
# production-path gate:
#   - tests/todo-center-pending-gate/todo-center-pending-gate.ts — the §3.0 fourteen-class
#     viewer matrix (user/role/admin/no-seat/reviewer-only/attendance-source_queue/dangling
#     definition/handler-node/non-pending/inactive-seat/dedup/own-read/other's-read, plus the
#     `sourceSystem` request-shape variants) run against the SAME shared query
#     `approval-pending-query.ts` that both GET /api/approvals/pending-count and
#     PendingSourceRegistry's approval source now use — asserted together so the extraction is a
#     verified zero-behavior-change refactor (judge D), not just a self-consistent new module.
#   - Judges A0/A/B/C/C' (endpoint-level half) live in this lane; C' unit-level half and E/F are
#     elsewhere per the taskbook's lane map (this workflow is not the whole verification surface).
# Ephemeral first-party PostgreSQL container; no customer source, no deployment, no flag change.
#
# WHY A STANDALONE FILE, not a plugin-tests.yml allowlist entry: plugin-tests.yml is an s6a
# sha256-pinned provenance input (sealed-export-package-provenance.cjs PINNED_EVIDENCE_FILES), so
# every edit forces an s6a re-pin and a merge-serialisation race (feedback_s6a_pin_is_a_merge_
# bottleneck). This mirrors the sibling approval-realdb-can-decide-current-node.yml /
# approval-realdb-list-scope.yml / approval-realdb-node-operation-policy.yml lanes and the
# precedent the design-lock itself cites (§ "触发集": approval-realdb-p7r1-coverage-repair.yml's
# paths block, not plugin-tests.yml's broad push.paths globs). plugin-tests.yml is left
# byte-identical by this commit — confirmed below with `git diff --stat`.
#
# RBAC posture (design-lock §3.0): RBAC_BYPASS=false / RBAC_TOKEN_TRUST=false /
# PRODUCT_MODE=plm-workbench / RBAC_CACHE_TTL_MS=0 — the OPPOSITE of the default integration
# harness (tests/setup.integration.ts trusts token claims), matching the
# vitest.elearning-pilot-auth.config.ts precedent plus the lock's own extra RBAC_CACHE_TTL_MS=0
# requirement (not present on that sibling).
#
# TWO-POINT WIRING (the other half): the gate file carries no `.test.ts`/`.spec.ts` suffix, so the
# default no-DB vitest.config.ts never collects it via its implicit include glob in the first
# place — no describe.skip-shaped green is possible because the file is never even seen there. The
# harmless, redundant second guard (an explicit exclude entry) already lives in vitest.config.ts.
# EXPECT_DB=1 below arms the suite's own anti-skip-green sentinel: a run in this lane with a
# missing/broken DATABASE_URL goes RED instead of silently reporting the whole file as skipped.

on:
  workflow_dispatch:
  # NO `merge_group:` — deliberately, matching the sibling approval-realdb-* evidence lanes: a
  # `merge_group` event does not honour the `paths` filter the way `pull_request` does, so
  # declaring it would spin up this PostgreSQL job for every merge group regardless of relevance.
  pull_request:
    # No `branches:` filter (mirrors the sibling approval-realdb-* precedents): a brand-new
    # workflow cannot be workflow_dispatch-ed until it has run once via a trigger it responds to.
    # The `paths` filter keeps it off unrelated PRs.
    paths:
      - 'packages/core-backend/src/services/approval-pending-query.ts'
      - 'packages/core-backend/src/services/approval-pending-source.ts'
      - 'packages/core-backend/src/services/pending-source-registry.ts'
      - 'packages/core-backend/src/routes/approvals.ts'
      - 'packages/core-backend/src/routes/todo.ts'
      - 'packages/core-backend/src/services/approval-seat-authorization.ts'
      - 'packages/core-backend/src/services/approval-actor-roles.ts'
      - 'packages/core-backend/tests/todo-center-pending-gate/todo-center-pending-gate.ts'
      - 'packages/core-backend/tests/todo-center-pending-gate/setup.ts'
      - 'packages/core-backend/vitest.todo-center-pending-gate.config.ts'
      - 'packages/core-backend/vitest.config.ts'
      # Gate report impl-gate-B-slice1-round1-20260918.md P2-2: this lane runs on the PRODUCTION
      # RBAC axis (RBAC_BYPASS=false / RBAC_TOKEN_TRUST=false / PRODUCT_MODE=plm-workbench below),
      # not the default token-trust harness, so these six modules are not merely imported — the
      # gate agent's mutation M8 (AuthService.ts:742 admin-role upgrade) proved one of them is
      # load-bearing for a specific class (③′) the suite's golden values depend on. A change to
      # any of the six can silently flip this gate's expected counts without ever triggering it.
      # Known cost, accepted per the same fail-closed-over-narrow-trigger-set precedent this repo
      # already applies elsewhere (feedback_lock_taking_port_needs_lock_order_census and siblings):
      # these are high-churn, widely-shared modules, so this lane's Postgres job will now spin up
      # more often than the narrower 13-path trigger set it replaces — the alternative (missing a
      # real behavior change) is worse for an advisory-only real-DB evidence lane (see P2-0 below).
      - 'packages/core-backend/src/auth/AuthService.ts'
      - 'packages/core-backend/src/rbac/rbac.ts'
      - 'packages/core-backend/src/rbac/service.ts'
      - 'packages/core-backend/src/rbac/namespace-admission.ts'
      - 'packages/core-backend/src/config/product-mode.ts'
      - 'packages/core-backend/src/routes/auth.ts'
      - '.github/workflows/approval-realdb-todo-center-pending-query.yml'
  push:
    branches: [main]
    paths:
      - 'packages/core-backend/src/services/approval-pending-query.ts'
      - 'packages/core-backend/src/services/approval-pending-source.ts'
      - 'packages/core-backend/src/services/pending-source-registry.ts'
      - 'packages/core-backend/src/routes/approvals.ts'
      - 'packages/core-backend/src/routes/todo.ts'
      - 'packages/core-backend/src/services/approval-seat-authorization.ts'
      - 'packages/core-backend/src/services/approval-actor-roles.ts'
      - 'packages/core-backend/tests/todo-center-pending-gate/todo-center-pending-gate.ts'
      - 'packages/core-backend/tests/todo-center-pending-gate/setup.ts'
      - 'packages/core-backend/vitest.todo-center-pending-gate.config.ts'
      - 'packages/core-backend/vitest.config.ts'
      # Gate report impl-gate-B-slice1-round1-20260918.md P2-2: this lane runs on the PRODUCTION
      # RBAC axis (RBAC_BYPASS=false / RBAC_TOKEN_TRUST=false / PRODUCT_MODE=plm-workbench below),
      # not the default token-trust harness, so these six modules are not merely imported — the
      # gate agent's mutation M8 (AuthService.ts:742 admin-role upgrade) proved one of them is
      # load-bearing for a specific class (③′) the suite's golden values depend on. A change to
      # any of the six can silently flip this gate's expected counts without ever triggering it.
      # Known cost, accepted per the same fail-closed-over-narrow-trigger-set precedent this repo
      # already applies elsewhere (feedback_lock_taking_port_needs_lock_order_census and siblings):
      # these are high-churn, widely-shared modules, so this lane's Postgres job will now spin up
      # more often than the narrower 13-path trigger set it replaces — the alternative (missing a
      # real behavior change) is worse for an advisory-only real-DB evidence lane (see P2-0 below).
      - 'packages/core-backend/src/auth/AuthService.ts'
      - 'packages/core-backend/src/rbac/rbac.ts'
      - 'packages/core-backend/src/rbac/service.ts'
      - 'packages/core-backend/src/rbac/namespace-admission.ts'
      - 'packages/core-backend/src/config/product-mode.ts'
      - 'packages/core-backend/src/routes/auth.ts'
      - '.github/workflows/approval-realdb-todo-center-pending-query.yml'

permissions:
  contents: read

jobs:
  approval-realdb-todo-center-pending-query:
    name: approval-realdb-todo-center-pending-query
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metasheet_approval_realdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d metasheet_approval_realdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/metasheet_approval_realdb
      # Arms the suite's top-level sentinel: in THIS lane a missing DATABASE_URL is a red run,
      # never a silent skipped-green.
      EXPECT_DB: '1'
      # design-lock §3.0 posture — also re-asserted at import time inside setup.ts/the gate file
      # itself (job-level env here + the suite's own import-time throws are the two-point form of
      # this same guard, matching the elearning-v01-auth-tenant-rbac-gate step in plugin-tests.yml).
      RBAC_BYPASS: 'false'
      RBAC_TOKEN_TRUST: 'false'
      PRODUCT_MODE: plm-workbench
      RBAC_CACHE_TTL_MS: '0'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Use empty npmrc for pnpm
        run: |
          echo "" > /tmp/empty-npmrc
          echo "NPM_CONFIG_USERCONFIG=/tmp/empty-npmrc" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run DB migrations
        env:
          # Same per-PR-gate exclusion list as plugin-tests.yml's "Run DB migrations" step
          # (see packages/core-backend/MIGRATION_EXCLUDE_TRACKING.md). This step-level env is
          # NOT inherited from anywhere else — GitHub Actions step `env:` blocks do not propagate
          # to other steps, so this list must be copied here explicitly rather than assumed.
          MIGRATION_EXCLUDE: 008_plugin_infrastructure.sql,048_create_event_bus_tables.sql,049_create_bpmn_workflow_tables.sql,042a_core_model_views.sql,20250924140000_create_gantt_tables.ts,20250925_create_view_tables.sql
        run: pnpm --filter @metasheet/core-backend db:migrate

      - name: Run todo-center pending-query production-path gate (whole file)
        # WHOLE FILE, --reporter=verbose: a name filter matching zero tests would exit green and
        # hide regressions; verbose prints every collected test so an empty collection shows in
        # the log. This step goes RED, not skip-green, while
        # tests/todo-center-pending-gate/todo-center-pending-gate.ts does not yet exist on this
        # branch (`vitest run` with zero matched files exits non-zero) — that is the correct
        # fail-closed behavior for a wiring-only slice landing ahead of the gate-content slice in
        # the same design-lock PR sequence, not a bug in this workflow.
        run: |
          : "${DATABASE_URL:?DATABASE_URL is required for the todo-center pending-query gate}"
          pnpm --filter @metasheet/core-backend exec vitest \
            --config vitest.todo-center-pending-gate.config.ts run \
            tests/todo-center-pending-gate/todo-center-pending-gate.ts \
            --reporter=verbose

      - name: Values-free evidence (this job)
        run: |
          {
            echo "evidenceKind=CONTROLLED_SYNTHETIC_FUNCTIONAL"
            echo "suites=todo-center-pending-gate.ts"
            echo "scope=todo-center-design-lock v2.14 section3.0/section5 shared pending query production-path gate: fourteen-class viewer matrix plus sourceSystem request-shape variants, asserted against the extracted approval-pending-query.ts shared by GET /api/approvals/pending-count and PendingSourceRegistry's approval source"
            echo "sentinelArmed=EXPECT_DB=1"
            echo "customerSourceAccess=NOT_INVOLVED"
            echo "flagChanged=false"
            echo "externalWrite=false"
          } | tee -a "$GITHUB_STEP_SUMMARY"
