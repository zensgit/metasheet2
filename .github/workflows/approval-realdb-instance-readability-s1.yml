name: Approval real-DB acceptance (S1 instance readability)

# EVIDENCE LANE for the Lock-10 (S1) canReadApprovalInstance real-DB acceptance suites:
#   - tests/integration/approval-instance-readability-s1.db.test.ts — the pure predicate, all FIVE
#     arms (requester, seat is_active-insensitive, past actor incl. policy_denied, CC target,
#     DB-backed admin) + the org pin (G-S1-1, G-S1-3, G-S1-6, G-S1-10, G-S1-11, G-S1-12 partial).
#   - tests/integration/approval-instance-readability-s1-consumers.db.test.ts — CONSUMER adoption:
#     detail/history pairing + the plm: spy-zero (G-S1-4, G-S1-5), and the metrics ACL substitution
#     (G-S1-7).
#   - tests/integration/approval-p1c-field-permissions.api.test.ts — a THIRD S1 consumer: added
#     after this lane's `paths:` omission let a fourth non-participant-observer collision
#     (`p1c-observer`/`p1c-admin`, minted JWT-only by that suite's own `authToken` helper) reach
#     the required `test (20.x)` lane undetected. Runs here now so a future S1 admission-shape
#     change is caught before it reaches the required lane, not after.
# The org pin ships DEFAULT OFF (APPROVAL_S1_ORG_PIN_ENABLED unset) — G-S1-3/G-S1-10 force it on
# in-process around single assertions; nothing in this lane flips the shipped default.
# G-S1-8 (feed⊆admission) is NOT in either suite — RECORDED-PENDING per Lock-10 §5.1.1, expected
# red until the three named feed residuals are ruled; landing it here would be exactly the
# "shipped green without having seen it red" hazard the gate table itself warns against.
# Ephemeral first-party PostgreSQL container; no customer source, no deployment, no flag change.
#
# WHY A STANDALONE FILE, not a plugin-tests.yml allowlist entry: plugin-tests.yml is an s6a
# sha256-pinned provenance input (sealed-export-package-provenance.cjs PINNED_EVIDENCE_FILES), so
# every edit forces an s6a re-pin and a merge-serialisation race. This mirrors the sibling
# approval-realdb-history-guard.yml / approval-realdb-node-operation-policy.yml lanes and the
# sealed-export-s6a-authority-row-lock.yml precedent they cite. plugin-tests.yml is left
# byte-identical.
#
# TWO-POINT WIRING (the other half): the suite is excluded from the no-DB default vitest config
# (packages/core-backend/vitest.config.ts) in the SAME commit that adds this file, so the required
# `test (18.x/20.x)` job no longer collect-and-skip-greens it. This workflow is where the suite
# actually EXECUTES, with EXPECT_DB=1 arming the suite's top-level anti-skip-green sentinel: a run
# in this lane with a missing/broken DATABASE_URL goes RED instead of silently reporting the whole
# file as skipped.

on:
  workflow_dispatch:
  # NO `merge_group:` — deliberately, matching the sibling approval-realdb-* evidence lanes (see
  # approval-realdb-history-guard.yml's comment for the full rationale: a `merge_group` event does
  # not honour the `paths` filter the way `pull_request` does, so declaring it would spin up this
  # PostgreSQL job for every merge group regardless of relevance).
  pull_request:
    # No `branches:` filter (mirrors the sibling approval-realdb-* precedents): a brand-new
    # workflow cannot be workflow_dispatch-ed until it has run once via a trigger it responds to.
    # The `paths` filter keeps it off unrelated PRs.
    paths:
      - 'packages/core-backend/tests/integration/approval-instance-readability-s1.db.test.ts'
      - 'packages/core-backend/tests/integration/approval-instance-readability-s1-consumers.db.test.ts'
      - 'packages/core-backend/tests/integration/approval-p1c-field-permissions.api.test.ts'
      - 'packages/core-backend/tests/unit/approval-instance-readability-plm-id-agreement.test.ts'
      - 'packages/core-backend/src/services/approval-instance-readability.ts'
      - 'packages/core-backend/src/services/approval-attachment-runtime.ts'
      - 'packages/core-backend/src/services/approval-actor-roles.ts'
      - 'packages/core-backend/src/services/approval-attachment-storage.ts'
      - 'packages/core-backend/src/routes/approval-attachments.ts'
      - 'packages/core-backend/src/routes/approval-metrics.ts'
      - 'packages/core-backend/src/db/migrations/zzzz20260821100000_add_approval_instance_org_id.ts'
      - 'packages/core-backend/src/routes/approvals.ts'
      - 'packages/core-backend/src/routes/approval-history.ts'
      - 'packages/core-backend/src/services/ApprovalBridgeService.ts'
      - 'packages/core-backend/src/types/approval-product.ts'
      - 'packages/core-backend/tests/helpers/approval-schema-bootstrap.ts'
      - 'packages/core-backend/vitest.config.ts'
      - '.github/workflows/approval-realdb-instance-readability-s1.yml'
  push:
    branches: [main]
    paths:
      - 'packages/core-backend/tests/integration/approval-instance-readability-s1.db.test.ts'
      - 'packages/core-backend/tests/integration/approval-instance-readability-s1-consumers.db.test.ts'
      - 'packages/core-backend/tests/integration/approval-p1c-field-permissions.api.test.ts'
      - 'packages/core-backend/tests/unit/approval-instance-readability-plm-id-agreement.test.ts'
      - 'packages/core-backend/src/services/approval-instance-readability.ts'
      - 'packages/core-backend/src/services/approval-attachment-runtime.ts'
      - 'packages/core-backend/src/services/approval-actor-roles.ts'
      - 'packages/core-backend/src/services/approval-attachment-storage.ts'
      - 'packages/core-backend/src/routes/approval-attachments.ts'
      - 'packages/core-backend/src/routes/approval-metrics.ts'
      - 'packages/core-backend/src/db/migrations/zzzz20260821100000_add_approval_instance_org_id.ts'
      - 'packages/core-backend/src/routes/approvals.ts'
      - 'packages/core-backend/src/routes/approval-history.ts'
      - 'packages/core-backend/src/services/ApprovalBridgeService.ts'
      - 'packages/core-backend/src/types/approval-product.ts'
      - 'packages/core-backend/tests/helpers/approval-schema-bootstrap.ts'
      - 'packages/core-backend/vitest.config.ts'
      - '.github/workflows/approval-realdb-instance-readability-s1.yml'

permissions:
  contents: read

jobs:
  approval-realdb-instance-readability-s1:
    name: approval-realdb-instance-readability-s1
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: metasheet_approval_realdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d metasheet_approval_realdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/metasheet_approval_realdb
      # Arms the suite's top-level sentinel: in THIS lane a missing DATABASE_URL is a red run,
      # never a silent skipped-green.
      EXPECT_DB: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.16.1
          run_install: false

      - name: Use empty npmrc for pnpm
        run: |
          echo "" > /tmp/empty-npmrc
          echo "NPM_CONFIG_USERCONFIG=/tmp/empty-npmrc" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run DB migrations
        env:
          # Same per-PR-gate exclusion list as plugin-tests.yml's "Run DB migrations" step
          # (see packages/core-backend/MIGRATION_EXCLUDE_TRACKING.md) — this lane provisions the
          # identical schema the approval real-DB steps run against, INCLUDING this PR's
          # zzzz20260821100000_add_approval_instance_org_id.ts (Phase 1: nullable, no default).
          MIGRATION_EXCLUDE: 008_plugin_infrastructure.sql,048_create_event_bus_tables.sql,049_create_bpmn_workflow_tables.sql,042a_core_model_views.sql,20250924140000_create_gantt_tables.ts,20250925_create_view_tables.sql
        run: pnpm --filter @metasheet/core-backend db:migrate

      - name: Run S1 instance-readability real-DB acceptance (whole files, all three suites)
        # WHOLE FILES, --reporter=verbose: a name filter matching zero tests would exit green and
        # hide regressions; verbose prints every collected test so an empty collection shows in
        # the log.
        run: >-
          pnpm --filter @metasheet/core-backend exec vitest
          --config vitest.integration.config.ts run
          tests/integration/approval-instance-readability-s1.db.test.ts
          tests/integration/approval-instance-readability-s1-consumers.db.test.ts
          tests/integration/approval-p1c-field-permissions.api.test.ts
          --reporter=verbose

      - name: Values-free evidence (this job)
        run: |
          {
            echo "evidenceKind=CONTROLLED_SYNTHETIC_FUNCTIONAL"
            echo "suites=approval-instance-readability-s1.db.test.ts,approval-instance-readability-s1-consumers.db.test.ts,approval-p1c-field-permissions.api.test.ts"
            echo "scope=Lock-10 (S1) canReadApprovalInstance all 5 arms + org pin (default OFF); detail/history/metrics consumer adoption"
            echo "sentinelArmed=EXPECT_DB=1"
            echo "customerSourceAccess=NOT_INVOLVED"
            echo "flagChanged=false"
            echo "externalWrite=false"
          } | tee -a "$GITHUB_STEP_SUMMARY"
